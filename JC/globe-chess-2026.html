<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Globe Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow: hidden; }
  body {
    /* All four gradient stops brightened by 125% (×1.25 on each channel
       value): #c8→#fa, #a0→#c8, #70→#8c, #40→#50. Keeps the same dark-
       vignette shape but the whole field reads lighter. */
    background: radial-gradient(circle at center, #fafafa 0%, #c8c8c8 40%, #8c8c8c 75%, #505050 100%);
    overflow: hidden;
    cursor: grab; user-select: none;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
  }
  body.dragging { cursor: grabbing; }
  canvas {
    display: block; touch-action: none;
    position: fixed; top: 0; left: 0;
  }
  /* ── Shared UI button base ── */
  .ui-btn {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer;
    padding:0; margin:0; opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none;
    pointer-events:auto; white-space:nowrap; display:block;
    text-align:left;
  }
  .ui-btn:hover { opacity:1; }
  /* ── Turn indicator (top center) ── */
  #turn {
    position:fixed; top:28px; left:50%; transform:translateX(-50%);
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff; opacity:0.85;
    pointer-events:none; z-index:100; white-space:nowrap;
    text-align:center; line-height:1.6;
  }
  /* ── See original (bottom center) ── */
  #seeOrigBtn {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    opacity:0.5; transition:opacity .2s; text-decoration:none;
    pointer-events:auto; z-index:100; white-space:nowrap;
  }
  #seeOrigBtn:hover { opacity:1; }
  /* ── AI toggle (top left) ── */
  #aiWrap {
    position:fixed; top:28px; right:28px; text-align:right;
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none; z-index:100;
    cursor:pointer; pointer-events:auto;
  }
  #aiWrap:hover { opacity:1; }
  #aiSwitch { display:none; }
  /* ── New Game (top right) ── */
  #newGameBtn {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    z-index:100; pointer-events:auto; text-align:center;
  }
  /* ── Test Mode (bottom left) ── */
  #testBtn {
    position:fixed; bottom:28px; left:28px;
    z-index:100; pointer-events:auto;
  }
  #testBtn.active { opacity:1; color:#fff; }
  /* ── Test panel (plain text, bottom left, above Quit button) ── */
  #testPanel {
    display:none; position:fixed; bottom:53px; left:28px;
    z-index:200; pointer-events:auto;
    background:none; border-radius:0; padding:0; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    flex-direction:column; align-items:flex-start; gap:12px;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    white-space:nowrap;
  }
  #testPanel.visible { display:flex; }
  .test-row { display:flex; align-items:center; gap:3px; }
  .test-row-label {
    font-size:11px; letter-spacing:normal; color:#fff; opacity:0.4; width:auto;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    margin-right:4px;
  }
  .test-pieces { display:flex; gap:1px; }
  .tpb {
    width:auto; height:auto; border-radius:0; border:none;
    background:none; cursor:pointer; font-size:11px; font-weight:400;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    color:#fff; transition:opacity .15s; pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center;
    opacity:0.3; padding:1px 3px;
  }
  .tpb[data-color="black"] { background:none; color:#fff; border-color:transparent; }
  .tpb.sel { opacity:1; }
  .tpb:hover { opacity:0.7; }
  /* Check flash overlay on king */
  .check-ring { pointer-events:none; }
  /* hidden controls */
  #coordWrap { display:none; }
  #toggleWrap { display:none; }
  #bottomLeft { display:none; }
  /* ── Battle area (bottom right) ── */
  #battleArea {
    position:fixed; bottom:28px; right:28px;
    display:flex; flex-direction:column; align-items:flex-end;
    gap:12px; z-index:100; pointer-events:auto;
  }
  #autoBattleBtn {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none;
    pointer-events:auto; white-space:nowrap;
  }
  #autoBattleBtn:hover { opacity:1; }
  #autoBattleControls {
    display:none; flex-direction:column; align-items:flex-end; gap:12px;
  }
  #autoBattleControls button {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.5; transition:opacity .2s;
    pointer-events:auto; white-space:nowrap; display:block;
  }
  #autoBattleControls button:hover { opacity:1; }
  #autoPauseBtn { opacity:0.85; }
  /* ── Report Modal ── */
  #reportModal {
    display:none; position:fixed; inset:0; z-index:600;
    background:rgba(0,0,0,0.84); justify-content:center; align-items:center;
    pointer-events:auto;
  }
  #reportModal.visible { display:flex; }
  #reportBox {
    background:#f4f4f4; border-radius:16px;
    width:min(660px,93vw); max-height:84vh;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 28px 90px rgba(0,0,0,0.6);
  }
  #reportHead {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 20px 10px; border-bottom:1px solid #ddd;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    font-size:11px; letter-spacing:normal; color:#444; flex-shrink:0;
  }
  #reportHead .rh-btns { display:flex; gap:14px; }
  #reportHead button {
    font-family:'Times New Roman',Times,serif; font-size:10px; font-style:italic;
    letter-spacing:normal; color:#000; background:none; border:none;
    cursor:pointer; padding:0; opacity:0.4; transition:opacity .2s;
    pointer-events:auto;
  }
  #reportHead button:hover { opacity:1; }
  #reportText {
    flex:1; font-family:'SF Mono','Menlo','Courier New',monospace; font-size:11px;
    line-height:1.68; padding:14px 18px; background:#ebebeb;
    border:none; outline:none; resize:none; cursor:pointer;
    overflow-y:auto; color:#1a1a1a; -webkit-overflow-scrolling:touch;
  }
  /* ── Side panels: clocks (left) + hemisphere disks (right) ─────────── */
  /* Hidden by default; only revealed on viewports that are large AND
     landscape, so the panels never crowd the central globe on:
       • phones (always too narrow / too short),
       • small tablets like the iPad mini (landscape height 744–768
         px — below the 800 px floor),
       • any device held in portrait — `(orientation: portrait)` flips
         a tablet's height/width so the landscape rule below fails as
         soon as the user rotates the device 90°.
     iPad standard 10.2" / Air / Pro all sit at ≥ 810 px landscape
     height and ≥ 1080 px landscape width, so they unlock the panels. */
  #clocksWrap, #disksWrap { display:none; }
  @media (orientation: landscape) and (min-width: 1000px) and (min-height: 800px) {
    #clocksWrap, #disksWrap { display:flex; }
  }
  #clocksWrap{
    position:fixed; left:28px; top:50%; transform:translateY(-50%);
    flex-direction:column; gap:0;
    z-index:50; pointer-events:none; user-select:none;
    overflow:visible;
    /* One shadow for the combined silhouette of BOTH clocks. Doing this at
       the wrap (rather than on each SVG individually) avoids the two
       drop-shadows clipping each other at the tangent join. */
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.55));
  }
  /* Pull the second clock up so the two circular faces touch edge-to-edge.
     SVG viewBox is 100 units mapped to 256px (1u = 2.56px); the face circle has
     radius 46u = 117.76px, leaving 10.24px of empty padding above/below the
     circle in each SVG. Overlapping the two SVGs by 20.48px makes them tangent. */
  #clocksWrap .gc-clock + .gc-clock{ margin-top:-20.48px; }
  #disksWrap{
    position:fixed; right:28px; top:50%; transform:translateY(-50%);
    flex-direction:column; gap:0;
    z-index:50; pointer-events:none; user-select:none;
    overflow:visible;
    /* One shadow for the combined silhouette of BOTH disks. Doing this at
       the wrap (rather than on each SVG individually) avoids the two
       drop-shadows clipping each other at the tangent join. */
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.55));
  }
  /* Same idea for the hemisphere disks: 200-unit viewBox → 256px (1u = 1.28px),
     outer ring radius 92u = 117.76px, so each SVG has 10.24px of empty padding
     above and below the disk. Overlap by 20.48px to make the two disks tangent. */
  #disksWrap .gc-disk + .gc-disk{ margin-top:-20.48px; }
  .gc-clock{
    width:256px; height:256px; display:block; opacity:1;
    /* Opacity is locked at 1 so the black face's #1a doesn't get bleached
       by the gray background underneath. overflow:visible lets the inner
       halo filters render fully even if their bounds peek over the SVG
       viewBox. The disk shadow itself is now drawn by #clocksWrap so the
       two faces share ONE shadow silhouette. */
    overflow:visible;
  }
  /* Side-panel palette: softened "near-white" #d0 and "near-black" #40.
     Less stark than pure piece tones but still a clear two-tone contrast
     on the gray game background. */
  .gc-clock .face-w{ fill:#c4c4c4; stroke:#a4a4a4; stroke-width:0.6; }
  .gc-clock .face-b{ fill:#404040; stroke:#5a5a5a; stroke-width:0.6; }
  /* Contrast elements use the OTHER clock's face colour so the two clocks
     share one palette: dark elements on the white clock are the black face's
     #404040; light elements on the black clock are the white face's #c4c4c4.
     The white clock's second hand uses #404040, the black clock's uses pure
     white (Swiss-railway style — see _buildClock for the disc tip). */
  .gc-clock .tick-w{ stroke:#404040; }
  .gc-clock .tick-b{ stroke:#c4c4c4; }
  .gc-clock .num-w{ fill:#404040; }
  .gc-clock .num-b{ fill:#c4c4c4; }
  /* Digital readout — sits below the centre pin and above the "6" numeral.
     Inherits the same Times New Roman italic face as the rest of the
     clock numerals so the analog and digital text feel like one family.
     Sized slightly larger than the hour numerals (7u vs 4.5u) so the
     readout reads cleanly without crowding the hands.
     The digital is painted in WHITE with mix-blend-mode:difference so
     every pixel renders as the inverse of whatever sits underneath:
       • over the face → reads as ~#3b3b3b (white clock) / ~#bfbfbf (black
         clock) — visually identical to the original #404040 / #c4c4c4
         numerals (within ~2% lightness).
       • where any hand sweeps over the digit → reads as the hand colour
         inverted (light over the dark hand, dark over the light hand) —
         giving the requested "反白/反黑 at overlap" effect.
     Both theme classes use the same rule because the difference blend
     auto-derives the correct theme colour from the face/hand backdrop. */
  .gc-clock .digital-w,
  .gc-clock .digital-b{
    font-size:7px; letter-spacing:0.4px;
    fill:#ffffff;
    mix-blend-mode:difference;
    /* Override the .gc-clock text default of dominant-baseline:central.
       With "alphabetic", the y= attribute pins the alphabetic baseline
       (= bottom of the cap glyphs) rather than the cap-height centre,
       so the inner <tspan> for the centiseconds inherits the same
       baseline and its bottoms line up with the SS digits' bottoms.
       This is the cleanest way to bottom-align differently-sized
       glyphs inside one <text>; baseline-shift on the tspan is
       inconsistently rendered across browsers under mix-blend-mode. */
    dominant-baseline:alphabetic;
  }
  /* Centisecond readout — two tiny digits glued directly to the SS digits
     (no decimal point separator) at 60% of the parent font-size
     (7 × 0.6 = 4.2 CSS px). Inherits fill, mix-blend-mode AND the parent's
     alphabetic baseline, so its bottoms line up with the SS digits' bottoms
     automatically — no per-tspan baseline math needed. */
  .gc-clock .digital-cs{
    font-size:4.2px; letter-spacing:0.2px;
  }
  .gc-clock .hand-w{ stroke:#404040; fill:#404040; stroke-linecap:round; }
  .gc-clock .hand-b{ stroke:#c4c4c4; fill:#c4c4c4; stroke-linecap:round; }
  .gc-clock .sec-w{ stroke:#404040; fill:#404040; stroke-linecap:butt; }
  .gc-clock .sec-b{ stroke:#ffffff; fill:#ffffff; stroke-linecap:butt; }
  .gc-clock text{
    font-family:'Times New Roman',Times,serif; font-style:italic;
    /* Clock viewBox is 100u → 256px (1u = 2.56px). 4.5u ≈ 11.5px on screen,
       matching the corner UI labels (font-size:11px). */
    font-size:4.5px; text-anchor:middle; dominant-baseline:central;
  }
  .gc-disk{
    width:256px; height:256px; display:block;
    cursor:grab; pointer-events:auto; touch-action:none;
    opacity:1;
    /* Opacity locked at 1 so the dark cells match the black clock face
       exactly. overflow:visible lets inner SVG filters render without
       being clipped at the viewBox. The disk's outer shadow is now drawn
       by #disksWrap so the two disks share ONE shadow silhouette and
       don't clip each other at the tangent join. */
    overflow:visible;
  }
  .gc-disk.dragging{ cursor:grabbing; }
  /* Disk cells use the same softened palette as the clocks: near-white #d0
     and near-black #40 — a clear but not stark two-tone. pole-cap sits at
     the midpoint #888888. */
  .gc-disk .cell-light{ fill:#c4c4c4; stroke:#a4a4a4; stroke-width:0.25; }
  .gc-disk .cell-dark { fill:#404040; stroke:#5a5a5a; stroke-width:0.25; }
  .gc-disk .pole-cap{ fill:#888888; stroke:#6a6a6a; stroke-width:0.4; }
  .gc-disk text{
    font-family:'Times New Roman',Times,serif;
    /* 80% of the previous 14u font-size — pieces read clearly but no
       longer crowd their cells. No hard stroke outline: pc-white and
       pc-black supply a soft drop-shadow halo instead (see below) so the
       glyph edges are gently faded rather than sharp. */
    font-weight:700; font-style:italic; font-size:11.2px;
    text-anchor:middle; dominant-baseline:central;
    pointer-events:none; user-select:none;
  }
  /* Letter fills. The halo is supplied by an SVG native filter (see
     _addHaloFilters in the IIFE), referenced per-element via the
     `filter="url(#...-halo-…)"` attribute — pc-white gets the black halo,
     pc-black gets the white.
     Optical-weight balance: white text always reads slightly bolder than
     black text at the same geometric width (the white expands into the
     visual field), so we give ONLY the black glyph a same-colour stroke
     to thicken it; the white glyph stays as a plain fill. Net effect:
     both read at the same thickness. */
  .gc-disk .pc-white{ fill:#ffffff; stroke:none; }
  .gc-disk .pc-black{
    fill:#000000; stroke:#000000; stroke-width:0.4; paint-order:stroke;
  }
  /* Knight-move overlay — a separate SVG layered on top of both disks so
     the knight's letter can slide smoothly across the hemisphere boundary
     without the usual cross-disk snap. The selectors mirror .gc-disk so
     the overlay text reads exactly the same as the resident cell letters. */
  #disksKnightOverlay{
    position:absolute; top:0; left:0; width:256px; height:491.52px;
    pointer-events:none; overflow:visible;
  }
  #disksKnightOverlay text{
    font-family:'Times New Roman',Times,serif;
    font-weight:700; font-style:italic; font-size:11.2px;
    text-anchor:middle; dominant-baseline:central;
    pointer-events:none; user-select:none;
  }
  #disksKnightOverlay .pc-white{ fill:#ffffff; stroke:none; }
  #disksKnightOverlay .pc-black{
    fill:#000000; stroke:#000000; stroke-width:0.4; paint-order:stroke;
  }
  .gc-disk .pole-label{
    fill:rgba(255,255,255,0.55); stroke:none; font-size:6.5px;
    letter-spacing:1px;
  }
  /* Move-path halo is wired up through the same SVG <filter> pipeline as
     the letters (see _addHaloFilters / _moveLayer.setAttribute('filter',
     …) in the IIFE). No CSS filter here for the same reason as the
     letters — nested CSS filters inside a CSS-filtered SVG render
     unreliably in practice. */
</style>
</head>
<body>
<div id="introFade" style="position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;transition:opacity 2s ease-out;"></div>
<div id="turn">White to move</div>
<a id="seeOrigBtn" href="https://mrjoshuachao.github.io/dot.html" target="_blank" style="display:none">See original</a>
<button id="pieceLetterBtn" class="ui-btn" style="position:fixed;top:28px;left:28px;z-index:100;text-align:left;" onclick="togglePieceLetters()">Piece letter on</button>
<button id="newGameBtn" class="ui-btn" onclick="resetGame()">New game</button>
<button id="testBtn" class="ui-btn" onclick="toggleTestMode()">Test move</button>

<!-- Test piece selector panel -->
<div id="testPanel">
  <div class="test-row">
    <div class="test-row-label">White</div>
    <div class="test-pieces">
      <button class="tpb" data-type="K" data-color="white">K</button>
      <button class="tpb" data-type="Q" data-color="white">Q</button>
      <button class="tpb" data-type="R" data-color="white">R</button>
      <button class="tpb" data-type="B" data-color="white">B</button>
      <button class="tpb" data-type="N" data-color="white">N</button>
      <button class="tpb" data-type="P" data-color="white">P</button>
    </div>
  </div>
  <div class="test-row">
    <div class="test-row-label">Black</div>
    <div class="test-pieces">
      <button class="tpb" data-type="K" data-color="black">K</button>
      <button class="tpb" data-type="Q" data-color="black">Q</button>
      <button class="tpb" data-type="R" data-color="black">R</button>
      <button class="tpb" data-type="B" data-color="black">B</button>
      <button class="tpb" data-type="N" data-color="black">N</button>
      <button class="tpb" data-type="P" data-color="black">P</button>
    </div>
  </div>
</div>
<!-- Battle area (bottom right) -->
<div id="battleArea">
  <!-- Idle state -->
  <button id="autoBattleBtn" onclick="startAutoBattle()">Watch AI battle</button>
  <!-- Active battle controls -->
  <div id="autoBattleControls">
    <button id="autoPauseBtn" onclick="toggleAutoPause()">Pause</button>
    <button onclick="newAutoBattle()">Reset</button>
    <button onclick="stopAutoBattle()">Quit</button>
  </div>
</div>
<!-- Report Modal -->
<div id="reportModal">
  <div id="reportBox">
    <div id="reportHead">
      <span>Battle report</span>
      <div class="rh-btns">
        <button id="copyReportBtn" onclick="copyReport()">Copy all</button>
        <button onclick="closeReport()">Close</button>
      </div>
    </div>
    <textarea id="reportText" readonly onclick="this.select()"></textarea>
  </div>
</div>
<!-- AI opponent toggle (top left) -->
<div id="aiWrap" onclick="toggleAI()">
  <input type="checkbox" id="aiToggle" style="display:none">
  <span id="aiLabel">AI opponent off</span>
</div>
<!-- Player thinking-time clocks (left, desktop/tablet only) -->
<div id="clocksWrap">
  <svg id="clockWhite" class="gc-clock" viewBox="-50 -50 100 100" aria-label="White thinking time"></svg>
  <svg id="clockBlack" class="gc-clock" viewBox="-50 -50 100 100" aria-label="Black thinking time"></svg>
</div>
<!-- Hemisphere disks (right, desktop/tablet only) -->
<div id="disksWrap">
  <svg id="diskNorth" class="gc-disk" viewBox="-100 -100 200 200" aria-label="North hemisphere"></svg>
  <svg id="diskSouth" class="gc-disk" viewBox="-100 -100 200 200" aria-label="South hemisphere"></svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Renderer ─────────────────────────────────────────────────────────────────
let _pieceLettersVisible=true; // must be before placePiece calls
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputEncoding     = THREE.sRGBEncoding;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 2000);
camera.position.set(0, 0, innerWidth < 768 ? 5.5 : 4.2);

// ─── Environment (cube camera) ────────────────────────────────────────────────
const envDome = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vDir;
      float rbox(vec3 d,vec3 c,vec3 u,vec3 r,float hw,float hh,float es){
        vec3 cn=normalize(c); float fwd=dot(d,cn); if(fwd<0.0)return 0.0;
        vec3 t=d-cn*fwd;
        float uu=dot(t,normalize(r))/max(fwd,0.001);
        float vv=dot(t,normalize(u))/max(fwd,0.001);
        return (1.0-smoothstep(hw-es,hw+es,abs(uu)))*(1.0-smoothstep(hh-es,hh+es,abs(vv)))*smoothstep(0.3,0.7,fwd);
      }
      void main(){
        float y=vDir.y;
        vec3 col=mix(vec3(0.82),vec3(0.98),smoothstep(-1.0,1.0,y));
        col+=vec3(rbox(vDir,vec3(-0.7,0.55,0.45),vec3(0,1,0),vec3(0,0,1),0.55,0.42,0.38)*0.92);
        col+=vec3(rbox(vDir,vec3(0.65,0.40,0.65),vec3(0,1,0),vec3(1,0,0),0.45,0.32,0.32)*0.70);

        gl_FragColor=vec4(min(col,vec3(1.0)),1.0);

const R=1;

const BAND_THETA=(Math.PI-2*CAP_THETA)/NUM_LAT;
const globe=new THREE.Group(); scene.add(globe);

// Depth occluder: invisible BackSide sphere. The front-side cell tiles do not cover the far
// hemisphere's depth buffer (they're back-face-culled), so pieces on the back of the globe
// pass the depth test and bleed through. This hidden sphere fills the far hemisphere's depth
// buffer and occludes any pieces behind the globe surface.
const _depthOccluder=new THREE.Mesh(
  new THREE.SphereGeometry(R*0.998,48,32),
  new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,side:THREE.BackSide})
);

// Cell meshes — renderOrder:-1 so globe geometry ALWAYS writes depth before chess pieces
// (renderOrder 0) test it. This guarantees pieces behind the sphere fail depth test.
const cellMeshes=[];
for(let lat=0;lat<NUM_LAT;lat++){
  for(let lon=0;lon<NUM_LON;lon++){
    const geo=new THREE.SphereGeometry(R,28,14,(lon/NUM_LON)*Math.PI*2,(Math.PI*2)/NUM_LON,CAP_THETA+lat*BAND_THETA,BAND_THETA);
    const mesh=new THREE.Mesh(geo,(lat+lon)%2===0?matW:matB);
    mesh.renderOrder=-1;
    mesh.userData={isCellMesh:true,lat,lon};
    globe.add(mesh);
    cellMeshes.push(mesh);
  }
}
capN.renderOrder=-1; capS.renderOrder=-1; _depthOccluder.renderOrder=-1;

// Ghost depth sphere: re-writes depth to globe-only (erases piece depth) for ghost layers.
// transparent:true puts it in the transparent queue (after blob shadows at renderOrder 0).
const _ghostDepthMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,transparent:true,opacity:1});
_ghostDepthMat.depthFunc=THREE.AlwaysDepth;

function cellPos(lat,lon,r=R*1.12){
  const theta=CAP_THETA+(lat+0.5)*BAND_THETA;
  const phi=((lon+0.5)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}
function cornerPos3D(latB,lonB,r=R*1.019){
  const theta=latB===0?CAP_THETA:latB===8?Math.PI-CAP_THETA:CAP_THETA+latB*BAND_THETA;
  const phi=((lonB)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}

function makeLetterTex(letter,isBlack){
  const S=512;
  const cv=document.createElement('canvas');
  cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,S,S);
  ctx.font=`italic bold ${Math.round(S*0.62)}px "Times New Roman",Times,serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const cx=S/2, cy=S/2+S*0.04;
  // Foggy glow edge
  const glowCol=isBlack?'rgba(255,255,255,1)':'rgba(0,0,0,1)';
  ctx.fillStyle=glowCol;
  ctx.shadowColor=glowCol;
  ctx.shadowBlur=28;
  for(let i=0;i<6;i++) ctx.fillText(letter,cx,cy);
  // Pure color letter on top
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';
  ctx.fillStyle=isBlack?'#000000':'#ffffff';
  ctx.fillText(letter,cx,cy);
  return new THREE.CanvasTexture(cv);
}

const allSprites=[];

// ─── Piece Mesh ───────────────────────────────────────────────────────────────
function createPieceMesh(type,isBlack){
  const g=new THREE.Group();
  const mat=isBlack?matDark:matLight;
  const hMin=u*4.5, hMax=u*7.5, step=(hMax-hMin)/4;
  const _H=1.375; // height scale: 1.25 × 1.10 = taller, slimmer silhouette
  const heights={'P':hMin*1.2*_H,'R':(hMin+step*2.3)*_H,'N':(hMin+step*2)*_H,'B':(hMax*0.5*1.25)*_H,'Q':hMax*_H,'K':hMax*_H};
  const r=u*1.65, h=heights[type]||(hMin+step*2)*_H;
  let cyl;

  if(type==='P'){
    const eggR=r*0.85*1.2;
    cyl=new THREE.Mesh(new THREE.SphereGeometry(eggR,32,24),mat);
    cyl.scale.y=(hMin*1.2*_H)/(2*eggR);
  } else if(type==='K'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.115,r*0.05,h,32),mat);
  } else if(type==='B'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(r,32,16,0,Math.PI*2,0,Math.PI/2),mat);
    dome.scale.y=1.5;
    dome.position.y=h/2;
    cyl.add(dome);
  } else if(type==='Q'){
    const rTop=r, rBot=r*1.10, waist=r*0.52;
    const pts=[];
    const N=40;
    for(let i=0;i<=N;i++){
      const t=i/N;
      const rad=rBot+(rTop-rBot)*t - waist*Math.sin(Math.PI*t);
      pts.push(new THREE.Vector2(Math.max(rad,r*0.18), t*h - h/2));
    }
    const geo=new THREE.LatheGeometry(pts,40);
    cyl=new THREE.Mesh(geo,mat);
    const topCap=new THREE.Mesh(new THREE.CircleGeometry(rTop,40),mat);
    topCap.rotation.x=-Math.PI/2; topCap.position.y=h/2;
    const botCap=new THREE.Mesh(new THREE.CircleGeometry(rBot,40),mat);
    botCap.rotation.x=Math.PI/2; botCap.position.y=-h/2;
    cyl.add(topCap); cyl.add(botCap);
  } else if(type==='N'){
    const W=r*2.6, H=h, d=W*0.618*0.78;
    const crTR=H*0.32;
    const crBL=H*0.45;
    const yB=-H/2, yT=H/2;
    const xOff=-crBL/2;
    const shape=new THREE.Shape();
    shape.moveTo(xOff-W/2+crBL, yB);
    shape.lineTo(xOff+W/2,      yB);
    shape.lineTo(xOff+W/2,      yT-crTR);
    shape.quadraticCurveTo(xOff+W/2, yT, xOff+W/2-crTR, yT);
    shape.lineTo(xOff-W/2,      yT);
    shape.lineTo(xOff-W/2,      yB+crBL);
    shape.quadraticCurveTo(xOff-W/2+crBL, yB+crBL, xOff-W/2+crBL, yB);
    shape.closePath();
    const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSize:r*0.04,bevelThickness:r*0.04,bevelSegments:3});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.z=-d/2;
    const wrapper=new THREE.Group();
    wrapper.add(mesh);
    wrapper.rotation.y=0;
    cyl=wrapper;
  } else {
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
  }

  cyl.position.y=h/2;
  cyl.userData={isPiece:true};
  g.add(cyl);

  // Letter sprite
  const spMat=new THREE.SpriteMaterial({map:makeLetterTex(type,isBlack),transparent:true,depthTest:true,depthWrite:false,sizeAttenuation:true});
  const sp=new THREE.Sprite(spMat);
  sp.raycast=()=>{};
  const sz=r*1.1;
  sp.scale.set(sz,sz,sz);
  const domeExtra=(type==='B')?(r*1.325):(type==='N')?-sz*0.05:(type==='P')?-sz*0.05:0;
  sp.position.y=h+sz*0.5+domeExtra;
  g.add(sp);
  return g;
}

// ─── Blob Shadow ──────────────────────────────────────────────────────────────
function createBlobGroup(blobScale,blobOpacity){
  blobScale=blobScale||1;
  blobOpacity=blobOpacity||1;
  const r=u*1.65;
  const bS=256;
  const bCv=document.createElement('canvas'); bCv.width=bCv.height=bS;
  const bCtx=bCv.getContext('2d');
  const bGrad=bCtx.createRadialGradient(bS/2,bS/2,0,bS/2,bS/2,bS/2);
  bGrad.addColorStop(0,   `rgba(0,0,0,${0.48*blobOpacity})`);
  bGrad.addColorStop(0.35,`rgba(0,0,0,${0.32*blobOpacity})`);
  bGrad.addColorStop(0.65,`rgba(0,0,0,${0.12*blobOpacity})`);
  bGrad.addColorStop(1,   'rgba(0,0,0,0.00)');
  bCtx.fillStyle=bGrad; bCtx.fillRect(0,0,bS,bS);
  const mat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bCv),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  const circle=new THREE.Mesh(new THREE.CircleGeometry(r*1.3*blobScale,32),mat);
  circle.raycast=()=>{};
  circle.rotation.x=-Math.PI/2;
  circle.position.y=0.002;
  const grp=new THREE.Group();
  grp.add(circle);
  return grp;
}

function orientPiece(obj,pos){
  obj.quaternion.setFromUnitVectors(_pieceUp,pos.clone().normalize());
}

// Knight facing toward pole
const _faceV1=new THREE.Vector3(), _faceV2=new THREE.Vector3();
function faceKnightTowardPole(group,pos,towardNorth){
  const radial=pos.clone().normalize();
  const poleWorld=new THREE.Vector3(0,towardNorth?1:-1,0);
  _faceV1.copy(poleWorld).addScaledVector(radial,-radial.dot(poleWorld));
  if(_faceV1.lengthSq()<1e-5)return;
  _faceV1.normalize();
  _faceV2.copy(_faceV1).applyQuaternion(group.quaternion.clone().conjugate());
  // Back cap (+Z) faces pole: Ry(α) Z_new=(sinα,0,cosα). sinα=tx,cosα=tz → α=atan2(tx,tz)+π/2
  const angle=Math.atan2(_faceV2.x,_faceV2.z)+Math.PI/2;
  group.children.forEach(c=>{if(c.isGroup)c.rotation.y=angle;});
}

function placePiece(type,isBlack,lat,lon){
  const group=createPieceMesh(type,isBlack);
  const pos=cellPos(lat,lon,R);
  group.position.copy(pos);
  orientPiece(group,pos);
  if(type==='N') faceKnightTowardPole(group,pos,!isBlack);
  group.userData={isPiece:true,lat,lon};
  globe.add(group);
  allSprites.push(group);
  const _blobSc=(type==='K'||type==='P')?0.5:(type==='Q'||type==='R'||type==='B')?1.25:1;
  const _blobOp=(type==='K')?0.5:1;
  const blob=createBlobGroup(_blobSc,_blobOp);
  blob.position.copy(pos);
  orientPiece(blob,pos);
  globe.add(blob);
  board[lat][lon]={type,color:isBlack?'black':'white',sprite:group,blob,hasMoved:false};
  if(!_pieceLettersVisible)
    group.traverse(c=>{if(c.isSprite)c.visible=false;});
}
