      el.setAttribute('r',3.75);            // match origin ring radius
      el.setAttribute('fill',_CLR_ORANGE);
    } else if(kind==='capture'){
      el.setAttribute('r',4.5);
      el.setAttribute('fill','none');
      el.setAttribute('stroke',_CLR_DEEPRED);
      el.setAttribute('stroke-width',1.56);
    }
    svg._moveLayer.appendChild(el);
  }
  function _diskClearMoves(){
    [diskN,diskS].forEach(svg=>{
      while(svg._moveLayer.firstChild) svg._moveLayer.removeChild(svg._moveLayer.firstChild);
      // Belt-and-braces drain of the boost layer in case the mirror got
      // out of sync (e.g., a cloneNode failure swallowed by the try-catch
      // in the patched appendChild). Normally already empty after the
      // primary loop, since each removeChild drains one boost child too.
      if(svg._moveLayerBoost){
        while(svg._moveLayerBoost.firstChild)
          svg._moveLayerBoost.removeChild(svg._moveLayerBoost.firstChild);
      }
    });
  }
  function _diskShowMovesFor(originLat, originLon, autoOnlyLat, autoOnlyLon){
    _diskClearMoves();
    if(originLat==null || originLon==null) return;
    if(!board[originLat] || !board[originLat][originLon]) return;
    let moves;
    try {
      moves=(typeof testModeActive!=='undefined'&&testModeActive)
        ?(typeof getValidMoves==='function'?getValidMoves(originLat,originLon):[])
        :getLegalMoves(originLat,originLon);
    } catch(e){ return; }
    if(!moves||!moves.length) return;
    _diskMarker(originLat,originLon,'origin');
    const sp=board[originLat][originLon];
    const isCap=(lat,lon)=>{
      const t=board[lat]?.[lon];
      return !!(t&&sp&&t.color!==sp.color);
    };
    const passAuto=(m)=> (autoOnlyLat==null) || (m.lat===autoOnlyLat&&m.lon===autoOnlyLon);
    // Dedup grouped types (straight, diagonal) so each direction draws ONE
    // full path through every reachable cell — not N overlapping copies.
    let toDraw;
    if(autoOnlyLat!=null){
      toDraw=moves.filter(passAuto);
    } else {
      const farthest=new Map();
      const singles=[];
      for(const m of moves){
        let key=null;
        if(m.straightKey) key='S|'+m.straightKey;
        else if(m.diagKey) key='D|'+m.diagKey;
        if(!key){ singles.push(m); continue; }
        const score=(m.step||0) + (m.diagWP?m.diagWP.length:0);
        const prev=farthest.get(key);
        if(!prev || score>prev.score) farthest.set(key,{m,score});
      }
      toDraw=[...singles, ...Array.from(farthest.values()).map(v=>v.m)];
    }
    // Trim the polyline against the markers so the line stops at the
    // circumference of each ring/dot rather than piercing the centre.
    // Dots now match their same-coloured rings (yellow dot/ring r=3.75,
    // red ring r=4.5). +0.3u visual gap so the line clears the marker.
    const ORIGIN_TRIM=3.75+0.3;
    const DOT_TRIM=3.75+0.3;
    const CAPTURE_TRIM=4.5+0.3;
    const originPos=_diskCellXY(originLat, originLon);
    for(const m of toDraw){
      const tps=_movePathTPs(originLat, originLon, m);
      const cap=isCap(m.lat,m.lon);
      const targetPos=_diskCellXY(m.lat, m.lon);
      _drawPathColored(tps, cap, !!m.isKnight,
        { center:originPos, radius:ORIGIN_TRIM },
        { center:targetPos, radius: cap ? CAPTURE_TRIM : DOT_TRIM });
    }
    // Destination markers — drawn for every reachable cell.
    for(const m of moves){
      if(!passAuto(m)) continue;
      if(m.isEnPassant){
        _diskMarker(m.lat,m.lon,'dot');
        _diskMarker(m.capturedLat,m.capturedLon,'capture');
      } else if(isCap(m.lat,m.lon)){
        _diskMarker(m.lat,m.lon,'capture');
      } else {
        _diskMarker(m.lat,m.lon,'dot');
      }
    }
  }
  // Wrap globe-side functions so the disk overlay stays in sync.
  const _origShowMoves=window.showMoves;
  window.showMoves=function(lat,lon,autoOnlyLat,autoOnlyLon){
    const r=_origShowMoves.apply(this,arguments);
    try { _diskShowMovesFor(lat,lon, autoOnlyLat==null?null:autoOnlyLat, autoOnlyLon==null?null:autoOnlyLon); } catch(e){ /* keep globe even if disk fails */ }
    return r;
  };
  const _origClearVis=window.clearVis;
  window.clearVis=function(){
    const r=_origClearVis.apply(this,arguments);
    try { _diskClearMoves(); } catch(e){}
    return r;
  };

  // ── Flying letter (disk-side move animation) ────────────────────────────
  // While the globe runs its piece-move animation (moveAnim is non-null),
  // the disk normally would just snap-refresh because the board state
  // updates immediately. To get the SAME smooth animation on the disks,
  // we (1) capture the move's from/to/piece info at execMove time,
  // (2) suppress the disk letter refresh while moveAnim is running, and
  // (3) draw a temporary "flying" letter that tracks the moving sprite's
  // projected position on whichever disk it currently belongs to.
  let _diskMoveAnim=null;        // {fromLat, fromLon, toLat, toLon, type, color}
  let _flyingLetterN=null;       // temp <text> on north disk (or null)
  let _flyingLetterS=null;       // temp <text> on south disk (or null)
  let _flyingLetterK=null;       // temp <text> on the knight overlay (or null)

  const _origExecMove=window.execMove;
  if(typeof _origExecMove==='function'){
    window.execMove=function(fromLat,fromLon,toLat,toLon){
      const piece=board[fromLat]&&board[fromLat][fromLon];
      if(piece){
        _diskMoveAnim={
          fromLat, fromLon, toLat, toLon,
          type: piece.type, color: piece.color
        };
      } else {
        _diskMoveAnim=null;
      }
      return _origExecMove.apply(this,arguments);
    };
  }

  function _removeFlyingLetter(slot){
    const t=slot==='N'?_flyingLetterN:_flyingLetterS;
    if(t && t.parentNode) t.parentNode.removeChild(t);
    if(slot==='N') _flyingLetterN=null; else _flyingLetterS=null;
  }
  function _removeKnightLetter(){
    if(_flyingLetterK && _flyingLetterK.parentNode){
      _flyingLetterK.parentNode.removeChild(_flyingLetterK);
    }
    _flyingLetterK=null;
  }
  function _ensureKnightLetter(type, color){
    if(_flyingLetterK) return _flyingLetterK;
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('class','disk-letter '+(color==='white'?'pc-white':'pc-black'));
    t.textContent=_pieceLetter[type]||'';
    t.setAttribute('filter', color==='white'?knightOverlay._haloBlack:knightOverlay._haloWhite);
    knightOverlay.appendChild(t);
    _flyingLetterK=t;
    return t;
  }
  function _ensureFlyingLetter(isN, type, color){
    const slot=isN?'N':'S';
    let t=isN?_flyingLetterN:_flyingLetterS;
    if(t) return t;
    t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('class','disk-letter '+(color==='white'?'pc-white':'pc-black'));
    t.textContent=_pieceLetter[type]||'';
    // Same SVG halo filter that the resident cell letters use, picked by
    // piece colour: white piece → black halo, black piece → white halo.
    const host=isN?diskN:diskS;
    t.setAttribute('filter', color==='white'?host._haloBlack:host._haloWhite);
    host._rotGroup.appendChild(t);
    if(isN) _flyingLetterN=t; else _flyingLetterS=t;
    return t;
  }
  function _hideFromCellLetter(){
    if(!_diskMoveAnim) return;
    const {fromLat, fromLon}=_diskMoveAnim;
    [diskN,diskS].forEach(svg=>{
      const t=svg._rotGroup.querySelector(
        'text.disk-letter[data-lat="'+fromLat+'"][data-lon="'+fromLon+'"]');
      if(t && t.textContent){
        t.textContent='';
      }
    });
  }
  function _updateFlyingLetter(){
    if(!moveAnim || !_diskMoveAnim){
      // Animation finished (or never started): drop ALL flying letters
      // (per-disk + knight overlay) and clear pending state so the next
      // sig-change repaint runs.
      if(_flyingLetterN) _removeFlyingLetter('N');
      if(_flyingLetterS) _removeFlyingLetter('S');
      if(_flyingLetterK) _removeKnightLetter();
      if(_diskMoveAnim){
        _diskMoveAnim=null;
        _lastBoardSig='';                       // force the post-move refresh
      }
      return;
    }
    // Keep the FROM-cell letter erased every frame — the source state is
    // "pre-move" because we gate _refreshDiskLetters on !moveAnim, but
    // _refreshDiskLetters may still have repainted FROM with the OLD piece
    // once at animation start. Cheap to keep clearing it.
    _hideFromCellLetter();
    // KNIGHT: render in the cross-hemisphere overlay with a straight-line
    // interpolation from source-cell to destination-cell, so the letter
    // moves smoothly even across the equator. (Sliding pieces still use
    // the 3D-position projection below — they trace surface paths and
    // their flying-letter motion already aligns with the move-path.)
    if(_diskMoveAnim.type==='N'){
      if(_flyingLetterN) _removeFlyingLetter('N');
      if(_flyingLetterS) _removeFlyingLetter('S');
      const src=_cellOverlayPos(_diskMoveAnim.fromLat, _diskMoveAnim.fromLon);
      const dst=_cellOverlayPos(_diskMoveAnim.toLat,   _diskMoveAnim.toLon);
      const te=(typeof easeInOut==='function')
        ? easeInOut(moveAnim.t)
        : moveAnim.t;
      const x=src.x + (dst.x - src.x) * te;
      const y=src.y + (dst.y - src.y) * te;
      const letter=_ensureKnightLetter(_diskMoveAnim.type, _diskMoveAnim.color);
      letter.setAttribute('x', x.toFixed(2));
      letter.setAttribute('y', y.toFixed(2));
      return;
    }
    // Non-knight: drop any leftover knight overlay letter, then continue
    // with the original per-disk 3D-projection flying letter.
    if(_flyingLetterK) _removeKnightLetter();
    // Read the moving sprite's globe-local position and project onto the
    // disk corresponding to its current hemisphere.
    const sp=moveAnim.sprite;
    if(!sp || !sp.position) return;
    const pos=sp.position;
    const len=Math.hypot(pos.x, pos.y, pos.z);
    if(len<1e-4) return;
    const theta=Math.acos(Math.max(-1, Math.min(1, pos.y/len)));
    const phi=Math.atan2(pos.z, pos.x);
    const proj=_proj(theta, phi);
    // Drop the flying letter from the other hemisphere if the piece crossed
    // the equator mid-animation.
    if(proj.isN){
      if(_flyingLetterS) _removeFlyingLetter('S');
    } else {
      if(_flyingLetterN) _removeFlyingLetter('N');
    }
    const letter=_ensureFlyingLetter(proj.isN, _diskMoveAnim.type, _diskMoveAnim.color);
    letter.setAttribute('x', proj.x.toFixed(2));
    letter.setAttribute('y', proj.y.toFixed(2));
    // The per-frame _updateDisks() picks the flying letter up via the
    // `text.disk-letter` selector and applies the same counter-rotation
    // (and mirror, on south) used for the static cell labels, so the
    // flying letter stays upright the whole way.
  }

  // ── Board-state reflection ───────────────────────────────────────────────
  let _lastBoardSig='';
  function _boardSig(){
    let s='';
    for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
      const p=board[la][lo];
      s += p?(p.color[0]+p.type):'--';
    }
    return s;
  }
  function _refreshDiskLetters(){
    [diskN,diskS].forEach(svg=>{
      svg._rotGroup.querySelectorAll('text.disk-letter').forEach(t=>{
        const lat=+t.dataset.lat, lon=+t.dataset.lon;
        const p=board[lat]?.[lon];
        if(p){
          t.textContent=_pieceLetter[p.type]||'';
          t.setAttribute('class','disk-letter '+(p.color==='white'?'pc-white':'pc-black'));
          // Pick the matching halo filter so white glyphs sit on a black
          // halo and black glyphs on a white one.
          t.setAttribute('filter', p.color==='white'?svg._haloBlack:svg._haloWhite);
        }else{
          t.textContent='';
          t.setAttribute('class','disk-letter');
          t.removeAttribute('filter');
        }
      });
    });
  }

  // ── Disk rotation (independent of globe) ─────────────────────────────────
  // The disks keep their OWN yaw state, decoupled from globe.quaternion.
  // Rotating the globe never rotates the disks, and rotating a disk (via
  // its drag handler below) never rotates the globe. Only the chess board
  // state (lat/lon of pieces) is shared between the two views; their
  // visual orientations are now independent.
  let _diskYaw=0;
  function _updateDisks(){
    const deg=_diskYaw*180/Math.PI;
    // The two disks rotate in OPPOSITE directions with disk yaw. Baselines
    // place the K–Q pair symmetrically about the centre of each disk's
    // facing edge: on north, Q (lon 4) lower-left and K (lon 3) lower-right
    // around SVG 90° (the bottom, facing south); on south, white K and Q
    // sit symmetrically around SVG −90° (the top, facing north). With these
    // baselines, page-load (disk yaw = 0) shows the user's expected
    // chess-board face-off layout.
    //
    // Geometry: the K–Q midpoint is at sector 3.5 (group SVG 67.5°). For
    // that midpoint to land at SVG 90° on north, baseline = 22.5°. For the
    // same midpoint to land at SVG −90° on south (after scale-x mirror
    // sends group SVG 67.5° → 112.5°), baseline = 157.5°.
    diskN._rotGroup.setAttribute('transform',`rotate(${(-deg+22.5).toFixed(3)})`);
    diskS._rotGroup.setAttribute('transform',`rotate(${(deg+157.5).toFixed(3)}) scale(-1,1)`);
    // Counter-rotate letters so glyphs stay upright on each disk. On south,
    // additionally flip the glyph horizontally around its own position so
    // it reads forwards after the disk's scale(-1, 1).
    const negN=(-(-deg+22.5)).toFixed(3);  // = (deg − 22.5)
    const negS=(-(deg+157.5)).toFixed(3);
    diskN._rotGroup.querySelectorAll('text.disk-letter').forEach(t=>{
      t.setAttribute('transform',`rotate(${negN} ${t.getAttribute('x')} ${t.getAttribute('y')})`);
    });
    diskS._rotGroup.querySelectorAll('text.disk-letter').forEach(t=>{
      const x=parseFloat(t.getAttribute('x'))||0;
      const y=parseFloat(t.getAttribute('y'))||0;
      t.setAttribute('transform',
        `translate(${(2*x).toFixed(3)},0) scale(-1,1) `+
        `rotate(${negS} ${x.toFixed(3)} ${y.toFixed(3)})`);
    });
  }

  // ── Disk drag interaction (rotates only the disks, NOT the globe) ────────
  // Also: a near-stationary tap on a cell that holds a piece selects that
  // piece. The selection auto-rotates the globe to centre the piece in the
  // camera view (via rotateGlobeToFace) and then shows its legal moves.
  function _attachDiskDrag(svg,isNorth){
    let prev=0, pid=null, downX=0, downY=0, totalRot=0;
    function angleAt(e){
      const r=svg.getBoundingClientRect();
      return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2));
    }
    svg.addEventListener('pointerdown',e=>{
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      pid=e.pointerId; prev=angleAt(e);
      downX=e.clientX; downY=e.clientY; totalRot=0;
      svg.classList.add('dragging');
    });
    svg.addEventListener('pointermove',e=>{
      if(e.pointerId!==pid)return;
      e.preventDefault();
      const a=angleAt(e);
      let da=a-prev; if(da>Math.PI)da-=2*Math.PI; if(da<-Math.PI)da+=2*Math.PI;
      prev=a;
      // The two disks rotate in opposite directions: south's transform uses
      // (+_diskYaw), north's uses (−_diskYaw). For a CW drag on either disk
      // to spin THAT disk CW visually, north drags must invert the sign of
      // the diskYaw delta.
      _diskYaw += isNorth ? -da : da;
      totalRot += Math.abs(da);
    });
    function end(e){
      if(e.pointerId!==pid)return;
      try{svg.releasePointerCapture(pid);}catch(_){}
      pid=null; svg.classList.remove('dragging');
      // If the pointer barely moved (small angular rotation + small pixel
      // displacement), treat as a click and try to select a piece on the disk.
      const dx=e.clientX-downX, dy=e.clientY-downY;
      const pixDist=Math.hypot(dx,dy);
      if(totalRot<0.04 && pixDist<6){
        _handleDiskClick(svg, isNorth, e);
      }
    }
    svg.addEventListener('pointerup',end);
    svg.addEventListener('pointercancel',end);
    svg.addEventListener('pointerleave',end);
  }
  _attachDiskDrag(diskN,true);
  _attachDiskDrag(diskS,false);

  // Translate a pointer event on a disk into a (lat, lon) cell and, if it
  // holds a piece, rotate the globe to face that piece then trigger the
  // normal showMoves selection.
  function _handleDiskClick(svg, isNorth, e){
    // Guard: ignore disk clicks while animations / AI turns / autoplay are
    // running, to match the main globe click handler's behaviour.
    if(typeof autoBattleActive!=='undefined' && autoBattleActive) return;
    if(typeof globeRotAnim!=='undefined' && globeRotAnim) return;
    if(typeof moveAnim!=='undefined' && moveAnim) return;
    if(typeof aiThinking!=='undefined' && aiThinking) return;
    if(typeof autoBattlePaused!=='undefined' && autoBattlePaused) return;
    // Screen pixel → disk SVG-viewport coords (viewBox is 200 units mapped
    // to the element's CSS width; subtract centre to get coords centred at 0).
    const rect=svg.getBoundingClientRect();
    if(rect.width<=0 || rect.height<=0) return;
    const scale=200/rect.width;                       // 200u viewBox → element px
    const sx=(e.clientX-rect.left-rect.width/2)*scale;
    const sy=(e.clientY-rect.top-rect.height/2)*scale;
    // Apply inverse of this disk's rotation-group transform to get group-
    // local coords (where cells/letters were originally placed).
    const yawDeg=_diskYaw*180/Math.PI;
    let gx, gy;
    if(isNorth){
      // North group: rotate(−yawDeg + 22.5). Inverse: rotate by (yawDeg − 22.5).
      const a=(yawDeg-22.5)*Math.PI/180;
      const c=Math.cos(a), s=Math.sin(a);
      gx=sx*c - sy*s;
      gy=sx*s + sy*c;
    } else {
      // South group: rotate(yawDeg + 157.5) scale(-1, 1).
      // Inverse: invert rotation, then invert scale (scale(-1,1)⁻¹ = scale(-1,1)).
      const a=-(yawDeg+157.5)*Math.PI/180;
      const c=Math.cos(a), s=Math.sin(a);
      const ix=sx*c - sy*s;
      const iy=sx*s + sy*c;
      gx=-ix; gy=iy;
    }
    // Convert (gx, gy) to (ring, sector) → (lat, lon).
    const gr=Math.hypot(gx, gy);
    if(gr<R_IN || gr>R_OUT) return;                   // pole cap or outside
    const ring=Math.floor((gr-R_IN)/RING_W);
    if(ring<0 || ring>3) return;
    const lat=isNorth?ring:(7-ring);
    let angDeg=Math.atan2(gy, gx)*180/Math.PI;        // (−180, 180]
    let secAng=angDeg+90+22.5;                        // shift so sector 0 starts at 0
    secAng=((secAng%360)+360)%360;
    const lon=Math.floor(secAng/45)%8;
    // Tapping the already-selected piece deselects (mirrors globe click).
    // The globe is already centred on it, so no rotation needed.
    if(typeof selectedCell!=='undefined' && selectedCell &&
       selectedCell.lat===lat && selectedCell.lon===lon){
      try { clearVis(); } catch(_){}
      return;
    }
    // ALWAYS rotate the globe to bring the tapped cell to screen-centre,
    // regardless of whether it holds a piece or whether that piece is
    // currently selectable. Selection eligibility is enforced separately
    // and only gates the showMoves() call that runs after the rotation.
    const piece=board[lat] && board[lat][lon];
    const inTest=(typeof testModeActive!=='undefined' && testModeActive);
    let selectable=!!piece;
    if(selectable && typeof turnColor!=='undefined' &&
       piece.color!==turnColor && !inTest) selectable=false;
    // Block the human from selecting AI-owned pieces when AI mode is on.
    if(selectable && typeof aiMode!=='undefined' && aiMode &&
       typeof AI_COLOR!=='undefined' && piece && piece.color===AI_COLOR &&
       !inTest) selectable=false;
    const localDir=cellPos(lat, lon, R).normalize();
    if(typeof rotateGlobeToFace==='function'){
      rotateGlobeToFace(localDir, 650, ()=>{
        if(selectable){ try { showMoves(lat, lon); } catch(_){} }
      });
    } else if(selectable){
      try { showMoves(lat, lon); } catch(_){}
    }
  }

  // ── Disk-side check visualisation ───────────────────────────────────────
  // Mirrors the globe's red check ring on the king + red attack paths from
  // the threatening pieces. Drawn into svg._checkLayer, which is a separate
  // group from the orange/red move layer so clearVis() doesn't wipe it.
  function _diskClearCheck(){
    [diskN,diskS].forEach(svg=>{
      if(svg._checkLayer){
        while(svg._checkLayer.firstChild)
          svg._checkLayer.removeChild(svg._checkLayer.firstChild);
      }
      // Mirror drain for the boost layer (see _diskClearMoves above).
      if(svg._checkLayerBoost){
        while(svg._checkLayerBoost.firstChild)
          svg._checkLayerBoost.removeChild(svg._checkLayerBoost.firstChild);
      }
    });
  }
  function _diskShowCheckRing(lat, lon){
    const c=_diskCellXY(lat, lon);
    const svg=c.isN?diskN:diskS;
    if(!svg._checkLayer) return;
    // Double ring around the king's cell. Radii kept at the 75% scale
    // (5.5→4.125, 7.2→5.4) but stroke unified to 1.56 to match the path
    // and other ring widths.
    for(let i=0;i<2;i++){
      const ring=document.createElementNS(SVG_NS,'circle');
      ring.setAttribute('cx',c.x.toFixed(2));
      ring.setAttribute('cy',c.y.toFixed(2));
      ring.setAttribute('r',(4.125+i*1.275).toFixed(3));
      ring.setAttribute('fill','none');
      ring.setAttribute('stroke',_CLR_DEEPRED);
      ring.setAttribute('stroke-width',1.56);
      svg._checkLayer.appendChild(ring);
    }
  }
  function _diskShowCheckThreats(color){
    // Identical attacker-finding logic to the globe's showCheckThreats().
    let kLat=-1, kLon=-1;
    for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
      if(board[la][lo]?.type==='K' && board[la][lo]?.color===color){
        kLat=la; kLon=lo;
      }
    if(kLat===-1) return;
    const opp=color==='white'?'black':'white';
    for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
      const p=board[la][lo]; if(!p || p.color!==opp) continue;
      let attacks=false;
      if(p.type==='P'){
        const dir=p.color==='black'?1:-1;
        attacks=(la+dir===kLat && (wL(lo-1)===kLon || wL(lo+1)===kLon));
      } else {
        attacks=aiMoves(la,lo).some(m=>m.tLat===kLat && m.tLon===kLon);
      }
      if(!attacks) continue;
      const allMvs=getValidMoves(la,lo).filter(m=>m.lat===kLat && m.lon===kLon);
      if(!allMvs.length) continue;
      // Trim radii for the check-threat polyline: attacker's red dot now
      // matches the capture ring at r=4.5 (+0.3 visual gap). King's outer
      // red ring stays around r=5.4 (+0.3 gap).
      const attackerPos=_diskCellXY(la, lo);
      const kingPos=_diskCellXY(kLat, kLon);
      const ATTACKER_TRIM=4.5+0.3;
      const KING_TRIM=5.4+0.3;
      for(const mv of allMvs){
        let tps;
        try { tps=_movePathTPs(la, lo, mv); } catch(_){ continue; }
        if(!tps || tps.length<2) continue;
        let segs=_splitEqProj(tps);
        segs=_trimSegments(segs,
          { center:attackerPos, radius:ATTACKER_TRIM },
          { center:kingPos,     radius:KING_TRIM });
        for(const seg of segs){
          if(seg.pts.length<2) continue;
          const svg=seg.isN?diskN:diskS;
          if(!svg._checkLayer) continue;
          const path=document.createElementNS(SVG_NS,'path');
          let d='';
          for(let i=0;i<seg.pts.length;i++)
            d+=(i===0?'M':'L')+seg.pts[i].x.toFixed(2)+' '+seg.pts[i].y.toFixed(2)+' ';
          path.setAttribute('d',d);
          path.setAttribute('fill','none');
          path.setAttribute('stroke',_CLR_DEEPRED);
          path.setAttribute('stroke-width',1.56);
          path.setAttribute('stroke-linecap', mv.isKnight?'butt':'round');
          path.setAttribute('stroke-linejoin','round');
          if(mv.isKnight) path.setAttribute('stroke-dasharray','4 3');
          svg._checkLayer.appendChild(path);
        }
      }
      // Red dot at attacker's cell. Radius matches the red capture ring
      // (r=4.5) so red dots and red rings on the disk all read at the same
      // size as their colour counterparts.
      const c=_diskCellXY(la, lo);
      const svg=c.isN?diskN:diskS;
      if(svg._checkLayer){
        const dot=document.createElementNS(SVG_NS,'circle');
        dot.setAttribute('cx',c.x.toFixed(2));
        dot.setAttribute('cy',c.y.toFixed(2));
        dot.setAttribute('r',4.5);
        dot.setAttribute('fill',_CLR_DEEPRED);
        svg._checkLayer.appendChild(dot);
      }
    }
  }
  // Wrap the globe-side check functions so the disks stay in sync.
  if(typeof window.clearCheckRing==='function'){
    const _origClearCheckRing=window.clearCheckRing;
    window.clearCheckRing=function(){
      const r=_origClearCheckRing.apply(this,arguments);
      try { _diskClearCheck(); } catch(e){}
      return r;
    };
  }
  if(typeof window.showCheckRing==='function'){
    const _origShowCheckRing=window.showCheckRing;
    window.showCheckRing=function(lat,lon){
      const r=_origShowCheckRing.apply(this,arguments);
      try { _diskShowCheckRing(lat,lon); } catch(e){}
      return r;
    };
  }
  if(typeof window.showCheckThreats==='function'){
    const _origShowCheckThreats=window.showCheckThreats;
    window.showCheckThreats=function(color){
      const r=_origShowCheckThreats.apply(this,arguments);
      try { _diskShowCheckThreats(color); } catch(e){}
      return r;
    };
  }

  // ── Disk yaw animation (auto-align for AI / auto-battle moves) ──────────
  // When the AI is about to move (single-AI or auto-battle), rotate the
  // disks so the incoming move's equator crossing lands at the tangent
  // join — that way the move path renders as one continuous line across
  // the two disks instead of being split.
  let _diskYawAnim=null;
  function _animateDiskYawTo(target, dur){
    // Choose the shortest signed delta so the animation never wraps the
    // long way around.
    while(target - _diskYaw >  Math.PI) target -= 2*Math.PI;
    while(target - _diskYaw < -Math.PI) target += 2*Math.PI;
    _diskYawAnim={
      fromYaw: _diskYaw, toYaw: target,
      startTime: performance.now(), dur: dur || 460
    };
  }
  function _stepDiskYawAnim(){
    if(!_diskYawAnim) return;
    const elapsed=performance.now()-_diskYawAnim.startTime;
    const u=Math.min(1, elapsed/_diskYawAnim.dur);
    // ease-in-out cubic
    const te=u<0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
    _diskYaw=_diskYawAnim.fromYaw + (_diskYawAnim.toYaw - _diskYawAnim.fromYaw)*te;
    if(u>=1) _diskYawAnim=null;
  }
  // Find the equator-crossing φ of the move that will be displayed (if any).
  function _moveCrossingPhi(fromLat, fromLon, toLat, toLon){
    const moves=getLegalMoves(fromLat, fromLon);
    const m=moves.find(mv=>mv.lat===toLat && mv.lon===toLon);
    if(!m) return null;
    let tps;
    try { tps=_movePathTPs(fromLat, fromLon, m); } catch(_){ return null; }
    if(!tps || tps.length<2) return null;
    for(let i=1;i<tps.length;i++){
      const prevN=tps[i-1].theta<Math.PI/2, currN=tps[i].theta<Math.PI/2;
      if(prevN!==currN){
        const t=(Math.PI/2 - tps[i-1].theta) / (tps[i].theta - tps[i-1].theta);
        return tps[i-1].phi + (tps[i].phi - tps[i-1].phi)*t;
      }
    }
    return null;
  }
  // Public hook: the AI/auto-battle code calls this just before
  // rotateGlobeToFace() so the disks and the globe rotate in parallel.
  window._alignDisksForMove=function(fromLat, fromLon, toLat, toLon, dur){
    // Only auto-align when the human isn't driving — drags shouldn't fight
    // an animation, and a single-player human turn shouldn't have its
    // disks repositioned.
    const isAuto=(typeof autoBattleActive!=='undefined' && autoBattleActive) ||
                 (typeof aiMode!=='undefined' && aiMode);
    if(!isAuto) return;
    // Tangent corresponds to lon 3.5 (φ = π) at disk yaw = 0, so the disk
    // yaw needed to put any specific φ at the tangent is (φ − π).
    const crossPhi=_moveCrossingPhi(fromLat, fromLon, toLat, toLon);
    let targetPhi;
    if(crossPhi!==null){
      // Equator-crossing move: align the actual crossing longitude to the
      // tangent so the path's two halves meet seamlessly across the disks.
      targetPhi=crossPhi;
    } else {
      // Non-crossing move (stays in one hemisphere): align the move's
      // *centre longitude* to the tangent — that puts the lon column the
      // piece is moving along at the disk edge that faces the OPPONENT'S
      // hemisphere, so white pieces on the south disk visibly attack
      // "upward" toward the north tangent and black pieces on the north
      // disk attack "downward" toward the south tangent.
      const phiFrom=(fromLon+0.5)/NUM_LON*2*Math.PI;
      const phiTo  =(toLon  +0.5)/NUM_LON*2*Math.PI;
      // Shortest signed arc between the two phis (handles wraparound).
      let diff=phiTo-phiFrom;
      while(diff> Math.PI) diff-=2*Math.PI;
      while(diff<-Math.PI) diff+=2*Math.PI;
      targetPhi=phiFrom + diff/2;
    }
    _animateDiskYawTo(targetPhi - Math.PI, dur || 460);
  };

  // ── Per-frame update driver ──────────────────────────────────────────────
  function _sideUIFrame(){
    // Refresh letters only when the board actually changed AND no move
    // animation is in flight — during a move we keep the pre-move letter
    // state and let _updateFlyingLetter render the moving piece.
    const sig=_boardSig();
    if(sig!==_lastBoardSig && !moveAnim){
      _lastBoardSig=sig;
      _refreshDiskLetters();
    }
    _tickClocks();
    _updateFlyingLetter();
    _stepDiskYawAnim();
    _updateDisks();
    requestAnimationFrame(_sideUIFrame);
  }
  requestAnimationFrame(_sideUIFrame);

  // ── Reset hook: restart clocks whenever a new game starts ────────────────
  const _origResetGame=window.resetGame;
  window.resetGame=function(){
    const r=_origResetGame.apply(this,arguments);
    _resetClocks();
    _lastBoardSig='';      // force letter refresh on next frame
    return r;
  };
})();

animate();
</script>
</body>
</html>
