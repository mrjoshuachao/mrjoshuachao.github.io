<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Globe Chess · 自動對戰</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; }
  #games {
    display:grid;
    --rows:3;
    --columns:6;
    grid-template:repeat(var(--rows),minmax(0,1fr)) / repeat(var(--columns),minmax(0,1fr));
    gap:1px;
    background:#000;
    height:100%;
    color:#fff;
  }
  #archive {
    position:fixed; inset:0; z-index:2; display:grid; place-items:center;
    background:#000; color:#eee; font:14px/1.5 system-ui,sans-serif;
  }
  #archive-controls { display:grid; justify-items:center; gap:16px; }
  #archive-controls label { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  #game-limit {
    width:6ch; padding:6px; border:1px solid #888; border-radius:5px;
    background:#151515; color:#fff; font:inherit;
    font-variant-numeric:tabular-nums; text-align:center;
  }
  #game-limit:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  #record-folder {
    padding:12px 24px; border:1px solid #888; border-radius:7px;
    background:#151515; color:#fff; font:inherit; cursor:pointer;
  }
  #record-folder:hover { background:#242424; border-color:#ccc; }
  #record-folder:focus-visible { outline:2px solid #fff; outline-offset:4px; }
  #record-status {
    position:absolute; top:calc(50% + 64px); left:0; right:0;
    padding:0 16px; text-align:center; color:#ccc;
  }
  #archive.running {
    inset:auto 8px 6px auto; display:flex; align-items:center; gap:8px;
    padding:6px 9px; border-radius:5px; background:#181818; font-size:12px;
  }
  #archive.running #archive-controls { display:contents; }
  #archive.running #record-status { position:static; padding:0; }
  #archive.running button { padding:4px 8px; }
  #archive[hidden], #archive [hidden] { display:none; }
  iframe { display:block; width:100%; height:100%; border:0; min-width:0; min-height:0; }
</style>
</head>
<body>
<main id="games" aria-label="十八局自動球面西洋棋"></main>
<aside id="archive" aria-label="棋譜儲存">
  <span id="record-status" role="status"></span>
  <form id="archive-controls">
    <label id="game-limit-label">自動對弈
      <input id="game-limit" type="text" inputmode="numeric" maxlength="4"
        pattern="[0-9]{1,4}" placeholder="___" autocomplete="off" required aria-label="自動對弈場數">
      場棋局
    </label>
    <button type="submit" id="record-folder">選擇儲存棋譜的資料夾</button>
  </form>
</aside>
<template id="game-head">
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Globe Chess</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow: hidden; }
  body {
    /* All four gradient stops brightened by 125% (×1.25 on each channel
       value): #c8→#fa, #a0→#c8, #70→#8c, #40→#50. Keeps the same dark-
       vignette shape but the whole field reads lighter. */
    background: radial-gradient(circle at center, #fafafa 0%, #c8c8c8 40%, #8c8c8c 75%, #505050 100%);
    overflow: hidden;
    cursor: grab; user-select: none;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
  }
  body.dragging { cursor: grabbing; }
  canvas {
    display: block; touch-action: none;
    position: fixed; top: 0; left: 0;
  }
</style>
</template>
<template id="game-body">
<div id="introFade" style="position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;transition:opacity 2s ease-out;"></div>
<div hidden inert>
<div id="turn">White to move</div>
<a id="seeOrigBtn" href="https://mrjoshuachao.github.io/dot.html" target="_blank" style="display:none">See original</a>
<button id="pieceLetterBtn" class="ui-btn" style="position:fixed;top:var(--tile-inset);left:var(--tile-inset);z-index:100;text-align:left;" onclick="togglePieceLetters()">Piece letter on</button>

<script id="chess-engine">
const NUM_LAT=8, NUM_LON=8;
// ─── Move Rules ───────────────────────────────────────────────────────────────
function wL(n){return((n%8)+8)%8;}
function poleRef(l,n){
  if(l<0) return{l:-1-l,n:wL(n+4),pole:'N'};
  if(l>7) return{l:15-l, n:wL(n+4),pole:'S'};
  return{l,n,pole:null};
}

function isBoardCell(lat,lon){
  return Number.isInteger(lat)&&lat>=0&&lat<NUM_LAT&&
    Number.isInteger(lon)&&lon>=0&&lon<NUM_LON;
}

// Board topology is fixed. Each ray lists its cells in travel order so
// blockers, pole crossings and longitude wrap are identical for moves and attacks.
function buildGlobeSteps(lat,lon){
  function ray(dl,dn,diagonal){
    const cells=[];
    let l=lat,n=lon,passedPole=false;
    let latDir=dl,lonDir=dn;
    for(let step=0;step<(diagonal?14:15);step++){
      const oldLon=n;
      l+=latDir;
      n=wL(n+lonDir);
      if(l<0||l>=NUM_LAT){
        if(passedPole&&!diagonal)break;
        const ref=poleRef(l,oldLon);
        l=ref.l; n=ref.n;
        latDir=-latDir;
        if(diagonal)lonDir=-lonDir;
        passedPole=true;
      }
      if(l===lat&&n===lon)break;
      cells.push(l*NUM_LON+n);
    }
    return {dl,dn,cells};
  }
  const straight=[[1,0],[-1,0],[0,1],[0,-1]].map(([dl,dn])=>ray(dl,dn,false));
  const diagonal=[[1,1],[1,-1],[-1,1],[-1,-1]].map(([dl,dn])=>ray(dl,dn,true));
  const knight=[];
  for(const [dl,dn] of [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){
    const ref=poleRef(lat+dl,wL(lon+dn));
    const longLat=Math.abs(dl)===2;
    knight.push({square:ref.l*NUM_LON+ref.n,isKnight:true,longLat,
      elbowLat:longLat?lat+dl:lat,elbowLon:longLat?lon:wL(lon+dn)});
  }
  const king=new Set();
  for(const r of [...straight,...diagonal])king.add(r.cells[0]);
  return {straight,diagonal,knight,king:[...king]};
}
const globeSteps=Array.from({length:NUM_LAT*NUM_LON},(_,i)=>
  buildGlobeSteps(Math.floor(i/NUM_LON),i%NUM_LON));

// Empty-board origins from which a piece could check a given king.
// A slider's real path, pins and the moving king are still checked on the board.
const attackMasks={R:1,B:2,Q:3,N:4,K:8,P:16};
const checkingOrigins=globeSteps.map((topology,target)=>{
  const masks=new Uint8Array(64);
  for(const ray of topology.straight)for(const sq of ray.cells)masks[sq]|=attackMasks.R;
  for(const ray of topology.diagonal)for(const sq of ray.cells)masks[sq]|=attackMasks.B;
  for(const jump of topology.knight)masks[jump.square]|=attackMasks.N;
  for(const sq of topology.king)masks[sq]|=attackMasks.K;
  for(const row of [(target>>3)-1,(target>>3)+1]){
    if(row<0||row>=8)continue;
    for(const offset of [-1,1])masks[row*8+wL((target&7)+offset)]|=attackMasks.P;
  }
  return masks;
});

// Only the UI needs path metadata. Search keeps one move per resulting position.
function generateMoves(lat,lon,visual,tacticalOnly=false){
  const piece=board[lat]?.[lon];
  if(!piece)return [];
  const {type,color}=piece;
  const topology=globeSteps[lat*NUM_LON+lon];
  const moves=[];
  const seen=visual?null:new Set();
  function add(l,n,details){
    if(tacticalOnly&&!board[l][n]&&!details?.isEnPassant&&
       !(type==='P'&&(l===0||l===7)))return;
    if(seen){
      const key=l*NUM_LON+n;
      if(seen.has(key))return;
      seen.add(key);
      moves.push({fLat:lat,fLon:lon,tLat:l,tLon:n,...details});
    }else moves.push({lat:l,lon:n,...details});
  }
  function along(rays,diagonal){
    for(const {dl,dn,cells} of rays){
      const waypoints=visual&&diagonal?[]:null;
      let lastLat=lat,pole=null;
      for(let i=0;i<cells.length;i++){
        const l=cells[i]>>3,n=cells[i]&7;
        const target=board[l][n];
        if(target?.color===color)break;
        let details;
        if(visual){
          if(diagonal){
            waypoints.push(cellPos(l,n,R*1.019));
            details={diagKey:`${dl},${dn}`,diagWP:waypoints.slice(),step:i+1};
          }else{
            if(dl&&l===lastLat)pole=l===0?'N':'S';
            details={straightKey:`S${dl},${dn}`,straightDl:dl,straightDn:dn,step:i+1,pole};
          }
        }
        add(l,n,details);
        if(target)break;
        lastLat=l;
      }
    }
  }
  if(type==='R'||type==='Q')along(topology.straight,false);
  if(type==='B'||type==='Q')along(topology.diagonal,true);
  if(type==='N'){
    for(const jump of topology.knight){
      const l=jump.square>>3,n=jump.square&7;
      if(board[l][n]?.color!==color)add(l,n,visual?jump:undefined);
    }
  }
  if(type==='K'){
    // Keep the UI's original order when several routes reach the same cell:
    // the first route is the one selected for the move animation.
    for(let dl=-1;dl<=1;dl++)for(let dn=-1;dn<=1;dn++){
      if(!dl&&!dn)continue;
      const overPole=lat+dl<0||lat+dl>=NUM_LAT;
      const ref=poleRef(lat+dl,overPole?lon:wL(lon+dn));
      if(board[ref.l][ref.n]?.color===color)continue;
      let details;
      if(visual){
        details=dl&&dn
          ?{diagKey:`${dl},${dn}`,diagWP:[cellPos(ref.l,ref.n,R*1.019)]}
          :{straightKey:`S${dl},${dn}`,straightDl:dl,straightDn:dn,step:1,pole:ref.pole};
      }
      add(ref.l,ref.n,details);
    }
    const home=color==='white'?7:0;
    if(!tacticalOnly&&!piece.hasMoved&&lat===home&&lon===3){
      const left=board[lat][0],right=board[lat][7];
      if(left?.type==='R'&&left.color===color&&!left.hasMoved&&!board[lat][1]&&!board[lat][2])
        add(lat,1,{isCastle:true,rookFromLon:0,rookToLon:2,passThroughLon:2});
      if(right?.type==='R'&&right.color===color&&!right.hasMoved&&!board[lat][4]&&!board[lat][5]&&!board[lat][6])
        add(lat,5,{isCastle:true,rookFromLon:7,rookToLon:4,passThroughLon:4});
    }
  }
  if(type==='P'){
    const dir=color==='black'?1:-1,start=color==='black'?1:6;
    const l=lat+dir;
    if(l<0||l>=NUM_LAT)return moves;
    if(!board[l][lon]){
      add(l,lon);
      if(lat===start&&!board[l+dir][lon])add(l+dir,lon);
    }
    for(const n of [wL(lon-1),wL(lon+1)]){
      const target=board[l][n],adjacent=board[lat][n];
      if(target&&target.color!==color)add(l,n);
      else if(!target&&enPassantTarget?.lat===l&&enPassantTarget.lon===n&&
              adjacent?.type==='P'&&adjacent.color!==color)
        add(l,n,{isEnPassant:true,capturedLat:lat,capturedLon:n});
    }
  }
  return moves;
}

function getValidMoves(lat,lon){
  return generateMoves(lat,lon,true);
}

// ─── Check Detection ──────────────────────────────────────────────────────────
function findKingSquare(color){
  for(let l=0;l<NUM_LAT;l++)for(let n=0;n<NUM_LON;n++){
    const p=board[l][n];
    if(p?.type==='K'&&p.color===color)return l*NUM_LON+n;
  }
  return -1;
}

function isSquareAttacked(square,attacker){
  if(square<0)return false; // test mode can omit a king
  const topology=globeSteps[square];
  const l=square>>3,n=square&7;
  const pawnRow=board[l+(attacker==='black'?-1:1)];
  if(pawnRow){
    const left=pawnRow[wL(n-1)],right=pawnRow[wL(n+1)];
    if((left?.type==='P'&&left.color===attacker)||(right?.type==='P'&&right.color===attacker))return true;
  }
  for(const jump of topology.knight){
    const p=board[jump.square>>3][jump.square&7];
    if(p?.type==='N'&&p.color===attacker)return true;
  }
  for(const cell of topology.king){
    const p=board[cell>>3][cell&7];
    if(p?.type==='K'&&p.color===attacker)return true;
  }
  // Every straight or diagonal path is reversible, including a pole crossing.
  function seesSlider(rays,type){
    for(const ray of rays){
      for(const cell of ray.cells){
        const p=board[cell>>3][cell&7];
        if(!p)continue;
        if(p.color===attacker&&(p.type===type||p.type==='Q'))return true;
        break;
      }
    }
    return false;
  }
  return seesSlider(topology.straight,'R')||seesSlider(topology.diagonal,'B');
}

function isInCheck(color){
  return isSquareAttacked(findKingSquare(color),color==='white'?'black':'white');
}

function isLegalSearchMove(m,kingSquare,checkingTarget=-1){
  const piece=board[m.fLat][m.fLon];
  const enemy=piece.color==='white'?'black':'white';
  if(board[m.tLat][m.tLon]?.type==='K')return false;
  if(m.isCastle){
    if(isSquareAttacked(kingSquare,enemy))return false;
    board[m.fLat][m.fLon]=null;
    board[m.fLat][m.passThroughLon]=piece;
    const attacked=isSquareAttacked(m.fLat*NUM_LON+m.passThroughLon,enemy);
    board[m.fLat][m.passThroughLon]=null;
    board[m.fLat][m.fLon]=piece;
    if(attacked)return false;
  }
  const afterKing=piece.type==='K'?m.tLat*NUM_LON+m.tLon:kingSquare;
  // For an ordinary move, only the two occupied cells can affect attacks.
  // A checking promotion needs the promoted piece's attack pattern.
  if(!m.isCastle&&!m.isEnPassant&&!(checkingTarget>=0&&piece.type==='P'&&(m.tLat===0||m.tLat===7))){
    const victim=board[m.tLat][m.tLon];
    board[m.fLat][m.fLon]=null;
    board[m.tLat][m.tLon]=piece;
    const safe=(checkingTarget<0||isSquareAttacked(checkingTarget,piece.color))&&
      !isSquareAttacked(afterKing,enemy);
    board[m.fLat][m.fLon]=piece;
    board[m.tLat][m.tLon]=victim;
    return safe;
  }
  const saved=aiApply(m);
  const safe=(checkingTarget<0||isSquareAttacked(checkingTarget,piece.color))&&
    !isSquareAttacked(afterKing,enemy);
  aiUndo(m,piece,saved);
  return safe;
}

function getLegalMoves(lat,lon){
  const piece=board[lat][lon]; if(!piece)return [];
  const king=findKingSquare(piece.color),safety=new Map();
  return getValidMoves(lat,lon).filter(m=>{
    const key=m.lat*NUM_LON+m.lon;
    if(!safety.has(key)){
      safety.set(key,isLegalSearchMove({fLat:lat,fLon:lon,tLat:m.lat,tLon:m.lon,...m},king));
    }
    return safety.get(key);
  });
}

// On this globe no mate is possible when each side has its king and at
// most one knight or bishop. Share the rule with the auto-battle driver.
function hasInsufficientMatingMaterial(){
  let kings=0, minors=0;
  for(const row of board)for(const piece of row){
    if(!piece)continue;
    const side=piece.color==='white'?1:2;
    if(piece.type==='K'){
      kings|=side;
    }else{
      if((piece.type!=='N'&&piece.type!=='B')||(minors&side))return false;
      minors|=side;
    }
  }
  return kings===3;
}

function hasAnyLegalMove(color){
  const king=findKingSquare(color);
  for(let l=0;l<NUM_LAT;l++)for(let n=0;n<NUM_LON;n++){
    if(board[l][n]?.color!==color)continue;
    if(generateMoves(l,n,false).some(m=>isLegalSearchMove(m,king)))return true;
  }
  return false;
}


function aiMoves(lat,lon){
  return generateMoves(lat,lon,false);
}
// Find a side's sole blocker between a target and a slider on each globe ray.
// This identifies pins to our own king and discovered checks on theirs.
function sliderScreens(king,blockerColor,sliderColor){
  const screens=new Set();
  if(king<0)return screens;
  const topology=globeSteps[king];
  function scan(rays,slider){
    for(const ray of rays){
      let blocker=-1;
      for(const cell of ray.cells){
        const piece=board[cell>>3][cell&7];
        if(!piece||cell===blocker)continue;
        if(blocker<0&&piece.color===blockerColor){blocker=cell;continue;}
        if(blocker>=0&&piece.color===sliderColor&&(piece.type===slider||piece.type==='Q'))screens.add(blocker);
        break;
      }
    }
  }
  scan(topology.straight,'R');
  scan(topology.diagonal,'B');
  return screens;
}
function allAIMoves(color,tacticalOnly=false,checkingTarget=-1){
  const legal=[],king=findKingSquare(color);
  const enemy=color==='black'?'white':'black';
  const pins=checkingTarget<0&&!isSquareAttacked(king,enemy)?sliderScreens(king,color,enemy):null;
  const checkSquares=checkingOrigins[checkingTarget];
  const discoveries=checkSquares&&!isSquareAttacked(checkingTarget,color)
    ?sliderScreens(checkingTarget,color,color):null;
  for(let l=0;l<NUM_LAT;l++)for(let n=0;n<NUM_LON;n++){
    const piece=board[l][n];
    if(piece?.color!==color)continue;
    const free=pins&&piece.type!=='K'&&!pins.has(l*NUM_LON+n);
    const directOnly=discoveries&&!discoveries.has(l*NUM_LON+n);
    for(const move of generateMoves(l,n,false,tacticalOnly)){
      if(directOnly&&!move.isCastle&&!move.isEnPassant){
        const promotes=piece.type==='P'&&(move.tLat===0||move.tLat===7);
        const mask=promotes?attackMasks.Q:attackMasks[piece.type];
        if(!(checkSquares[move.tLat*NUM_LON+move.tLon]&mask))continue;
      }
      if(free&&!move.isEnPassant){
        if(board[move.tLat][move.tLon]?.type!=='K')legal.push(move);
      }else if(isLegalSearchMove(move,king,checkingTarget))legal.push(move);
    }
  }
  return legal;
}
function aiApply(m){
  const piece=board[m.fLat][m.fLon];
  const saved={
    c:board[m.tLat][m.tLon],prevEP:enPassantTarget,wasType:piece.type,
    hasMoved:piece.hasMoved,wasCastled:piece._castled,epCap:null
  };
  enPassantTarget=piece.type==='P'&&Math.abs(m.tLat-m.fLat)===2
    ?{lat:(m.tLat+m.fLat)/2,lon:m.tLon}:null;
  board[m.fLat][m.fLon]=null;
  board[m.tLat][m.tLon]=piece;
  piece.hasMoved=true;
  if(piece.type==='P'&&(m.tLat===0||m.tLat===7))piece.type='Q';
  if(m.isCastle){
    const rook=board[m.tLat][m.rookFromLon];
    saved.rookHasMoved=rook.hasMoved;
    board[m.tLat][m.rookFromLon]=null;
    board[m.tLat][m.rookToLon]=rook;
    rook.hasMoved=true;
    piece._castled=true;
  }
  if(m.isEnPassant){
    saved.epCap=board[m.capturedLat][m.capturedLon];
    board[m.capturedLat][m.capturedLon]=null;
  }
  return saved;
}
function aiUndo(m,piece,saved){
  piece.type=saved.wasType;
  piece.hasMoved=saved.hasMoved;
  board[m.fLat][m.fLon]=piece;
  board[m.tLat][m.tLon]=saved.c;
  enPassantTarget=saved.prevEP;
  if(m.isCastle){
    const rook=board[m.tLat][m.rookToLon];
    board[m.tLat][m.rookToLon]=null;
    board[m.tLat][m.rookFromLon]=rook;
    rook.hasMoved=saved.rookHasMoved;
    if(saved.wasCastled===undefined)delete piece._castled;
    else piece._castled=saved.wasCastled;
  }
  if(m.isEnPassant)board[m.capturedLat][m.capturedLon]=saved.epCap;
}

function _autoBoardHash(color=turnColor){
  let key=color==='white'?'w':'b';
  for(const row of board){
    for(const p of row){
      key+=p?(p.color==='white'?p.type:p.type.toLowerCase()):'.';
    }
  }
  for(const [rank,side] of [[0,'black'],[7,'white']]){
    const king=board[rank][3];
    const eligible=king?.type==='K'&&king.color===side&&!king.hasMoved;
    for(const lon of [0,7]){
      const rook=board[rank][lon];
      key+=eligible&&rook?.type==='R'&&rook.color===side&&!rook.hasMoved?'1':'0';
    }
  }
  // En passant distinguishes positions only when a legal capture is available.
  if(enPassantTarget){
    const {lat,lon}=enPassantTarget;
    const fromLat=lat+(color==='white'?1:-1);
    const victim=board[fromLat]?.[lon];
    if(victim?.type==='P'&&victim.color!==color){
      for(const fromLon of [wL(lon-1),wL(lon+1)]){
        const pawn=board[fromLat][fromLon];
        if(pawn?.type!=='P'||pawn.color!==color)continue;
        const move={fLat:fromLat,fLon:fromLon,tLat:lat,tLon:lon,isEnPassant:true,
          capturedLat:fromLat,capturedLon:lon};
        const saved=aiApply(move);
        const legal=!isInCheck(color);
        aiUndo(move,pawn,saved);
        if(legal)return key+'e'+lat+lon;
      }
    }
  }
  return key;
}

// Search and the game report use positive scores for Black.
const _EV={K:50000,Q:1800,R:1000,B:650,N:620,P:180};
const phaseWeight={K:0,Q:4,R:2,B:1,N:1,P:0}; // initial material totals 24
const rankBonus={
  P:[0,0,6,14,26,44,72,0],
  N:[-14,-4,8,12,12,8,0,-8],
  B:[-8,2,8,12,12,8,2,-4],
  R:[0,0,2,4,6,10,18,12],
  Q:[0,0,2,4,4,2,0,0],
  K:[0,0,0,0,0,0,0,0]
};
const passerBonus=[0,155,94,58,36,24,16,0];

// Distance in king moves on the empty globe. A polar step stays on the
// outermost rank and exits four files away. Other rank steps may be diagonal.
function globeKingDistance(lat,lon,targetLat,targetLon){
  const delta=Math.abs(lon-targetLon);
  const files=Math.min(delta,8-delta);
  const direct=Math.max(Math.abs(lat-targetLat),files);
  const ranksViaPole=Math.min(lat+targetLat,14-lat-targetLat);
  return Math.min(direct,1+Math.max(ranksViaPole,4-files));
}

// Scratch masks for this synchronous evaluator. One bit per occupied rank.
const evalPawns=new Uint8Array(16);
const evalFiles=new Uint8Array(8);
const evalKings=new Int8Array(2);
const evalBishops=new Uint8Array(2);
const evalArmy=new Uint8Array(2);
const evalPhase=new Uint8Array(2);

// Exhaustive K+R vs K retrograde analysis for this board's globe topology.
// With no castling rights, optimal play draws except at the encoded mating
// positions. Rotate the lone king's file to zero and reflect the hemispheres.
const rookEndgameWins=new Set([
  2053, 2055, 2059, 2061, 2066, 2068, 2070, 2074, 2076, 2078, 2082, 2084,
  2086, 2090, 2092, 2094, 2098, 2100, 2102, 2106, 2108, 2110, 2114, 2116,
  2118, 2122, 2124, 2126, 2130, 2132, 2134, 2138, 2140, 2142, 2146, 2148,
  2150, 2154, 2156, 2158, 2162, 2164, 2166, 2170, 2172, 2174, 2183, 2198,
  2206, 2214, 2222, 2230, 2238, 2246, 2254, 2262, 2270, 2278, 2286, 2294,
  2302, 2955, 2962, 2970, 2978, 2986, 2994, 3002, 3010, 3018, 3026, 3034,
  3042, 3050, 3058, 3066
]);

function rookEndgameCanMate(weak,strong,rook,defends){
  const reflected=weak>=32;
  function square(index){
    const rank=reflected?(index>>3)^7:index>>3;
    const file=(index-weak)&7;
    return rank*8+file;
  }
  const index=((square(weak)>>3)*4096+square(strong)*64+square(rook))*2+Number(defends);
  return rookEndgameWins.has(index);
}

function evaluate(sideToMove){
  evalPawns.fill(0);
  evalFiles.fill(0);
  evalKings.fill(-1);
  evalBishops.fill(0);
  evalArmy.fill(0);
  evalPhase.fill(0);
  let rookSquare=-1;
  for(let lat=0;lat<8;lat++)for(let lon=0;lon<8;lon++){
    const piece=board[lat][lon];
    if(!piece)continue;
    const side=piece.color==='black'?0:1;
    const bit=1<<lat;
    evalFiles[lon]|=bit;
    if(piece.type==='K')evalKings[side]=lat*8+lon;
    else evalArmy[side]++;
    if(piece.type==='P')evalPawns[side*8+lon]|=bit;
    if(piece.type==='B')evalBishops[side]++;
    if(piece.type==='R')rookSquare=lat*8+lon;
    evalPhase[side]+=phaseWeight[piece.type];
  }
  if(sideToMove&&evalArmy[0]+evalArmy[1]===1&&rookSquare>=0&&evalKings.every(square=>square>=0)){
    const rook=board[rookSquare>>3][rookSquare&7];
    const side=rook.color==='black'?0:1;
    const strong=evalKings[side],weak=evalKings[1-side];
    const king=board[strong>>3][strong&7];
    const home=side===0?0:7;
    const rookFile=rookSquare&7;
    const canCastle=!rook.hasMoved&&!king.hasMoved&&strong===home*8+3&&
      rookSquare>>3===home&&(rookFile===0||rookFile===7);
    if(!canCastle&&!rookEndgameCanMate(weak,strong,rookSquare,sideToMove!==rook.color))return 0;
  }
  const midgame=Math.min(24,evalPhase[0]+evalPhase[1])/24;
  const endgame=1-midgame;
  let score=0;
  for(let lat=0;lat<8;lat++)for(let lon=0;lon<8;lon++){
    const piece=board[lat][lon];
    if(!piece)continue;
    const black=piece.color==='black';
    const side=black?0:1, opponent=1-side;
    const own=side*8, enemy=opponent*8;
    const progress=black?lat:7-lat;
    const left=(lon+7)%8,right=(lon+1)%8;
    let value=_EV[piece.type]+rankBonus[piece.type][progress];
    if(piece.type==='P'){
      const ahead=black?(255<<(lat+1))&255:(1<<lat)-1;
      const ownAhead=evalPawns[own+lon]&ahead;
      const neighbors=evalPawns[own+left]|evalPawns[own+right];
      if(ownAhead)value-=22;
      if(!neighbors)value-=14;
      const supportRank=lat+(black?-1:1);
      if(supportRank>=0&&supportRank<8&&(neighbors&(1<<supportRank)))value+=12;
      const enemyFiles=evalPawns[enemy+left]|evalPawns[enemy+lon]|evalPawns[enemy+right];
      if(!ownAhead&&!(enemyFiles&ahead)){
        const steps=7-progress;
        const clear=!(evalFiles[lon]&ahead);
        value+=passerBonus[steps]*(clear?1:0.55);
        const enemyKing=evalKings[opponent],ownKing=evalKings[side];
        if(endgame>0&&enemyKing>=0&&ownKing>=0){
          const promoLat=black?7:0;
          const escort=globeKingDistance(lat,lon,ownKing>>3,ownKing%8);
          const intercept=globeKingDistance(promoLat,lon,enemyKing>>3,enemyKing%8);
          value+=endgame*(intercept-escort)*6;
          if(clear&&evalPhase[opponent]===0&&intercept>steps+1)value+=endgame*55;
        }
      }
    }else if(piece.type==='N'){
      // Use actual globe jumps, including jumps reflected across a pole.
      // Count squares the knight can use without stepping into a pawn attack.
      let mobility=0;
      for(const jump of globeSteps[lat*8+lon].knight){
        const rank=jump.square>>3,file=jump.square%8;
        if(board[rank][file]?.color===piece.color)continue;
        const pawnRank=rank+(black?1:-1);
        const pawnFiles=evalPawns[enemy+(file+7)%8]|evalPawns[enemy+(file+1)%8];
        if(pawnRank<0||pawnRank>7||!(pawnFiles&(1<<pawnRank)))mobility++;
      }
      value+=mobility*4;
    }else if(piece.type==='B'){
      // Score the first two usable squares on each diagonal to reward
      // development and penalize bishops shut in by their own pawns.
      for(const ray of globeSteps[lat*8+lon].diagonal){
        for(let step=0;step<Math.min(2,ray.cells.length);step++){
          const square=ray.cells[step];
          const blocker=board[square>>3][square%8];
          if(blocker?.color===piece.color)break;
          value+=3;
          if(blocker)break;
        }
      }
    }else if(piece.type==='R'){
      if(!evalPawns[own+lon])value+=evalPawns[enemy+lon]?12:24;
    }else if(piece.type==='K'){
      const shieldRank=lat+(black?1:-1);
      let shield=0;
      if(shieldRank>=0&&shieldRank<8){
        const bit=1<<shieldRank;
        if(evalPawns[own+left]&bit)shield++;
        if(evalPawns[own+lon]&bit)shield++;
        if(evalPawns[own+right]&bit)shield++;
      }
      value+=midgame*(shield*14-6*Math.min(progress,4));
      if(evalArmy[opponent]===0&&evalArmy[side]>0&&evalKings[opponent]>=0){
        const enemyKing=evalKings[opponent];
        const distance=globeKingDistance(lat,lon,enemyKing>>3,enemyKing%8);
        value+=endgame*(7-distance)*16;
      }
    }
    score+=black?value:-value;
  }
  if(evalBishops[0]>=2)score+=30;
  if(evalBishops[1]>=2)score-=30;
  return Math.trunc(score);
}

// Scores in negamax are always from the side-to-move's perspective.
const AI_MATE=1000000;
const AI_TIMEOUT=Symbol('AI deadline');
let aiSearchGeneration=0;

function aiMoveId(m){
  return ((m.fLat*8+m.fLon)*8+m.tLat)*8+m.tLon;
}
function orderSearchMoves(moves,preferred,killers,history){
  for(const m of moves){
    const piece=board[m.fLat][m.fLon];
    const victim=board[m.tLat][m.tLon];
    const capture=victim?_EV[victim.type]:(m.isEnPassant?_EV.P:0);
    const promotion=piece.type==='P'&&(m.tLat===0||m.tLat===7);
    // Try the previous principal move, promotions, then valuable captures
    // by cheaper attackers. These priorities only change search order.
    const id=aiMoveId(m);
    m.order=id===preferred?1000000:0;
    if(!capture&&!promotion){
      if(killers&&id===killers[0])m.order+=260;
      else if(killers&&id===killers[1])m.order+=130;
      if(history)m.order+=history[id];
    }
    if(promotion)m.order+=16*(_EV.Q-_EV.P);
    if(capture)m.order+=16*capture-_EV[piece.type]/100;
    if(m.isCastle)m.order+=1;
  }
  return moves.sort((a,b)=>b.order-a.order);
}

function searchExpired(search){
  if(performance.now()>=search.deadline)throw AI_TIMEOUT;
}

// Mate scores are relative to the root in the tree, but relative to the
// position in the transposition table (a position may recur at another ply).
function adjustMateScore(score,ply){
  if(score>AI_MATE/2)return score+ply;
  if(score<-AI_MATE/2)return score-ply;
  return score;
}

// Repetition depends on the route to a position. Keep reversible ancestors
// since the last capture or pawn move. The root history already includes the
// current root position. A new irreversible move can safely discard both.
function thirdSearchOccurrence(key,prior){
  if(!prior)return false;
  let previous=prior.game?(_autoPosHist[key]||0):0;
  if(previous>=2)return true;
  for(let p=prior;p;p=p.parent){
    if(p.key===key&&++previous>=2)return true;
  }
  return false;
}

function sameSearchHistory(a,b){
  while(a!==b){
    if(!a||!b||a.key!==b.key||a.game!==b.game)return false;
    a=a.parent;b=b.parent;
  }
  return true;
}

function previousPositions(key,prior){
  return {key,parent:prior,game:prior?.game||false};
}

function childHistory(m,saved,history){
  return saved.c||saved.wasType==='P'||m.isCastle?null:history;
}

function nextHalfMoveClock(clock,saved){
  return saved.c||saved.wasType==='P'?0:clock+1;
}

function fiftyMoveScore(color,ply){
  return isInCheck(color)&&!hasAnyLegalMove(color)?ply-AI_MATE:0;
}

function searchPosition(color,depth,alpha,beta,ply,search,prior=null,clock=0){
  searchExpired(search);
  if(clock>=100)return fiftyMoveScore(color,ply);
  if(depth===0)return searchCaptures(color,alpha,beta,ply,4,search,prior,clock);
  if(hasInsufficientMatingMaterial())return 0;
  const key=_autoBoardHash(color);
  if(thirdSearchOccurrence(key,prior))return 0;
  const history=previousPositions(key,prior);
  const cached=search.table.get(key);
  if(cached&&cached.depth>=depth&&cached.clock===clock&&sameSearchHistory(cached.prior,prior)){
    const value=adjustMateScore(cached.score,-ply);
    if(cached.bound==='exact'||(cached.bound==='lower'&&value>=beta)||
       (cached.bound==='upper'&&value<=alpha))return value;
  }

  const moves=allAIMoves(color);
  if(!moves.length)return isInCheck(color)?ply-AI_MATE:0;
  const other=color==='black'?'white':'black';
  const originalAlpha=alpha;
  const quietHistory=search.history?.[color];
  let best=-Infinity, bestId;
  for(const m of orderSearchMoves(moves,cached?.moveId,search.killers[ply],quietHistory)){
    const piece=board[m.fLat][m.fLon], saved=aiApply(m);
    let score;
    const nextHistory=childHistory(m,saved,history),nextClock=nextHalfMoveClock(clock,saved);
    try {
      // Outside a null window, test siblings against alpha first. Re-search
      // promising moves at full width before treating a bound as a score.
      if(best!==-Infinity&&depth>=2&&beta-alpha>1&&Number.isFinite(alpha)){
        score=-searchPosition(other,depth-1,-alpha-1,-alpha,ply+1,search,nextHistory,nextClock);
        if(score>alpha&&score<beta){
          score=-searchPosition(other,depth-1,-beta,-alpha,ply+1,search,nextHistory,nextClock);
        }
      }else{
        score=-searchPosition(other,depth-1,-beta,-alpha,ply+1,search,nextHistory,nextClock);
      }
    }finally { aiUndo(m,piece,saved); }
    if(score>best){best=score;bestId=aiMoveId(m);}
    alpha=Math.max(alpha,score);
    if(alpha>=beta){
      // A quiet refutation often works in sibling variations at the same ply.
      if(!saved.c&&!m.isEnPassant){
        const id=aiMoveId(m),previous=search.killers[ply];
        if(previous?.[0]!==id)search.killers[ply]=[id,previous?.[0]];
        if(quietHistory&&!(saved.wasType==='P'&&(m.tLat===0||m.tLat===7))){
          const bonus=depth*depth;
          quietHistory[id]+=bonus-Math.trunc(quietHistory[id]*bonus/128);
        }
      }
      break;
    }
  }
  const bound=best<=originalAlpha?'upper':best>=beta?'lower':'exact';
  if((!cached||cached.depth<=depth)&&(cached||search.table.size<50000)){
    search.table.set(key,{depth,bound,prior,clock,score:adjustMateScore(best,ply),moveId:bestId});
  }
  return best;
}

function searchCaptures(color,alpha,beta,ply,remaining,search,prior,clock){
  searchExpired(search);
  if(clock>=100)return fiftyMoveScore(color,ply);
  if(hasInsufficientMatingMaterial())return 0;
  const checked=isInCheck(color);
  // Outside check, quiescence only follows irreversible captures/promotions.
  // We need this position's history for possible quiet evasions only in check.
  const key=prior||checked?_autoBoardHash(color):null;
  if(prior&&thirdSearchOccurrence(key,prior))return 0;
  const history=checked?previousPositions(key,prior):null;
  let moves, best=-Infinity;
  if(checked){
    // Standing still is illegal in check. Search every evasion, including
    // quiet interpositions and king moves even past the capture horizon.
    moves=allAIMoves(color);
    if(!moves.length)return ply-AI_MATE;
  }else{
    if(!hasAnyLegalMove(color))return 0;
    best=(color==='black'?1:-1)*evaluate(color);
    if(remaining<=0||best>=beta)return best;
    alpha=Math.max(alpha,best);
    moves=allAIMoves(color,true); // captures, en passant and quiet promotions
  }
  const other=color==='black'?'white':'black';
  for(const m of orderSearchMoves(moves)){
    const piece=board[m.fLat][m.fLon], saved=aiApply(m);
    let score;
    try { score=-searchCaptures(other,-beta,-alpha,ply+1,remaining-1,search,childHistory(m,saved,history),nextHalfMoveClock(clock,saved)); }
    finally { aiUndo(m,piece,saved); }
    best=Math.max(best,score);
    alpha=Math.max(alpha,score);
    if(alpha>=beta)break;
  }
  return best;
}

// Prove short forcing lines independently of the material evaluation. A checking
// line succeeds only if every legal king move, capture and interposition loses.
function forcingMateProbe(legal,color,other,deadline,clock=0){
  const visits=new Map();
  function inPosition(move,next,visit){
    const piece=board[move.fLat][move.fLon], saved=aiApply(move);
    let key, count;
    const previousClock=clock;
    clock=nextHalfMoveClock(clock,saved);
    try{
      if(clock>=100&&fiftyMoveScore(next,0)===0)return false;
      if(saved.c&&hasInsufficientMatingMaterial())return false;
      key=_autoBoardHash(next);
      count=visits.get(key)||0;
      if(autoBattleActive&&(_autoPosHist[key]||0)+count>=2)return false;
      visits.set(key,count+1);
      return visit();
    }finally{
      if(key){if(count)visits.set(key,count);else visits.delete(key);}
      clock=previousClock;
      aiUndo(move,piece,saved);
    }
  }
  function matingCheck(attacker,defender,checks,stop=deadline){
    if(performance.now()>=stop)throw AI_TIMEOUT;
    const king=findKingSquare(defender);
    for(const m of allAIMoves(attacker,false,king)){
      if(inPosition(m,defender,()=>allEvasionsLose(attacker,defender,checks-1,stop)))return true;
    }
    return false;
  }
  function allEvasionsLose(attacker,defender,remaining,stop=deadline){
    if(performance.now()>=stop)throw AI_TIMEOUT;
    if(remaining===0)return !hasAnyLegalMove(defender);
    for(const reply of allAIMoves(defender)){
      if(!inPosition(reply,attacker,()=>matingCheck(attacker,defender,remaining,stop)))return false;
    }
    return true;
  }

  function setupMateInTwo(attacker,defender,moves,stop){
    for(const move of moves){
      if(performance.now()>=stop)throw AI_TIMEOUT;
      if(move.rootCheck||move.lossBound!==undefined)continue;
      const win=inPosition(move,defender,()=>{
        if(isInCheck(defender))return false; // the checking pass covers this
        const replies=allAIMoves(defender);
        // No replies to a nonchecking move means stalemate.
        return replies.length>0&&replies.every(reply=>
          inPosition(reply,attacker,()=>matingCheck(attacker,defender,1,stop)));
      });
      if(win)return move;
    }
    return null;
  }

  // Reserve part of the remaining time for two-move mates whose first move
  // is a setup. Check both sides so an apparently safe defense is not a trap.
  function setupDeadline(){
    const now=performance.now();
    return now+(deadline-now)/5;
  }
  function quietMateInTwo(){
    try{
      const move=setupMateInTwo(color,other,legal,setupDeadline());
      return move?{move,depth:3}:null;
    }catch(error){
      if(error!==AI_TIMEOUT)throw error;
      return null;
    }
  }
  function checkQuietThreats(){
    const stop=setupDeadline();
    try{
      for(const move of legal){
        if(move.lossBound!==undefined)continue;
        if(performance.now()>=stop)break;
        if(inPosition(move,other,()=>setupMateInTwo(other,color,allAIMoves(other),stop))){
          move.lossBound=4-AI_MATE;
        }
      }
    }catch(error){
      if(error!==AI_TIMEOUT)throw error;
    }
  }

  try{
    for(let checks=1;checks<=3;checks++){
      for(const m of legal){
        if(performance.now()>=deadline)throw AI_TIMEOUT;
        if(m.lossBound!==undefined)continue;
        const win=inPosition(m,other,()=>{
          if(checks===1)m.rootCheck=isInCheck(other);
          return m.rootCheck&&allEvasionsLose(color,other,checks-1);
        });
        if(win){
          const shorter=checks===3?quietMateInTwo():null;
          return shorter||{move:m,depth:2*checks-1};
        }
      }
      for(const m of legal){
        if(performance.now()>=deadline)throw AI_TIMEOUT;
        if(m.lossBound!==undefined)continue;
        if(inPosition(m,other,()=>matingCheck(other,color,checks))){
          m.lossBound=2*checks-AI_MATE;
        }
      }
      // When few plays remain, verify that the apparent escapes do not
      // allow the opponent a two-move mate with a nonchecking first move.
      if(checks===2&&legal.length<=12)checkQuietThreats();
    }
    // Without an existing mate threat, reserve this additional pass for
    // positions where the defender has lost at least half its army.
    let defenders=0;
    for(const row of board)for(const piece of row){
      if(piece?.color===other&&++defenders>8)return null;
    }
    return quietMateInTwo();
  }catch(error){
    if(error!==AI_TIMEOUT)throw error;
  }
  return null;
}

// Only yield between root moves, when the live board is fully restored.
function searchChessPosition(color,timeLimitMs,onProgress,onDone,halfMoveClock=0,seenOpeningMoves=null){
  const generation=++aiSearchGeneration;
  const start=performance.now();
  const search={deadline:start+timeLimitMs,table:new Map(),killers:[],
    history:{white:new Int16Array(4096),black:new Int16Array(4096)}};
  const other=color==='black'?'white':'black';
  const legal=allAIMoves(color);
  if(legal.length&&hasInsufficientMatingMaterial()){onDone(legal[0],0,0);return;}
  if(legal.length<=1){onDone(legal[0]||null,0);return;}
  // Preserve variety between equally good options without adding noise to scores.
  for(let i=legal.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [legal[i],legal[j]]=[legal[j],legal[i]];
  }
  orderSearchMoves(legal);
  const probeCap=typeof document==='undefined'?300:32;
  const probeBudget=Math.min(probeCap,timeLimitMs*0.20);
  const rootHistory=autoBattleActive?{key:null,parent:null,game:true}:
    previousPositions(_autoBoardHash(color),null);
  const proof=forcingMateProbe(legal,color,other,start+probeBudget,halfMoveClock);
  if(proof){onDone(proof.move,proof.depth,AI_MATE-proof.depth);return;}
  // Even an incomplete probe can disprove a tempting capture. Try unrefuted
  // moves first, keeping the shuffle order within equal priorities.
  legal.sort((a,b)=>(b.lossBound??0)-(a.lossBound??0));
  let bestMove=legal[0], completedDepth=0, completedScore=null;
  let depth=1, index=0, roundScore=-Infinity, roundRawScore=null, roundBest=null;
  function finish(){
    // On devices that cannot finish even depth one, use the best fully
    // evaluated root move we did finish, or the first legal move.
    onDone(completedDepth?bestMove:(roundBest||bestMove),completedDepth,completedScore);
  }
  function advance(){
    if(generation!==aiSearchGeneration)return;
    const sliceStart=performance.now();
    if(onProgress&&index===0)onProgress(depth,sliceStart-start);
    try {
      while(index<legal.length){
        searchExpired(search);
        const m=legal[index++];
        if(m.lossBound!==undefined&&m.lossBound<=roundScore)continue;
        const piece=board[m.fLat][m.fLon], saved=aiApply(m);
        let score;
        // A small root preference keeps early boards distinct. Proven mates
        // retain their full scores, and the worker reports the raw evaluation.
        const penalty=seenOpeningMoves?.has(aiMoveId(m))?24:0;
        const rawAlpha=Math.abs(roundScore)<AI_MATE/2?roundScore+penalty:roundScore;
        try {
          score=-searchPosition(other,depth-1,-Infinity,-rawAlpha,1,search,childHistory(m,saved,rootHistory),nextHalfMoveClock(halfMoveClock,saved));
          if(m.lossBound!==undefined)score=Math.min(score,m.lossBound);
        } finally { aiUndo(m,piece,saved); }
        const adjusted=Math.abs(score)<AI_MATE/2?score-penalty:score;
        if(adjusted>roundScore){roundScore=adjusted;roundRawScore=score;roundBest=m;}
        if(score===AI_MATE-1){onDone(m,depth,score);return;}
        if(index<legal.length&&performance.now()-sliceStart>=24){
          setTimeout(advance,0);
          return;
        }
      }
    } catch(error){
      if(error!==AI_TIMEOUT)throw error;
      finish();
      return;
    }
    bestMove=roundBest;
    completedDepth=depth;
    completedScore=roundRawScore;
    if(Math.abs(roundScore)>AI_MATE/2||depth>=8||performance.now()>=search.deadline){
      finish();
      return;
    }
    legal.splice(legal.indexOf(bestMove),1);
    legal.unshift(bestMove);
    depth++; index=0; roundBest=null; roundScore=-Infinity; roundRawScore=null;
    setTimeout(advance,0);
  }
  setTimeout(advance,0);
}

<script id="chess-worker" type="text/plain">

    (move,depth,score)=>self.postMessage({id:data.id,kind:'move',move,depth,score}),data.halfMoveClock,data.seenOpeningMoves);
};

<script>

// ─── Environment (cube camera) ────────────────────────────────────────────────
const cubeRT=wall.environment(renderer=>{
  const envDome = new THREE.Mesh(
    new THREE.SphereGeometry(600, 48, 32),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        varying vec3 vDir;
        float rbox(vec3 d,vec3 c,vec3 u,vec3 r,float hw,float hh,float es){
          vec3 cn=normalize(c); float fwd=dot(d,cn); if(fwd<0.0)return 0.0;
          vec3 t=d-cn*fwd;
          float uu=dot(t,normalize(r))/max(fwd,0.001);
          float vv=dot(t,normalize(u))/max(fwd,0.001);
          return (1.0-smoothstep(hw-es,hw+es,abs(uu)))*(1.0-smoothstep(hh-es,hh+es,abs(vv)))*smoothstep(0.3,0.7,fwd);
        }
        void main(){
          float y=vDir.y;
          vec3 col=mix(vec3(0.82),vec3(0.98),smoothstep(-1.0,1.0,y));
          col+=vec3(rbox(vDir,vec3(-0.7,0.55,0.45),vec3(0,1,0),vec3(0,0,1),0.55,0.42,0.38)*0.92);
          col+=vec3(rbox(vDir,vec3(0.65,0.40,0.65),vec3(0,1,0),vec3(1,0,0),0.45,0.32,0.32)*0.70);
          col+=vec3(rbox(vDir,vec3(0.2,-0.35,-0.92),vec3(0,1,0),vec3(1,0,0),0.60,0.20,0.28)*0.55);
          gl_FragColor=vec4(min(col,vec3(1.0)),1.0);
        }
      `,
    })
  );
  const sky=new THREE.Scene();
  sky.add(envDome);

  const cubeRT = new THREE.WebGLCubeRenderTarget(512, {
    format: THREE.RGBFormat, generateMipmaps: true,

  });

  sky.add(cubeCamera);
  cubeCamera.update(renderer,sky);
  envDome.geometry.dispose();
  envDome.material.dispose();

});

// ─── Lights ───────────────────────────────────────────────────────────────────
const _ambLight=new THREE.AmbientLight(0xffffff, 0);
scene.add(_ambLight);
const _ambTarget=0.275; // normal intensity
const kl=new THREE.DirectionalLight(0xffffff,1.4); kl.position.set(-7,8,3);  scene.add(kl);
const fl=new THREE.DirectionalLight(0xffffff,0.5); fl.position.set(-3,6,3);  scene.add(fl);
const rl=new THREE.DirectionalLight(0xffffff,0.06); rl.position.set(4,-4,-4); scene.add(rl);

// ─── Globe Materials ──────────────────────────────────────────────────────────
const PLASTIC={roughness:0.45,metalness:0.0};
const matW=new THREE.MeshStandardMaterial({color:0x333333,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.2});
const matB=new THREE.MeshStandardMaterial({color:0x111111,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.2});
const matG=new THREE.MeshStandardMaterial({color:0x222222,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.0});

// ─── Globe ────────────────────────────────────────────────────────────────────
const R=1;
const CAP_THETA=Math.PI/18;
const BAND_THETA=(Math.PI-2*CAP_THETA)/NUM_LAT;
const globe=new THREE.Group(); scene.add(globe);
globe.scale.set(0.3,0.3,0.3); // start small for intro animation

// Polar caps
const capN=new THREE.Mesh(new THREE.SphereGeometry(R,64,24,0,Math.PI*2,0,CAP_THETA),matG); globe.add(capN);
const capS=new THREE.Mesh(new THREE.SphereGeometry(R,64,24,0,Math.PI*2,Math.PI-CAP_THETA,CAP_THETA),matG); globe.add(capS);

// Depth occluder: invisible BackSide sphere. The front-side cell tiles do not cover the far
// hemisphere's depth buffer (they're back-face-culled), so pieces on the back of the globe
// pass the depth test and bleed through. This hidden sphere fills the far hemisphere's depth
// buffer and occludes any pieces behind the globe surface.
const _depthOccluder=new THREE.Mesh(
  new THREE.SphereGeometry(R*0.998,48,32),
  new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,side:THREE.BackSide})
);
globe.add(_depthOccluder);

// Cell meshes — renderOrder:-1 so globe geometry ALWAYS writes depth before chess pieces
// (renderOrder 0) test it. This guarantees pieces behind the sphere fail depth test.
const cellMeshes=[];
for(let lat=0;lat<NUM_LAT;lat++){
  for(let lon=0;lon<NUM_LON;lon++){
    const geo=wall.asset('cell-'+lat+'-'+lon,()=>new THREE.SphereGeometry(
      R,28,14,(lon/NUM_LON)*Math.PI*2,(Math.PI*2)/NUM_LON,CAP_THETA+lat*BAND_THETA,BAND_THETA));
    const mesh=new THREE.Mesh(geo,(lat+lon)%2===0?matW:matB);
    mesh.renderOrder=-1;
    mesh.userData={isCellMesh:true,lat,lon};
    globe.add(mesh);
    cellMeshes.push(mesh);
  }
}
capN.renderOrder=-1; capS.renderOrder=-1; _depthOccluder.renderOrder=-1;

// Ghost depth sphere: re-writes depth to globe-only (erases piece depth) for ghost layers.
// transparent:true puts it in the transparent queue (after blob shadows at renderOrder 0).
const _ghostDepthMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,transparent:true,opacity:1});
_ghostDepthMat.depthFunc=THREE.AlwaysDepth;
const _ghostDepthSphere=new THREE.Mesh(new THREE.SphereGeometry(R*0.99,48,32),_ghostDepthMat);
_ghostDepthSphere.renderOrder=4.5; _ghostDepthSphere.frustumCulled=false;

// ─── Board State ──────────────────────────────────────────────────────────────

function cellPos(lat,lon,r=R*1.12){
  const theta=CAP_THETA+(lat+0.5)*BAND_THETA;
  const phi=((lon+0.5)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}
function cornerPos3D(latB,lonB,r=R*1.019){
  const theta=latB===0?CAP_THETA:latB===8?Math.PI-CAP_THETA:CAP_THETA+latB*BAND_THETA;
  const phi=((lonB)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}

// ─── Piece Materials ──────────────────────────────────────────────────────────
const matLight=new THREE.MeshStandardMaterial({color:0x444444,roughness:0.45,metalness:0.0,envMap:cubeRT.texture,envMapIntensity:1.2});
const matDark=new THREE.MeshStandardMaterial({color:0x000000,roughness:0.45,metalness:0.0,envMap:cubeRT.texture,envMapIntensity:1.2});

// ─── Letter Texture ───────────────────────────────────────────────────────────
function makeLetterTex(letter,isBlack){
  const S=512;
  const cv=document.createElement('canvas');
  cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,S,S);
  ctx.font=`italic bold ${Math.round(S*0.62)}px "Times New Roman",Times,serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const cx=S/2, cy=S/2+S*0.04;
  // Foggy glow edge
  const glowCol=isBlack?'rgba(255,255,255,1)':'rgba(0,0,0,1)';
  ctx.fillStyle=glowCol;
  ctx.shadowColor=glowCol;
  ctx.shadowBlur=28;
  for(let i=0;i<6;i++) ctx.fillText(letter,cx,cy);
  // Pure color letter on top
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';
  ctx.fillStyle=isBlack?'#000000':'#ffffff';
  ctx.fillText(letter,cx,cy);
  return new THREE.CanvasTexture(cv);
}

const allSprites=[];
const _pieceUp=new THREE.Vector3(0,1,0);
const u=0.062;

// ─── Piece Mesh ───────────────────────────────────────────────────────────────
function createPieceMesh(type,isBlack){
  const g=new THREE.Group();
  const mat=isBlack?matDark:matLight;
  const hMin=u*4.5, hMax=u*7.5, step=(hMax-hMin)/4;
  const _H=1.375; // height scale: 1.25 × 1.10 = taller, slimmer silhouette
  const heights={'P':hMin*1.2*_H,'R':(hMin+step*2.3)*_H,'N':(hMin+step*2)*_H,'B':(hMax*0.5*1.25)*_H,'Q':hMax*_H,'K':hMax*_H};
  const r=u*1.65, h=heights[type]||(hMin+step*2)*_H;
  let cyl;

  if(type==='P'){
    const eggR=r*0.85*1.2;
    cyl=new THREE.Mesh(new THREE.SphereGeometry(eggR,32,24),mat);
    cyl.scale.y=(hMin*1.2*_H)/(2*eggR);
  } else if(type==='K'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.115,r*0.05,h,32),mat);
  } else if(type==='B'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(r,32,16,0,Math.PI*2,0,Math.PI/2),mat);
    dome.scale.y=1.5;
    dome.position.y=h/2;
    cyl.add(dome);
  } else if(type==='Q'){
    const rTop=r, rBot=r*1.10, waist=r*0.52;
    const pts=[];
    const N=40;
    for(let i=0;i<=N;i++){
      const t=i/N;
      const rad=rBot+(rTop-rBot)*t - waist*Math.sin(Math.PI*t);
      pts.push(new THREE.Vector2(Math.max(rad,r*0.18), t*h - h/2));
    }
    const geo=new THREE.LatheGeometry(pts,40);
    cyl=new THREE.Mesh(geo,mat);
    const topCap=new THREE.Mesh(new THREE.CircleGeometry(rTop,40),mat);
    topCap.rotation.x=-Math.PI/2; topCap.position.y=h/2;
    const botCap=new THREE.Mesh(new THREE.CircleGeometry(rBot,40),mat);
    botCap.rotation.x=Math.PI/2; botCap.position.y=-h/2;
    cyl.add(topCap); cyl.add(botCap);
  } else if(type==='N'){
    const W=r*2.6, H=h, d=W*0.618*0.78;
    const crTR=H*0.32;
    const crBL=H*0.45;
    const yB=-H/2, yT=H/2;
    const xOff=-crBL/2;
    const shape=new THREE.Shape();
    shape.moveTo(xOff-W/2+crBL, yB);
    shape.lineTo(xOff+W/2,      yB);
    shape.lineTo(xOff+W/2,      yT-crTR);
    shape.quadraticCurveTo(xOff+W/2, yT, xOff+W/2-crTR, yT);
    shape.lineTo(xOff-W/2,      yT);
    shape.lineTo(xOff-W/2,      yB+crBL);
    shape.quadraticCurveTo(xOff-W/2+crBL, yB+crBL, xOff-W/2+crBL, yB);
    shape.closePath();
    const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSize:r*0.04,bevelThickness:r*0.04,bevelSegments:3});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.z=-d/2;
    const wrapper=new THREE.Group();
    wrapper.add(mesh);
    wrapper.rotation.y=0;
    cyl=wrapper;
  } else {
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
  }

  cyl.position.y=h/2;
  cyl.userData={isPiece:true};
  g.add(cyl);

  // Letter sprite
  const spMat=new THREE.SpriteMaterial({map:wall.asset('letter-'+type+'-'+isBlack,()=>makeLetterTex(type,isBlack)),transparent:true,depthTest:true,depthWrite:false,sizeAttenuation:true});
  const sp=new THREE.Sprite(spMat);
  sp.raycast=()=>{};
  const sz=r*1.1;
  sp.scale.set(sz,sz,sz);
  const domeExtra=(type==='B')?(r*1.325):(type==='N')?-sz*0.05:(type==='P')?-sz*0.05:0;
  sp.position.y=h+sz*0.5+domeExtra;
  g.add(sp);
  return g;
}

// ─── Blob Shadow ──────────────────────────────────────────────────────────────
function createBlobGroup(blobScale,blobOpacity){
  blobScale=blobScale||1;
  blobOpacity=blobOpacity||1;
  const r=u*1.65;
  const shadow=wall.asset('shadow-'+blobOpacity,()=>{
    const bS=256;
    const bCv=document.createElement('canvas'); bCv.width=bCv.height=bS;
    const bCtx=bCv.getContext('2d');
    const bGrad=bCtx.createRadialGradient(bS/2,bS/2,0,bS/2,bS/2,bS/2);
    bGrad.addColorStop(0,   `rgba(0,0,0,${0.48*blobOpacity})`);
    bGrad.addColorStop(0.35,`rgba(0,0,0,${0.32*blobOpacity})`);
    bGrad.addColorStop(0.65,`rgba(0,0,0,${0.12*blobOpacity})`);
    bGrad.addColorStop(1,   'rgba(0,0,0,0.00)');
    bCtx.fillStyle=bGrad; bCtx.fillRect(0,0,bS,bS);
    return new THREE.CanvasTexture(bCv);
  });
  const mat=new THREE.MeshBasicMaterial({map:shadow,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  const circle=new THREE.Mesh(new THREE.CircleGeometry(r*1.3*blobScale,32),mat);
  circle.raycast=()=>{};
  circle.rotation.x=-Math.PI/2;
  circle.position.y=0.002;
  const grp=new THREE.Group();
  grp.add(circle);
  return grp;
}

function orientPiece(obj,pos){
  obj.quaternion.setFromUnitVectors(_pieceUp,pos.clone().normalize());
}

// Knight facing toward pole
const _faceV1=new THREE.Vector3(), _faceV2=new THREE.Vector3();
function faceKnightTowardPole(group,pos,towardNorth){
  const radial=pos.clone().normalize();
  const poleWorld=new THREE.Vector3(0,towardNorth?1:-1,0);
  _faceV1.copy(poleWorld).addScaledVector(radial,-radial.dot(poleWorld));
  if(_faceV1.lengthSq()<1e-5)return;
  _faceV1.normalize();
  _faceV2.copy(_faceV1).applyQuaternion(group.quaternion.clone().conjugate());
  // Back cap (+Z) faces pole: Ry(α) Z_new=(sinα,0,cosα). sinα=tx,cosα=tz → α=atan2(tx,tz)+π/2
  const angle=Math.atan2(_faceV2.x,_faceV2.z)+Math.PI/2;
  group.children.forEach(c=>{if(c.isGroup)c.rotation.y=angle;});
}

function removePieceObject(group){
  globe.remove(group);
  group.traverse(child=>{
    if(child.isMesh)child.geometry.dispose();
    const mat=child.material;
    if(mat&&mat!==matDark&&mat!==matLight)mat.dispose();
  });
}

function placePiece(type,isBlack,lat,lon){
  const group=createPieceMesh(type,isBlack);
  const pos=cellPos(lat,lon,R);
  group.position.copy(pos);
  orientPiece(group,pos);
  if(type==='N') faceKnightTowardPole(group,pos,!isBlack);
  group.userData={isPiece:true,lat,lon};
  globe.add(group);
  allSprites.push(group);
  const _blobSc=(type==='K'||type==='P')?0.5:(type==='Q'||type==='R'||type==='B')?1.25:1;
  const _blobOp=(type==='K')?0.5:1;
  const blob=createBlobGroup(_blobSc,_blobOp);
  blob.position.copy(pos);
  orientPiece(blob,pos);
  globe.add(blob);
  board[lat][lon]={type,color:isBlack?'black':'white',sprite:group,blob,hasMoved:false};
  if(!_pieceLettersVisible)
    group.traverse(c=>{if(c.isSprite)c.visible=false;});
}

    sp.raycast=()=>{};

// ── Version label sprites on polar caps ──────────────────────────────────────
const _VERSION='v2.6.1';
const _versionSprites=[];
(function(){
  const VER=_VERSION;

  spN.raycast=()=>{};
