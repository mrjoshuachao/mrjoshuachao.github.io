// ─── Animate ──────────────────────────────────────────────────────────────────
const lastDrawnRotation=new THREE.Quaternion();
let lastDrawnZoom=NaN, previousTick;
function animate(now=performance.now()){
  requestAnimationFrame(animate);
  const dtMs=previousTick===undefined?0:Math.min(100,Math.max(0,now-previousTick));
  previousTick=now;
  const animating=moveAnim||bounceAnim||globeRotAnim||captureFlyAnims.length||shakeAnims.length;

  // Intro animation
  if(!introAnim.done){
    introAnim.t=Math.min(introAnim.t+dtMs/2000,1);
    const te=1-Math.pow(1-introAnim.t,5);
    _introQspin.setFromAxisAngle(introSpinAxis,te*3.0*Math.PI);
    globe.quaternion.multiplyQuaternions(_introQspin,introR0);
    // Scale: start small (0.3), grow to full size (1.0)
    const sc=0.3+0.7*te;
    globe.scale.set(sc,sc,sc);
    // Ambient light: dark to normal over 2s
    _ambLight.intensity=_ambTarget*introAnim.t;
    // Trigger black fade-out on first frame
    if(!introAnim._fadeStarted){
      introAnim._fadeStarted=true;
      requestAnimationFrame(()=>{
        const fd=document.getElementById('introFade');
        if(fd){fd.style.opacity='0';setTimeout(()=>fd.remove(),2100);}
      });
    }
    if(introAnim.t>=1){introAnim.done=true;globe.quaternion.copy(introFinalQ);globe.scale.set(1,1,1);_ambLight.intensity=_ambTarget;autoRotate=false;}
    tileView.render(scene,camera);
    return;
  }

  // ── Skip all animations when paused (freeze frame) ──
  if(!autoBattlePaused){

  // Globe rotation animation
  if(globeRotAnim){
    globeRotAnim.t=Math.min(globeRotAnim.t+dtMs/globeRotAnim.dur,1);
    const te=easeInOut(globeRotAnim.t);
    globe.quaternion.copy(globeRotAnim.startQ).slerp(globeRotAnim.endQ,te);
    if(globeRotAnim.t>=1){const cb=globeRotAnim.onDone;globeRotAnim=null;if(cb)cb();}
  }

  // Shake animation for threatened pieces (fearful trembling)
  if(shakeAnims.length){
    // maxAngle scales inversely with piece height squared — pawn unchanged, large pieces calmer
    // Effective heights (in multiples of u): P=5.4 N=6.0 R=6.2 B=7.2 Q=7.5 K=7.5
    const SHAKE_AMP={P:0.090,N:0.073,R:0.068,B:0.051,Q:0.047,K:0.047};
    const PIECE_H  ={P:7.4,  N:8.25, R:8.5,  B:9.9,  Q:10.3, K:10.3}; // 1.375× height scale
    const dt=dtMs/1000;
    shakeAnims.forEach(s=>{
      s.t+=dt;
      const maxAngle=SHAKE_AMP[s.type]??0.065;
      const localX=new THREE.Vector3(1,0,0).applyQuaternion(s.baseQ);
      const localZ=new THREE.Vector3(0,0,1).applyQuaternion(s.baseQ);
      const rx=(Math.sin(s.t*53)+Math.sin(s.t*37)*0.6)*maxAngle;
      const rz=(Math.sin(s.t*41)*0.8+Math.sin(s.t*29)*0.4)*maxAngle;
      const perturbQ=new THREE.Quaternion()
        .multiply(new THREE.Quaternion().setFromAxisAngle(localX,rx))
        .multiply(new THREE.Quaternion().setFromAxisAngle(localZ,rz));
      const hCenter=0.062*(PIECE_H[s.type]??6.5)/2*0.65;
      const center=s.basePos.clone().addScaledVector(s.radialDir,hCenter);
      const newQ=perturbQ.clone().multiply(s.baseQ);
      s.group.quaternion.copy(newQ);
      const newLocalY=new THREE.Vector3(0,1,0).applyQuaternion(newQ);
      s.group.position.copy(center).addScaledVector(newLocalY,-hCenter);
    });
  }

  // Captured piece fade-out
  for(let i=captureFlyAnims.length-1;i>=0;i--){
    const a=captureFlyAnims[i];
    a.t+=dtMs/1000;
    const opacity=Math.max(0,1-a.t/a.dur);
    a.sprite.traverse(child=>{
      if((child.isMesh||child.isSprite)&&child.material)child.material.opacity=opacity;
    });
    if(a.t>=a.dur){removePieceObject(a.sprite);captureFlyAnims.splice(i,1);}
  }

  // Bounce
  if(bounceAnim){
    bounceAnim.t+=dtMs/1000;
    const lift=Math.abs(Math.sin(bounceAnim.t*Math.PI))*0.18;
    bounceAnim.group.position.copy(bounceAnim.basePos).addScaledVector(bounceAnim.radialDir,lift);
    // Blob shadow fades as piece lifts: full opacity at ground, fades to ~20% at peak
    if(bounceAnim.blob){
      const mat=bounceAnim.blob.children[0]?.material;
      if(mat){mat.opacity=0.48*(1-lift/0.18*0.8);mat.needsUpdate=true;}
    }
  }

  // Move animation
  if(moveAnim){
    moveAnim.t=Math.min(moveAnim.t+dtMs/moveAnim.dur,1);
    const te=easeInOut(moveAnim.t);
    // Arc-length parameterization: map eased time → target arc distance → point
    const targetDist=te*moveAnim.totalLen;
    const cum=moveAnim.cum;
    let i0=0;
    for(let i=1;i<cum.length-1;i++){if(cum[i]>=targetDist)break;i0=i;}
    const segLen=cum[i0+1]-cum[i0];
    const frac=segLen>1e-9?(targetDist-cum[i0])/segLen:0;
    const pos=moveAnim.pts[i0].clone().lerp(moveAnim.pts[i0+1],frac);
    moveAnim.sprite.position.copy(pos);
    orientPiece(moveAnim.sprite,pos);
    if(moveAnim.pieceType==='N') faceKnightTowardPole(moveAnim.sprite,pos,moveAnim.pieceIsWhite);
    if((aiMode||autoBattleActive)&&!globeRotAnim&&!dragging){
      const worldDir=pos.clone().normalize().applyQuaternion(globe.quaternion);
      const offCentre=Math.max(0,1-worldDir.z);
      const alpha=0.025+offCentre*0.035;
      const Qr=new THREE.Quaternion().setFromUnitVectors(worldDir,new THREE.Vector3(0,0,1));
      const tQ=new THREE.Quaternion().multiplyQuaternions(Qr,globe.quaternion);
      globe.quaternion.slerp(tQ,alpha);
    }
    if(moveAnim.blob){
      const blobPos=pos.clone().normalize().multiplyScalar(R);
      moveAnim.blob.position.copy(blobPos);
      orientPiece(moveAnim.blob,blobPos);
    }
    if(moveAnim.t>=1)finishMoveAnimation();
  }

  // Inertia
  if(!dragging){
    if(Math.abs(vel.x)>0.01||Math.abs(vel.y)>0.01){applyDelta(vel.x,vel.y);vel.x*=0.88;vel.y*=0.88;}
    else{vel.x=0;vel.y=0;}
    if(autoRotate){
      const rotSpeed=0.0010;
      _qy.setFromAxisAngle(WY,rotSpeed);globe.quaternion.premultiply(_qy);
    }
  }

  } // end pause guard
  if(boardNeedsPaint||(animating&&!autoBattlePaused)||!lastDrawnRotation.equals(globe.quaternion)||
     lastDrawnZoom!==camera.position.z){
    tileView.render(scene,camera);
    lastDrawnRotation.copy(globe.quaternion);
    lastDrawnZoom=camera.position.z;
    boardNeedsPaint=false;
  }
}

// ── Background tab support ────────────────────────────────────────────────────
// requestAnimationFrame stops when tab is hidden, blocking moveAnim/globeRotAnim
// completion. This interval-based driver flushes stuck animations in background.
const backgroundBattleDriver=setInterval(()=>{
  if(!document.hidden||autoBattlePaused)return;
  if(!(autoBattleActive||aiMode))return;
  // Complete globeRotAnim instantly
  if(globeRotAnim){
    globe.quaternion.copy(globeRotAnim.endQ);
    const cb=globeRotAnim.onDone;
    globeRotAnim=null;
    if(cb)cb();
  }
  finishMoveAnimation();
  // Complete capture fade instantly
  captureFlyAnims.forEach(a=>{
    a.sprite.traverse(c=>{
      if((c.isMesh||c.isSprite)&&c.material)c.material.opacity=0;
    });
    removePieceObject(a.sprite);
  });
  captureFlyAnims=[];
},1500);

const AUTO_DELAY = 300;        // ms between moves (AI thinking time is the main pacing now)
const AUTO_MAX_MOVES = 250;    // draw if exceeded
const RESIGN_THRESHOLD = 1800; // eval pts: losing by this much = hopeless → resign (raised to allow more checkmates)
const RESIGN_STREAK    = 10;   // consecutive half-moves at that level to confirm
const DRAW_EVAL_RANGE  = 150;  // eval pts: both sides within this = "mutually equal"
const DRAW_STREAK      = 20;   // consecutive half-moves both agree it's equal → draw
let autoBattleActive = false;
let autoBattlePaused = false;
let _autoBattleTimer = null;
let _pausedAutoAction=null;

// Keep exactly one pending battle step, including while a rotation or a search finishes.
function runAutoStep(action){
  if(!autoBattleActive)return;
  if(autoBattlePaused)_pausedAutoAction=action;
  else action();
}
let _autoBattleLog = null;
let _autoGameNum = 0;
let _autoPosHist = {};

// ── Logging helpers ───────────────────────────────────────────────────────────
const _ACOL=['h','g','f','e','d','c','b','a'];
function _autoNote(la,lo){return _ACOL[lo]+(8-la);}
function openingLayout(move,color){
  const piece=board[move.fLat][move.fLon], saved=aiApply(move);
  try{
    // Castling rights and en passant don't change how a position looks.
    return _autoBoardHash(color==='white'?'black':'white').slice(1,65);
  }finally{aiUndo(move,piece,saved);}
}
function _autoBoardSnap(){
  let s='  a b c d e f g h\n';
  for(let la=0;la<8;la++){
    s+=''+(8-la)+' ';
    for(let lo=7;lo>=0;lo--){
      const p=board[la][lo];
      s+=(p?(p.color==='white'?p.type:p.type.toLowerCase()):'.')+' ';
    }
    s+='\n';
  }
  return s;
}
function _autoLogAnomaly(type,desc,extra={}){
  const entry={n:_autoBattleLog?.moves.length||0,type,desc,extra,
    snap:_autoBoardSnap(),turn:turnColor};
  _autoBattleLog?.anomalies.push(entry);
  console.warn('[AUTO-BATTLE ANOMALY]',type,desc,extra);
}

// ── Main drive loop ───────────────────────────────────────────────────────────

// ══════════════════════════════════════════════════════════════════════════════
// ─── Enhanced AI Engine — positional evaluation + iterative deepening α-β ────
const _AI_THINK_MS  = 8000;   // AI opponent: 8 s per move
const _AUTO_THINK_MS= 1500;   // Auto-battle: 1.5 s per move (deeper search)

// ── Main drive loop ───────────────────────────────────────────────────────────

function doAutoMove(){
  if(!autoBattleActive||autoBattlePaused)return;
  if(moveAnim||globeRotAnim){_autoBattleTimer=setTimeout(()=>runAutoStep(doAutoMove),120);return;}

  const log=_autoBattleLog;if(!log)return;

  // Checkmate and stalemate take precedence over all self-play adjudications.
  if(!hasAnyLegalMove(turnColor)){
    _endAutoGame(isInCheck(turnColor)
      ?(turnColor==='white'?'BLACK_WINS_CHECKMATE':'WHITE_WINS_CHECKMATE')
      :'DRAW_STALEMATE');
    return;
  }

  // Move-limit guard
  if(log.moves.length>=AUTO_MAX_MOVES){
    _autoLogAnomaly('MOVE_LIMIT',`Game exceeded ${AUTO_MAX_MOVES} moves — possible infinite loop`);
    _endAutoGame('DRAW_MOVE_LIMIT');return;
  }

  // 3-fold repetition guard
  const hash=_autoBoardHash();
  _autoPosHist[hash]=(_autoPosHist[hash]||0)+1;
  if(_autoPosHist[hash]>=3){
    _autoLogAnomaly('REPETITION','Same position repeated 3 times',{count:_autoPosHist[hash]});
    _endAutoGame('DRAW_REPETITION');return;
  }

  // A dead position ends the game regardless of material evaluation.
  if(hasInsufficientMatingMaterial()){
    _autoLogAnomaly('INSUF_MATERIAL','Both sides have insufficient mating material (K/K+minor vs K/K+minor)');
    _endAutoGame('DRAW_INSUF_MATERIAL');return;
  }

  // A near-zero static score can conceal a promotion or a forcing capture.
  // Only accumulate draw offers through quiet play from both sides.
  const quietForAgreement=log.moves.length>=40&&log.halfMoveClock>=8&&
    !isInCheck(turnColor)&&!allAIMoves(turnColor,true).length;
  const positionEval=evaluate();
  if(!quietForAgreement)log._symDrawStreak=0;

  // Symmetric endgame detection: R+K vs R+K (with equal pawns) → draw quickly
  // Also covers equal minor piece endgames that will never produce a winner
  if(quietForAgreement&&log.moves.length>=50){
    let wPieces=[],bPieces=[],wPawns=0,bPawns=0;
    for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
      const p=board[la][lo];if(!p||p.type==='K')continue;
      if(p.type==='P'){if(p.color==='white')wPawns++;else bPawns++;continue;}
      (p.color==='white'?wPieces:bPieces).push(p.type);
    }
    const wStr=wPieces.sort().join(''), bStr=bPieces.sort().join('');
    // Symmetric: same pieces and same number of pawns
    if(wStr===bStr&&wPawns===bPawns){
      // R vs R, B vs B, N vs N, RB vs RB, etc. with equal pawns → draw after 8 half-moves of low eval
      if(!log._symDrawStreak)log._symDrawStreak=0;
      if(Math.abs(positionEval)<=300) log._symDrawStreak++;
      else log._symDrawStreak=0;
      if(log._symDrawStreak>=8){
        _endAutoGame('DRAW_AGREEMENT');return;
      }
    } else { log._symDrawStreak=0; }
  }

  // 50-move rule — 100 half-moves without capture or pawn advance
  if((log.halfMoveClock||0)>=100){
    _autoLogAnomaly('FIFTY_MOVE',`50-move rule triggered after ${log.halfMoveClock} half-moves without capture or pawn advance`);
    _endAutoGame('DRAW_FIFTY_MOVE');return;
  }

  // ── Resignation & draw-by-agreement ────────────────────────────────────────
  const _ev=positionEval;
  if(_ev >= RESIGN_THRESHOLD){
    log.wResignStreak++;log.bResignStreak=0;log.drawStreak=0;
  } else if(_ev <= -RESIGN_THRESHOLD){
    log.bResignStreak++;log.wResignStreak=0;log.drawStreak=0;
  } else {
    log.wResignStreak=0;log.bResignStreak=0;
    if(quietForAgreement&&Math.abs(_ev)<=DRAW_EVAL_RANGE){
      log.drawStreak++;
    } else {
      log.drawStreak=0;
    }
  }
  if(log.drawStreak>=DRAW_STREAK){_endAutoGame('DRAW_AGREEMENT');return;}

  // Show thinking status
  const cLabel=turnColor==='white'?'White':'Black';
  turnEl.textContent=cLabel+' thinking…';

  function playMove(m,completedDepth,thinkMs,score){
    runAutoStep(()=>{
      if(!m){
        _autoLogAnomaly('NO_MOVE',`${turnColor} AI returned null despite available legal moves`,
          {legalCheck:allAIMoves(turnColor).length});
        _endAutoGame('ERROR_NO_MOVE');return;
      }
      // Only the side to move can resign. Require its completed search to
      // confirm the sustained static deficit after considering its best reply.
      const resignStreak=turnColor==='white'?log.wResignStreak:log.bResignStreak;
      if(resignStreak>=RESIGN_STREAK&&completedDepth>=2&&score<=-RESIGN_THRESHOLD){
        _endAutoGame(turnColor==='white'?'WHITE_RESIGNS':'BLACK_RESIGNS');
        return;
      }
      const piece=board[m.fLat][m.fLon];
      if(!piece){
        _autoLogAnomaly('EMPTY_FROM','AI selected a move originating from an empty square',
          {from:`${m.fLat},${m.fLon}`,to:`${m.tLat},${m.tLon}`});
        _endAutoGame('ERROR_EMPTY_SQUARE');return;
      }
      const cap=m.isEnPassant?board[m.capturedLat][m.capturedLon]:board[m.tLat][m.tLon];
      const color=turnColor;
      const ply=log.moves.length+1;
      if(ply<=wall.openingPlies)wall.rememberOpeningPosition(ply,openingLayout(m,color));
      // Chess notation status
      const _an=_moveNotation(piece,m.fLat,m.fLon,m.tLat,m.tLon,!!cap||!!m.isEnPassant,m,false,false);
      turnEl.textContent=(color==='white'?'White':'Black')+': '+_an;
      // Rotate globe to face the piece, show move dots briefly, execute.
      const localDir=cellPos(m.fLat,m.fLon,R).normalize();
      rotateGlobeToFace(localDir,460,()=>{
        showMoves(m.fLat,m.fLon,m.tLat,m.tLon);
        _autoBattleTimer=setTimeout(()=>runAutoStep(()=>{
          if(board[m.fLat][m.fLon]!==piece||turnColor!==color)return;
          const entry={
            n:log.moves.length+1,color,piece:piece.type,
            from:_autoNote(m.fLat,m.fLon),to:_autoNote(m.tLat,m.tLon),
            captured:cap?cap.type:null,captureVal:cap?AI_PVAL[cap.type]:0,
            special:m.isCastle?'castle':m.isEnPassant?'ep':null,
            thinkMs,completedDepth,coords:[m.fLat,m.fLon,m.tLat,m.tLon]
          };
          log.moves.push(entry);
          if(cap)(color==='white'?log.wCapt:log.bCapt).push({t:cap.type,v:AI_PVAL[cap.type]});
          log.halfMoveClock=(cap||piece.type==='P')?0:(log.halfMoveClock||0)+1;
          execMove(m.fLat,m.fLon,m.tLat,m.tLon);
        }),370);
      });
    });
  }

  if(log.moves.length===0&&turnColor==='white'){
    const firstMove=allAIMoves('white').find(move=>
      _autoNote(move.fLat,move.fLon)+_autoNote(move.tLat,move.tLon)===log.opening);
    if(firstMove){playMove(firstMove,0,0,null);return;}
  }
  _findBestMove(turnColor,_AUTO_THINK_MS,null,playMove);
}

// ── Game lifecycle ────────────────────────────────────────────────────────────
function _endAutoGame(result){
  if(!autoBattleActive)return;
  autoBattleActive=false;autoBattlePaused=false;
  cancelComputerTurn();
  clearVis();
  if(_autoBattleLog){_autoBattleLog.result=result;_autoBattleLog.endTime=Date.now();}
  const _MSG={
    WHITE_RESIGNS:'White resigns — Black wins',BLACK_RESIGNS:'Black resigns — White wins',
    DRAW_AGREEMENT:'Draw — by agreement',BLACK_WINS_CHECKMATE:'Checkmate — Black wins',
    WHITE_WINS_CHECKMATE:'Checkmate — White wins',DRAW_STALEMATE:'Draw — stalemate',
    DRAW_REPETITION:'Draw — threefold repetition',DRAW_FIFTY_MOVE:'Draw — 50-move rule',
    DRAW_INSUF_MATERIAL:'Draw — insufficient material',DRAW_MOVE_LIMIT:'Draw — move limit reached',
    ERROR_NO_MOVE:'Error — no move found',ERROR_EMPTY_SQUARE:'Error — empty square',
    STOPPED_BY_USER:'Stopped',
  };
  turnEl.textContent=_MSG[result]||result;
  if(result==='WHITE_RESIGNS'||result==='BLACK_RESIGNS') playGameOver();
  const log=_autoBattleLog;
  const record=_genCompactRecord()+'\n';
  const slot=Number(window.frameElement.dataset.slot);
  async function archiveAndRestart(){
    try{
      await parent.globeWall.saveRecord(slot,log.gameNum,result,record);
    }catch(error){
      // Keep this immutable record and retry without generating another game ID.
      console.error('Could not archive game',slot,log.gameNum,error);
      _autoBattleTimer=setTimeout(archiveAndRestart,5000);
      return;
    }
    _autoBattleTimer=setTimeout(startAutoBattle,500);
  }
  archiveAndRestart();
}

function startAutoBattle(){
  if(autoBattleActive)return;
  const slot=Number(window.frameElement.dataset.slot);
  const opening=wall.reserveGame(slot,_autoGameNum+1);
  if(!opening){
    closeChessWorker();
    clearInterval(backgroundBattleDriver);
    return;
  }
  _autoGameNum++;_autoPosHist={};
  _autoBattleLog={gameNum:_autoGameNum,opening,moves:[],anomalies:[],wCapt:[],bCapt:[],
    result:null,halfMoveClock:0,wResignStreak:0,bResignStreak:0,drawStreak:0,
    startTime:Date.now(),endTime:null};
  autoBattleActive=true;autoBattlePaused=false;
  resetGame();
  _autoBattleTimer=setTimeout(()=>runAutoStep(doAutoMove),900);
}

// ── Record generation ─────────────────────────────────────────────────────────
function _genCompactRecord(){
  const log=_autoBattleLog;if(!log)return'';
  const dur=log.endTime?Math.round((log.endTime-log.startTime)/1000):0;
  const ds=dur<60?dur+'s':Math.floor(dur/60)+'m'+(dur%60)+'s';
  const RES={
    BLACK_WINS_CHECKMATE:'B_MATE',WHITE_WINS_CHECKMATE:'W_MATE',
    WHITE_RESIGNS:'B_WIN_RES',BLACK_RESIGNS:'W_WIN_RES',
    DRAW_AGREEMENT:'DRAW_AGR',DRAW_STALEMATE:'DRAW_STALE',
    DRAW_REPETITION:'DRAW_REP',DRAW_MOVE_LIMIT:'DRAW_LIM',
    DRAW_FIFTY_MOVE:'DRAW_50',DRAW_INSUF_MATERIAL:'DRAW_INSUF',
    ERROR_NO_MOVE:'ERR_NULL',ERROR_EMPTY_SQUARE:'ERR_EMPTY',
    STOPPED_BY_USER:'STOPPED'
  };
  // Compact captures: P5+N2+B2+Q1+R1=3100
  const capStr=arr=>{
    if(!arr.length)return'-';
    const g={};arr.forEach(({t,v})=>{if(!g[t])g[t]=0;g[t]++;});
    const total=arr.reduce((s,{v})=>s+v,0);
    return Object.entries(g).map(([t,n])=>t+n).join('+')+`=${total}`;
  };
  // Compact move: piece+from+cap?+to+special (e.g. "Nb1-a3" "Paxb5" "Ke1-a1castle")
  const mvStr=m=>{
    const c=m.captured?'x':'>';
    let s=m.piece+m.from+c+m.to;
    if(m.special)s+='.'+m.special;
    s+='.'+m.thinkMs;
    return s;
  };
  // Board: 8 ranks separated by /, pieces as FEN (uppercase=white, lowercase=black)
  const fenRow=lat=>{
    let r='',empty=0;
    for(let lo=0;lo<8;lo++){
      const p=board[lat][lo];
      if(!p){empty++;continue;}
      if(empty>0){r+=empty;empty=0;}
      const ch=p.type==='N'?'N':p.type;
      r+=p.color==='white'?ch:ch.toLowerCase();
    }
    if(empty>0)r+=empty;
    return r;
  };
  const boardStr=[];for(let la=0;la<8;la++)boardStr.push(fenRow(la));
  // Anomalies compact
  const anomStr=log.anomalies.length===0?'':'\nA:'+log.anomalies.map(a=>`#${a.n}:${a.type}`).join(',');
  const lines=[
    `GLOBE_CHESS ${_VERSION} #${log.gameNum} ${new Date(log.startTime).toISOString()}`,
    `R:${RES[log.result]||log.result} N:${log.moves.length} D:${ds}`,
    `WC:${capStr(log.wCapt)} BC:${capStr(log.bCapt)}`,
    `BD:${boardStr.join('/')}`,
    `MV:${log.moves.map(mvStr).join(' ')}`,
    `SD:${log.moves.map(m=>m.completedDepth).join(' ')}`
  ];
  if(anomStr)lines.push(anomStr);
  return lines.join('\n');
}

function _copyRecord(){
  const record=_genCompactRecord();
  if(!record)return;
  try{navigator.clipboard?.writeText(record);}catch(e){
    // Fallback
    const ta=document.createElement('textarea');
    ta.value=record;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const pauseBtn=document.getElementById('autoPauseBtn');
  pauseBtn.textContent='Record copied';
  setTimeout(()=>{pauseBtn.textContent='Record';},2000);
}

function _showAutoReport(){_copyRecord();}

function closeReport(){
  document.getElementById('reportModal').classList.remove('visible');
  if(!autoBattleActive)turnEl.textContent=turnColor==='white'?'White to move':'Black to move';
}

function copyReport(){_copyRecord();}


startAutoBattle();
animate();
</script>

<script>
// Serialize commits. The same game retries its original filename if a write fails.
function createRecordArchive(directory,onWriteStatus){
  const session=new Date().toISOString().replace(/[:.]/g,'-')+'-'+crypto.randomUUID();
  let chain=Promise.resolve();
  return function saveRecord(slot,game,result,text){
    const name=session+'-board-'+slot+'-game-'+String(game).padStart(5,'0')+'-'+result+'.txt';
    const next=chain.then(async()=>{
      try{
        const file=await directory.getFileHandle(name,{create:true});
        const stream=await file.createWritable();
        try{await stream.write(text);await stream.close();}
        catch(error){try{await stream.abort();}catch{} throw error;}
      }catch(error){onWriteStatus(error);throw error;}
      onWriteStatus(null);
    });
    chain=next.catch(()=>{});
    return next;
  };
}

// Nineteen legal first moves stayed near the top in six- and seven-ply
// opening searches. One spare lets a board change its opening on restart.
const openingMoves=[
  'h2h3','h2h4','g2g3','g2g4','f2f4','e2e3','e2e4','d2d3','d2d4',
  'c2c3','c2c4','b2b3','b2b4','a2a3','a2a4','g1f3','g1h3','b1a3','b1c3'
];
function createBatch(limit,writeRecord,onComplete){
  const active=new Map(), lastOpening=new Map(), openingUse=new Map();
  const openingPositions=Array.from({length:8},()=>new Set());
  let started=0, saved=0;
  function reserveGame(slot,game){
    if(started>=limit||active.has(slot))return false;
    const taken=new Set(Array.from(active.values(),entry=>entry.opening));
    const available=openingMoves.filter(move=>!taken.has(move)&&lastOpening.get(slot)!==move);
    if(!available.length)return false;
    const fewest=Math.min(...available.map(move=>openingUse.get(move)||0));
    const choices=available.filter(move=>(openingUse.get(move)||0)===fewest);
    const opening=choices[Math.floor(Math.random()*choices.length)];
    openingUse.set(opening,fewest+1);
    lastOpening.set(slot,opening);
    active.set(slot,{game,opening,save:null});
    started++;
    return opening;
  }
  function saveRecord(slot,game,result,text){
    const entry=active.get(slot);
    if(!entry||entry.game!==game)return Promise.reject(Error('This game was not reserved'));
    if(entry.save)return entry.save;
    entry.save=writeRecord(slot,game,result,text).then(()=>{
      active.delete(slot);
      saved++;
      if(saved===limit)onComplete(saved);
    },error=>{
      entry.save=null;
      throw error;
    });
    return entry.save;
  }
  return {
    reserveGame,saveRecord,openingPlies:openingPositions.length,
    hasOpeningPosition:(ply,key)=>openingPositions[ply-1].has(key),
    rememberOpeningPosition:(ply,key)=>openingPositions[ply-1].add(key)
  };
}

function enableFolderSelection(){
  const panel=document.getElementById('archive');
  const form=document.getElementById('archive-controls');
  const input=document.getElementById('game-limit');
  const label=document.getElementById('game-limit-label');
  const button=document.getElementById('record-folder');
  const status=document.getElementById('record-status');
  let directory=null, picking=false, completed=false;
  input.addEventListener('input',()=>{
    input.value=input.value.replace(/[０-９]/g,digit=>String(digit.charCodeAt(0)-0xff10))
      .replace(/[^0-9]/g,'').slice(0,4);
    status.textContent='';
  });

  function showComplete(count){
    completed=true;
    panel.hidden=false;
    button.hidden=true;
    status.textContent='已完成並儲存 '+count+' 場棋局。';
  }

  function showWriteStatus(error){
    if(completed)return;
    panel.hidden=!error;
    if(!error)return;
    const needsPermission=error.name==='NotAllowedError'||error.name==='SecurityError';
    button.hidden=!needsPermission;
    button.textContent='重新授權此資料夾';
    status.textContent=needsPermission?'儲存棋譜需要寫入權限':'棋譜寫入失敗，將自動重試。';
  }

  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(picking||completed)return;
    const limit=Number(input.value);
    if(!directory&&(!/^[0-9]{1,4}$/.test(input.value)||limit<1)){
      status.textContent='請輸入 1 到 9999 場。';
      input.focus();
      return;
    }
    picking=true;
    button.disabled=true;
    input.disabled=true;
    status.textContent='';
    try{
      if(directory){
        if(await directory.requestPermission({mode:'readwrite'})!=='granted'){
          status.textContent='請允許寫入本次選擇的資料夾。';
        }else{panel.hidden=true;}
        return;
      }
      if(typeof window.showDirectoryPicker!=='function'){
        status.textContent='請用桌面版 Chrome 或 Edge 開啟此頁，以選擇棋譜資料夾。';
        return;
      }
      const selected=await window.showDirectoryPicker({mode:'readwrite',startIn:'documents'});
      for await(const name of selected.keys()){
        if(!/\.txt$/i.test(name))continue;
        status.textContent='這個資料夾已有 .txt 檔案。請選擇沒有 .txt 檔案的資料夾。';
        return;
      }
      status.textContent='正在載入棋盤…';
      await loadChessRenderer();
      const writeRecord=createRecordArchive(selected,showWriteStatus);
      mountGames(createBatch(limit,writeRecord,showComplete));
      directory=selected;
      label.hidden=true;
      panel.classList.add('running');
      panel.hidden=true;
      status.textContent='';
    }catch(error){
      if(error.name==='AbortError')status.textContent='';
      else if(error.name==='NotAllowedError'||error.name==='SecurityError')
        status.textContent='請允許寫入所選資料夾，再開始對戰。';
      else status.textContent='無法啟動，請確認網路連線與瀏覽器硬體加速後重試。';
    }finally{
      picking=false;
      button.disabled=false;
      input.disabled=Boolean(directory);
    }
  });
  // Returning through the browser's in-memory page cache is a new visit, too.
  window.addEventListener('pageshow',event=>{if(event.persisted)window.location.reload();});
}

async function loadChessRenderer(){
  if(window.THREE)return;
  await new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    script.onload=()=>{if(window.THREE)resolve();else reject(Error('Three.js unavailable'));};
    script.onerror=()=>{script.remove();reject(Error('Three.js unavailable'));};
    document.head.appendChild(script);
  });
}

// Give each board its full search budget when a CPU slot becomes available.
function createSearchScheduler(limit){
  const waiting=[];
  let active=0;
  function release(){
    const next=waiting.shift();
    if(next)next(release);
    else active--;
  }
  return function acquireSearchSlot(){
    return new Promise(resolve=>{
      if(active>=limit){waiting.push(resolve);return;}
      active++;
      resolve(release);
    });
  };
}

// Each frame owns its game. All boards share one GPU context.
function mountGames(batch){
  const grid=document.getElementById('games');
  const style=getComputedStyle(grid);
  const rows=Number(style.getPropertyValue('--rows'));
  const columns=Number(style.getPropertyValue('--columns'));
  const availableCPUs=Math.max(1,(navigator.hardwareConcurrency||4)-1);
  const searchSlots=typeof Worker==='undefined'?1:Math.min(rows*columns,availableCPUs);
  const acquireSearchSlot=createSearchScheduler(searchSlots);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,stencil:true});
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.setClearColor(0x000000,0);

  const assets=new Map();
  function asset(key,create){
    if(!assets.has(key))assets.set(key,create());
    return assets.get(key);
  }

  // Render one tile at a time and keep its last image while its board is still.
  // Round the backing size up so adjacent CSS grid tracks share one GPU buffer.
  function createView(doc){
    const canvas=doc.createElement('canvas');
    canvas.style.width='100%';
    canvas.style.height='100%';
    const ctx=canvas.getContext('2d',{alpha:true});
    function render(scene,camera){
      const dpr=Math.min(window.devicePixelRatio||1,1.5);
      const width=Math.max(1,Math.ceil(grid.clientWidth/columns*dpr));
      const height=Math.max(1,Math.ceil(grid.clientHeight/rows*dpr));
      if(renderer.domElement.width!==width||renderer.domElement.height!==height){
        renderer.setSize(width,height,false);
      }
      if(canvas.width!==width||canvas.height!==height){
        canvas.width=width;
        canvas.height=height;
      }
      renderer.render(scene,camera);
      ctx.globalCompositeOperation='copy';
      ctx.drawImage(renderer.domElement,0,0);
    }
    return {canvas,render};
  }

  window.globeWall={asset,createView,acquireSearchSlot,...batch,environment:create=>asset('environment',()=>create(renderer))};
  const head=document.getElementById('game-head').innerHTML;
  const body=document.getElementById('game-body').innerHTML;
  const page='<!doctype html><html lang="zh-TW"><head>'+head+'</head><body>'+body+'</body></html>';
  for(let i=0;i<rows*columns;i++){
    const frame=document.createElement('iframe');
    frame.dataset.slot=String(i+1);
    frame.title='球面西洋棋 第 '+(i+1)+' 局';
    frame.srcdoc=page;
    grid.appendChild(frame);
  }
}
enableFolderSelection();
</script>
