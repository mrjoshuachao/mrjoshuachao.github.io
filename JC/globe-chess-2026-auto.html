// ─── Check Ring Visual ────────────────────────────────────────────────────────
let checkRingObjs=[];
let _checkOuterR=0, _checkCenter=null;
let _checkmateActive=false; // when true, check threats are never cleared
function clearCheckRing(){
  boardNeedsPaint=true;
  if(_checkmateActive)return; // permanent on checkmate
  removeOverlays(checkRingObjs);
  checkRingObjs=[];
}
function showCheckRing(lat,lon){
  clearCheckRing();
  const center=cellPos(lat,lon,R*1.006);
  const radial=center.clone().normalize();
  const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
  const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
  const rr=BAND_THETA*R*0.14;
  _checkOuterR=rr*1.55; _checkCenter=center.clone();
  for(let ring=0;ring<2;ring++){
    const N=64; const pts=[];
    const rOff=rr*(1+ring*0.55);
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*rOff).addScaledVector(t2,Math.sin(a)*rOff);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.010,8,true);
    geo.computeBoundingSphere();
    // Front: opaque, hidden by pieces
    const mat=new THREE.MeshBasicMaterial({color:0x880000,depthTest:true,depthWrite:false,
      polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
    const mesh=new THREE.Mesh(geo,mat); mesh.renderOrder=5; mesh.frustumCulled=false;
    globe.add(mesh); checkRingObjs.push(mesh);
    // Ghost: 50% through pieces
    const gMat=_ghostMat(0x880000,null,null,3);
    const gMesh=new THREE.Mesh(geo,gMat); gMesh.renderOrder=5; gMesh.frustumCulled=false;
    globe.add(gMesh); checkRingObjs.push(gMesh);
  }
}

// ─── Check Threat Visualization ───────────────────────────────────────────────
// Shows the attack path(s) from threatening piece(s) to the king.
// Uses computeAnimPath so diagonals, knights, pole-crossings all look correct.
function showCheckThreats(color){
  let kLat=-1,kLon=-1;
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
    if(board[la][lo]?.type==='K'&&board[la][lo]?.color===color){kLat=la;kLon=lo;}
  if(kLat===-1)return;
  const opp=color==='white'?'black':'white';
  const redMat=()=>new THREE.MeshBasicMaterial({color:0x880000,depthTest:true,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-12});

  // Draw dashed red path along pts — used for knight L-shape
  function redDash(pts){
    const H=R*1.005;
    const sp=pts.map(p=>p.clone().normalize().multiplyScalar(H));
    const cum=[0];
    for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+sp[i].distanceTo(sp[i-1]));
    const tot=cum[cum.length-1];
    function ptAt(s){
      s=Math.max(0,Math.min(s,tot));
      for(let i=1;i<cum.length;i++){
        if(cum[i]>=s){const tt=(s-cum[i-1])/(cum[i]-cum[i-1]);
          return sp[i-1].clone().lerp(sp[i],tt).normalize().multiplyScalar(H);}
      }
      return sp[sp.length-1].clone();
    }
    const dLen=0.035,gLen=0.04;let d=0;
    while(d<tot){
      const dEnd=Math.min(d+dLen,tot);const n=Math.max(2,Math.round((dEnd-d)/0.01));
      const seg=[];for(let i=0;i<=n;i++)seg.push(ptAt(d+(dEnd-d)*i/n));
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),n,0.010,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,redMat());m.renderOrder=2;m.frustumCulled=false;
      globe.add(m);checkRingObjs.push(m);
      // Ghost
      const gm=new THREE.Mesh(geo,_ghostMat(0x880000,-3,-12,3));
      gm.renderOrder=5;gm.frustumCulled=false;
      globe.add(gm);checkRingObjs.push(gm);
      d+=dLen+gLen;
    }
  }

  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p||p.color!==opp)continue;
    let attacks=false;
    if(p.type==='P'){const dir=p.color==='black'?1:-1;attacks=(la+dir===kLat&&(wL(lo-1)===kLon||wL(lo+1)===kLon));}
    else attacks=aiMoves(la,lo).some(m=>!m.isCastle&&m.tLat===kLat&&m.tLon===kLon);
    if(!attacks)continue;

    // All valid moves from this piece that land on the king's square
    const allMvs=getValidMoves(la,lo).filter(m=>m.lat===kLat&&m.lon===kLon);
    if(!allMvs.length)continue;
    const r=R*1.005;

    if(p.type==='N'){
      // Knights: draw the L-shaped dashed path (only one knight move can reach a given square)
      const mv=allMvs[0];
      if(!mv.isKnight)continue;
      const from3d=cellPos(la,lo,r);
      let seg1,seg2;
      if(mv.longLat){
        if(mv.elbowLat>=0&&mv.elbowLat<=7){
          seg1=geodesicPts(from3d,cellPos(mv.elbowLat,mv.elbowLon,r),24);
          seg2=latRingArc(mv.elbowLat,mv.elbowLon,kLon,12,r);
        } else {
          const isNorth=mv.elbowLat<0;
          const polePt=new THREE.Vector3(0,(isNorth?1:-1)*r,0);
          const ref=poleRef(mv.elbowLat,mv.elbowLon);
          seg1=[...geodesicPts(from3d,polePt,12),...geodesicPts(polePt,cellPos(ref.l,ref.n,r),12).slice(1)];
          seg2=latRingArc(ref.l,ref.n,kLon,12,r);
        }
      } else {
        seg1=latRingArc(la,lo,mv.elbowLon,24,r);
        seg2=geodesicPts(cellPos(mv.elbowLat,mv.elbowLon,r),cellPos(kLat,kLon,r),12);
      }
      redDash([...seg1,...seg2.slice(1)]);
    } else {
      // Non-knight: solid red tube along each valid attack path to the king.
      // Using all matching moves covers the polar edge case where a queen can
      // reach the same square via both a rank move AND a diagonal-through-pole.
      for(const cm of allMvs){
        const animPts=computeAnimPath(cm,la,lo,kLat,kLon,cellPos(la,lo,R));
        if(!animPts||animPts.length<2)continue;
        const surfPts=animPts.map(q=>q.clone().normalize().multiplyScalar(r));
        // Trim end at outer check ring
        let trimmed=surfPts;
        if(_checkCenter&&_checkOuterR>0){
          let ci=surfPts.length-1;
          while(ci>0&&surfPts[ci].distanceTo(_checkCenter)<_checkOuterR)ci--;
          if(ci<surfPts.length-1){
            const p0=surfPts[ci],p1=surfPts[ci+1];
            const d0=p0.distanceTo(_checkCenter),d1=p1.distanceTo(_checkCenter);
            const t2=(d0-d1)>0.0001?(d0-_checkOuterR)/(d0-d1):0;
            const bp=p0.clone().lerp(p1,t2).normalize().multiplyScalar(r);
            trimmed=[...surfPts.slice(0,ci+1),bp];
          }
        }
        if(trimmed.length<2)continue;
        const tGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(trimmed,false,'centripetal'),Math.max(trimmed.length*4,40),0.010,6,false);
        tGeo.computeBoundingSphere();
        const tube=new THREE.Mesh(tGeo,redMat());tube.renderOrder=2;tube.frustumCulled=false;
        globe.add(tube);checkRingObjs.push(tube);
        // Ghost
        const gTube=new THREE.Mesh(tGeo,_ghostMat(0x880000,-3,-12,3));
        gTube.renderOrder=5;gTube.frustumCulled=false;
        globe.add(gTube);checkRingObjs.push(gTube);
      }
    }
    // Red dot at attacker's position
    const aPos=cellPos(la,lo,R*1.005);
    const dGeo=new THREE.CircleGeometry(BAND_THETA*R*0.13,36);
    const dot=new THREE.Mesh(dGeo,redMat());
    dot.position.copy(aPos);
    dot.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),aPos.clone().normalize());
    dot.renderOrder=2;dot.frustumCulled=false;
    globe.add(dot);checkRingObjs.push(dot);
    // Ghost dot
    const gDot=new THREE.Mesh(dGeo,_ghostMat(0x880000,-3,-12,3));
    gDot.position.copy(aPos);
    gDot.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),aPos.clone().normalize());
    gDot.renderOrder=5;gDot.frustumCulled=false;
    globe.add(gDot);checkRingObjs.push(gDot);
  }
}

// ─── Path helpers ─────────────────────────────────────────────────────────────
function geodesicPts(p1,p2,segs=48){
  const pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const v=new THREE.Vector3().lerpVectors(p1,p2,t).normalize().multiplyScalar(p1.length());
    pts.push(v);
  }
  return pts;
}
function latRingArc(latIdx,lonA,lonB,segs=40,r=R*1.019,dn_sign=0){
  const theta=CAP_THETA+(latIdx+0.5)*BAND_THETA;
  const sinT=Math.sin(theta),cosT=Math.cos(theta);
  const phiA=((lonA+0.5)/NUM_LON)*Math.PI*2;
  const phiB=((lonB+0.5)/NUM_LON)*Math.PI*2;
  let dp=phiB-phiA;
  // dn_sign forces the arc direction to match the actual move direction.
  // Without this, a move that goes 6 steps to the right would be drawn as
  // a 2-step arc to the left (shortest path), leaving intermediate dots disconnected.
  if(dn_sign>0){if(dp<=0)dp+=Math.PI*2;}       // force clockwise (increasing phi)
  else if(dn_sign<0){if(dp>=0)dp-=Math.PI*2;}  // force counterclockwise
  else{if(dp>Math.PI)dp-=Math.PI*2;if(dp<-Math.PI)dp+=Math.PI*2;} // shortest (default)
  const pts=[];
  for(let i=0;i<=segs;i++){
    const phi=phiA+(i/segs)*dp;
    pts.push(new THREE.Vector3(r*sinT*Math.cos(phi),r*cosT,r*sinT*Math.sin(phi)));
  }
  return pts;
}

// ─── Visualization Materials ──────────────────────────────────────────────────
const TUBE_F=new THREE.MeshBasicMaterial({color:0xff6600,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
const DOT_GEO=new THREE.SphereGeometry(0.048,32,32);

let selectedCell=null,currentTargets=[],visObjects=[];
let shakeAnims=[]; // [{group, basePos, radialDir, t}]

// Ghost material factory: 50% transparent, depthTest against globe-only depth,
// stencil anti-overlap — first ghost to draw at a pixel writes stencil=4;
// subsequent ghosts at same pixel see stencil=4 and skip (no double-blend).
// sRef: stencil ref value. Red ghosts use 3, orange use 4.
// Orange (ref=4) tests NotEqual(4): passes where stencil=0 or 3(red) → overwrites red.
// Red (ref=3) tests NotEqual(3): passes where stencil=0 → draws, but orange overwrites later.
function _ghostMat(color,pgOF,pgOU,sRef){
  return new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.5,
    depthTest:true,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:pgOF||(-4),polygonOffsetUnits:pgOU||(-16),
    stencilWrite:true,stencilRef:sRef||4,
    stencilFunc:THREE.NotEqualStencilFunc,stencilFuncMask:0xFF,
    stencilFail:THREE.KeepStencilOp,stencilZFail:THREE.KeepStencilOp,
    stencilZPass:THREE.ReplaceStencilOp});
}

function showMoves(lat,lon,autoOnlyLat=null,autoOnlyLon=null){
  // autoOnlyLat/Lon: when set (auto-battle), only draw path for that specific destination
  clearVis();
  // In test mode, skip check-filtering so all raw moves are shown
  const moves=testModeActive?getValidMoves(lat,lon):getLegalMoves(lat,lon);
  if(!moves.length)return;
  selectedCell={lat,lon};
  currentTargets=moves;
  const sel=board[lat][lon];
  if(sel&&sel.sprite) startBounce(sel.sprite,lat,lon);
  if(typeof updateDeleteBtn==='function')updateDeleteBtn();
  const from=cellPos(lat,lon,R*1.019);

  const ringR=BAND_THETA*R*0.14;
  const fromCenter=cellPos(lat,lon,R*1.006);
  // Depth-only sphere: re-writes depth to globe-only AFTER pieces, so ghost layers
  // Trim start: remove points inside start ring, prepend exact boundary point
  function trimStart(pts){
    let i=0;
    while(i<pts.length-1&&pts[i].distanceTo(fromCenter)<ringR)i++;
    if(i===0)return pts;
    const p0=pts[i-1],p1=pts[i];
    const d0=p0.distanceTo(fromCenter),d1=p1.distanceTo(fromCenter);
    const t=(d1-d0)>0.0001?(ringR-d0)/(d1-d0):0;
    const bp=p0.clone().lerp(p1,t).normalize().multiplyScalar(R*1.006);
    return[bp,...pts.slice(i)];
  }
  // Trim end: remove points inside target ring, append exact boundary point
  function trimEnd(pts,tgtCenter){
    let i=pts.length-1;
    while(i>0&&pts[i].distanceTo(tgtCenter)<ringR)i--;
    if(i===pts.length-1)return pts;
    const p0=pts[i],p1=pts[i+1];
    const d0=p0.distanceTo(tgtCenter),d1=p1.distanceTo(tgtCenter);
    const t=(d0-d1)>0.0001?(d0-ringR)/(d0-d1):0;
    const bp=p0.clone().lerp(p1,t).normalize().multiplyScalar(R*1.006);
    return[...pts.slice(0,i+1),bp];
  }

  function addTube(pts,captureEnd=false,tgtCenter=null){
    let tp=trimStart(pts);
    if(tgtCenter&&captureEnd) tp=trimEnd(tp,tgtCenter);
    if(tp.length<2)return false;
    const surfPts=tp.map(p=>p.clone().normalize().multiplyScalar(R*1.006));

    if(!captureEnd){
      const segs=Math.max(surfPts.length*4,32);
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(surfPts,false,'centripetal'),segs,0.008,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,TUBE_F); m.renderOrder=7; m.frustumCulled=false;
      globe.add(m); visObjects.push(m);
      // Ghost
      const gm=new THREE.Mesh(geo,_ghostMat(0xff6600));
      gm.renderOrder=6; gm.frustumCulled=false;
      globe.add(gm); visObjects.push(gm);
      return true;
    }

    // Compute arc-length split: orange part + last-one-cell gradient part
    const cum=[0];
    for(let k=1;k<surfPts.length;k++) cum.push(cum[k-1]+surfPts[k].distanceTo(surfPts[k-1]));
    const totalLen=cum[cum.length-1];
    const gradStartLen=Math.max(0,totalLen-BAND_THETA*R);

    let si=surfPts.length-1;
    for(let k=0;k<cum.length;k++){if(cum[k]>=gradStartLen){si=k;break;}}
    let splitPt;
    if(si>0&&cum[si]>gradStartLen){
      const t=(gradStartLen-cum[si-1])/(cum[si]-cum[si-1]);
      splitPt=surfPts[si-1].clone().lerp(surfPts[si],t).normalize().multiplyScalar(R*1.006);
    }else{splitPt=surfPts[si].clone();}

    // Orange part — TUBE_F (exact orange, no color space issues)
    const oPts=[...surfPts.slice(0,si),splitPt];
    if(oPts.length>=2){
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(oPts,false,'centripetal'),Math.max(oPts.length*4,32),0.008,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,TUBE_F); m.renderOrder=7; m.frustumCulled=false;
      globe.add(m); visObjects.push(m);
      const gm=new THREE.Mesh(geo,_ghostMat(0xff6600));
      gm.renderOrder=6; gm.frustumCulled=false;
      globe.add(gm); visObjects.push(gm);
    }

    // Gradient part — 60 MeshBasicMaterial segments for silky smooth transition
    const gPts=[splitPt,...surfPts.slice(si)];
    if(gPts.length>=2){
      // Densify gradient zone so segments always have enough points
      const gCurve=new THREE.CatmullRomCurve3(gPts,false,'centripetal');
      const DENSE=120;
      const densePts=gCurve.getPoints(DENSE);
      const N=60;
      const cFrom=new THREE.Color(0xff6600), cTo=new THREE.Color(0x880000);
      for(let i=0;i<N;i++){
        const i0=Math.floor(i/N*densePts.length);
        const i1=Math.min(Math.ceil((i+1)/N*densePts.length),densePts.length-1);
        const seg=densePts.slice(i0,i1+1);
        if(seg.length<2)continue;
        const col=cFrom.clone().lerp(cTo,(i+0.5)/N);
        const mat=new THREE.MeshBasicMaterial({color:col,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
        const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),Math.max(seg.length,4),0.008,5,false);
        geo.computeBoundingSphere();
        const m=new THREE.Mesh(geo,mat); m.renderOrder=7; m.frustumCulled=false;
        globe.add(m); visObjects.push(m);
        const gm=new THREE.Mesh(geo,_ghostMat(col));
        gm.renderOrder=6; gm.frustumCulled=false;
        globe.add(gm); visObjects.push(gm);
      }
    }
    return true;
  }
  function addDot(pos,lat,lon){
    const spos=pos.clone().normalize().multiplyScalar(R*1.006);
    const geo=new THREE.CircleGeometry(ringR,40);
    const mat=new THREE.MeshBasicMaterial({color:0xff6600,side:THREE.FrontSide,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
    const circle=new THREE.Mesh(geo,mat);
    circle.position.copy(spos);
    circle.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),spos.clone().normalize());
    circle.renderOrder=7; circle.frustumCulled=false;
    circle.userData={isMoveTarget:true,lat,lon};
    globe.add(circle); visObjects.push(circle);
    // Ghost dot: 50% through pieces
    const gMat=_ghostMat(0xff6600);
    const gCircle=new THREE.Mesh(geo,gMat);
    gCircle.position.copy(spos);
    gCircle.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),spos.clone().normalize());
    gCircle.renderOrder=8; gCircle.frustumCulled=false;
    globe.add(gCircle); visObjects.push(gCircle);
  }
  function addDash(pts, isCapture, tgtLat, tgtLon, elbowIdx, gapOnly, gapSize, startAfterElbow, skipZone2){
    const H=R*1.006;
    const surfPts=pts.map(p=>p.clone().normalize().multiplyScalar(H));
    const cum=[0];
    for(let i=1;i<surfPts.length;i++) cum.push(cum[i-1]+surfPts[i].distanceTo(surfPts[i-1]));
    const total=cum[cum.length-1];
    if(total<0.001)return;
    // Start: exactly at origin ring edge (ring interior stays empty)
    let startD=0;
    for(let i=0;i<surfPts.length;i++){
      if(surfPts[i].distanceTo(fromCenter)>=ringR){
        if(i>0){
          const d0=surfPts[i-1].distanceTo(fromCenter), d1=surfPts[i].distanceTo(fromCenter);
          const t=(d1-d0)>0.0001?(ringR-d0)/(d1-d0):0;
          startD=cum[i-1]+(cum[i]-cum[i-1])*t;
        }
        break;
      }
    }
    // End: for captures stop at capture ring edge; for normal stops at dot edge
    let endD=total;
    if(isCapture&&tgtLat!=null){
      const tgtCenter=cellPos(tgtLat,tgtLon,H);
      for(let i=surfPts.length-1;i>0;i--){
        if(surfPts[i].distanceTo(tgtCenter)>=ringR){
          if(i<surfPts.length-1){
            const d0=surfPts[i].distanceTo(tgtCenter), d1=surfPts[i+1].distanceTo(tgtCenter);
            const t2=(d0-d1)>0.0001?(d0-ringR)/(d0-d1):0;
            endD=cum[i]+(cum[i+1]-cum[i])*t2;
          }
          break;
        }
      }
    } else if(tgtLat!=null){
      // Non-capture: stop at destination dot edge (dot radius = ringR)
      const dotCenter=cellPos(tgtLat,tgtLon,H);
      for(let i=surfPts.length-1;i>0;i--){
        if(surfPts[i].distanceTo(dotCenter)>=ringR){
          if(i<surfPts.length-1){
            const d0=surfPts[i].distanceTo(dotCenter), d1=surfPts[i+1].distanceTo(dotCenter);
            const t2=(d0-d1)>0.0001?(d0-ringR)/(d0-d1):0;
            endD=cum[i]+(cum[i+1]-cum[i])*t2;
          }
          break;
        }
      }
    }
    if(endD<=startD)return;
    // Corner arm length: equal on both sides of elbow
    const cornerArm=0.025; // each arm of the ∟ shape
    // Gradient for captures
    const gradStartLen=isCapture?Math.max(0,endD-BAND_THETA*R):endD;
    const cFrom=new THREE.Color(0xff6600), cTo=new THREE.Color(0x880000);
    function ptAt(s){
      s=Math.max(0,Math.min(s,total));
      for(let i=1;i<cum.length;i++){
        if(cum[i]>=s){
          const tt=(s-cum[i-1])/(cum[i]-cum[i-1]);
          return surfPts[i-1].clone().lerp(surfPts[i],tt).normalize().multiplyScalar(H);
        }
      }
      return surfPts[surfPts.length-1].clone();
    }
    function dashColor(arcPos){
      if(!isCapture||arcPos<=gradStartLen)return 0xff6600;
      const frac=Math.min(1,(arcPos-gradStartLen)/(endD-gradStartLen+0.001));
      return cFrom.clone().lerp(cTo,frac);
    }
    function drawSeg(sA,sB,col){
      if(sB-sA<0.001)return;
      const n=Math.max(2,Math.round((sB-sA)/0.008));
      const seg=[];
      for(let i=0;i<=n;i++) seg.push(ptAt(sA+(sB-sA)*i/n));
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),n,0.008,5,false);
      geo.computeBoundingSphere();
      const matF=new THREE.MeshBasicMaterial({color:col,depthTest:true,depthWrite:false,
        polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
      const front=new THREE.Mesh(geo,matF); front.renderOrder=7; front.frustumCulled=false;
      globe.add(front); visObjects.push(front);
      const ghost=new THREE.Mesh(geo,_ghostMat(col));
      ghost.renderOrder=6; ghost.frustumCulled=false;
      globe.add(ghost); visObjects.push(ghost);
    }
    function fillZone(zA,zB){
      const len=zB-zA;
      if(len<0.005)return;
      const dashLen2=0.035, gapLen2=0.04, step2=dashLen2+gapLen2;
      const nDash=Math.max(1,Math.round(len/step2));
      const actualStep=len/nDash;
      const aDash=actualStep*(dashLen2/step2);
      for(let i=0;i<nDash;i++){
        const dS=zA+i*actualStep;
        const dE=Math.min(dS+aDash,zB);
        if(dE-dS<0.002)continue;
        drawSeg(dS,dE,dashColor((dS+dE)/2));
      }
    }
    // Draw corner at elbow (solid ∟ with equal arms) — or just leave gap if gapOnly
    let cornerStart=null, cornerEnd=null;
    const _gapR=gapSize||cornerArm; // gap radius from elbow center
    if(elbowIdx!=null){
      const elbowArc=(elbowIdx<cum.length)?cum[elbowIdx]:null;
      if(elbowArc!=null&&elbowArc>startD&&elbowArc<endD){
        cornerStart=Math.max(startD,elbowArc-_gapR);
        cornerEnd=Math.min(endD,elbowArc+_gapR);
        if(!gapOnly) drawSeg(cornerStart,cornerEnd,dashColor(elbowArc));
      }
    }
    // Zone 1: startD → cornerStart (or endD) — skip if startAfterElbow
    const z1End=cornerStart!=null?cornerStart:endD;
    if(!startAfterElbow&&z1End>startD) fillZone(startD,z1End);
    // Zone 2: cornerEnd → endD — skip if skipZone2
    if(!skipZone2&&cornerEnd!=null&&endD>cornerEnd) fillZone(cornerEnd,endD);
  }

  function addRing(lat,lon){
    const center=cellPos(lat,lon,R*1.006);
    const radial=center.clone().normalize();
    const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
    const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
    const N=64;
    const pts=[];
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*ringR).addScaledVector(t2,Math.sin(a)*ringR);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.008,8,true);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,TUBE_F.clone()); mesh.renderOrder=7; mesh.frustumCulled=false;
    globe.add(mesh); visObjects.push(mesh);
    // Ghost: 50% through pieces
    const gMat=_ghostMat(0xff6600);
    const gMesh=new THREE.Mesh(geo,gMat); gMesh.renderOrder=6; gMesh.frustumCulled=false;
    globe.add(gMesh); visObjects.push(gMesh);
  }

  addRing(lat,lon);

  const tubeDests=new Set(); // track destinations with tubes drawn — prevent duplicates

  // Diagonal spiral paths
  const diagGroups={};
  moves.forEach(m=>{
    if(!m.diagKey)return;
    if(!diagGroups[m.diagKey])diagGroups[m.diagKey]=[];
    diagGroups[m.diagKey].push(m);
  });
  Object.values(diagGroups).forEach(dmoves=>{
    dmoves.sort((a,b)=>a.diagWP.length-b.diagWP.length);
    // Auto-battle: only draw the direction containing the target, keeping all intermediates
    if(autoOnlyLat!==null){
      const _ti=dmoves.findIndex(m=>m.lat===autoOnlyLat&&m.lon===autoOnlyLon);
      if(_ti===-1)return;
      dmoves=dmoves.slice(0,_ti+1);
    }
    const cells=[{lat,lon},...dmoves.map(m=>({lat:m.lat,lon:m.lon}))];
    const SEGS=14, r=R*1.006;
    const dn=parseInt(dmoves[0].diagKey.split(',')[1]); // initial dn from diagKey
    let poleCrossCount=0; // tracks how many pole crossings so far (dn flips each time)
    const pts=[];
    for(let i=0;i<cells.length-1;i++){
      const c0=cells[i],c1=cells[i+1];
      const th0=CAP_THETA+(c0.lat+0.5)*BAND_THETA;
      const th1=CAP_THETA+(c1.lat+0.5)*BAND_THETA;
      const ph0=(c0.lon+0.5)/NUM_LON*Math.PI*2;
      const ph1r=(c1.lon+0.5)/NUM_LON*Math.PI*2;
      let dph=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      const lDiff=Math.min(((c1.lon-c0.lon+8)%8),((c0.lon-c1.lon+8)%8));
      const isPole=c0.lat===c1.lat&&lDiff===4;
      const skip=(i===0)?0:1;
      if(isPole){
        // Loxodrome continuation: diagonal keeps its dθ/dφ ratio through the pole,
        // exits with fully reversed direction — creates smooth ∞/figure-8 shape.
        const dn_cur=dn*(poleCrossCount%2===0?1:-1); // effective dn at this crossing
        const dph_step=(2*Math.PI/NUM_LON)*dn_cur;   // φ change per "step unit"
        const isNorth=c0.lat<4;
        const poleTheta=isNorth?0:Math.PI;
        const dl_sign=isNorth?-1:1;                  // θ direction toward pole
        // Distance (in θ) from cell center to pole
        const distToPole=isNorth?th0:(Math.PI-th0);
        const t_half=distToPole/BAND_THETA;           // = 1.0 for this board geometry
        const phi_pole=ph0+dph_step*t_half;
        const N=SEGS*8;
        for(let s=skip;s<=N;s++){
          const t=(s/N)*2*t_half;
          let theta,phi;
          if(t<=t_half){
            // Spiralling toward pole
            theta=th0+dl_sign*BAND_THETA*t;
            phi=ph0+dph_step*t;
          } else {
            // Spiralling away from pole in mirrored direction
            const dt=t-t_half;
            theta=poleTheta-dl_sign*BAND_THETA*dt;
            phi=phi_pole+Math.PI-dph_step*dt;
          }
          theta=Math.max(0,Math.min(Math.PI,theta));
          pts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
        poleCrossCount++;
      } else {
        for(let s=skip;s<=SEGS;s++){
          const t=s/SEGS;
          const theta=th0+(th1-th0)*t;
          const phi=ph0+dph*t;
          pts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
      }
    }
    const lastCell=cells[cells.length-1];
    const isDiagCapture=!!(board[lastCell.lat]?.[lastCell.lon]&&board[lastCell.lat][lastCell.lon].color!==board[lat][lon]?.color);
    // Use diagKey in dedup key so mirror diagonals (different dn) are BOTH drawn
    const dk=`diag:${dmoves[0].diagKey}`;
    if(!tubeDests.has(dk)){
      tubeDests.add(dk);
      if(addTube(pts,isDiagCapture,cellPos(lastCell.lat,lastCell.lon,R*1.006)))
        tubeDests.add(`${lastCell.lat},${lastCell.lon}`);
    }
  });

  // Straight paths — group ALL moves per direction, build path through every intermediate
  // cell so each visible dot has a tube segment passing through it.
  // (Old approach: one long tube from piece to farthest → tube goes around back hemisphere
  //  and intermediate dots appear "disconnected".)
  const straightGroups={};
  moves.forEach(m=>{
    if(!m.straightKey)return;
    if(!straightGroups[m.straightKey])straightGroups[m.straightKey]=[];
    straightGroups[m.straightKey].push(m);
  });
  Object.entries(straightGroups).forEach(([,grpMoves])=>{
    grpMoves.sort((a,b)=>a.step-b.step);
    // Auto-battle: only draw the direction containing the target, keeping all intermediates
    if(autoOnlyLat!==null){
      const _ti=grpMoves.findIndex(m=>m.lat===autoOnlyLat&&m.lon===autoOnlyLon);
      if(_ti===-1)return;
      grpMoves=grpMoves.slice(0,_ti+1);
    }
    const farthest=grpMoves[grpMoves.length-1];
    // Dedup by direction (straightKey), NOT by cell coordinates.
    // Two different directions can share the same farthest cell (e.g. a vertical pole-crossing
    // path and a horizontal path both ending at the same cell). Each direction must draw its
    // own tube independently — cell-based dedup would skip one entirely, leaving dots with no lines.
    const sk=grpMoves[0].straightKey;
    if(tubeDests.has(sk))return;
    tubeDests.add(sk);
    let pts;
    if(farthest.straightDl===0){
      // Horizontal ring arc: single arc, as before
      pts=latRingArc(lat,lon,farthest.lon,48,R*1.019,farthest.straightDn);
    } else {
      // Vertical: separate pre-pole and post-pole segments.
      // A single CatmullRomCurve3 through the whole path (including the U-turn at the
      // pole) overshoots inside the sphere at the pole junction → the post-pole tube
      // segment is hidden by depth testing. Drawing two separate tubes avoids this.
      const poleVec=grpMoves.find(m=>m.pole);
      const isStraightCapture=!!(board[farthest.lat]?.[farthest.lon]&&board[farthest.lat][farthest.lon].color!==board[lat][lon]?.color);
      if(!poleVec){
        // No pole crossing: single smooth tube through all cells
        pts=[from];
        grpMoves.forEach(m=>pts.push(cellPos(m.lat,m.lon,R*1.019)));
        const ptsFlat=[];
        for(let i=0;i<pts.length-1;i++){
          const seg=geodesicPts(pts[i],pts[i+1],8);if(i>0)seg.shift();ptsFlat.push(...seg);
        }
        addTube(ptsFlat,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
      } else {
        // Pole crossing: tube 1 = piece→pole, tube 2 = pole→farthest (no U-turn in either)
        const polePt=new THREE.Vector3(0,(poleVec.pole==='N'?1:-1)*R*1.001,0);
        const preWP=[from,...grpMoves.filter(m=>!m.pole).map(m=>cellPos(m.lat,m.lon,R*1.019)),polePt];
        const postWP=[polePt,...grpMoves.filter(m=>!!m.pole).map(m=>cellPos(m.lat,m.lon,R*1.019))];
        // Draw pre-pole tube (piece → pole)
        const prePts=[];
        for(let i=0;i<preWP.length-1;i++){
          const seg=geodesicPts(preWP[i],preWP[i+1],8);if(i>0)seg.shift();prePts.push(...seg);
        }
        addTube(prePts,false,null); // don't trim at pole — continuous with post-pole tube
        // Draw post-pole tube (pole → farthest)
        if(postWP.length>=2){
          const postPts=[];
          for(let i=0;i<postWP.length-1;i++){
            const seg=geodesicPts(postWP[i],postWP[i+1],8);if(i>0)seg.shift();postPts.push(...seg);
          }
          addTube(postPts,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
        }
      }
      pts=null; // already handled above
    }
    if(pts!==null){
      const isStraightCapture=!!(board[farthest.lat]?.[farthest.lon]&&board[farthest.lat][farthest.lon].color!==board[lat][lon]?.color);
      addTube(pts,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
    }
    // Track cell coords so fallback doesn't draw a duplicate geodesic
    tubeDests.add(`${farthest.lat},${farthest.lon}`);
  });

  // Knight L-shape dashed paths
  // Group by elbow to handle T-junctions (shared elbow = ⊥ shape with equal arms)
  const _knightByElbow={};
  const _drawnSeg2=new Set(); // track seg2 geodesics by sorted endpoint keys to prevent reverse-duplicate drawing
  moves.forEach((m)=>{
    if(!m.isKnight)return;
    if(autoOnlyLat!==null&&!(m.lat===autoOnlyLat&&m.lon===autoOnlyLon))return;
    const ek=`${m.elbowLat},${m.elbowLon},${m.longLat?1:0}`;
    if(!_knightByElbow[ek])_knightByElbow[ek]=[];
    _knightByElbow[ek].push(m);
  });
  Object.values(_knightByElbow).forEach(group=>{
    const m0=group[0];
    const r=R*1.006;
    // Build shared seg1 (origin → elbow)
    let seg1;
    if(m0.longLat){
      if(m0.elbowLat>=0&&m0.elbowLat<=7){
        seg1=geodesicPts(from,cellPos(m0.elbowLat,m0.elbowLon,r),24);
      } else {
        const isNorth=m0.elbowLat<0;
        const polePt=new THREE.Vector3(0,(isNorth?1:-1)*R*1.001,0);
        const ref=poleRef(m0.elbowLat,m0.elbowLon);
        seg1=[...geodesicPts(from,polePt,12),...geodesicPts(polePt,cellPos(ref.l,ref.n,r),12).slice(1)];
      }
    } else {
      seg1=latRingArc(lat,lon,m0.elbowLon,24,r);
    }
    // Build seg2 for each target — check for reverse-duplicate geodesics
    const paths=group.map(m=>{
      let seg2;
      if(m.longLat){
        if(m.elbowLat>=0&&m.elbowLat<=7){
          seg2=latRingArc(m.elbowLat,m.elbowLon,m.lon,12,r);
        } else {
          const ref=poleRef(m.elbowLat,m.elbowLon);
          seg2=latRingArc(ref.l,ref.n,m.lon,12,r);
        }
      } else {
        seg2=geodesicPts(cellPos(m.elbowLat,m.elbowLon,r),cellPos(m.lat,m.lon,r),12);
      }
      const isCap=!!(board[m.lat]?.[m.lon]&&board[m.lat][m.lon].color!==board[lat][lon]?.color);
      // Check if this seg2 geodesic (or its reverse) was already drawn
      const s2Start=seg2[0], s2End=seg2[seg2.length-1];
      const kA=`${Math.round(s2Start.x*80)},${Math.round(s2Start.y*80)},${Math.round(s2Start.z*80)}`;
      const kB=`${Math.round(s2End.x*80)},${Math.round(s2End.y*80)},${Math.round(s2End.z*80)}`;
      const seg2Key=[kA,kB].sort().join('|');
      const seg2Dup=_drawnSeg2.has(seg2Key);
      _drawnSeg2.add(seg2Key);
      return{m,seg2,isCap,seg2Dup};
    });
    if(group.length===1){
      const p=paths[0];
      const _elbowIdx=seg1.length-1;
      addDash([...seg1,...p.seg2.slice(1)],p.isCap,p.m.lat,p.m.lon,_elbowIdx,
        false,undefined,false,p.seg2Dup);
    } else {
      const _elbowIdx=seg1.length-1;
      const tCornerArm=0.025;
      const tGap=tCornerArm*2;
      paths.forEach((p,pi)=>{
        const fullPts=[...seg1,...p.seg2.slice(1)];
        addDash(fullPts,p.isCap,p.m.lat,p.m.lon,_elbowIdx,true,tGap,pi>0,p.seg2Dup);
      });
      // Draw T-corner arms
      const H=R*1.006;
      const elbowPt=seg1[seg1.length-1].clone().normalize().multiplyScalar(H);
      const drawArm=(fromPt,toPt,len,col)=>{
        const dir=toPt.clone().sub(fromPt).normalize();
        const armN=8;
        const armPts=[];
        for(let i=0;i<=armN;i++){
          const p=fromPt.clone().addScaledVector(dir,len*i/armN);
          armPts.push(p.normalize().multiplyScalar(H));
        }
        if(armPts.length<2)return;
        const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(armPts,false,'centripetal'),armN,0.008,5,false);
        geo.computeBoundingSphere();
        const matF=new THREE.MeshBasicMaterial({color:col,depthTest:true,depthWrite:false,
          polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});
        const front=new THREE.Mesh(geo,matF);front.renderOrder=7;front.frustumCulled=false;
        globe.add(front);visObjects.push(front);
        const ghost=new THREE.Mesh(geo,_ghostMat(col));
        ghost.renderOrder=6;ghost.frustumCulled=false;
        globe.add(ghost);visObjects.push(ghost);
      };
      // Stem: 2×cornerArm toward origin (matches total horizontal bar width)
      const stemRef=seg1.length>=2?seg1[seg1.length-2].clone().normalize().multiplyScalar(H):elbowPt;
      drawArm(elbowPt,stemRef,tCornerArm*2,0xff6600);
      // Each horizontal arm: cornerArm toward each target
      paths.forEach(p=>{
        const seg2Ref=p.seg2.length>=2?p.seg2[1].clone().normalize().multiplyScalar(H)
          :p.seg2[0].clone().normalize().multiplyScalar(H);
        drawArm(elbowPt,seg2Ref,tCornerArm,0xff6600);
      });
    }
    group.forEach(m=>tubeDests.add(`${m.lat},${m.lon}`));
  });

  // Pawn / King / fallback — also catches failed diagonal/straight tubes during auto-battle
  const drawnDests=new Set();
  moves.forEach(m=>{if(m.diagKey||m.straightKey||m.isKnight)drawnDests.add(`${m.lat},${m.lon}`);});
  moves.forEach(({lat:tl,lon:tn,diagKey,straightKey,isKnight})=>{
    if(autoOnlyLat===null){
      // Normal mode: skip moves handled by specialized sections
      if(diagKey||straightKey||isKnight)return;
      if(drawnDests.has(`${tl},${tn}`))return;
    } else {
      // Auto-battle: only draw the target, skip if already drawn by specialized section
      if(!(tl===autoOnlyLat&&tn===autoOnlyLon))return;
    }
    const fk=`${tl},${tn}`;
    if(tubeDests.has(fk))return;
    tubeDests.add(fk);
    const r2=R*1.006;
    const fromPt=from.clone().normalize().multiplyScalar(r2);
    const to3d=cellPos(tl,tn,r2);
    // Detect pole-crossing (both near same pole, phi differs ~π)
    const th0=CAP_THETA+(lat+0.5)*BAND_THETA;
    const th1=CAP_THETA+(tl+0.5)*BAND_THETA;
    const ph0=(lon+0.5)/NUM_LON*Math.PI*2;
    const ph1r=(tl===lat)?Math.atan2(to3d.z,to3d.x):((tn+0.5)/NUM_LON*Math.PI*2);
    let dphF=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
    const nearN=th0<CAP_THETA+BAND_THETA*1.5&&th1<CAP_THETA+BAND_THETA*1.5;
    const nearS=th0>Math.PI-CAP_THETA-BAND_THETA*1.5&&th1>Math.PI-CAP_THETA-BAND_THETA*1.5;
    const isPoleF=(nearN||nearS)&&Math.abs(Math.abs(dphF)-Math.PI)<0.6;
    let pts;
    // Pawn diagonal capture: use loxodromic (constant dθ/dφ) path instead of great circle
    // Great circles deviate visibly from the true diagonal on a sphere
    const _pType=board[lat]?.[lon]?.type;
    if(_pType==='P'&&tl!==lat&&tn!==lon){
      const _SEGS=20;
      const _th0=CAP_THETA+(lat+0.5)*BAND_THETA;
      const _th1=CAP_THETA+(tl+0.5)*BAND_THETA;
      const _ph0=((lon+0.5)/NUM_LON)*Math.PI*2;
      const _ph1=((tn+0.5)/NUM_LON)*Math.PI*2;
      let _dp=((_ph1-_ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      pts=[];
      for(let s=0;s<=_SEGS;s++){
        const t=s/_SEGS;
        const theta=_th0+(_th1-_th0)*t;
        const phi=_ph0+_dp*t;
        pts.push(new THREE.Vector3(r2*Math.sin(theta)*Math.cos(phi),r2*Math.cos(theta),r2*Math.sin(theta)*Math.sin(phi)));
      }
    } else {
      pts=geodesicPts(fromPt,to3d,60);
    }
    const isPawnCapture=!!(board[tl]?.[tn]&&board[tl][tn].color!==board[lat][lon]?.color);
    addTube(pts,isPawnCapture,cellPos(tl,tn,r2));
  });

  const CAPTURE_F=new THREE.MeshBasicMaterial({color:0x880000,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-16});

  function addCaptureRing(lat,lon){
    const center=cellPos(lat,lon,R*1.006);
    const radial=center.clone().normalize();
    const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
    const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
    const N=64;
    const pts=[];
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*ringR).addScaledVector(t2,Math.sin(a)*ringR);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.008,8,true);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,CAPTURE_F.clone()); mesh.renderOrder=7; mesh.frustumCulled=false;
    globe.add(mesh); visObjects.push(mesh);
    // Ghost: 50% through pieces
    const gMat=_ghostMat(0x880000);
    const gMesh=new THREE.Mesh(geo,gMat); gMesh.renderOrder=6; gMesh.frustumCulled=false;
    globe.add(gMesh); visObjects.push(gMesh);
  }

  // Keep every path but draw each destination marker only once.
  const marked=new Set();
  moves.forEach(m=>{
    const{lat:tl,lon:tn}=m;
    if(autoOnlyLat!==null&&!(tl===autoOnlyLat&&tn===autoOnlyLon))return;
    const key=tl*NUM_LON+tn;
    if(marked.has(key))return;
    marked.add(key);
    const target=board[tl]?.[tn];
    const isCapture=target&&target.color!==board[lat][lon]?.color;
    if(m.isEnPassant){
      // Orange dot at destination + capture ring on the adjacent pawn
      addDot(cellPos(tl,tn,R*1.006),tl,tn);
      addCaptureRing(m.capturedLat,m.capturedLon);
      const epPawn=board[m.capturedLat]?.[m.capturedLon];
      if(epPawn){
        const bp=cellPos(m.capturedLat,m.capturedLon,R*1.035).clone();
        shakeAnims.push({group:epPawn.sprite,basePos:bp,baseQ:epPawn.sprite.quaternion.clone(),radialDir:bp.clone().normalize(),t:Math.random()*Math.PI*2,type:epPawn.type});
      }
    } else if(!isCapture){
      addDot(cellPos(tl,tn,R*1.006),tl,tn);
    } else {
      addCaptureRing(tl,tn);
      const spos=cellPos(tl,tn,R*1.006).normalize().multiplyScalar(R*1.006);
      const hit=new THREE.Mesh(DOT_GEO,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
      hit.position.copy(spos); hit.renderOrder=4; hit.frustumCulled=false;
      hit.userData={isMoveTarget:true,lat:tl,lon:tn};
      globe.add(hit); visObjects.push(hit);
      const basePos=cellPos(tl,tn,R*1.035).clone();
      shakeAnims.push({group:target.sprite,basePos,baseQ:target.sprite.quaternion.clone(),radialDir:basePos.clone().normalize(),t:Math.random()*Math.PI*2,type:target.type});
    }
  });
}

function removeOverlays(objects){
  const geometries=new Set();
  const materials=new Set();
  for(const mesh of objects){
    globe.remove(mesh);
    if(mesh.geometry!==DOT_GEO)geometries.add(mesh.geometry);
    if(mesh.material!==TUBE_F)materials.add(mesh.material);
  }
  for(const geometry of geometries)geometry.dispose();
  for(const material of materials)material.dispose();
}

function clearVis(){
  boardNeedsPaint=true;
  stopBounce();
  // Stop shake animations and restore positions
  shakeAnims.forEach(s=>{s.group.position.copy(s.basePos);if(s.baseQ)s.group.quaternion.copy(s.baseQ);});
  shakeAnims=[];
  removeOverlays(visObjects);
  visObjects=[];currentTargets=[];selectedCell=null;
  if(typeof updateDeleteBtn==='function')updateDeleteBtn();
}

// ─── Move Animation ───────────────────────────────────────────────────────────
let moveAnim=null;
let bounceAnim=null;

function startBounce(group,lat,lon){
  const basePos=cellPos(lat,lon,R).clone();
  const piece=board[lat][lon];
  const blob=piece?piece.blob:null;
  bounceAnim={group,blob,basePos,radialDir:basePos.clone().normalize(),t:0};
}
function stopBounce(){
  if(bounceAnim){
    bounceAnim.group.position.copy(bounceAnim.basePos);
    // Restore blob opacity to full
    if(bounceAnim.blob){
      const mat=bounceAnim.blob.children[0]?.material;
      if(mat) mat.opacity=0.48;
    }
    bounceAnim=null;
  }
}

// ─── Animation duration helper ────────────────────────────────────────────────
// Duration scales with actual 3D path length — not grid-step count.
// Calibration: 1 latitude step (BAND_THETA) → 500 ms  |  longest spirals → 5000 ms
// This ensures a bishop spiralling diagonally across the globe takes noticeably
// longer than a rook creeping one step at high latitude, matching visual distance.
function calcMoveDur(pathLen){
  const minDist = BAND_THETA;          // shortest realistic path: 1 lat step
  const maxDist = BAND_THETA * 25;     // practical upper bound for long loxodromes
  return Math.min(5000, Math.max(500,
    Math.round(500 + (pathLen - minDist) / (maxDist - minDist) * 4500)
  ));
}

function startMoveAnim(sprite,blob,animPts,onDone){
  if(document.hidden&&(autoBattleActive||aiMode)){
    onDone();
    return;
  }
  let pathLen=0;
  for(let i=1;i<animPts.length;i++) pathLen+=animPts[i].distanceTo(animPts[i-1]);
  const dur=calcMoveDur(pathLen);
  // Precompute cumulative arc-length table so the animate loop can sample
  // by actual distance rather than by point index.
  // This eliminates the apparent speed spike/slowdown caused by non-uniform
  // point density (e.g., pole-crossing spirals pack points tightly near the pole).
  const cum=[0];
  for(let i=1;i<animPts.length;i++) cum.push(cum[i-1]+animPts[i].distanceTo(animPts[i-1]));
  moveAnim={sprite,blob,pts:animPts,cum,totalLen:pathLen,t:0,dur,onDone,pieceType:null,pieceIsWhite:null};
}
function finishMoveAnimation(){
  if(!moveAnim)return;
  boardNeedsPaint=true;
  const done=moveAnim.onDone;
  moveAnim=null;
  done();
}

function computeAnimPath(move,fromLat,fromLon,toLat,toLon,fromPos){
  const r=R*1.01;
  const snap=pts=>pts.map(p=>p.clone().normalize().multiplyScalar(r));
  const from3d=fromPos.clone().normalize().multiplyScalar(r);
  const to3d=cellPos(toLat,toLon,r);

  if(move&&move.diagKey&&move.diagWP&&move.diagWP.length){
    function toAngles(pt){const l=pt.length()||r;return{theta:Math.acos(Math.max(-1,Math.min(1,pt.y/l))),phi:Math.atan2(pt.z,pt.x)};}
    const wp=snap(move.diagWP);
    const rawWP=[from3d,...wp];
    const allPts=[];
    const SEGS=30;
    const dn_init=parseInt(move.diagKey.split(',')[1]);
    let diagPoleCount=0;
    for(let i=0;i<rawWP.length-1;i++){
      const{theta:th0,phi:ph0}=toAngles(rawWP[i]);
      const{theta:th1,phi:ph1r}=toAngles(rawWP[i+1]);
      let dph=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      const nearN=th0<CAP_THETA+BAND_THETA*1.5&&th1<CAP_THETA+BAND_THETA*1.5;
      const nearS=th0>Math.PI-CAP_THETA-BAND_THETA*1.5&&th1>Math.PI-CAP_THETA-BAND_THETA*1.5;
      const isPole=(nearN||nearS)&&Math.abs(Math.abs(dph)-Math.PI)<0.5;
      const skip=i===0?0:1;
      if(isPole){
        // Loxodrome continuation — same formula as visualization
        const dn_cur=dn_init*(diagPoleCount%2===0?1:-1);
        const dph_step=(2*Math.PI/NUM_LON)*dn_cur;
        const isNorth=nearN;
        const poleTheta=isNorth?0:Math.PI;
        const dl_sign=isNorth?-1:1;
        const distToPole=isNorth?th0:(Math.PI-th0);
        const t_half=distToPole/BAND_THETA;
        const phi_pole=ph0+dph_step*t_half;
        const N=SEGS*8;
        for(let s=skip;s<=N;s++){
          const t=(s/N)*2*t_half;
          let theta,phi;
          if(t<=t_half){
            theta=th0+dl_sign*BAND_THETA*t;
            phi=ph0+dph_step*t;
          } else {
            const dt=t-t_half;
            theta=poleTheta-dl_sign*BAND_THETA*dt;
            phi=phi_pole+Math.PI-dph_step*dt;
          }
          theta=Math.max(0,Math.min(Math.PI,theta));
          allPts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
        diagPoleCount++;
      } else {
        for(let s=skip;s<=SEGS;s++){
          const t=s/SEGS;
          const theta=th0+(th1-th0)*t;
          const phi=ph0+dph*t;
          allPts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
      }
    }
    return allPts;
  }

  if(move&&move.isKnight){
    const SEGS=120;
    const s=from3d.clone().normalize();
    const e=to3d.clone().normalize();
    const ang=s.angleTo(e);
    const maxLift=Math.max(0.40,Math.sin(ang)*0.84)*R;
    const pts=[];
    for(let i=0;i<=SEGS;i++){
      const t=i/SEGS;
      let dir;
      if(ang<0.001){dir=s.clone();}
      else{const sinA=Math.sin(ang);dir=new THREE.Vector3().addScaledVector(s,Math.sin((1-t)*ang)/sinA).addScaledVector(e,Math.sin(t*ang)/sinA);}
      const lift=Math.sin(Math.PI*t)*maxLift;
      pts.push(dir.normalize().multiplyScalar(r+lift));
    }
    return pts;
  }

  if(move&&move.straightKey){
    if(move.straightDl===0) return snap(latRingArc(fromLat,fromLon,toLon,120,r,move.straightDn));
    else if(move.pole){
      const polePt=new THREE.Vector3(0,(move.pole==='N'?1:-1)*r,0);
      return snap([...geodesicPts(from3d,polePt,60),...geodesicPts(polePt,to3d,60)]);
    } else return snap(geodesicPts(from3d,to3d,120));
  }
  // Fallback (king, pawn, etc.) — pole-crossing: geodesicPts naturally passes through pole for antipodal polar points
  return snap(geodesicPts(from3d,to3d,120));
}

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

// Professional algebraic chess notation: Nf3, Bxe5+, O-O, e8=Q, dxe6 e.p.
const _NF=['a','b','c','d','e','f','g','h']; // file letters (lon 7→a, lon 0→h)
function _sq(lat,lon){return _NF[7-lon]+(8-lat);}
function _moveNotation(piece,fromLat,fromLon,toLat,toLon,captured,move,inCheck,isMate){
  if(move?.isCastle) return (toLon<fromLon?'O-O-O':'O-O')+(isMate?'#':inCheck?'+':'');
  let n='';
  if(piece.type!=='P') n+=piece.type;
  else if(captured) n+=_NF[7-fromLon]; // pawn captures: file of origin
  if(captured) n+='x';
  n+=_sq(toLat,toLon);
  if(piece.type==='P'&&(toLat===0||toLat===7)) n+='=Q';
  if(move?.isEnPassant) n+=' e.p.';
  if(isMate) n+='#'; else if(inCheck) n+='+';
  return n;
}

let _ac=null;
function getAC(){
  if(!_ac)try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch{}
  return _ac?.state==='running'?_ac:null;
}
// Autoplay may suspend Web Audio. Never queue old moves on a stopped audio clock.
document.addEventListener('pointerdown',()=>{
  getAC();
  if(_ac?.state==='suspended')_ac.resume().catch(()=>{});
},{capture:true});
function sfxNoise(freq,vol,tau,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const N=Math.ceil(ctx.sampleRate*0.16);
  const buf=ctx.createBuffer(1,N,ctx.sampleRate); const d=buf.getChannelData(0);
  const k=ctx.sampleRate*tau;
  for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/k);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=freq; bpf.Q.value=1.1;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); src.start(t);
}
function sfxTone(freq,vol,dur,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+dur+0.02);
}
// Crisp mechanical click (like a mouse button): very short noise burst, high-Q bandpass
function sfxClick(freq,vol,tau,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const N=Math.ceil(ctx.sampleRate*0.05);
  const buf=ctx.createBuffer(1,N,ctx.sampleRate); const d=buf.getChannelData(0);
  const k=ctx.sampleRate*tau;
  for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/k);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=freq; bpf.Q.value=3.5;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); src.start(t);
}

function execMove(fromLat,fromLon,toLat,toLon){
  if(moveAnim||!isBoardCell(fromLat,fromLon)||!isBoardCell(toLat,toLon))return;
  const piece=board[fromLat][fromLon];
  if(!piece||selectedCell?.lat!==fromLat||selectedCell?.lon!==fromLon)return;
  const move=currentTargets.find(m=>m.lat===toLat&&m.lon===toLon);
  if(!move)return;
  const _origType=piece.type; // save before promotion changes it
  const _wasCapture=!!(board[toLat][toLon])||!!(move?.isEnPassant);
  // Store captured piece — remove blob, defer sprite removal until fade
  let capturedPiece=null;
  if(board[toLat][toLon]){
    capturedPiece=board[toLat][toLon];
    removePieceObject(capturedPiece.blob);
    const i=allSprites.indexOf(capturedPiece.sprite);if(i>=0)allSprites.splice(i,1);
  }
  board[toLat][toLon]=piece;
  board[fromLat][fromLon]=null;
  piece.hasMoved=true;
  if(move?.isCastle)piece._castled=true;
  piece.sprite.userData.lat=toLat;
  piece.sprite.userData.lon=toLon;
  // Stop bounce BEFORE capturing fromPos so animation starts from cell center,
  // not from a mid-bounce lifted position.
  stopBounce(); // stop bounce but keep path lines visible until animation completes
  const fromPos=piece.sprite.position.clone();
  const animPts=computeAnimPath(move,fromLat,fromLon,toLat,toLon,fromPos);
  // En passant: remove the captured pawn from board & scene immediately
  let epCaptured=null;
  if(move?.isEnPassant){
    epCaptured=board[move.capturedLat][move.capturedLon];
    if(epCaptured){
      removePieceObject(epCaptured.blob);
      const ei=allSprites.indexOf(epCaptured.sprite);if(ei>=0)allSprites.splice(ei,1);
      board[move.capturedLat][move.capturedLon]=null;
    }
  }
  // Always play the moving piece's click sound the moment it starts moving
  if(move?.isCastle) playCastle(); else playMove(piece.type);
  // Schedule captured piece fade — collision sound fires exactly when piece starts disappearing
  if(capturedPiece){
    const pathLen=animPts.reduce((s,p,i)=>i===0?0:s+p.distanceTo(animPts[i-1]),0);
    setTimeout(()=>{startCaptureFade(capturedPiece);playCapture();},Math.max(0,calcMoveDur(pathLen)-500));
  }
  // En passant: collision sound fires when the passed pawn starts fading
  if(epCaptured){
    setTimeout(()=>{startCaptureFade(epCaptured);playCapture();},300);
  }
  // Show preliminary notation during animation (no check info yet)
  if(!autoBattleActive&&!testModeActive){
    const _preNote=_moveNotation({type:_origType,color:piece.color},fromLat,fromLon,toLat,toLon,_wasCapture,move,false,false);
    const _mover=piece.color==='white'?'White':'Black';
    turnEl.textContent=_mover+': '+_preNote;
  }
  startMoveAnim(piece.sprite,piece.blob,animPts,()=>{
    // Clear path visualization after animation completes
    clearVis();
    const finalPos=cellPos(toLat,toLon,R);
    piece.sprite.position.copy(finalPos);
    orientPiece(piece.sprite,finalPos);
    if(piece.type==='N') faceKnightTowardPole(piece.sprite,finalPos,piece.color==='white');
    piece.blob.position.copy(finalPos);
    orientPiece(piece.blob,finalPos);
    if(piece.type==='P'){
      const promLat=piece.color==='black'?7:0;
      if(toLat===promLat){
        piece.type='Q';
        removePieceObject(piece.sprite);
        const idx=allSprites.indexOf(piece.sprite);if(idx>=0)allSprites.splice(idx,1);
        const newGrp=createPieceMesh('Q',piece.color==='black');
        newGrp.position.copy(finalPos);
        orientPiece(newGrp,finalPos);
        newGrp.userData={isPiece:true,lat:toLat,lon:toLon};
        globe.add(newGrp); allSprites.push(newGrp);
        if(!_pieceLettersVisible) newGrp.traverse(c=>{if(c.isSprite)c.visible=false;});
        piece.sprite=newGrp; board[toLat][toLon]=piece;
      }
    }
    // Castling: snap rook to its new position
    if(move?.isCastle){      const rook=board[toLat][move.rookFromLon];
      if(rook){
        board[toLat][move.rookToLon]=rook;
        board[toLat][move.rookFromLon]=null;
        rook.hasMoved=true;
        rook.sprite.userData.lat=toLat;
        rook.sprite.userData.lon=move.rookToLon;
        const rookPos=cellPos(toLat,move.rookToLon,R);
        rook.sprite.position.copy(rookPos); orientPiece(rook.sprite,rookPos);
        rook.blob.position.copy(rookPos);   orientPiece(rook.blob,rookPos);
      }
    }
    // Test mode: no turn alternation; after each move check both kings for threats
    if(testModeActive){
      // Update en passant target so en passant captures work in test mode
      enPassantTarget=(piece.type==='P'&&Math.abs(toLat-fromLat)===2)
        ?{lat:Math.round((fromLat+toLat)/2),lon:toLon}:null;
      clearCheckRing();
      for(const col of['white','black']){
        if(isInCheck(col)){
          for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
            if(board[la][lo]?.type==='K'&&board[la][lo]?.color===col){showCheckRing(la,lo);}
          showCheckThreats(col);
        }
      }
      turnEl.textContent='Test move — tap any piece';
      return;
    }
    // Update en passant target for the next turn
    enPassantTarget=(piece.type==='P'&&Math.abs(toLat-fromLat)===2)
      ?{lat:Math.round((fromLat+toLat)/2),lon:toLon}:null;
    turnColor=turnColor==='black'?'white':'black';
    clearCheckRing();
    const inCheck=isInCheck(turnColor);
    const hasMove=hasAnyLegalMove(turnColor);
    if(!hasMove){
      if(inCheck){
        // Checkmate — draw permanent threat lines
        _checkmateActive=false; // temporarily allow drawing
        for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
          if(board[la][lo]?.type==='K'&&board[la][lo]?.color===turnColor){showCheckRing(la,lo);}
        showCheckThreats(turnColor);
        _checkmateActive=true; // now lock them permanently
        const winner=turnColor==='white'?'Black':'White';
        const _note=_moveNotation({type:_origType,color:piece.color},fromLat,fromLon,toLat,toLon,_wasCapture,move,true,true);
        const _mover=piece.color==='white'?'White':'Black';
        turnEl.innerHTML=_mover+': '+_note+'<br>'+winner+' wins';
        playGameOver();
        if(autoBattleActive){const r=turnColor==='white'?'BLACK_WINS_CHECKMATE':'WHITE_WINS_CHECKMATE';_autoBattleTimer=setTimeout(()=>_endAutoGame(r),600);}
      } else {
        turnEl.textContent='Stalemate  —  draw';
        if(autoBattleActive){_autoBattleTimer=setTimeout(()=>_endAutoGame('DRAW_STALEMATE'),600);}
      }
      return;
    }
    // Build notation with check info
    const _note=_moveNotation({type:_origType,color:piece.color},fromLat,fromLon,toLat,toLon,_wasCapture,move,inCheck,false);
    const _mover=piece.color==='white'?'White':'Black';
    if(inCheck){
      for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
        if(board[la][lo]?.type==='K'&&board[la][lo]?.color===turnColor){showCheckRing(la,lo);}
      showCheckThreats(turnColor);
      playCheck();
    }
    if(autoBattleActive){
      clearTimeout(_autoBattleTimer);
      _autoBattleTimer=setTimeout(()=>runAutoStep(doAutoMove),AUTO_DELAY);
    } else if(aiMode&&turnColor===AI_COLOR){
      const _aiTurnLabel=inCheck?'AI thinking… (check)':'AI thinking…';
      _showNotation(_mover+': '+_note, _aiTurnLabel, 2000);
      aiTimer=setTimeout(doAiMove,2200);
    } else {
      // Human play: show notation + turn on two lines for 5 seconds
      const _turnLabel=(turnColor==='white'?'White':'Black')+' to move'+(inCheck?' — check':'');
      _showNotation(_mover+': '+_note, _turnLabel, 5000);
    }
  });
  setMoveAnimPiece(piece.type,piece.color==='white');
}

// ─── Hit Detection (screen-space) ─────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const _hWP=new THREE.Vector3();
function screenXY(worldPos){
  worldPos.project(camera);
  return{sx:(worldPos.x*0.5+0.5)*innerWidth,sy:(-worldPos.y*0.5+0.5)*innerHeight};
}
function hitTest(cx,cy){
  globe.updateMatrixWorld(true);
  const DOT_PX=Math.max(3, Math.min(38, innerHeight*camera.zoom*0.16/camera.position.z));
  let bestDot=null, bestDotD=DOT_PX;
  for(const o of visObjects){
    if(!o.userData.isMoveTarget)continue;
    o.getWorldPosition(_hWP);
    if(_hWP.dot(camera.position)<=0)continue;
    const{sx,sy}=screenXY(_hWP.clone());
    const d=Math.hypot(cx-sx,cy-sy);
    if(d<bestDotD){bestDotD=d;bestDot=o;}
  }
  if(bestDot)return{kind:'dot',...bestDot.userData};
  // Raycast against all piece meshes (entire body, not just base point)
  raycaster.setFromCamera({x:(cx/innerWidth)*2-1,y:-(cy/innerHeight)*2+1},camera);
  let bestPiece=null, bestPieceDist=Infinity;
  for(const grp of allSprites){
    if(!grp.visible)continue;
    // Quick front-hemisphere check using base position
    grp.getWorldPosition(_hWP);
    if(_hWP.dot(camera.position)<=0)continue;
    // Raycast against all meshes in this piece group
    const hits=raycaster.intersectObject(grp,true);
    for(const hit of hits){
      if(hit.distance<bestPieceDist){
        bestPieceDist=hit.distance;bestPiece=grp;
      }
    }
  }
  if(bestPiece)return{kind:'piece',...bestPiece.userData};
  const ch=raycaster.intersectObjects(cellMeshes);
  if(ch.length)return{kind:'cell',...ch[0].object.userData};
  return null;
}

  if(!introAnim.done){introAnim.done=true;globe.quaternion.copy(introFinalQ);globe.scale.set(1,1,1);_ambLight.intensity=_ambTarget;const _fd=document.getElementById('introFade');if(_fd)_fd.remove();}
  inputCanvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  autoRotate=false; vel={x:0,y:0}; dragging=true;
  document.body.classList.add('dragging');
  const pts=[...activePointers.values()];
  if(pts.length===1){
    prevMidX=pts[0].x; prevMidY=pts[0].y;
    pDownPos={x:e.clientX,y:e.clientY};
  } else {
    prevMidX=(pts[0].x+pts[1].x)/2; prevMidY=(pts[0].y+pts[1].y)/2;
    prevPinchDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    prevFingerAngle=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
    pDownPos=null;
  }
});

inputCanvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...activePointers.values()];
  if(pts.length===1){
    const dx=pts[0].x-prevMidX, dy=pts[0].y-prevMidY;
    prevMidX=pts[0].x; prevMidY=pts[0].y;
    vel={x:dx,y:dy};
    applyDelta(dx,dy);
  } else if(pts.length>=2){
    const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    // Pinch zoom
    camera.position.z=Math.max(1.6,Math.min(7,camera.position.z+(prevPinchDist-dist)*0.012));
    // Two-finger roll
    const angle=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
    if(prevFingerAngle!==null){
      let da=angle-prevFingerAngle;
      if(da>Math.PI)da-=2*Math.PI;
      if(da<-Math.PI)da+=2*Math.PI;
      const qRoll=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-da);
      globe.quaternion.premultiply(qRoll);
    }
    prevFingerAngle=angle;
    prevMidX=mx; prevMidY=my; prevPinchDist=dist;
  }
});

inputCanvas.addEventListener('pointerup',e=>{
  inputCanvas.releasePointerCapture(e.pointerId);
  activePointers.delete(e.pointerId);
  dragging=activePointers.size>0;
  if(!dragging)document.body.classList.remove('dragging');
  pDownPos=null;
  // Re-init midpoint for remaining finger
  if(activePointers.size===1){
    const pt=[...activePointers.values()][0];
    prevMidX=pt.x; prevMidY=pt.y; prevFingerAngle=null;
  }
});

inputCanvas.addEventListener('lostpointercapture',e=>{
  activePointers.delete(e.pointerId);
  dragging=activePointers.size>0;
  if(!dragging)document.body.classList.remove('dragging');
});

inputCanvas.addEventListener('pointerleave',e=>{
  activePointers.delete(e.pointerId);
  if(activePointers.size===0){dragging=false;document.body.classList.remove('dragging');}
});

// Each game owns its search worker. Only chess state crosses the thread boundary.
let chessWorker=null, chessWorkerURL=null, workerUnavailable=false;
let searchRequest=null, nextSearchId=0, scheduledSearch=null;

function closeChessWorker(){
  if(chessWorker)chessWorker.terminate();
  chessWorker=null;
  if(chessWorkerURL)URL.revokeObjectURL(chessWorkerURL);
  chessWorkerURL=null;
}

function cancelAISearch(){
  if(scheduledSearch){
    scheduledSearch.release?.();
    scheduledSearch=null;
  }
  aiSearchGeneration++; // cancel a local fallback between slices
  if(searchRequest){
    searchRequest=null;
    closeChessWorker();
  }
}

function workerFailed(){
  const request=searchRequest;
  searchRequest=null;
  closeChessWorker();
  workerUnavailable=true;
  if(request){
    searchChessPosition(request.color,request.timeLimit,request.onProgress,request.onDone,request.halfMoveClock,request.seenOpeningMoves);
  }
}

function getChessWorker(){
  if(chessWorker)return chessWorker;
  const engine=document.getElementById('chess-engine').textContent;
  const protocol=document.getElementById('chess-worker').textContent;
  chessWorkerURL=URL.createObjectURL(new Blob([engine,'\n',protocol],{type:'text/javascript'}));
  const worker=new Worker(chessWorkerURL);
  chessWorker=worker;
  worker.onmessage=({data})=>{
    const request=searchRequest;
    if(worker!==chessWorker||!request||data.id!==request.id)return;
    if(data.kind==='progress'){
      if(request.onProgress)request.onProgress(data.depth,data.elapsed);
    }else if(data.kind==='move'){
      searchRequest=null;
      request.onDone(data.move,data.depth,data.score);
    }
  };
  worker.onerror=event=>{
    if(worker!==chessWorker)return;
    event.preventDefault();
    workerFailed();
  };
  worker.onmessageerror=()=>{if(worker===chessWorker)workerFailed();};
  return worker;
}

async function _findBestMove(color,timeLimit,onProgress,onDone){
  cancelAISearch();
  const job={release:null};
  scheduledSearch=job;
  const release=await wall.acquireSearchSlot();
  if(scheduledSearch!==job){release();return;}
  job.release=release;
  const searchStarted=performance.now();
  function complete(move,depth,score){
    if(scheduledSearch!==job)return;
    scheduledSearch=null;
    release();
    onDone(move,depth,Math.round(performance.now()-searchStarted),score);
  }
  runBoardSearch(color,timeLimit,onProgress,complete);
}
function runBoardSearch(color,timeLimit,onProgress,onDone){
  const halfMoveClock=autoBattleActive?_autoBattleLog.halfMoveClock:0;
  const ply=autoBattleActive?_autoBattleLog.moves.length+1:0;
  const seenOpeningMoves=ply>1&&ply<=wall.openingPlies&&!isInCheck(color)
    ?new Set(allAIMoves(color).filter(move=>wall.hasOpeningPosition(ply,openingLayout(move,color))).map(aiMoveId))
    :null;
  if(workerUnavailable||typeof Worker==='undefined'){
    searchChessPosition(color,timeLimit,onProgress,onDone,halfMoveClock,seenOpeningMoves);
    return;
  }
  const id=++nextSearchId;
  searchRequest={id,color,timeLimit,onProgress,onDone,halfMoveClock,seenOpeningMoves};
  const position=board.map(row=>row.map(piece=>piece?{
    type:piece.type,color:piece.color,hasMoved:piece.hasMoved,_castled:piece._castled
  }:null));
  try{
    getChessWorker().postMessage({id,color,timeLimit,position,enPassant:enPassantTarget,
      isBattle:autoBattleActive,history:autoBattleActive?_autoPosHist:{},halfMoveClock,seenOpeningMoves});
  }catch{
    workerFailed();
  }
}

// Globe rotation animation
let globeRotAnim=null;
function rotateGlobeToFace(localDir,dur,onDone){
  const worldDir=localDir.clone().normalize().applyQuaternion(globe.quaternion);
  if(worldDir.z>0.88){if(onDone)onDone();return;}
  const Qr=new THREE.Quaternion().setFromUnitVectors(worldDir,new THREE.Vector3(0,0,1));
  const endQ=new THREE.Quaternion().multiplyQuaternions(Qr,globe.quaternion);
  // In background: skip animation, snap instantly
  if(document.hidden){globe.quaternion.copy(endQ);if(onDone)onDone();return;}
  globeRotAnim={startQ:globe.quaternion.clone(),endQ,t:0,dur:dur||650,onDone};
}
