<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Globe Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow: hidden; }
  body {
    background: radial-gradient(circle at center, #c8c8c8 0%, #a0a0a0 40%, #707070 75%, #404040 100%);
    overflow: hidden;
    cursor: grab; user-select: none;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
  }
  body.dragging { cursor: grabbing; }
  canvas {
    display: block; touch-action: none;
    position: fixed; top: 0; left: 0;
    width: 100vw !important; height: 100vh !important;
  }
  /* ── Shared UI button base ── */
  .ui-btn {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer;
    padding:0; margin:0; opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none;
    pointer-events:auto; white-space:nowrap; display:block;
    text-align:left;
  }
  .ui-btn:hover { opacity:1; }
  /* ── Turn indicator (top center) ── */
  #turn {
    position:fixed; top:28px; left:50%; transform:translateX(-50%);
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff; opacity:0.85;
    pointer-events:none; z-index:100; white-space:nowrap;
  }
  /* ── AI toggle (top left) ── */
  #aiWrap {
    position:fixed; top:28px; left:28px;
    display:flex; align-items:center; gap:9px;
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none; z-index:100;
  }
  #aiWrap:hover { opacity:1; }
  #aiSwitch { position:relative; width:36px; height:20px; cursor:pointer; flex-shrink:0; }
  #aiSwitch input { display:none; }
  #aiTrack { position:absolute; inset:0; border-radius:10px; background:rgba(255,255,255,0.3); transition:background .25s; }
  #aiSwitch input:checked ~ #aiTrack { background:rgba(255,255,255,0.7); }
  #aiThumb { position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%;
    background:#fff; transition:transform .25s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  #aiSwitch input:checked ~ #aiThumb { transform:translateX(16px); }
  /* ── New Game (top right) ── */
  #newGameBtn {
    position:fixed; top:28px; right:28px;
    z-index:100; pointer-events:auto;
  }
  /* ── Test Mode (bottom left) ── */
  #testBtn {
    position:fixed; bottom:28px; left:28px;
    z-index:100; pointer-events:auto;
  }
  #testBtn.active { opacity:1; color:#fff; }
  /* ── Test panel (plain text, bottom left, above test button) ── */
  #testPanel {
    display:none; position:fixed; bottom:46px; left:28px;
    z-index:200; pointer-events:auto;
    background:none; border-radius:0; padding:0; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    flex-direction:column; align-items:flex-start; gap:4px;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    white-space:nowrap;
  }
  #testPanel.visible { display:flex; }
  #testPanelTitle {
    font-size:11px; letter-spacing:normal; color:#fff; opacity:0.4;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    margin-bottom:2px;
  }
  .test-row { display:flex; align-items:center; gap:3px; }
  .test-row-label {
    font-size:11px; letter-spacing:normal; color:#fff; opacity:0.4; width:auto;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    margin-right:4px;
  }
  .test-pieces { display:flex; gap:1px; }
  .tpb {
    width:auto; height:auto; border-radius:0; border:none;
    background:none; cursor:pointer; font-size:11px; font-weight:400;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    color:#fff; transition:opacity .15s; pointer-events:auto;
    display:inline-flex; align-items:center; justify-content:center;
    opacity:0.3; padding:1px 3px;
  }
  .tpb[data-color="black"] { background:none; color:#fff; border-color:transparent; }
  .tpb.sel { opacity:1; }
  .tpb:hover { opacity:0.7; }
  #testStartBtn {
    align-self:flex-start; padding:0; border-radius:0;
    border:none; background:none; color:#fff;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    font-size:11px; letter-spacing:normal; cursor:pointer; pointer-events:auto;
    opacity:0.4; transition:opacity .2s; margin-top:2px;
  }
  #testStartBtn:hover { opacity:1; }
  #testStartBtn:disabled { opacity:0.15; cursor:default; }
  /* Check flash overlay on king */
  .check-ring { pointer-events:none; }
  /* hidden controls */
  #coordWrap { display:none; }
  #toggleWrap { display:none; }
  #bottomLeft { display:none; }
  /* ── Battle area (bottom right) ── */
  #battleArea {
    position:fixed; bottom:28px; right:28px;
    display:flex; flex-direction:column; align-items:flex-end;
    gap:4px; z-index:100; pointer-events:auto;
  }
  #autoBattleBtn {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.5; transition:opacity .2s;
    user-select:none; -webkit-user-select:none;
    pointer-events:auto; white-space:nowrap;
  }
  #autoBattleBtn:hover { opacity:1; }
  #autoBattleControls {
    display:none; flex-direction:column; align-items:flex-end; gap:4px;
  }
  #autoBattleControls button {
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.5; transition:opacity .2s;
    pointer-events:auto; white-space:nowrap; display:block;
  }
  #autoBattleControls button:hover { opacity:1; }
  #autoPauseBtn { opacity:0.85; }
  /* ── Report Modal ── */
  #reportModal {
    display:none; position:fixed; inset:0; z-index:600;
    background:rgba(0,0,0,0.84); justify-content:center; align-items:center;
    pointer-events:auto;
  }
  #reportModal.visible { display:flex; }
  #reportBox {
    background:#f4f4f4; border-radius:16px;
    width:min(660px,93vw); max-height:84vh;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 28px 90px rgba(0,0,0,0.6);
  }
  #reportHead {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 20px 10px; border-bottom:1px solid #ddd;
    font-family:'Times New Roman',Times,serif; font-style:italic;
    font-size:11px; letter-spacing:normal; color:#444; flex-shrink:0;
  }
  #reportHead .rh-btns { display:flex; gap:14px; }
  #reportHead button {
    font-family:'Times New Roman',Times,serif; font-size:10px; font-style:italic;
    letter-spacing:normal; color:#000; background:none; border:none;
    cursor:pointer; padding:0; opacity:0.4; transition:opacity .2s;
    pointer-events:auto;
  }
  #reportHead button:hover { opacity:1; }
  #reportText {
    flex:1; font-family:'SF Mono','Menlo','Courier New',monospace; font-size:11px;
    line-height:1.68; padding:14px 18px; background:#ebebeb;
    border:none; outline:none; resize:none; cursor:pointer;
    overflow-y:auto; color:#1a1a1a; -webkit-overflow-scrolling:touch;
  }
  /* ── Per-panel battle info overlay ── */
  #panelInfo { display:none; position:fixed; inset:0; pointer-events:none; z-index:60; }
  #panelInfo .pi {
    position:absolute; transform:translateX(-50%);
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff; opacity:0.75;
    white-space:nowrap;
  }
  /* ── Battle selector: all right-aligned at bottom right ── */
  #splitRow {
    position:fixed; bottom:64px; right:28px;
    display:none; flex-direction:row; gap:8px; align-items:center;
    z-index:100; pointer-events:auto; white-space:nowrap;
  }
  #battleStartBtn {
    position:fixed; bottom:28px; right:28px;
    display:none;
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.85; transition:opacity .2s;
    pointer-events:auto; white-space:nowrap; z-index:100;
  }
  #battleStartBtn:hover { opacity:1; }
  #battleCancelBtn {
    position:fixed; bottom:46px; right:28px;
    display:none;
    font-family:'Times New Roman',Times,serif; font-size:11px;
    font-weight:400; font-style:italic; letter-spacing:normal; color:#fff;
    background:none; border:none; cursor:pointer; padding:0;
    opacity:0.5; transition:opacity .2s;
    pointer-events:auto; white-space:nowrap; z-index:100;
  }
  #battleCancelBtn:hover { opacity:1; }
  #splitLabel {
    font-family:'Times New Roman',Times,serif; font-size:11px; font-style:italic;
    letter-spacing:normal; color:#fff; opacity:0.5; pointer-events:none;
  }
  .spb {
    font-family:'Times New Roman',Times,serif; font-size:11px; font-style:italic;
    letter-spacing:normal; color:#fff; background:none; border:none;
    cursor:pointer; padding:0; opacity:0.3; transition:opacity .2s;
    pointer-events:auto; white-space:nowrap;
  }
  .spb.sel { opacity:0.9; }
  .spb:hover { opacity:1; }
  #mvLines {
    display:none; position:fixed; inset:0; pointer-events:none; z-index:50;
  }
  #mvLines.mv2 { display:block;
    background:linear-gradient(180deg,transparent calc(50% - 1px),rgba(255,255,255,0.2) calc(50% - 1px),rgba(255,255,255,0.2) calc(50% + 1px),transparent calc(50% + 1px));
  }
  #mvLines.mv4 { display:block;
    background:
      linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,0.2) calc(50% - 1px),rgba(255,255,255,0.2) calc(50% + 1px),transparent calc(50% + 1px)),
      linear-gradient(180deg,transparent calc(50% - 1px),rgba(255,255,255,0.2) calc(50% - 1px),rgba(255,255,255,0.2) calc(50% + 1px),transparent calc(50% + 1px));
  }
  #mvLines.mv6 { display:block;
    background:
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,0.2) calc(50% - 1px), rgba(255,255,255,0.2) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(180deg, transparent calc(33.33% - 1px), rgba(255,255,255,0.2) calc(33.33% - 1px), rgba(255,255,255,0.2) calc(33.33% + 1px), transparent calc(33.33% + 1px), transparent calc(66.66% - 1px), rgba(255,255,255,0.2) calc(66.66% - 1px), rgba(255,255,255,0.2) calc(66.66% + 1px), transparent calc(66.66% + 1px));
  }
</style>
</head>
<body>
<div id="turn">White to move</div>
<button id="newGameBtn" class="ui-btn" onclick="resetGame()">New game</button>
<button id="testBtn" class="ui-btn" onclick="toggleTestMode()">Test mode</button>

<!-- Test piece selector panel -->
<div id="testPanel">
  <div id="testPanelTitle">Select pieces to test</div>
  <div class="test-row">
    <div class="test-row-label">White</div>
    <div class="test-pieces">
      <button class="tpb" data-type="K" data-color="white">K</button>
      <button class="tpb" data-type="Q" data-color="white">Q</button>
      <button class="tpb" data-type="R" data-color="white">R</button>
      <button class="tpb" data-type="B" data-color="white">B</button>
      <button class="tpb" data-type="N" data-color="white">N</button>
      <button class="tpb" data-type="P" data-color="white">P</button>
    </div>
  </div>
  <div class="test-row">
    <div class="test-row-label">Black</div>
    <div class="test-pieces">
      <button class="tpb" data-type="K" data-color="black">K</button>
      <button class="tpb" data-type="Q" data-color="black">Q</button>
      <button class="tpb" data-type="R" data-color="black">R</button>
      <button class="tpb" data-type="B" data-color="black">B</button>
      <button class="tpb" data-type="N" data-color="black">N</button>
      <button class="tpb" data-type="P" data-color="black">P</button>
    </div>
  </div>
  <button id="testStartBtn" disabled onclick="startTestWithSelection()">Start</button>
</div>
<!-- Split selector row — bottom left (shown during selector mode) -->
<div id="splitRow">
  <span id="splitLabel">Split</span>
  <button class="spb sel" data-v="0" onclick="setSplitView(0)">1</button>
  <button class="spb" data-v="2" onclick="setSplitView(2)">2</button>
  <button class="spb" data-v="4" onclick="setSplitView(4)">4</button>
  <button class="spb" data-v="6" onclick="setSplitView(6)">6</button>
</div>
<!-- Start button — bottom right (shown during selector mode) -->
<button id="battleStartBtn" onclick="startAutoBattle()">Start</button>
<!-- Cancel button — bottom centre (shown during selector mode) -->
<button id="battleCancelBtn" onclick="closeBattleSelector()">Cancel</button>
<!-- Battle area (bottom right) -->
<div id="battleArea">
  <!-- Idle state -->
  <button id="autoBattleBtn" onclick="openBattleSelector()">Watch AI battle</button>
  <!-- Active battle controls -->
  <div id="autoBattleControls">
    <button id="autoPauseBtn" onclick="toggleAutoPause()">Pause</button>
    <button onclick="newAutoBattle()">Reset</button>
    <button onclick="stopAutoBattle()">Quit</button>
  </div>
</div>
<!-- Split-screen grid separator lines (z-index 50, pointer-events none) -->
<div id="mvLines"></div>
<!-- Per-panel battle info overlay (z-index 60, pointer-events none) -->
<div id="panelInfo"></div>
<!-- Report Modal -->
<div id="reportModal">
  <div id="reportBox">
    <div id="reportHead">
      <span>Battle report</span>
      <div class="rh-btns">
        <button id="copyReportBtn" onclick="copyReport()">Copy all</button>
        <button onclick="closeReport()">Close</button>
      </div>
    </div>
    <textarea id="reportText" readonly onclick="this.select()"></textarea>
  </div>
</div>
<!-- AI opponent toggle (top left) -->
<div id="aiWrap">
  <label id="aiSwitch">
    <input type="checkbox" id="aiToggle">
    <div id="aiTrack"></div>
    <div id="aiThumb"></div>
  </label>
  <span>AI opponent</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputEncoding     = THREE.sRGBEncoding;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 2000);
camera.position.set(0, 0, innerWidth < 768 ? 5.5 : 4.2);

// ─── Environment (cube camera) ────────────────────────────────────────────────
const envDome = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vDir;
      float rbox(vec3 d,vec3 c,vec3 u,vec3 r,float hw,float hh,float es){
        vec3 cn=normalize(c); float fwd=dot(d,cn); if(fwd<0.0)return 0.0;
        vec3 t=d-cn*fwd;
        float uu=dot(t,normalize(r))/max(fwd,0.001);
        float vv=dot(t,normalize(u))/max(fwd,0.001);
        return (1.0-smoothstep(hw-es,hw+es,abs(uu)))*(1.0-smoothstep(hh-es,hh+es,abs(vv)))*smoothstep(0.3,0.7,fwd);
      }
      void main(){
        float y=vDir.y;
        vec3 col=mix(vec3(0.82),vec3(0.98),smoothstep(-1.0,1.0,y));
        col+=vec3(rbox(vDir,vec3(-0.7,0.55,0.45),vec3(0,1,0),vec3(0,0,1),0.55,0.42,0.38)*0.92);
        col+=vec3(rbox(vDir,vec3(0.65,0.40,0.65),vec3(0,1,0),vec3(1,0,0),0.45,0.32,0.32)*0.70);
        col+=vec3(rbox(vDir,vec3(0.2,-0.35,-0.92),vec3(0,1,0),vec3(1,0,0),0.60,0.20,0.28)*0.55);
        gl_FragColor=vec4(min(col,vec3(1.0)),1.0);
      }
    `,
  })
);
scene.add(envDome);

const cubeRT = new THREE.WebGLCubeRenderTarget(512, {
  format: THREE.RGBFormat, generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter, encoding: THREE.sRGBEncoding,
});
const cubeCamera = new THREE.CubeCamera(1, 1500, cubeRT);
scene.add(cubeCamera);
cubeCamera.update(renderer, scene);
envDome.visible = false;

// ─── Lights ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.275));
const kl=new THREE.DirectionalLight(0xffffff,1.4); kl.position.set(-7,8,3);  scene.add(kl);
const fl=new THREE.DirectionalLight(0xffffff,0.5); fl.position.set(-3,6,3);  scene.add(fl);
const rl=new THREE.DirectionalLight(0xffffff,0.06); rl.position.set(4,-4,-4); scene.add(rl);

// ─── Globe Materials ──────────────────────────────────────────────────────────
const PLASTIC={roughness:0.45,metalness:0.0};
const matW=new THREE.MeshStandardMaterial({color:0x333333,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.2});
const matB=new THREE.MeshStandardMaterial({color:0x111111,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.2});
const matG=new THREE.MeshStandardMaterial({color:0x222222,...PLASTIC,envMap:cubeRT.texture,envMapIntensity:1.0});

// ─── Globe ────────────────────────────────────────────────────────────────────
const R=1;
const NUM_LAT=8, NUM_LON=8;
const CAP_THETA=Math.PI/18;
const BAND_THETA=(Math.PI-2*CAP_THETA)/NUM_LAT;
const globe=new THREE.Group(); scene.add(globe);

// Polar caps
const capN=new THREE.Mesh(new THREE.SphereGeometry(R,64,24,0,Math.PI*2,0,CAP_THETA),matG); globe.add(capN);
const capS=new THREE.Mesh(new THREE.SphereGeometry(R,64,24,0,Math.PI*2,Math.PI-CAP_THETA,CAP_THETA),matG); globe.add(capS);

// Depth occluder: invisible BackSide sphere. The front-side cell tiles do not cover the far
// hemisphere's depth buffer (they're back-face-culled), so pieces on the back of the globe
// pass the depth test and bleed through. This hidden sphere fills the far hemisphere's depth
// buffer and occludes any pieces behind the globe surface.
const _depthOccluder=new THREE.Mesh(
  new THREE.SphereGeometry(R*0.998,48,32),
  new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,side:THREE.BackSide})
);
globe.add(_depthOccluder);

// Cell meshes — renderOrder:-1 so globe geometry ALWAYS writes depth before chess pieces
// (renderOrder 0) test it. This guarantees pieces behind the sphere fail depth test.
const cellMeshes=[];
for(let lat=0;lat<NUM_LAT;lat++){
  for(let lon=0;lon<NUM_LON;lon++){
    const geo=new THREE.SphereGeometry(R,28,14,(lon/NUM_LON)*Math.PI*2,(Math.PI*2)/NUM_LON,CAP_THETA+lat*BAND_THETA,BAND_THETA);
    const mesh=new THREE.Mesh(geo,(lat+lon)%2===0?matW:matB);
    mesh.renderOrder=-1;
    mesh.userData={isCellMesh:true,lat,lon};
    globe.add(mesh);
    cellMeshes.push(mesh);
  }
}
capN.renderOrder=-1; capS.renderOrder=-1; _depthOccluder.renderOrder=-1;

// ─── Board State ──────────────────────────────────────────────────────────────
const board=Array.from({length:8},()=>Array(8).fill(null));

function cellPos(lat,lon,r=R*1.12){
  const theta=CAP_THETA+(lat+0.5)*BAND_THETA;
  const phi=((lon+0.5)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}
function cornerPos3D(latB,lonB,r=R*1.019){
  const theta=latB===0?CAP_THETA:latB===8?Math.PI-CAP_THETA:CAP_THETA+latB*BAND_THETA;
  const phi=((lonB)/NUM_LON)*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi));
}

// ─── Piece Materials ──────────────────────────────────────────────────────────
const matLight=new THREE.MeshStandardMaterial({color:0x444444,roughness:0.45,metalness:0.0,envMap:cubeRT.texture,envMapIntensity:1.2});
const matDark=new THREE.MeshStandardMaterial({color:0x000000,roughness:0.45,metalness:0.0,envMap:cubeRT.texture,envMapIntensity:1.2});

// ─── Letter Texture ───────────────────────────────────────────────────────────
function makeLetterTex(letter,isBlack){
  const S=512;
  const cv=document.createElement('canvas');
  cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,S,S);
  ctx.font=`bold ${Math.round(S*0.62)}px "New York","Times New Roman",Times,serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const cx=S/2, cy=S/2+S*0.04;
  // Foggy glow edge
  const glowCol=isBlack?'rgba(255,255,255,1)':'rgba(0,0,0,1)';
  ctx.fillStyle=glowCol;
  ctx.shadowColor=glowCol;
  ctx.shadowBlur=28;
  for(let i=0;i<6;i++) ctx.fillText(letter,cx,cy);
  // Pure color letter on top
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';
  ctx.fillStyle=isBlack?'#000000':'#ffffff';
  ctx.fillText(letter,cx,cy);
  return new THREE.CanvasTexture(cv);
}

const allSprites=[];
const _pieceUp=new THREE.Vector3(0,1,0);
const u=0.062;

// ─── Piece Mesh ───────────────────────────────────────────────────────────────
function createPieceMesh(type,isBlack){
  const g=new THREE.Group();
  const mat=isBlack?matDark:matLight;
  const hMin=u*4.5, hMax=u*7.5, step=(hMax-hMin)/4;
  const heights={'P':hMin*1.2,'R':hMin+step*2.3,'N':hMin+step*2,'B':hMax*0.5*1.25,'Q':hMax,'K':hMax};
  const r=u*1.65, h=heights[type]||hMin+step*2;
  let cyl;

  if(type==='P'){
    const eggR=r*0.85*1.2;
    cyl=new THREE.Mesh(new THREE.SphereGeometry(eggR,32,24),mat);
    cyl.scale.y=hMin*1.2/(2*eggR);
  } else if(type==='K'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.115,r*0.05,h,32),mat);
  } else if(type==='B'){
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(r,32,16,0,Math.PI*2,0,Math.PI/2),mat);
    dome.scale.y=1.5;
    dome.position.y=h/2;
    cyl.add(dome);
  } else if(type==='Q'){
    const rTop=r, rBot=r*1.10, waist=r*0.52;
    const pts=[];
    const N=40;
    for(let i=0;i<=N;i++){
      const t=i/N;
      const rad=rBot+(rTop-rBot)*t - waist*Math.sin(Math.PI*t);
      pts.push(new THREE.Vector2(Math.max(rad,r*0.18), t*h - h/2));
    }
    const geo=new THREE.LatheGeometry(pts,40);
    cyl=new THREE.Mesh(geo,mat);
    const topCap=new THREE.Mesh(new THREE.CircleGeometry(rTop,40),mat);
    topCap.rotation.x=-Math.PI/2; topCap.position.y=h/2;
    const botCap=new THREE.Mesh(new THREE.CircleGeometry(rBot,40),mat);
    botCap.rotation.x=Math.PI/2; botCap.position.y=-h/2;
    cyl.add(topCap); cyl.add(botCap);
  } else if(type==='N'){
    const W=r*2.6, H=h, d=W*0.618;
    const crTR=H*0.32;
    const crBL=H*0.45;
    const yB=-H/2, yT=H/2;
    const xOff=-crBL/2;
    const shape=new THREE.Shape();
    shape.moveTo(xOff-W/2+crBL, yB);
    shape.lineTo(xOff+W/2,      yB);
    shape.lineTo(xOff+W/2,      yT-crTR);
    shape.quadraticCurveTo(xOff+W/2, yT, xOff+W/2-crTR, yT);
    shape.lineTo(xOff-W/2,      yT);
    shape.lineTo(xOff-W/2,      yB+crBL);
    shape.quadraticCurveTo(xOff-W/2+crBL, yB+crBL, xOff-W/2+crBL, yB);
    shape.closePath();
    const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSize:r*0.04,bevelThickness:r*0.04,bevelSegments:3});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.z=-d/2;
    const wrapper=new THREE.Group();
    wrapper.add(mesh);
    wrapper.rotation.y=0;
    cyl=wrapper;
  } else {
    cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.10,h,32),mat);
  }

  cyl.position.y=h/2;
  cyl.userData={isPiece:true};
  g.add(cyl);

  // Letter sprite
  const spMat=new THREE.SpriteMaterial({map:makeLetterTex(type,isBlack),transparent:true,depthTest:true,depthWrite:false,sizeAttenuation:true});
  const sp=new THREE.Sprite(spMat);
  sp.raycast=()=>{};
  const sz=r*1.1;
  sp.scale.set(sz,sz,sz);
  const domeExtra=(type==='B')?(0.48-h-sz*0.5):(type==='N')?-sz*0.05:(type==='P')?-sz*0.05:0;
  sp.position.y=h+sz*0.5+domeExtra;
  g.add(sp);
  return g;
}

// ─── Blob Shadow ──────────────────────────────────────────────────────────────
function createBlobGroup(){
  const r=u*1.65;
  const bS=256;
  const bCv=document.createElement('canvas'); bCv.width=bCv.height=bS;
  const bCtx=bCv.getContext('2d');
  const bGrad=bCtx.createRadialGradient(bS/2,bS/2,0,bS/2,bS/2,bS/2);
  bGrad.addColorStop(0,   'rgba(0,0,0,0.48)');
  bGrad.addColorStop(0.35,'rgba(0,0,0,0.32)');
  bGrad.addColorStop(0.65,'rgba(0,0,0,0.12)');
  bGrad.addColorStop(1,   'rgba(0,0,0,0.00)');
  bCtx.fillStyle=bGrad; bCtx.fillRect(0,0,bS,bS);
  const mat=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bCv),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  const circle=new THREE.Mesh(new THREE.CircleGeometry(r*1.3,32),mat);
  circle.raycast=()=>{};
  circle.rotation.x=-Math.PI/2;
  circle.position.y=0.002;
  const grp=new THREE.Group();
  grp.add(circle);
  return grp;
}

function orientPiece(obj,pos){
  obj.quaternion.setFromUnitVectors(_pieceUp,pos.clone().normalize());
}

// Knight facing toward pole
const _faceV1=new THREE.Vector3(), _faceV2=new THREE.Vector3();
function faceKnightTowardPole(group,pos,towardNorth){
  const radial=pos.clone().normalize();
  const poleWorld=new THREE.Vector3(0,towardNorth?1:-1,0);
  _faceV1.copy(poleWorld).addScaledVector(radial,-radial.dot(poleWorld));
  if(_faceV1.lengthSq()<1e-5)return;
  _faceV1.normalize();
  _faceV2.copy(_faceV1).applyQuaternion(group.quaternion.clone().conjugate());
  // Back cap (+Z) faces pole: Ry(α) Z_new=(sinα,0,cosα). sinα=tx,cosα=tz → α=atan2(tx,tz)+π/2
  const angle=Math.atan2(_faceV2.x,_faceV2.z)+Math.PI/2;
  group.children.forEach(c=>{if(c.isGroup)c.rotation.y=angle;});
}

function placePiece(type,isBlack,lat,lon){
  const group=createPieceMesh(type,isBlack);
  const pos=cellPos(lat,lon,R);
  group.position.copy(pos);
  orientPiece(group,pos);
  if(type==='N') faceKnightTowardPole(group,pos,!isBlack);
  group.userData={isPiece:true,lat,lon};
  globe.add(group);
  allSprites.push(group);
  const blob=createBlobGroup();
  blob.position.copy(pos);
  orientPiece(blob,pos);
  globe.add(blob);
  board[lat][lon]={type,color:isBlack?'black':'white',sprite:group,blob,hasMoved:false};
}

// ─── Move Rules ───────────────────────────────────────────────────────────────
function wL(n){return((n%8)+8)%8;}
function poleRef(l,n){
  if(l<0) return{l:-1-l,n:wL(n+4),pole:'N'};
  if(l>7) return{l:15-l, n:wL(n+4),pole:'S'};
  return{l,n,pole:null};
}

function getValidMoves(lat,lon){
  const piece=board[lat][lon];
  if(!piece)return[];
  const{type,color}=piece;
  const moves=[];
  function ok(l){return l>=0&&l<=7;}
  function ally(l,n){return ok(l)&&board[l][n]&&board[l][n].color===color;}
  function enemy(l,n){return ok(l)&&board[l][n]&&board[l][n].color!==color;}

  function straight(dl,dn){
    const key=`S${dl},${dn}`;
    let l=lat,n=lon,step=0,curDl=dl,pole=null;
    for(let i=0;i<15;i++){
      l+=curDl; n=wL(n+dn); step++;
      if(dl!==0&&(l<0||l>7)){
        if(pole)break;
        const r=poleRef(l,n);l=r.l;n=r.n;curDl=-curDl;pole=r.pole;
      }else if(dl===0&&!ok(l))break;
      if(!ok(l))break;
      if(ally(l,n))break;
      moves.push({lat:l,lon:n,diagKey:null,diagWP:null,straightKey:key,straightDl:dl,straightDn:dn,step,pole});
      if(enemy(l,n))break;
    }
  }

  function diag(initDl,initDn){
    const key=`${initDl},${initDn}`;
    let l=lat,n=lon,cDl=initDl,cDn=initDn;
    const wp=[];
    for(let i=0;i<14;i++){
      const nb=n; l+=cDl; n=wL(n+cDn);
      if(l<0){l=0;n=wL(nb+4);cDl=1;cDn=-cDn;}
      else if(l>7){l=7;n=wL(nb+4);cDl=-1;cDn=-cDn;}
      if(ally(l,n))break;
      wp.push(cellPos(l,n,R*1.019));
      moves.push({lat:l,lon:n,diagKey:key,diagWP:wp.slice(),straightKey:null,step:i+1});
      if(enemy(l,n))break;
    }
  }

  if(type==='R'||type==='Q'){straight(1,0);straight(-1,0);straight(0,1);straight(0,-1);}
  if(type==='B'||type==='Q'){diag(1,1);diag(1,-1);diag(-1,1);diag(-1,-1);}

  if(type==='N'){
    for(const[dl,dn]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){
      let l=lat+dl,n=wL(lon+dn);
      const longLat=Math.abs(dl)===2;
      const elbowLat=longLat?lat+dl:lat;
      const elbowLon=longLat?lon:wL(lon+dn);
      if(l<0||l>7){const r=poleRef(l,n);l=r.l;n=r.n;}
      if(ok(l)&&!ally(l,n))moves.push({lat:l,lon:n,diagKey:null,diagWP:null,straightKey:null,isKnight:true,longLat,elbowLat,elbowLon});
    }
  }

  if(type==='K'){
    for(let dl=-1;dl<=1;dl++)for(let dn=-1;dn<=1;dn++){
      if(!dl&&!dn)continue;
      let l=lat+dl, n=wL(lon+dn);
      if(l<0||l>7){
        // All 3 "over-pole" directions converge to the same cell (pre-step lon+4).
        // Add all 3 so visualization draws straight line + figure-8 loxodrome.
        const refL=l<0?-1-l:15-l;
        const refN=wL(lon+4); // pre-step lon+4 (same destination for all 3)
        const pole=l<0?'N':'S';
        if(ally(refL,refN))continue;
        if(dn===0){
          // Straight through pole (added first → used by execMove animation)
          moves.push({lat:refL,lon:refN,diagKey:null,diagWP:null,
            straightKey:`S${dl},0`,straightDl:dl,straightDn:0,step:1,pole});
        } else {
          // Diagonal through pole: lDiff=4 triggers loxodrome isPole → draws figure-8
          moves.push({lat:refL,lon:refN,diagKey:`${dl},${dn}`,
            diagWP:[cellPos(refL,refN,R*1.019)],straightKey:null});
        }
        continue;
      }
      if(!ok(l)||ally(l,n))continue;
      if(dl!==0&&dn!==0){
        moves.push({lat:l,lon:n,diagKey:`${dl},${dn}`,diagWP:[cellPos(l,n,R*1.019)],straightKey:null});
      } else {
        moves.push({lat:l,lon:n,diagKey:null,diagWP:null,
          straightKey:`S${dl},${dn}`,straightDl:dl,straightDn:dn,step:1,pole:null});
      }
    }
    // Castling (piece.hasMoved checked; check-safety handled by getLegalMoves)
    if(!piece.hasMoved){
      // Queenside: K lon3→lon1, R lon0→lon2; squares 1,2 must be empty
      const rQ=board[lat][0];
      if(rQ?.type==='R'&&!rQ.hasMoved&&rQ.color===color&&!board[lat][1]&&!board[lat][2])
        moves.push({lat,lon:1,diagKey:null,diagWP:null,straightKey:null,isCastle:true,rookFromLon:0,rookToLon:2,passThroughLon:2});
      // Kingside: K lon3→lon5, R lon7→lon4; squares 4,5,6 must be empty
      const rK=board[lat][7];
      if(rK?.type==='R'&&!rK.hasMoved&&rK.color===color&&!board[lat][4]&&!board[lat][5]&&!board[lat][6])
        moves.push({lat,lon:5,diagKey:null,diagWP:null,straightKey:null,isCastle:true,rookFromLon:7,rookToLon:4,passThroughLon:4});
    }
  }

  if(type==='P'){
    const dir=color==='black'?1:-1,start=color==='black'?1:6;
    const fl=lat+dir;
    if(ok(fl)&&!board[fl][lon]){
      moves.push({lat:fl,lon:lon,diagKey:null,diagWP:null,straightKey:null});
      if(lat===start&&!board[fl+dir]?.[lon])
        moves.push({lat:fl+dir,lon:lon,diagKey:null,diagWP:null,straightKey:null});
    }
    for(const cn of[wL(lon-1),wL(lon+1)])
      if(ok(fl)&&board[fl][cn]?.color!==color&&board[fl][cn])
        moves.push({lat:fl,lon:cn,diagKey:null,diagWP:null,straightKey:null});
    // En passant
    if(enPassantTarget&&ok(fl))
      for(const cn of[wL(lon-1),wL(lon+1)])
        if(fl===enPassantTarget.lat&&cn===enPassantTarget.lon)
          moves.push({lat:fl,lon:cn,diagKey:null,diagWP:null,straightKey:null,isEnPassant:true,capturedLat:lat,capturedLon:cn});
  }
  return moves;
}

// ─── Check Detection ──────────────────────────────────────────────────────────
function isInCheck(color){
  let kLat=-1,kLon=-1;
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
    if(board[la][lo]?.type==='K'&&board[la][lo]?.color===color){kLat=la;kLon=lo;}
  if(kLat===-1)return false;
  const opp=color==='white'?'black':'white';
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p||p.color!==opp)continue;
    if(p.type==='P'){
      // Pawns threaten diagonals regardless of occupancy
      const dir=p.color==='black'?1:-1;
      if(la+dir===kLat&&(wL(lo-1)===kLon||wL(lo+1)===kLon))return true;
    } else {
      if(aiMoves(la,lo).some(m=>m.tLat===kLat&&m.tLon===kLon))return true;
    }
  }
  return false;
}

function getLegalMoves(lat,lon){
  const piece=board[lat][lon]; if(!piece)return[];
  const raw=getValidMoves(lat,lon);
  return raw.filter(m=>{
    // Castling: king must not currently be in check, nor pass through a checked square
    if(m.isCastle){
      if(isInCheck(piece.color))return false;
      const tmp=board[lat][m.passThroughLon];
      board[lat][m.passThroughLon]=piece; board[lat][lon]=null;
      const thru=isInCheck(piece.color);
      board[lat][lon]=piece; board[lat][m.passThroughLon]=tmp||null;
      if(thru)return false;
    }
    // En passant: temporarily remove the captured pawn for check simulation
    let epSave=null;
    if(m.isEnPassant){epSave=board[m.capturedLat][m.capturedLon]; board[m.capturedLat][m.capturedLon]=null;}
    const cap=board[m.lat][m.lon];
    board[m.lat][m.lon]=piece; board[lat][lon]=null;
    const safe=!isInCheck(piece.color);
    board[lat][lon]=piece; board[m.lat][m.lon]=cap||null;
    if(m.isEnPassant&&epSave)board[m.capturedLat][m.capturedLon]=epSave;
    return safe;
  });
}

function hasAnyLegalMove(color){
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    if(board[la][lo]?.color!==color)continue;
    if(getLegalMoves(la,lo).length>0)return true;
  }
  return false;
}

// ─── Check Ring Visual ────────────────────────────────────────────────────────
let checkRingObjs=[];
function clearCheckRing(){
  checkRingObjs.forEach(o=>globe.remove(o));
  checkRingObjs=[];
}
function showCheckRing(lat,lon){
  clearCheckRing();
  const center=cellPos(lat,lon,R*1.006);
  const radial=center.clone().normalize();
  const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
  const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
  const rr=BAND_THETA*R*0.14;
  for(let ring=0;ring<2;ring++){
    const N=64; const pts=[];
    const rOff=rr*(1+ring*0.55);
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*rOff).addScaledVector(t2,Math.sin(a)*rOff);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.007,8,true);
    geo.computeBoundingSphere();
    const mat=new THREE.MeshBasicMaterial({color:0xcc0000,depthTest:true,depthWrite:false,
      polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8,transparent:true,opacity:0.85-ring*0.3});
    const mesh=new THREE.Mesh(geo,mat); mesh.renderOrder=5; mesh.frustumCulled=false;
    globe.add(mesh); checkRingObjs.push(mesh);
  }
}

// ─── Check Threat Visualization ───────────────────────────────────────────────
// Shows the attack path(s) from threatening piece(s) to the king.
// Uses computeAnimPath so diagonals, knights, pole-crossings all look correct.
function showCheckThreats(color){
  let kLat=-1,kLon=-1;
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
    if(board[la][lo]?.type==='K'&&board[la][lo]?.color===color){kLat=la;kLon=lo;}
  if(kLat===-1)return;
  const opp=color==='white'?'black':'white';
  const redMat=()=>new THREE.MeshBasicMaterial({color:0x880000,depthTest:true,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-12});

  // Draw dashed red path along pts — used for knight L-shape
  function redDash(pts){
    const H=R*1.007;
    const sp=pts.map(p=>p.clone().normalize().multiplyScalar(H));
    const cum=[0];
    for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+sp[i].distanceTo(sp[i-1]));
    const tot=cum[cum.length-1];
    function ptAt(s){
      s=Math.max(0,Math.min(s,tot));
      for(let i=1;i<cum.length;i++){
        if(cum[i]>=s){const tt=(s-cum[i-1])/(cum[i]-cum[i-1]);
          return sp[i-1].clone().lerp(sp[i],tt).normalize().multiplyScalar(H);}
      }
      return sp[sp.length-1].clone();
    }
    const dLen=0.035,gLen=0.04;let d=0;
    while(d<tot){
      const dEnd=Math.min(d+dLen,tot);const n=Math.max(2,Math.round((dEnd-d)/0.01));
      const seg=[];for(let i=0;i<=n;i++)seg.push(ptAt(d+(dEnd-d)*i/n));
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),n,0.010,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,redMat());m.renderOrder=6;m.frustumCulled=false;
      globe.add(m);checkRingObjs.push(m);
      d+=dLen+gLen;
    }
  }

  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p||p.color!==opp)continue;
    let attacks=false;
    if(p.type==='P'){const dir=p.color==='black'?1:-1;attacks=(la+dir===kLat&&(wL(lo-1)===kLon||wL(lo+1)===kLon));}
    else attacks=aiMoves(la,lo).some(m=>m.tLat===kLat&&m.tLon===kLon);
    if(!attacks)continue;

    // All valid moves from this piece that land on the king's square
    const allMvs=getValidMoves(la,lo).filter(m=>m.lat===kLat&&m.lon===kLon);
    if(!allMvs.length)continue;
    const r=R*1.007;

    if(p.type==='N'){
      // Knights: draw the L-shaped dashed path (only one knight move can reach a given square)
      const mv=allMvs[0];
      if(!mv.isKnight)continue;
      const from3d=cellPos(la,lo,r);
      let seg1,seg2;
      if(mv.longLat){
        if(mv.elbowLat>=0&&mv.elbowLat<=7){
          seg1=geodesicPts(from3d,cellPos(mv.elbowLat,mv.elbowLon,r),24);
          seg2=latRingArc(mv.elbowLat,mv.elbowLon,kLon,12,r);
        } else {
          const isNorth=mv.elbowLat<0;
          const polePt=new THREE.Vector3(0,(isNorth?1:-1)*r,0);
          const ref=poleRef(mv.elbowLat,mv.elbowLon);
          seg1=[...geodesicPts(from3d,polePt,12),...geodesicPts(polePt,cellPos(ref.l,ref.n,r),12).slice(1)];
          seg2=latRingArc(ref.l,ref.n,kLon,12,r);
        }
      } else {
        seg1=latRingArc(la,lo,mv.elbowLon,24,r);
        seg2=geodesicPts(cellPos(mv.elbowLat,mv.elbowLon,r),cellPos(kLat,kLon,r),12);
      }
      redDash([...seg1,...seg2.slice(1)]);
    } else {
      // Non-knight: solid red tube along each valid attack path to the king.
      // Using all matching moves covers the polar edge case where a queen can
      // reach the same square via both a rank move AND a diagonal-through-pole.
      for(const cm of allMvs){
        const animPts=computeAnimPath(cm,la,lo,kLat,kLon,cellPos(la,lo,R));
        if(!animPts||animPts.length<2)continue;
        const surfPts=animPts.map(q=>q.clone().normalize().multiplyScalar(r));
        const tGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(surfPts,false,'centripetal'),Math.max(surfPts.length*4,40),0.010,6,false);
        tGeo.computeBoundingSphere();
        const tube=new THREE.Mesh(tGeo,redMat());tube.renderOrder=6;tube.frustumCulled=false;
        globe.add(tube);checkRingObjs.push(tube);
      }
    }
    // Red dot at attacker's position
    const aPos=cellPos(la,lo,R*1.007);
    const dGeo=new THREE.CircleGeometry(BAND_THETA*R*0.13,36);
    const dot=new THREE.Mesh(dGeo,redMat());
    dot.position.copy(aPos);
    dot.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),aPos.clone().normalize());
    dot.renderOrder=6;dot.frustumCulled=false;
    globe.add(dot);checkRingObjs.push(dot);
  }
}

// ─── Path helpers ─────────────────────────────────────────────────────────────
function geodesicPts(p1,p2,segs=48){
  const pts=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const v=new THREE.Vector3().lerpVectors(p1,p2,t).normalize().multiplyScalar(p1.length());
    pts.push(v);
  }
  return pts;
}
function latRingArc(latIdx,lonA,lonB,segs=40,r=R*1.019,dn_sign=0){
  const theta=CAP_THETA+(latIdx+0.5)*BAND_THETA;
  const sinT=Math.sin(theta),cosT=Math.cos(theta);
  const phiA=((lonA+0.5)/NUM_LON)*Math.PI*2;
  const phiB=((lonB+0.5)/NUM_LON)*Math.PI*2;
  let dp=phiB-phiA;
  // dn_sign forces the arc direction to match the actual move direction.
  // Without this, a move that goes 6 steps to the right would be drawn as
  // a 2-step arc to the left (shortest path), leaving intermediate dots disconnected.
  if(dn_sign>0){if(dp<=0)dp+=Math.PI*2;}       // force clockwise (increasing phi)
  else if(dn_sign<0){if(dp>=0)dp-=Math.PI*2;}  // force counterclockwise
  else{if(dp>Math.PI)dp-=Math.PI*2;if(dp<-Math.PI)dp+=Math.PI*2;} // shortest (default)
  const pts=[];
  for(let i=0;i<=segs;i++){
    const phi=phiA+(i/segs)*dp;
    pts.push(new THREE.Vector3(r*sinT*Math.cos(phi),r*cosT,r*sinT*Math.sin(phi)));
  }
  return pts;
}

// ─── Visualization Materials ──────────────────────────────────────────────────
const TUBE_F=new THREE.MeshBasicMaterial({color:0xff6600,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});
const DOT_F =new THREE.MeshBasicMaterial({color:0xff6600,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});
const DASH_F=new THREE.LineDashedMaterial({color:0xff6600,dashSize:0.035,gapSize:0.04,linewidth:2,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});
const DASH_B=new THREE.LineDashedMaterial({color:0xd0d0d0,dashSize:0.035,gapSize:0.04,transparent:true,opacity:0.15,depthTest:false,depthWrite:false});
const DOT_GEO=new THREE.SphereGeometry(0.048,32,32);

let selectedCell=null,currentTargets=[],visObjects=[];
let shakeAnims=[]; // [{group, basePos, radialDir, t}]

function showMoves(lat,lon,autoOnlyLat=null,autoOnlyLon=null){
  // autoOnlyLat/Lon: when set (auto-battle), only draw path for that specific destination
  clearVis();
  // In test mode, skip check-filtering so all raw moves are shown
  const moves=testModeActive?getValidMoves(lat,lon):getLegalMoves(lat,lon);
  if(!moves.length)return;
  selectedCell={lat,lon};
  currentTargets=moves;
  const sel=board[lat][lon];
  if(sel&&sel.sprite) startBounce(sel.sprite,lat,lon);
  if(typeof updateDeleteBtn==='function')updateDeleteBtn();
  const from=cellPos(lat,lon,R*1.019);

  const ringR=BAND_THETA*R*0.14;
  const fromCenter=cellPos(lat,lon,R*1.006);
  // Trim start: remove points inside start ring, prepend exact boundary point
  function trimStart(pts){
    let i=0;
    while(i<pts.length-1&&pts[i].distanceTo(fromCenter)<ringR)i++;
    if(i===0)return pts;
    const p0=pts[i-1],p1=pts[i];
    const d0=p0.distanceTo(fromCenter),d1=p1.distanceTo(fromCenter);
    const t=(d1-d0)>0.0001?(ringR-d0)/(d1-d0):0;
    const bp=p0.clone().lerp(p1,t).normalize().multiplyScalar(R*1.006);
    return[bp,...pts.slice(i)];
  }
  // Trim end: remove points inside target ring, append exact boundary point
  function trimEnd(pts,tgtCenter){
    let i=pts.length-1;
    while(i>0&&pts[i].distanceTo(tgtCenter)<ringR)i--;
    if(i===pts.length-1)return pts;
    const p0=pts[i],p1=pts[i+1];
    const d0=p0.distanceTo(tgtCenter),d1=p1.distanceTo(tgtCenter);
    const t=(d0-d1)>0.0001?(d0-ringR)/(d0-d1):0;
    const bp=p0.clone().lerp(p1,t).normalize().multiplyScalar(R*1.006);
    return[...pts.slice(0,i+1),bp];
  }

  function addTube(pts,captureEnd=false,tgtCenter=null){
    let tp=trimStart(pts);
    if(tgtCenter) tp=trimEnd(tp,tgtCenter);
    if(tp.length<2)return;
    const surfPts=tp.map(p=>p.clone().normalize().multiplyScalar(R*1.006));

    if(!captureEnd){
      const segs=Math.max(surfPts.length*4,32);
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(surfPts,false,'centripetal'),segs,0.008,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,TUBE_F); m.renderOrder=4; m.frustumCulled=false;
      globe.add(m); visObjects.push(m);
      return;
    }

    // Compute arc-length split: orange part + last-one-cell gradient part
    const cum=[0];
    for(let k=1;k<surfPts.length;k++) cum.push(cum[k-1]+surfPts[k].distanceTo(surfPts[k-1]));
    const totalLen=cum[cum.length-1];
    const gradStartLen=Math.max(0,totalLen-BAND_THETA*R);

    let si=surfPts.length-1;
    for(let k=0;k<cum.length;k++){if(cum[k]>=gradStartLen){si=k;break;}}
    let splitPt;
    if(si>0&&cum[si]>gradStartLen){
      const t=(gradStartLen-cum[si-1])/(cum[si]-cum[si-1]);
      splitPt=surfPts[si-1].clone().lerp(surfPts[si],t).normalize().multiplyScalar(R*1.006);
    }else{splitPt=surfPts[si].clone();}

    // Orange part — TUBE_F (exact orange, no color space issues)
    const oPts=[...surfPts.slice(0,si),splitPt];
    if(oPts.length>=2){
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(oPts,false,'centripetal'),Math.max(oPts.length*4,32),0.008,5,false);
      geo.computeBoundingSphere();
      const m=new THREE.Mesh(geo,TUBE_F); m.renderOrder=4; m.frustumCulled=false;
      globe.add(m); visObjects.push(m);
    }

    // Gradient part — 60 MeshBasicMaterial segments for silky smooth transition
    const gPts=[splitPt,...surfPts.slice(si)];
    if(gPts.length>=2){
      // Densify gradient zone so segments always have enough points
      const gCurve=new THREE.CatmullRomCurve3(gPts,false,'centripetal');
      const DENSE=120;
      const densePts=gCurve.getPoints(DENSE);
      const N=60;
      const cFrom=new THREE.Color(0xff6600), cTo=new THREE.Color(0x880000);
      for(let i=0;i<N;i++){
        const i0=Math.floor(i/N*densePts.length);
        const i1=Math.min(Math.ceil((i+1)/N*densePts.length),densePts.length-1);
        const seg=densePts.slice(i0,i1+1);
        if(seg.length<2)continue;
        const col=cFrom.clone().lerp(cTo,(i+0.5)/N);
        const mat=new THREE.MeshBasicMaterial({color:col,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});
        const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),Math.max(seg.length,4),0.008,5,false);
        geo.computeBoundingSphere();
        const m=new THREE.Mesh(geo,mat); m.renderOrder=4; m.frustumCulled=false;
        globe.add(m); visObjects.push(m);
      }
    }
  }
  function surfPts_count(tp){return tp.length;}
  function addDot(pos,lat,lon){
    const spos=pos.clone().normalize().multiplyScalar(R*1.007);
    const geo=new THREE.CircleGeometry(ringR,40);
    const mat=new THREE.MeshBasicMaterial({color:0xff6600,side:THREE.FrontSide,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});
    const circle=new THREE.Mesh(geo,mat);
    circle.position.copy(spos);
    circle.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),spos.clone().normalize());
    circle.renderOrder=4; circle.frustumCulled=false;
    circle.userData={isMoveTarget:true,lat,lon};
    globe.add(circle); visObjects.push(circle);
  }
  function addDash(pts){
    const H=R*1.006;
    const surfPts=pts.map(p=>p.clone().normalize().multiplyScalar(H));
    const cum=[0];
    for(let i=1;i<surfPts.length;i++) cum.push(cum[i-1]+surfPts[i].distanceTo(surfPts[i-1]));
    const total=cum[cum.length-1];
    function ptAt(s){
      s=Math.max(0,Math.min(s,total));
      for(let i=1;i<cum.length;i++){
        if(cum[i]>=s){
          const tt=(s-cum[i-1])/(cum[i]-cum[i-1]);
          return surfPts[i-1].clone().lerp(surfPts[i],tt).normalize().multiplyScalar(H);
        }
      }
      return surfPts[surfPts.length-1].clone();
    }
    const dashLen=0.035, gapLen=0.04;
    let d=0;
    while(d<total){
      const dEnd=Math.min(d+dashLen,total);
      const n=Math.max(2,Math.round((dEnd-d)/0.01));
      const seg=[];
      for(let i=0;i<=n;i++) seg.push(ptAt(d+(dEnd-d)*i/n));
      const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seg,false,'centripetal'),n,0.008,5,false);
      geo.computeBoundingSphere();
      const front=new THREE.Mesh(geo,TUBE_F); front.renderOrder=4; front.frustumCulled=false;
      globe.add(front); visObjects.push(front);
      d+=dashLen+gapLen;
    }
  }

  function addRing(lat,lon){
    const center=cellPos(lat,lon,R*1.006);
    const radial=center.clone().normalize();
    const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
    const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
    const N=64;
    const pts=[];
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*ringR).addScaledVector(t2,Math.sin(a)*ringR);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.008,8,true);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,TUBE_F.clone()); mesh.renderOrder=4; mesh.frustumCulled=false;
    globe.add(mesh); visObjects.push(mesh);
  }

  addRing(lat,lon);

  const tubeDests=new Set(); // track destinations with tubes drawn — prevent duplicates

  // Diagonal spiral paths
  const diagGroups={};
  moves.forEach(m=>{
    if(!m.diagKey)return;
    if(!diagGroups[m.diagKey])diagGroups[m.diagKey]=[];
    diagGroups[m.diagKey].push(m);
  });
  Object.values(diagGroups).forEach(dmoves=>{
    dmoves.sort((a,b)=>a.diagWP.length-b.diagWP.length);
    // Auto-battle: only draw the direction containing the target, keeping all intermediates
    if(autoOnlyLat!==null){
      const _ti=dmoves.findIndex(m=>m.lat===autoOnlyLat&&m.lon===autoOnlyLon);
      if(_ti===-1)return;
      dmoves=dmoves.slice(0,_ti+1);
    }
    const cells=[{lat,lon},...dmoves.map(m=>({lat:m.lat,lon:m.lon}))];
    const SEGS=14, r=R*1.006;
    const dn=parseInt(dmoves[0].diagKey.split(',')[1]); // initial dn from diagKey
    let poleCrossCount=0; // tracks how many pole crossings so far (dn flips each time)
    const pts=[];
    for(let i=0;i<cells.length-1;i++){
      const c0=cells[i],c1=cells[i+1];
      const th0=CAP_THETA+(c0.lat+0.5)*BAND_THETA;
      const th1=CAP_THETA+(c1.lat+0.5)*BAND_THETA;
      const ph0=(c0.lon+0.5)/NUM_LON*Math.PI*2;
      const ph1r=(c1.lon+0.5)/NUM_LON*Math.PI*2;
      let dph=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      const lDiff=Math.min(((c1.lon-c0.lon+8)%8),((c0.lon-c1.lon+8)%8));
      const isPole=c0.lat===c1.lat&&lDiff===4;
      const skip=(i===0)?0:1;
      if(isPole){
        // Loxodrome continuation: diagonal keeps its dθ/dφ ratio through the pole,
        // exits with fully reversed direction — creates smooth ∞/figure-8 shape.
        const dn_cur=dn*(poleCrossCount%2===0?1:-1); // effective dn at this crossing
        const dph_step=(2*Math.PI/NUM_LON)*dn_cur;   // φ change per "step unit"
        const isNorth=c0.lat<4;
        const poleTheta=isNorth?0:Math.PI;
        const dl_sign=isNorth?-1:1;                  // θ direction toward pole
        // Distance (in θ) from cell center to pole
        const distToPole=isNorth?th0:(Math.PI-th0);
        const t_half=distToPole/BAND_THETA;           // = 1.0 for this board geometry
        const phi_pole=ph0+dph_step*t_half;
        const N=SEGS*8;
        for(let s=skip;s<=N;s++){
          const t=(s/N)*2*t_half;
          let theta,phi;
          if(t<=t_half){
            // Spiralling toward pole
            theta=th0+dl_sign*BAND_THETA*t;
            phi=ph0+dph_step*t;
          } else {
            // Spiralling away from pole in mirrored direction
            const dt=t-t_half;
            theta=poleTheta-dl_sign*BAND_THETA*dt;
            phi=phi_pole+Math.PI-dph_step*dt;
          }
          theta=Math.max(0,Math.min(Math.PI,theta));
          pts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
        poleCrossCount++;
      } else {
        for(let s=skip;s<=SEGS;s++){
          const t=s/SEGS;
          const theta=th0+(th1-th0)*t;
          const phi=ph0+dph*t;
          pts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
      }
    }
    const lastCell=cells[cells.length-1];
    const isDiagCapture=!!(board[lastCell.lat]?.[lastCell.lon]&&board[lastCell.lat][lastCell.lon].color!==board[lat][lon]?.color);
    // Use diagKey in dedup key so mirror diagonals (different dn) are BOTH drawn
    const dk=`diag:${dmoves[0].diagKey}`;
    if(!tubeDests.has(dk)){tubeDests.add(dk);addTube(pts,isDiagCapture,cellPos(lastCell.lat,lastCell.lon,R*1.006));}
  });

  // Straight paths — group ALL moves per direction, build path through every intermediate
  // cell so each visible dot has a tube segment passing through it.
  // (Old approach: one long tube from piece to farthest → tube goes around back hemisphere
  //  and intermediate dots appear "disconnected".)
  const straightGroups={};
  moves.forEach(m=>{
    if(!m.straightKey)return;
    if(!straightGroups[m.straightKey])straightGroups[m.straightKey]=[];
    straightGroups[m.straightKey].push(m);
  });
  Object.entries(straightGroups).forEach(([,grpMoves])=>{
    grpMoves.sort((a,b)=>a.step-b.step);
    // Auto-battle: only draw the direction containing the target, keeping all intermediates
    if(autoOnlyLat!==null){
      const _ti=grpMoves.findIndex(m=>m.lat===autoOnlyLat&&m.lon===autoOnlyLon);
      if(_ti===-1)return;
      grpMoves=grpMoves.slice(0,_ti+1);
    }
    const farthest=grpMoves[grpMoves.length-1];
    // Dedup by direction (straightKey), NOT by cell coordinates.
    // Two different directions can share the same farthest cell (e.g. a vertical pole-crossing
    // path and a horizontal path both ending at the same cell). Each direction must draw its
    // own tube independently — cell-based dedup would skip one entirely, leaving dots with no lines.
    const sk=grpMoves[0].straightKey;
    if(tubeDests.has(sk))return;
    tubeDests.add(sk);
    let pts;
    if(farthest.straightDl===0){
      // Horizontal ring arc: single arc, as before
      pts=latRingArc(lat,lon,farthest.lon,48,R*1.019,farthest.straightDn);
    } else {
      // Vertical: separate pre-pole and post-pole segments.
      // A single CatmullRomCurve3 through the whole path (including the U-turn at the
      // pole) overshoots inside the sphere at the pole junction → the post-pole tube
      // segment is hidden by depth testing. Drawing two separate tubes avoids this.
      const poleVec=grpMoves.find(m=>m.pole);
      const isStraightCapture=!!(board[farthest.lat]?.[farthest.lon]&&board[farthest.lat][farthest.lon].color!==board[lat][lon]?.color);
      if(!poleVec){
        // No pole crossing: single smooth tube through all cells
        pts=[from];
        grpMoves.forEach(m=>pts.push(cellPos(m.lat,m.lon,R*1.019)));
        const ptsFlat=[];
        for(let i=0;i<pts.length-1;i++){
          const seg=geodesicPts(pts[i],pts[i+1],8);if(i>0)seg.shift();ptsFlat.push(...seg);
        }
        addTube(ptsFlat,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
      } else {
        // Pole crossing: tube 1 = piece→pole, tube 2 = pole→farthest (no U-turn in either)
        const polePt=new THREE.Vector3(0,(poleVec.pole==='N'?1:-1)*R*1.001,0);
        const preWP=[from,...grpMoves.filter(m=>!m.pole).map(m=>cellPos(m.lat,m.lon,R*1.019)),polePt];
        const postWP=[polePt,...grpMoves.filter(m=>!!m.pole).map(m=>cellPos(m.lat,m.lon,R*1.019))];
        // Draw pre-pole tube (piece → pole)
        const prePts=[];
        for(let i=0;i<preWP.length-1;i++){
          const seg=geodesicPts(preWP[i],preWP[i+1],8);if(i>0)seg.shift();prePts.push(...seg);
        }
        addTube(prePts,false,null); // don't trim at pole — continuous with post-pole tube
        // Draw post-pole tube (pole → farthest)
        if(postWP.length>=2){
          const postPts=[];
          for(let i=0;i<postWP.length-1;i++){
            const seg=geodesicPts(postWP[i],postWP[i+1],8);if(i>0)seg.shift();postPts.push(...seg);
          }
          addTube(postPts,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
        }
      }
      pts=null; // already handled above
    }
    if(pts!==null){
      const isStraightCapture=!!(board[farthest.lat]?.[farthest.lon]&&board[farthest.lat][farthest.lon].color!==board[lat][lon]?.color);
      addTube(pts,isStraightCapture,cellPos(farthest.lat,farthest.lon,R*1.006));
    }
  });

  // Knight L-shape dashed paths
  moves.forEach(({isKnight,longLat,elbowLat,elbowLon,lat:tl,lon:tn})=>{
    if(!isKnight)return;
    if(autoOnlyLat!==null&&!(tl===autoOnlyLat&&tn===autoOnlyLon))return;
    const r=R*1.006;
    let seg1,seg2;
    if(longLat){
      if(elbowLat>=0&&elbowLat<=7){
        // Normal case: elbow is within the grid
        seg1=geodesicPts(from,cellPos(elbowLat,elbowLon,r),24);
        seg2=latRingArc(elbowLat,elbowLon,tn,12,r);
      } else {
        // Elbow is in the polar cap — route through the pole, then to reflected elbow
        const isNorth=elbowLat<0;
        const polePt=new THREE.Vector3(0,(isNorth?1:-1)*R*1.001,0);
        const ref=poleRef(elbowLat,elbowLon);
        seg1=[...geodesicPts(from,polePt,12),...geodesicPts(polePt,cellPos(ref.l,ref.n,r),12).slice(1)];
        seg2=latRingArc(ref.l,ref.n,tn,12,r);
      }
    } else {
      seg1=latRingArc(lat,lon,elbowLon,24,r);
      seg2=geodesicPts(cellPos(elbowLat,elbowLon,r),cellPos(tl,tn,r),12);
    }
    addDash([...seg1,...seg2.slice(1)]);
  });

  // Pawn / King / fallback
  const drawnDests=new Set();
  moves.forEach(m=>{if(m.diagKey||m.straightKey||m.isKnight)drawnDests.add(`${m.lat},${m.lon}`);});
  moves.forEach(({lat:tl,lon:tn,diagKey,straightKey,isKnight})=>{
    if(diagKey||straightKey||isKnight)return;
    if(autoOnlyLat!==null&&!(tl===autoOnlyLat&&tn===autoOnlyLon))return;
    if(drawnDests.has(`${tl},${tn}`))return;
    const fk=`${tl},${tn}`;
    if(tubeDests.has(fk))return;
    tubeDests.add(fk);
    const r2=R*1.006;
    const fromPt=from.clone().normalize().multiplyScalar(r2);
    const to3d=cellPos(tl,tn,r2);
    // Detect pole-crossing (both near same pole, phi differs ~π)
    const th0=CAP_THETA+(lat+0.5)*BAND_THETA;
    const th1=CAP_THETA+(tl+0.5)*BAND_THETA;
    const ph0=(lon+0.5)/NUM_LON*Math.PI*2;
    const ph1r=(tl===lat)?Math.atan2(to3d.z,to3d.x):((tn+0.5)/NUM_LON*Math.PI*2);
    let dphF=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
    const nearN=th0<CAP_THETA+BAND_THETA*1.5&&th1<CAP_THETA+BAND_THETA*1.5;
    const nearS=th0>Math.PI-CAP_THETA-BAND_THETA*1.5&&th1>Math.PI-CAP_THETA-BAND_THETA*1.5;
    const isPoleF=(nearN||nearS)&&Math.abs(Math.abs(dphF)-Math.PI)<0.6;
    let pts;
    // Pawn diagonal capture: use loxodromic (constant dθ/dφ) path instead of great circle
    // Great circles deviate visibly from the true diagonal on a sphere
    const _pType=board[lat]?.[lon]?.type;
    if(_pType==='P'&&tl!==lat&&tn!==lon){
      const _SEGS=20;
      const _th0=CAP_THETA+(lat+0.5)*BAND_THETA;
      const _th1=CAP_THETA+(tl+0.5)*BAND_THETA;
      const _ph0=((lon+0.5)/NUM_LON)*Math.PI*2;
      const _ph1=((tn+0.5)/NUM_LON)*Math.PI*2;
      let _dp=((_ph1-_ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      pts=[];
      for(let s=0;s<=_SEGS;s++){
        const t=s/_SEGS;
        const theta=_th0+(_th1-_th0)*t;
        const phi=_ph0+_dp*t;
        pts.push(new THREE.Vector3(r2*Math.sin(theta)*Math.cos(phi),r2*Math.cos(theta),r2*Math.sin(theta)*Math.sin(phi)));
      }
    } else {
      pts=geodesicPts(fromPt,to3d,60);
    }
    const isPawnCapture=!!(board[tl]?.[tn]&&board[tl][tn].color!==board[lat][lon]?.color);
    addTube(pts,isPawnCapture,cellPos(tl,tn,r2));
  });

  const CAPTURE_F=new THREE.MeshBasicMaterial({color:0x880000,depthTest:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-8});

  function addCaptureRing(lat,lon){
    const center=cellPos(lat,lon,R*1.006);
    const radial=center.clone().normalize();
    const tmp=Math.abs(radial.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const t1=new THREE.Vector3().crossVectors(radial,tmp).normalize();
    const t2=new THREE.Vector3().crossVectors(radial,t1).normalize();
    const N=64;
    const pts=[];
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const pt=center.clone().addScaledVector(t1,Math.cos(a)*ringR).addScaledVector(t2,Math.sin(a)*ringR);
      pts.push(pt.normalize().multiplyScalar(R*1.006));
    }
    const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true,'centripetal'),N,0.008,8,true);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,CAPTURE_F.clone()); mesh.renderOrder=4; mesh.frustumCulled=false;
    globe.add(mesh); visObjects.push(mesh);
  }

  // Dots at destinations — captures get red ring; en passant shows ring on captured pawn
  moves.forEach(m=>{
    const{lat:tl,lon:tn}=m;
    if(autoOnlyLat!==null&&!(tl===autoOnlyLat&&tn===autoOnlyLon))return;
    const target=board[tl]?.[tn];
    const isCapture=target&&target.color!==board[lat][lon]?.color;
    if(m.isEnPassant){
      // Orange dot at destination + capture ring on the adjacent pawn
      addDot(cellPos(tl,tn,R*1.006),tl,tn);
      addCaptureRing(m.capturedLat,m.capturedLon);
      const epPawn=board[m.capturedLat]?.[m.capturedLon];
      if(epPawn){
        const bp=cellPos(m.capturedLat,m.capturedLon,R*1.035).clone();
        shakeAnims.push({group:epPawn.sprite,basePos:bp,baseQ:epPawn.sprite.quaternion.clone(),radialDir:bp.clone().normalize(),t:Math.random()*Math.PI*2,type:epPawn.type});
      }
    } else if(!isCapture){
      addDot(cellPos(tl,tn,R*1.006),tl,tn);
    } else {
      addCaptureRing(tl,tn);
      const spos=cellPos(tl,tn,R*1.006).normalize().multiplyScalar(R*1.006);
      const hit=new THREE.Mesh(DOT_GEO,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
      hit.position.copy(spos); hit.renderOrder=4; hit.frustumCulled=false;
      hit.userData={isMoveTarget:true,lat:tl,lon:tn};
      globe.add(hit); visObjects.push(hit);
      const basePos=cellPos(tl,tn,R*1.035).clone();
      shakeAnims.push({group:target.sprite,basePos,baseQ:target.sprite.quaternion.clone(),radialDir:basePos.clone().normalize(),t:Math.random()*Math.PI*2,type:target.type});
    }
  });
}

function clearVis(){
  stopBounce();
  // Stop shake animations and restore positions
  shakeAnims.forEach(s=>{s.group.position.copy(s.basePos);if(s.baseQ)s.group.quaternion.copy(s.baseQ);});
  shakeAnims=[];
  visObjects.forEach(o=>globe.remove(o));
  visObjects=[];currentTargets=[];selectedCell=null;
  if(typeof updateDeleteBtn==='function')updateDeleteBtn();
}

// ─── Move Animation ───────────────────────────────────────────────────────────
let moveAnim=null;
let bounceAnim=null;

function startBounce(group,lat,lon){
  const basePos=cellPos(lat,lon,R).clone();
  const piece=board[lat][lon];
  const blob=piece?piece.blob:null;
  bounceAnim={group,blob,basePos,radialDir:basePos.clone().normalize(),t:0};
}
function stopBounce(){
  if(bounceAnim){
    bounceAnim.group.position.copy(bounceAnim.basePos);
    // Restore blob opacity to full
    if(bounceAnim.blob){
      const mat=bounceAnim.blob.children[0]?.material;
      if(mat) mat.opacity=0.48;
    }
    bounceAnim=null;
  }
}

// ─── Animation duration helper ────────────────────────────────────────────────
// Duration scales with actual 3D path length — not grid-step count.
// Calibration: 1 latitude step (BAND_THETA) → 500 ms  |  longest spirals → 5000 ms
// This ensures a bishop spiralling diagonally across the globe takes noticeably
// longer than a rook creeping one step at high latitude, matching visual distance.
function calcMoveDur(pathLen){
  const minDist = BAND_THETA;          // shortest realistic path: 1 lat step
  const maxDist = BAND_THETA * 25;     // practical upper bound for long loxodromes
  return Math.min(5000, Math.max(500,
    Math.round(500 + (pathLen - minDist) / (maxDist - minDist) * 4500)
  ));
}

function startMoveAnim(sprite,blob,animPts,onDone){
  let pathLen=0;
  for(let i=1;i<animPts.length;i++) pathLen+=animPts[i].distanceTo(animPts[i-1]);
  const dur=calcMoveDur(pathLen);
  // Precompute cumulative arc-length table so the animate loop can sample
  // by actual distance rather than by point index.
  // This eliminates the apparent speed spike/slowdown caused by non-uniform
  // point density (e.g., pole-crossing spirals pack points tightly near the pole).
  const cum=[0];
  for(let i=1;i<animPts.length;i++) cum.push(cum[i-1]+animPts[i].distanceTo(animPts[i-1]));
  moveAnim={sprite,blob,pts:animPts,cum,totalLen:pathLen,t:0,dur,onDone,pieceType:null,pieceIsWhite:null};
}
function setMoveAnimPiece(type,isWhite){
  if(moveAnim){moveAnim.pieceType=type;moveAnim.pieceIsWhite=isWhite;}
}

function computeAnimPath(move,fromLat,fromLon,toLat,toLon,fromPos){
  const r=R*1.01;
  const snap=pts=>pts.map(p=>p.clone().normalize().multiplyScalar(r));
  const from3d=fromPos.clone().normalize().multiplyScalar(r);
  const to3d=cellPos(toLat,toLon,r);

  if(move&&move.diagKey&&move.diagWP&&move.diagWP.length){
    function toAngles(pt){const l=pt.length()||r;return{theta:Math.acos(Math.max(-1,Math.min(1,pt.y/l))),phi:Math.atan2(pt.z,pt.x)};}
    const wp=snap(move.diagWP);
    const rawWP=[from3d,...wp];
    const allPts=[];
    const SEGS=30;
    const dn_init=parseInt(move.diagKey.split(',')[1]);
    let diagPoleCount=0;
    for(let i=0;i<rawWP.length-1;i++){
      const{theta:th0,phi:ph0}=toAngles(rawWP[i]);
      const{theta:th1,phi:ph1r}=toAngles(rawWP[i+1]);
      let dph=((ph1r-ph0+3*Math.PI)%(2*Math.PI))-Math.PI;
      const nearN=th0<CAP_THETA+BAND_THETA*1.5&&th1<CAP_THETA+BAND_THETA*1.5;
      const nearS=th0>Math.PI-CAP_THETA-BAND_THETA*1.5&&th1>Math.PI-CAP_THETA-BAND_THETA*1.5;
      const isPole=(nearN||nearS)&&Math.abs(Math.abs(dph)-Math.PI)<0.5;
      const skip=i===0?0:1;
      if(isPole){
        // Loxodrome continuation — same formula as visualization
        const dn_cur=dn_init*(diagPoleCount%2===0?1:-1);
        const dph_step=(2*Math.PI/NUM_LON)*dn_cur;
        const isNorth=nearN;
        const poleTheta=isNorth?0:Math.PI;
        const dl_sign=isNorth?-1:1;
        const distToPole=isNorth?th0:(Math.PI-th0);
        const t_half=distToPole/BAND_THETA;
        const phi_pole=ph0+dph_step*t_half;
        const N=SEGS*8;
        for(let s=skip;s<=N;s++){
          const t=(s/N)*2*t_half;
          let theta,phi;
          if(t<=t_half){
            theta=th0+dl_sign*BAND_THETA*t;
            phi=ph0+dph_step*t;
          } else {
            const dt=t-t_half;
            theta=poleTheta-dl_sign*BAND_THETA*dt;
            phi=phi_pole+Math.PI-dph_step*dt;
          }
          theta=Math.max(0,Math.min(Math.PI,theta));
          allPts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
        diagPoleCount++;
      } else {
        for(let s=skip;s<=SEGS;s++){
          const t=s/SEGS;
          const theta=th0+(th1-th0)*t;
          const phi=ph0+dph*t;
          allPts.push(new THREE.Vector3(r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta),r*Math.sin(theta)*Math.sin(phi)));
        }
      }
    }
    return allPts;
  }

  if(move&&move.isKnight){
    const SEGS=120;
    const s=from3d.clone().normalize();
    const e=to3d.clone().normalize();
    const ang=s.angleTo(e);
    const maxLift=Math.max(0.40,Math.sin(ang)*0.84)*R;
    const pts=[];
    for(let i=0;i<=SEGS;i++){
      const t=i/SEGS;
      let dir;
      if(ang<0.001){dir=s.clone();}
      else{const sinA=Math.sin(ang);dir=new THREE.Vector3().addScaledVector(s,Math.sin((1-t)*ang)/sinA).addScaledVector(e,Math.sin(t*ang)/sinA);}
      const lift=Math.sin(Math.PI*t)*maxLift;
      pts.push(dir.normalize().multiplyScalar(r+lift));
    }
    return pts;
  }

  if(move&&move.straightKey){
    if(move.straightDl===0) return snap(latRingArc(fromLat,fromLon,toLon,120,r,move.straightDn));
    else if(move.pole){
      const polePt=new THREE.Vector3(0,(move.pole==='N'?1:-1)*r,0);
      return snap([...geodesicPts(from3d,polePt,60),...geodesicPts(polePt,to3d,60)]);
    } else return snap(geodesicPts(from3d,to3d,120));
  }
  // Fallback (king, pawn, etc.) — pole-crossing: geodesicPts naturally passes through pole for antipodal polar points
  return snap(geodesicPts(from3d,to3d,120));
}

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

let turnColor='white';
const turnEl=document.getElementById('turn');
