// ── Main drive loop ───────────────────────────────────────────────────────────

// Insufficient material: K/K+minor vs K/K+minor → cannot force checkmate
function _autoInsufMaterial(){
  let wX=[],bX=[];
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo];if(!p||p.type==='K')continue;
    (p.color==='white'?wX:bX).push(p.type);
  }
  const minor=arr=>arr.length===0||(arr.length===1&&(arr[0]==='B'||arr[0]==='N'));
  return minor(wX)&&minor(bX);
}

// ══════════════════════════════════════════════════════════════════════════════
// ─── Enhanced AI Engine — positional evaluation + iterative deepening α-β ────
const _AI_THINK_MS  = 8000;   // AI opponent: 8 s per move
const _AUTO_THINK_MS= 1000;   // Auto-battle: 1 s per move (fast aggressive play)

// Piece-square tables (index = latForPST: 0=own back rank, 7=opponent back rank)
const _PST={
  P:[0,0,10,20,35,55,80,0],
  N:[-20,-5,10,18,18,10,-5,-20],
  B:[-10,0,8,12,12,8,0,-10],
  R:[5,0,0,5,5,0,0,5],
  Q:[-10,-5,0,5,5,0,-5,-10],
  Km:[20,5,-10,-20,-20,-10,5,20],   // king middlegame: stay back
  Ke:[-10,0,10,15,15,10,0,-10]      // king endgame: centralize
};
const _EV={K:50000,Q:1800,R:1000,B:650,N:620,P:180};
const _POL={Q:30,R:27,B:24,N:20,P:0,K:0};

function evaluate(){
  let s=0,nonPK=0;
  const pLon=[new Uint8Array(8),new Uint8Array(8)]; // [black,white] pawn lon counts
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    const p=board[a][o];if(!p||p.type==='K'||p.type==='P')continue;
    nonPK+=_EV[p.type];
  }
  const eg=nonPK<2600;
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    const p=board[a][o];if(!p)continue;
    const bk=p.color==='black';
    const lp=bk?a:(7-a);
    let v=_EV[p.type];
    // PST
    v+=(p.type==='K'?(eg?_PST.Ke:_PST.Km):_PST[p.type]||[])[lp]||0;
    // Polar bonus
    const pd=Math.min(a,7-a);
    if(pd<=1)v+=(2-pd)*(_POL[p.type]||0);
    if(pd===0&&(p.type==='Q'||p.type==='R')){
      const op=board[a][wL(o+4)];
      if(op&&op.color!==p.color)v+=Math.round(_EV[op.type]*0.09);
    }
    // Development: minor pieces still on starting square
    if(!p.hasMoved&&(p.type==='N'||p.type==='B'))v-=18;
    if(p.type==='R'&&p.hasMoved)v+=8;
    // Pawn tracking
    if(p.type==='P')pLon[bk?0:1][o]++;
    s+=bk?v:-v;
  }
  // Pawn structure penalties
  for(let side=0;side<2;side++){
    const sgn=side===0?1:-1; // black penalty → s↓, white penalty → s↑
    let pen=0;
    for(let o=0;o<8;o++){
      const c=pLon[side][o];
      if(c>1)pen+=(c-1)*15;   // doubled pawns
      if(c>0&&!pLon[side][wL(o-1)]&&!pLon[side][wL(o+1)])pen+=12; // isolated
    }
    s-=pen*sgn;
  }
  return s;
}

// α-β with time deadline
function _abSearch(depth,alpha,beta,maxing,deadline){
  if(Date.now()>=deadline)return evaluate();
  if(depth<=0)return _abQuiesce(alpha,beta,maxing,4,deadline);
  const color=maxing?'black':'white';
  const mvs=allAIMoves(color);
  if(!mvs.length)return evaluate();
  mvs.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?_EV.P:0);
    const vb=(board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?_EV.P:0);
    return vb-va;
  });
  let best=maxing?-Infinity:Infinity;
  for(const m of mvs){
    if(Date.now()>=deadline)break;
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const sc=_abSearch(depth-1,alpha,beta,!maxing,deadline);
    aiUndo(m,pc,sv);
    if(maxing){if(sc>best)best=sc;if(sc>alpha)alpha=sc;}
    else{if(sc<best)best=sc;if(sc<beta)beta=sc;}
    if(beta<=alpha)break;
  }
  return best;
}
function _abQuiesce(alpha,beta,maxing,qleft,deadline){
  if(Date.now()>=deadline)return evaluate();
  const stand=evaluate();
  if(qleft<=0)return stand;
  if(maxing){if(stand>=beta)return beta;if(stand>alpha)alpha=stand;}
  else{if(stand<=alpha)return alpha;if(stand<beta)beta=stand;}
  const color=maxing?'black':'white';
  const caps=allAIMoves(color).filter(m=>board[m.tLat][m.tLon]||m.isEnPassant);
  caps.sort((a,b)=>{
    const va=board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0;
    const vb=board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0;
    return vb-va;
  });
  for(const m of caps){
    if(Date.now()>=deadline)break;
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const sc=_abQuiesce(alpha,beta,!maxing,qleft-1,deadline);
    aiUndo(m,pc,sv);
    if(maxing){if(sc>alpha){alpha=sc;if(alpha>=beta)return beta;}}
    else{if(sc<beta){beta=sc;if(beta<=alpha)return alpha;}}
  }
  return maxing?alpha:beta;
}

// Iterative deepening with time control + progress UI
function _findBestMove(color,timeLimitMs,onProgress,onDone,opts){
  const captureBonus=(opts?.captureBonus)||0;
  const globeBonus=(opts?.globeBonus)||0;  // scale factor for globe-wrapping spectacle bonus
  const t0=Date.now(),deadline=t0+timeLimitMs;
  // Pre-compute phase deadlines as absolute timestamps
  const dlEarly=t0+timeLimitMs*0.55;  // stop starting new depths after 55% of time
  const dlMid  =t0+timeLimitMs*0.80;  // abort if no time for a full depth
  const dlLate =t0+timeLimitMs*0.95;  // stop mid-depth if nearly out of time
  const legal=[];
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    if(board[a][o]?.color!==color)continue;
    getLegalMoves(a,o).forEach(mv=>legal.push({fLat:a,fLon:o,tLat:mv.lat,tLon:mv.lon,...mv}));
  }
  if(!legal.length){onDone(null,0);return;}
  // Shuffle for variety among equal-scoring moves
  for(let i=legal.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[legal[i],legal[j]]=[legal[j],legal[i]];}
  // Initial ordering: captures first
  legal.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?_EV.P:0);
    const vb=(board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?_EV.P:0);
    return vb-va;
  });
  let bestMove=legal[0],finalDepth=0;
  // Anti-oscillation (auto-battle only)
  const recent=autoBattleActive?(_autoBattleLog?.moves||[]).filter(m=>m.color===color).slice(-3):[];
  const isRev=m=>recent.some(p=>p.coords[2]===m.fLat&&p.coords[3]===m.fLon&&p.coords[0]===m.tLat&&p.coords[1]===m.tLon);
  let searchDepth=0;

  function nextDepth(){
    searchDepth++;
    if(searchDepth>8||Date.now()>=dlEarly){onDone(bestMove,finalDepth);return;}
    if(onProgress)onProgress(searchDepth,Date.now()-t0);
    setTimeout(()=>{
      if(Date.now()>=dlMid){onDone(bestMove,finalDepth);return;}
      const isBlack=color==='black';
      let dBest=null,dBestSc=isBlack?-Infinity:Infinity;
      let completed=true;
      for(const m of legal){
        if(Date.now()>=dlLate){completed=false;break;}
        const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
        let sc=_abSearch(searchDepth-1,-Infinity,Infinity,!isBlack,deadline);
        aiUndo(m,pc,sv);
        // Capture incentive: bias top-level selection toward moves that eat enemy pieces.
        // This makes the AI prefer captures even when the search says they're slightly worse,
        // creating much more exciting, action-packed games.
        if(captureBonus>0&&(sv.c||sv.epCap)){
          const capT=sv.c?sv.c.type:(sv.epCap?'P':null);
          if(capT)sc+=(isBlack?1:-1)*Math.min(Math.round(_EV[capT]*captureBonus),150);
        }
        // Globe spectacle bonus: reward moves that showcase the spherical topology —
        // pole crossings, long wrap-arounds, diagonal spirals.  These are the moves that
        // are impossible on a flat board and make Globe Chess visually unique.
        if(globeBonus>0){
          let gb=0;
          const steps=m.step||0;
          if(steps>3) gb+=(steps-3)*12;           // long-distance travel
          if(m.pole) gb+=50;                       // straight pole crossing
          if(m.straightDn&&steps>4) gb+=35;        // horizontal wrap-around (>half the ring)
          if(m.diagKey&&steps>3) gb+=(steps-3)*10+30; // long diagonal spiral
          sc+=(isBlack?1:-1)*Math.round(gb*globeBonus);
        }
        if(isRev(m))sc=isBlack?sc-700:sc+700;
        if(isBlack?sc>dBestSc:sc<dBestSc){dBestSc=sc;dBest=m;}
      }
      // Only update bestMove if this depth completed fully (partial results unreliable)
      if(completed&&dBest){
        bestMove=dBest;finalDepth=searchDepth;
        const idx=legal.indexOf(dBest);
        if(idx>0){legal.splice(idx,1);legal.unshift(dBest);}
      }
      nextDepth();
    },4);
  }
  nextDepth();
}

// ── Main drive loop ───────────────────────────────────────────────────────────

function doAutoMove(){
  if(!autoBattleActive||autoBattlePaused)return;
  if(moveAnim||globeRotAnim){_autoBattleTimer=setTimeout(doAutoMove,120);return;}

  const log=_autoBattleLog;if(!log)return;

  // Move-limit guard
  if(log.moves.length>=AUTO_MAX_MOVES){
    _autoLogAnomaly('MOVE_LIMIT',`Game exceeded ${AUTO_MAX_MOVES} moves — possible infinite loop`);
    _endAutoGame('DRAW_MOVE_LIMIT');return;
  }

  // 3-fold repetition guard
  const hash=_autoBoardHash();
  _autoPosHist[hash]=(_autoPosHist[hash]||0)+1;
  if(_autoPosHist[hash]>=3){
    _autoLogAnomaly('REPETITION','Same position repeated 3 times',{count:_autoPosHist[hash]});
    _endAutoGame('DRAW_REPETITION');return;
  }

  // Insufficient material — neither side can force checkmate
  if(_autoInsufMaterial()){
    _autoLogAnomaly('INSUF_MATERIAL','Both sides have insufficient mating material (K/K+minor vs K/K+minor)');
    _endAutoGame('DRAW_INSUF_MATERIAL');return;
  }

  // 50-move rule — 100 half-moves without capture or pawn advance
  if((log.halfMoveClock||0)>=100){
    _autoLogAnomaly('FIFTY_MOVE',`50-move rule triggered after ${log.halfMoveClock} half-moves without capture or pawn advance`);
    _endAutoGame('DRAW_FIFTY_MOVE');return;
  }

  // ── Resignation & draw-by-agreement ────────────────────────────────────────
  const _ev=evaluate();
  if(_ev >= RESIGN_THRESHOLD){
    log.wResignStreak++;log.bResignStreak=0;log.drawStreak=0;
  } else if(_ev <= -RESIGN_THRESHOLD){
    log.bResignStreak++;log.wResignStreak=0;log.drawStreak=0;
  } else {
    log.wResignStreak=0;log.bResignStreak=0;
    if(log.moves.length>=40 && Math.abs(_ev)<=DRAW_EVAL_RANGE){
      log.drawStreak++;
    } else {
      log.drawStreak=0;
    }
  }
  if(log.wResignStreak>=RESIGN_STREAK){_endAutoGame('WHITE_RESIGNS');return;}
  if(log.bResignStreak>=RESIGN_STREAK){_endAutoGame('BLACK_RESIGNS');return;}
  if(log.drawStreak>=DRAW_STREAK){_endAutoGame('DRAW_AGREEMENT');return;}

  // Game-end check (before AI thinks)
  if(!hasAnyLegalMove(turnColor)){
    _endAutoGame(isInCheck(turnColor)
      ?(turnColor==='white'?'BLACK_WINS_CHECKMATE':'WHITE_WINS_CHECKMATE')
      :'DRAW_STALEMATE');
    return;
  }

  // Show thinking status
  const moveNum=log.moves.length+1;
  const cLabel=turnColor==='white'?'White':'Black';
  turnEl.textContent=`Auto ${moveNum} — ${cLabel}: thinking…`;
  _updatePanelInfo(`${cLabel}: thinking…`);

  // Async AI search — aggressive + spectacular play
  const t0=Date.now();
  _findBestMove(turnColor,_AUTO_THINK_MS,
    (depth,elapsed)=>{
      const txt=`Auto ${moveNum} — ${cLabel}: depth ${depth} (${(elapsed/1000).toFixed(1)}s)`;
      turnEl.textContent=txt;_updatePanelInfo(txt);
    },
    (m,fd)=>{
      if(!autoBattleActive)return;
      const thinkMs=Date.now()-t0;
      if(!m){
        _autoLogAnomaly('NO_MOVE',`${turnColor} AI returned null despite available legal moves`,
          {legalCheck:allAIMoves(turnColor).length});
        _endAutoGame('ERROR_NO_MOVE');return;
      }
      const piece=board[m.fLat][m.fLon];
      if(!piece){
        _autoLogAnomaly('EMPTY_FROM','AI selected a move originating from an empty square',
          {from:`${m.fLat},${m.fLon}`,to:`${m.tLat},${m.tLon}`});
        _endAutoGame('ERROR_EMPTY_SQUARE');return;
      }
      // Record move
      const cap=board[m.tLat][m.tLon];
      const color=turnColor;
      const entry={
        n:log.moves.length+1,color,piece:piece.type,
        from:_autoNote(m.fLat,m.fLon),to:_autoNote(m.tLat,m.tLon),
        captured:cap?cap.type:null,captureVal:cap?AI_PVAL[cap.type]:0,
        special:m.isCastle?'castle':m.isEnPassant?'ep':null,
        thinkMs,coords:[m.fLat,m.fLon,m.tLat,m.tLon]
      };
      log.moves.push(entry);
      if(cap)(color==='white'?log.wCapt:log.bCapt).push({t:cap.type,v:AI_PVAL[cap.type]});
      log.halfMoveClock=(cap||piece.type==='P')?0:(log.halfMoveClock||0)+1;
      // Status bar
      const statusText=`Auto ${entry.n} — ${color==='white'?'White':'Black'}: ${piece.type} ${entry.from}→${entry.to}${cap?' x'+cap.type:''}${m.isCastle?' 0-0':''}  (d${fd} ${(thinkMs/1000).toFixed(1)}s)`;
      turnEl.textContent=statusText;
      _updatePanelInfo(statusText);
      // Rotate globe to face the piece, show move dots briefly, execute
      const localDir=cellPos(m.fLat,m.fLon,R).normalize();
      rotateGlobeToFace(localDir,460,()=>{
        showMoves(m.fLat,m.fLon,m.tLat,m.tLon);
        if(multiViewMode>0) visObjects.forEach(o=>o.layers.set(1));
        setTimeout(()=>execMove(m.fLat,m.fLon,m.tLat,m.tLon),370);
      });
    },
    {captureBonus:0.12, globeBonus:1}  // aggressive captures + globe-wrapping spectacle
  );
}

// ── Game lifecycle ────────────────────────────────────────────────────────────
function _endAutoGame(result){
  if(!autoBattleActive)return;
  autoBattleActive=false;autoBattlePaused=false;
  _splitIntroAnim.active=false;
  _pgStop();
  allSprites.forEach(s=>s.traverse(c=>c.layers.enableAll())); // restore main pieces to all layers
  _forEachBlob(c=>c.layers.enableAll());
  clearTimeout(_autoBattleTimer);
  clearVis();
  if(_autoBattleLog){_autoBattleLog.result=result;_autoBattleLog.endTime=Date.now();}
  // Show result on screen
  const _MSG={
    WHITE_RESIGNS:       'White resigns — Black wins',
    BLACK_RESIGNS:       'Black resigns — White wins',
    DRAW_AGREEMENT:      'Draw — by agreement',
    BLACK_WINS_CHECKMATE:'Checkmate — Black wins',
    WHITE_WINS_CHECKMATE:'Checkmate — White wins',
    DRAW_STALEMATE:      'Draw — stalemate',
    DRAW_REPETITION:     'Draw — threefold repetition',
    DRAW_FIFTY_MOVE:     'Draw — 50-move rule',
    DRAW_INSUF_MATERIAL: 'Draw — insufficient material',
    DRAW_MOVE_LIMIT:     'Draw — move limit reached',
    ERROR_NO_MOVE:       'Error — no move found',
    ERROR_EMPTY_SQUARE:  'Error — empty square',
    STOPPED_BY_USER:     'Stopped',
  };
  turnEl.textContent=_MSG[result]||result;
  _updatePanelInfo(_MSG[result]||result);
  if(result==='WHITE_RESIGNS'||result==='BLACK_RESIGNS') playGameOver();
  _updateAutoBattleUI();
  if(_autoBattleLog&&_autoBattleLog.moves.length>0)_showAutoReport();
}


// Helper: apply a layer operation to every currently-live main-game blob shadow.
// Blobs are sibling globe children (not in allSprites) so they need separate handling.
function _forEachBlob(fn){
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(p&&p.blob) p.blob.traverse(fn);
  }
}
function startAutoBattle(){
  if(testModeActive)return;
  if(autoBattleActive)stopAutoBattle();
  _autoGameNum++;_autoPosHist={};
  _autoBattleLog={gameNum:_autoGameNum,moves:[],anomalies:[],wCapt:[],bCapt:[],
    result:null,halfMoveClock:0,
    wResignStreak:0,bResignStreak:0,drawStreak:0,
    startTime:Date.now(),endTime:null};
  autoBattleActive=true;autoBattlePaused=false;
  // Disable human/AI controls during battle
  document.getElementById('aiToggle').checked=false;
  aiMode=false;aiThinking=false;
  resetGame();
  _updateAutoBattleUI();

  if(multiViewMode>0){
    // Split-view intro: animate each panel's own quaternion (does NOT touch globe.quaternion)
    // so the split screen stays active throughout the animation.
    autoRotate=false;
    globeRotAnim=null;
    _mvPanelQ.forEach(q=>q.copy(introR0));
    _mvBattleQ.forEach(q=>q.set(0,0,0,1));      // reset user spin overlays
    _mvPanelDist.forEach((_,i)=>{_mvPanelDist[i]=camera.position.z;}); // sync zoom
    _splitIntroAnim.t=0; _splitIntroAnim.active=true;
    // Tag main-game pieces to layer 1 so only panel 0's camera sees them.
    allSprites.forEach(s=>s.traverse(c=>c.layers.set(1)));
    _forEachBlob(c=>c.layers.set(1));
    // Start independent AI-driven side games for panels 1+
    const layout=_mvLayout();
    if(layout&&layout.length>1) _pgStart(layout.length);
    // Wait for intro (~2 s) before first move
    _autoBattleTimer=setTimeout(doAutoMove, 2400);
  } else {
    _autoBattleTimer=setTimeout(doAutoMove,900);
  }
}

function toggleAutoPause(){
  if(!autoBattleActive)return;
  autoBattlePaused=!autoBattlePaused;
  document.getElementById('autoPauseBtn').textContent=autoBattlePaused?'Resume':'Pause';
  if(!autoBattlePaused){clearTimeout(_autoBattleTimer);doAutoMove();}
}

function newAutoBattle(){
  // Discard current log silently and restart
  _autoBattleLog=null;autoBattleActive=false;
  clearTimeout(_autoBattleTimer);
  startAutoBattle();
}

function stopAutoBattle(){
  if(!autoBattleActive)return;
  const log=_autoBattleLog;
  autoBattleActive=false;autoBattlePaused=false;
  _splitIntroAnim.active=false;
  _pgStop();
  allSprites.forEach(s=>s.traverse(c=>c.layers.enableAll())); // restore main pieces to all layers
  _forEachBlob(c=>c.layers.enableAll());
  clearTimeout(_autoBattleTimer);
  clearVis();
  _updateAutoBattleUI();
  if(log&&log.moves.length>0){
    log.result='STOPPED_BY_USER';log.endTime=Date.now();
    _showAutoReport();
  } else {
    turnEl.textContent='White to move';
  }
}

function openBattleSelector(){
  if(testModeActive)return;
  autoRotate=false;
  // Hide other UI elements immediately
  document.getElementById('aiWrap').style.display='none';
  document.getElementById('newGameBtn').style.display='none';
  document.getElementById('testBtn').style.display='none';
  document.getElementById('turn').style.display='none';
  document.getElementById('autoBattleBtn').style.display='none';
  // Show the three selector elements at their fixed positions
  document.getElementById('splitRow').style.display='flex';
  document.getElementById('battleStartBtn').style.display='block';
  document.getElementById('battleCancelBtn').style.display='block';
  // Give each panel its own copy of the current globe orientation and camera distance
  _mvPanelQ.forEach(q=>q.copy(globe.quaternion));
  _mvPanelDist.forEach((_,i)=>{ _mvPanelDist[i]=camera.position.z; });
  _dragCi=-1;
  if(multiViewMode===0) setSplitView(0);
}

function closeBattleSelector(){
  // Restore all hidden elements
  document.getElementById('aiWrap').style.display='';
  document.getElementById('newGameBtn').style.display='';
  document.getElementById('testBtn').style.display='';
  document.getElementById('turn').style.display='';
  document.getElementById('autoBattleBtn').style.display='';
  // Hide selector elements
  document.getElementById('splitRow').style.display='none';
  document.getElementById('battleStartBtn').style.display='none';
  document.getElementById('battleCancelBtn').style.display='none';
  setSplitView(0);
}

function _updatePanelInfo(text){
  const el=document.getElementById('panelInfo');
  if(!autoBattleActive||multiViewMode===0){el.style.display='none';return;}
  el.style.display='block';
  const layout=_mvLayout();
  if(!layout){el.style.display='none';return;}
  el.innerHTML=layout.map(({x,y,w})=>
    `<div class="pi" style="left:${x+w/2}px;top:${y+14}px">${text}</div>`
  ).join('');
}

function _updateAutoBattleUI(){
  const btn=document.getElementById('autoBattleBtn');
  const ctrl=document.getElementById('autoBattleControls');
  const aw=document.getElementById('aiWrap');
  const ng=document.getElementById('newGameBtn');
  const tb=document.getElementById('testBtn');
  const turn=document.getElementById('turn');
  if(autoBattleActive){
    btn.style.display='none';
    // Hide selector elements (in case battle started from selector)
    document.getElementById('splitRow').style.display='none';
    document.getElementById('battleStartBtn').style.display='none';
    document.getElementById('battleCancelBtn').style.display='none';
    ctrl.style.display='flex';
    // Hide other UI elements that should not be accessible during battle
    aw.style.display='none';
    ng.style.display='none';
    tb.style.display='none';
    // Hide the central turn indicator when split view shows per-panel info
    if(multiViewMode>0) turn.style.display='none';
    document.getElementById('autoPauseBtn').textContent='Pause';
  } else {
    btn.style.display='';
    ctrl.style.display='none';
    // Restore all hidden elements
    aw.style.display='';
    ng.style.display='';
    tb.style.display='';
    turn.style.display='';
    _updatePanelInfo('');
  }
}

// ── Report generation ─────────────────────────────────────────────────────────
function _showAutoReport(){
  const log=_autoBattleLog;if(!log)return;
  const dur=log.endTime?Math.round((log.endTime-log.startTime)/1000):0;
  const durStr=dur<60?dur+'s':Math.floor(dur/60)+'m '+(dur%60)+'s';

  const LABELS={
    BLACK_WINS_CHECKMATE:'⬛ BLACK WINS — Checkmate',
    WHITE_WINS_CHECKMATE:'⬜ WHITE WINS — Checkmate',
    WHITE_RESIGNS:       '⬛ BLACK WINS — White resigns',
    BLACK_RESIGNS:       '⬜ WHITE WINS — Black resigns',
    DRAW_AGREEMENT:      '½  DRAW — By mutual agreement',
    DRAW_STALEMATE:      '½  DRAW — Stalemate',
    DRAW_REPETITION:     '½  DRAW — 3-fold Repetition',
    DRAW_MOVE_LIMIT:     `½  DRAW — ${AUTO_MAX_MOVES}-move Limit`,
    DRAW_FIFTY_MOVE:     '½  DRAW — 50-move Rule',
    DRAW_INSUF_MATERIAL: '½  DRAW — Insufficient Material (K/K+minor vs K/K+minor)',
    ERROR_NO_MOVE:       '⚠  ERROR — AI returned null move',
    ERROR_EMPTY_SQUARE:  '⚠  ERROR — Move from empty square',
    STOPPED_BY_USER:     '⏹  Stopped by user'
  };
  const resultLabel=LABELS[log.result]||log.result;

  const capLine=(arr,label)=>{
    if(!arr.length)return `${label}: — (nothing captured)`;
    const grp={};arr.forEach(({t,v})=>{if(!grp[t])grp[t]={n:0,total:0,each:v};grp[t].n++;grp[t].total+=v;});
    const total=arr.reduce((s,{v})=>s+v,0);
    const parts=Object.entries(grp).map(([t,{n,total}])=>`${t}×${n} (${total}pts)`).join(' + ');
    return `${label}: ${parts}  →  total ${total} pts`;
  };

  const pad=(s,w)=>{s=String(s);return s.length>=w?s:s+' '.repeat(w-s.length);};

  // Header row
  const hdr='  #  Color  Piece  From→To   Captured       Special    Think';
  const moveLines=log.moves.map(m=>{
    const capS=m.captured?`×${m.captured}[${m.captureVal}pts]`:'—';
    const spec=m.special||'—';
    const col=m.color==='white'?'White':'Black';
    return `${pad(m.n,4)} ${pad(col,6)} ${pad(m.piece,6)} ${m.from}→${pad(m.to,4)}  ${pad(capS,14)} ${pad(spec,10)} ${m.thinkMs}ms`;
  }).join('\n');

  const anomLines=log.anomalies.length===0?'  (none detected)'
    :log.anomalies.map(a=>[
        `  [Move #${a.n}] TYPE: ${a.type}`,
        `  DESC: ${a.desc}`,
        Object.keys(a.extra).length?`  EXTRA: ${JSON.stringify(a.extra)}`:'',
        `  TURN: ${a.turn}`,
        `  BOARD:\n${a.snap.split('\n').map(l=>'    '+l).join('\n')}`
      ].filter(Boolean).join('\n')).join('\n\n');

  const B='═'.repeat(62);
  const b='─'.repeat(62);
  const report=
`${B}
  GLOBE CHESS — AI vs AI BATTLE REPORT  #${log.gameNum}
${B}

  Date      : ${new Date(log.startTime).toLocaleString()}
  Duration  : ${durStr}
  Result    : ${resultLabel}
  Total moves: ${log.moves.length}  (limit: ${AUTO_MAX_MOVES})

CAPTURES
${b}
  ${capLine(log.wCapt,'White captured')}
  ${capLine(log.bCapt,'Black captured')}

MOVE LOG
${b}
${hdr}
${b}
${moveLines||'  (no moves played)'}

ANOMALIES  (${log.anomalies.length} detected)
${b}
${anomLines}

BOARD STATE AT END
${b}
${_autoBoardSnap()}
SYSTEM INFO
${b}
  Globe Chess Auto Battle  v2
  AI for both sides  : evaluate() + iterative deepening α-β + quiescence(4) + PST + pawn structure
  White strategy     : minimize evaluate()  (PST, development, polar-tactics, pawn structure)
  Black strategy     : maximize evaluate()  (PST, development, polar-tactics, pawn structure)
  Search             : iterative deepening depth 1→8, ${_AUTO_THINK_MS/1000}s limit, capture bonus 12%, globe spectacle bonus
  Legal move filter  : getLegalMoves() — no illegal moves executed
  Repetition rule    : 3× same position → draw
  50-move rule       : 100 half-moves without capture or pawn advance → draw
  Insuf. material    : K/K+minor vs K/K+minor → draw
  Resignation        : eval ≥ ${RESIGN_THRESHOLD} pts for ${RESIGN_STREAK} consecutive half-moves
  Draw by agreement  : |eval| ≤ ${DRAW_EVAL_RANGE} pts for ${DRAW_STREAK} consecutive half-moves (after move 40)
  Move limit         : ${AUTO_MAX_MOVES} moves → draw
${B}`;

  document.getElementById('reportText').value=report;
  document.getElementById('reportModal').classList.add('visible');
}

function closeReport(){
  document.getElementById('reportModal').classList.remove('visible');
  if(!autoBattleActive)turnEl.textContent=turnColor==='white'?'White to move':'Black to move';
}

function copyReport(){
  const ta=document.getElementById('reportText');
  ta.select();ta.setSelectionRange(0,99999);
  try{navigator.clipboard?.writeText(ta.value);}catch(e){}
  try{document.execCommand('copy');}catch(e){}
  const btn=document.getElementById('copyReportBtn');
  const orig=btn.textContent;
  btn.textContent='Copied ✓';
  setTimeout(()=>btn.textContent=orig,1800);
}

animate();
</script>
