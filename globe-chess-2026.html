// ─── Sound Effects (Web Audio API) ───────────────────────────────────────────
let _ac=null;
function getAC(){
  if(!_ac)try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(_ac?.state==='suspended')_ac.resume(); return _ac;
}
function sfxNoise(freq,vol,tau,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const N=Math.ceil(ctx.sampleRate*0.16);
  const buf=ctx.createBuffer(1,N,ctx.sampleRate); const d=buf.getChannelData(0);
  const k=ctx.sampleRate*tau;
  for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/k);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=freq; bpf.Q.value=1.1;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); src.start(t);
}
function sfxTone(freq,vol,dur,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+dur+0.02);
}
// Crisp mechanical click (like a mouse button): very short noise burst, high-Q bandpass
function sfxClick(freq,vol,tau,delay=0){
  const ctx=getAC();if(!ctx)return; const t=ctx.currentTime+delay;
  const N=Math.ceil(ctx.sampleRate*0.05);
  const buf=ctx.createBuffer(1,N,ctx.sampleRate); const d=buf.getChannelData(0);
  const k=ctx.sampleRate*tau;
  for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/k);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bpf=ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=freq; bpf.Q.value=3.5;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bpf); bpf.connect(g); g.connect(ctx.destination); src.start(t);
}
// Each piece has its own pitch signature — listener can identify the piece by sound
const _PC={P:{f:1500,v:0.28,tau:0.004},N:{f:860,v:0.40,tau:0.006},
           B:{f:1180,v:0.34,tau:0.005},R:{f:600,v:0.46,tau:0.008},
           Q:{f:760,v:0.44,tau:0.007},K:{f:500,v:0.42,tau:0.009}};
function playMove(type){ const c=_PC[type]||_PC.P; sfxClick(c.f,c.v,c.tau); }
// Capture: collision impact — low thud body + mid crunch + sharp high transient
function playCapture(){ sfxNoise(150,0.88,0.040); sfxNoise(360,0.52,0.022); sfxClick(1800,0.22,0.003); }
// Castle: king click + lighter rook click
function playCastle() { sfxClick(500,0.42,0.009); sfxClick(900,0.30,0.005,0.19); }
// Check: keep existing rising two-tone
function playCheck()  { sfxTone(740,0.22,0.14); sfxTone(980,0.17,0.22,0.13); }
// Game over: ascending C-E-G-C arpeggio — mission complete feeling
function playGameOver(){ sfxTone(523,0.16,0.20); sfxTone(659,0.15,0.20,0.22);
                         sfxTone(784,0.15,0.22,0.44); sfxTone(1047,0.20,0.40,0.66); }

// ─── Capture Fly-Away Animation ───────────────────────────────────────────────
let captureFlyAnims=[];
function startCaptureFade(cap){
  cap.sprite.traverse(child=>{
    if(child.isMesh&&child.material){
      child.material=child.material.clone();
      child.material.transparent=true;
      child.material.opacity=1;
    }
  });
  captureFlyAnims.push({sprite:cap.sprite,t:0,dur:0.5});
}


function execMove(fromLat,fromLon,toLat,toLon){
  const piece=board[fromLat][fromLon];
  if(!piece||moveAnim)return;
  const move=currentTargets.find(m=>m.lat===toLat&&m.lon===toLon);
  // Store captured piece — remove blob, defer sprite removal until fade
  let capturedPiece=null;
  if(board[toLat][toLon]){
    capturedPiece=board[toLat][toLon];
    globe.remove(capturedPiece.blob);
    const i=allSprites.indexOf(capturedPiece.sprite);if(i>=0)allSprites.splice(i,1);
  }
  board[toLat][toLon]=piece;
  board[fromLat][fromLon]=null;
  piece.hasMoved=true;
  piece.sprite.userData.lat=toLat;
  piece.sprite.userData.lon=toLon;
  // Stop bounce BEFORE capturing fromPos so animation starts from cell center,
  // not from a mid-bounce lifted position.
  if(autoBattleActive) stopBounce();
  const fromPos=piece.sprite.position.clone();
  const animPts=computeAnimPath(move,fromLat,fromLon,toLat,toLon,fromPos);
  if(!autoBattleActive) clearVis(); // In auto-battle keep path visible while piece moves
  // En passant: remove the captured pawn from board & scene immediately
  let epCaptured=null;
  if(move?.isEnPassant){
    epCaptured=board[move.capturedLat][move.capturedLon];
    if(epCaptured){
      globe.remove(epCaptured.blob);
      const ei=allSprites.indexOf(epCaptured.sprite);if(ei>=0)allSprites.splice(ei,1);
      board[move.capturedLat][move.capturedLon]=null;
      setTimeout(()=>startCaptureFade(epCaptured),300);
    }
  }
  // Always play the moving piece's click sound the moment it starts moving
  if(move?.isCastle) playCastle(); else playMove(piece.type);
  // Schedule captured piece fade — collision sound fires exactly when piece starts disappearing
  if(capturedPiece){
    const pathLen=animPts.reduce((s,p,i)=>i===0?0:s+p.distanceTo(animPts[i-1]),0);
    setTimeout(()=>{startCaptureFade(capturedPiece);playCapture();},Math.max(0,calcMoveDur(pathLen)-500));
  }
  // En passant: collision sound fires when the passed pawn starts fading
  if(epCaptured){
    setTimeout(()=>{startCaptureFade(epCaptured);playCapture();},300);
  }
  startMoveAnim(piece.sprite,piece.blob,animPts,()=>{
    const finalPos=cellPos(toLat,toLon,R);
    piece.sprite.position.copy(finalPos);
    orientPiece(piece.sprite,finalPos);
    if(piece.type==='N') faceKnightTowardPole(piece.sprite,finalPos,piece.color==='white');
    piece.blob.position.copy(finalPos);
    orientPiece(piece.blob,finalPos);
    if(piece.type==='P'){
      const promLat=piece.color==='black'?7:0;
      if(toLat===promLat){
        piece.type='Q';
        globe.remove(piece.sprite);
        const idx=allSprites.indexOf(piece.sprite);if(idx>=0)allSprites.splice(idx,1);
        const newGrp=createPieceMesh('Q',piece.color==='black');
        newGrp.position.copy(finalPos);
        orientPiece(newGrp,finalPos);
        newGrp.userData={isPiece:true,lat:toLat,lon:toLon};
        globe.add(newGrp); allSprites.push(newGrp);
        if(multiViewMode>0&&autoBattleActive) newGrp.traverse(c=>c.layers.set(1));
        piece.sprite=newGrp; board[toLat][toLon]=piece;
      }
    }
    // Castling: snap rook to its new position
    if(move?.isCastle){      const rook=board[toLat][move.rookFromLon];
      if(rook){
        board[toLat][move.rookToLon]=rook;
        board[toLat][move.rookFromLon]=null;
        rook.hasMoved=true;
        rook.sprite.userData.lat=toLat;
        rook.sprite.userData.lon=move.rookToLon;
        const rookPos=cellPos(toLat,move.rookToLon,R);
        rook.sprite.position.copy(rookPos); orientPiece(rook.sprite,rookPos);
        rook.blob.position.copy(rookPos);   orientPiece(rook.blob,rookPos);
      }
    }
    // Test mode: no turn alternation; after each move check both kings for threats
    if(testModeActive){
      // Update en passant target so en passant captures work in test mode
      enPassantTarget=(piece.type==='P'&&Math.abs(toLat-fromLat)===2)
        ?{lat:Math.round((fromLat+toLat)/2),lon:toLon}:null;
      clearCheckRing();
      for(const col of['white','black']){
        if(isInCheck(col)){
          for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
            if(board[la][lo]?.type==='K'&&board[la][lo]?.color===col){showCheckRing(la,lo);}
          showCheckThreats(col);
        }
      }
      turnEl.textContent='Test mode — tap any piece';
      return;
    }
    // Update en passant target for the next turn
    enPassantTarget=(piece.type==='P'&&Math.abs(toLat-fromLat)===2)
      ?{lat:Math.round((fromLat+toLat)/2),lon:toLon}:null;
    turnColor=turnColor==='black'?'white':'black';
    clearCheckRing();
    const inCheck=isInCheck(turnColor);
    const hasMove=hasAnyLegalMove(turnColor);
    if(!hasMove){
      if(inCheck){
        const winner=turnColor==='white'?'Black':'White';
        turnEl.textContent=winner+' wins — checkmate';
        playGameOver();
        if(autoBattleActive){const r=turnColor==='white'?'BLACK_WINS_CHECKMATE':'WHITE_WINS_CHECKMATE';setTimeout(()=>_endAutoGame(r),600);}
      } else {
        turnEl.textContent='Stalemate  —  draw';
        if(autoBattleActive){setTimeout(()=>_endAutoGame('DRAW_STALEMATE'),600);}
      }
      return;
    }
    if(inCheck){
      for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
        if(board[la][lo]?.type==='K'&&board[la][lo]?.color===turnColor){showCheckRing(la,lo);}
      showCheckThreats(turnColor);
      turnEl.textContent=(turnColor==='black'?'Black':'White')+' to move  —  check';
      playCheck();
    } else {
      turnEl.textContent=turnColor==='black'?'Black to move':'White to move';
    }
    if(autoBattleActive&&!autoBattlePaused){
      _autoBattleTimer=setTimeout(doAutoMove,AUTO_DELAY);
    } else if(aiMode&&turnColor===AI_COLOR){
      turnEl.textContent=inCheck?'AI thinking… (check)':'AI thinking…';
      setTimeout(doAiMove,700);
    }
  });
  setMoveAnimPiece(piece.type,piece.color==='white');
}

// ─── Hit Detection (screen-space) ─────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const _hWP=new THREE.Vector3();
function screenXY(worldPos){
  worldPos.project(camera);
  return{sx:(worldPos.x*0.5+0.5)*innerWidth,sy:(-worldPos.y*0.5+0.5)*innerHeight};
}
function hitTest(cx,cy){
  globe.updateMatrixWorld(true);
  const DOT_PX=38;
  let bestDot=null, bestDotD=DOT_PX;
  for(const o of visObjects){
    if(!o.userData.isMoveTarget)continue;
    o.getWorldPosition(_hWP);
    if(_hWP.dot(camera.position)<=0)continue;
    const{sx,sy}=screenXY(_hWP.clone());
    const d=Math.hypot(cx-sx,cy-sy);
    if(d<bestDotD){bestDotD=d;bestDot=o;}
  }
  if(bestDot)return{kind:'dot',...bestDot.userData};
  const PIECE_PX=40;
  let bestPiece=null, bestPieceDist=Infinity;
  for(const grp of allSprites){
    if(!grp.visible)continue; // skip hidden pieces (test mode)
    grp.getWorldPosition(_hWP);
    if(_hWP.dot(camera.position)<=0)continue; // back hemisphere
    const{sx,sy}=screenXY(_hWP.clone());
    const screenDist=Math.hypot(cx-sx,cy-sy);
    if(screenDist>PIECE_PX)continue; // outside touch radius
    // Among pieces within touch radius, pick the one closest to camera (frontmost)
    const camDist=_hWP.distanceTo(camera.position);
    if(camDist<bestPieceDist){bestPieceDist=camDist;bestPiece=grp;}
  }
  if(bestPiece)return{kind:'piece',...bestPiece.userData};
  raycaster.setFromCamera({x:(cx/innerWidth)*2-1,y:-(cy/innerHeight)*2+1},camera);
  const ch=raycaster.intersectObjects(cellMeshes);
  if(ch.length)return{kind:'cell',...ch[0].object.userData};
  return null;
}

// ─── Rotation + Interaction ────────────────────────────────────────────────────
let dragging=false,prev={x:0,y:0},vel={x:0,y:0},autoRotate=false;
let pDownPos=null;
const WX=new THREE.Vector3(1,0,0),WY=new THREE.Vector3(0,1,0);
const _qx=new THREE.Quaternion(),_qy=new THREE.Quaternion();

const introSpinAxis=new THREE.Vector3(1/Math.SQRT2,1/Math.SQRT2,0);
// Final view: qX(-90°) rotates south pole to face camera;
// qZ(-90°) rotates ring so K+Q (phi=π) lands at upper center,
// and Rooks (phi≈0) land at lower screen — "K+Q upper center, Rooks lower"
const introFinalQ=(()=>{
  const qX=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2);
  const qZ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-Math.PI/2);
  return new THREE.Quaternion().multiplyQuaternions(qZ,qX);
})();
// introR0 = q(-3π, spinAxis)·introFinalQ so q(3π)·introR0 = identity·introFinalQ ✓
const introR0=(()=>{
  const qSpin=new THREE.Quaternion().setFromAxisAngle(introSpinAxis,-3*Math.PI);
  return new THREE.Quaternion().multiplyQuaternions(qSpin,introFinalQ);
})();
const _introQspin=new THREE.Quaternion();
let introAnim={t:0,done:false};

renderer.domElement.addEventListener('touchstart',e=>{
  // Don't hijack touches that started on a UI button/control
  if(e.target!==renderer.domElement)return;
  e.preventDefault();
},{passive:false});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.target!==renderer.domElement)return;

// ─── Multi-pointer rotation + pinch zoom ──────────────────────────────────────
function applyDelta(dx,dy){
  const s=2*Math.tan(21*Math.PI/180)*camera.position.z/innerHeight;
  if(multiViewMode>0&&_dragCi>=0){
    _qy.setFromAxisAngle(_mvUps[_dragCi],   dx*s);
    _qx.setFromAxisAngle(_mvRights[_dragCi],dy*s);
    if(autoBattleActive){
      // Battle: accumulate user offset in _mvBattleQ; auto-tracking still runs underneath
      _mvBattleQ[_dragCi].premultiply(_qy).premultiply(_qx);
    } else {
      _mvPanelQ[_dragCi].premultiply(_qy).premultiply(_qx);
    }
  } else {
    _qy.setFromAxisAngle(WY,dx*s);
    _qx.setFromAxisAngle(WX,dy*s);
    globe.quaternion.premultiply(_qy).premultiply(_qx);
  }
}
const activePointers=new Map();
let prevMidX=0,prevMidY=0,prevPinchDist=0,prevFingerAngle=null;

renderer.domElement.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!introAnim.done){introAnim.done=true;globe.quaternion.copy(introFinalQ);}
  renderer.domElement.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  autoRotate=false; vel={x:0,y:0}; dragging=true;
  document.body.classList.add('dragging');
  // In split-view preview mode, find which panel was touched
  if(multiViewMode>0){
    _dragCi=-1;
    const layout=_mvLayout();
    if(layout) for(const{ci,x,y,w,h}of layout){
      if(e.clientX>=x&&e.clientX<x+w&&e.clientY>=y&&e.clientY<y+h){_dragCi=ci;break;}
    }
  }
  const pts=[...activePointers.values()];
  if(pts.length===1){
    prevMidX=pts[0].x; prevMidY=pts[0].y;
    pDownPos={x:e.clientX,y:e.clientY};
  } else {
    prevMidX=(pts[0].x+pts[1].x)/2; prevMidY=(pts[0].y+pts[1].y)/2;
    prevPinchDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    prevFingerAngle=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
    pDownPos=null; // cancel tap when two fingers touch
    // Re-detect panel from midpoint so pinch zoom targets the right panel
    if(multiViewMode>0){
      _dragCi=-1;
      const layout=_mvLayout();
      if(layout) for(const{ci,x,y,w,h}of layout){
        if(prevMidX>=x&&prevMidX<x+w&&prevMidY>=y&&prevMidY<y+h){_dragCi=ci;break;}
      }
    }
  }
});

renderer.domElement.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...activePointers.values()];
  if(pts.length===1){
    const dx=pts[0].x-prevMidX, dy=pts[0].y-prevMidY;
    prevMidX=pts[0].x; prevMidY=pts[0].y;
    vel={x:dx,y:dy};
    applyDelta(dx,dy);
  } else if(pts.length>=2){
    const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    // Pinch zoom — per-panel in split-view preview, shared camera otherwise
    if(multiViewMode>0&&_dragCi>=0){
      _mvPanelDist[_dragCi]=Math.max(1.6,Math.min(7,_mvPanelDist[_dragCi]+(prevPinchDist-dist)*0.012));
    } else {
      camera.position.z=Math.max(1.6,Math.min(7,camera.position.z+(prevPinchDist-dist)*0.012));
    }
    // Two-finger wheel: compute angle of finger-pair, delta → rotate around view axis
    const angle=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
    if(prevFingerAngle!==null){
      let da=angle-prevFingerAngle;
      if(da>Math.PI)da-=2*Math.PI;
      if(da<-Math.PI)da+=2*Math.PI;
      if(multiViewMode>0&&_dragCi>=0){
        const qRollPanel=new THREE.Quaternion().setFromAxisAngle(_mvPds[_dragCi],-da);
        if(autoBattleActive){
          _mvBattleQ[_dragCi].premultiply(qRollPanel);
        } else {
          _mvPanelQ[_dragCi].premultiply(qRollPanel);
        }
      } else {
        const qRoll=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-da);
        globe.quaternion.premultiply(qRoll);
      }
    }
    prevFingerAngle=angle;
    prevMidX=mx; prevMidY=my; prevPinchDist=dist;
  }
});

renderer.domElement.addEventListener('pointerup',e=>{
  renderer.domElement.releasePointerCapture(e.pointerId);
  const wasOne=activePointers.size===1;
  activePointers.delete(e.pointerId);
  dragging=activePointers.size>0;
  if(!dragging) document.body.classList.remove('dragging');
  // Tap detection only on single-finger lift
  if(wasOne&&pDownPos){
    const dx=e.clientX-pDownPos.x, dy=e.clientY-pDownPos.y;
    pDownPos=null;
    // During auto-battle, ignore taps — prevent accidental touches on mobile from
    // clearing the move visualization (clearVis) and currentTargets needed by execMove.
    if(autoBattleActive){}
    else if(Math.hypot(dx,dy)<8&&!aiThinking){
      const hit=hitTest(e.clientX,e.clientY);
      if(hit?.kind==='dot'){
        if(selectedCell)execMove(selectedCell.lat,selectedCell.lon,hit.lat,hit.lon);
        return;
      }
      if(hit?.kind==='piece'||hit?.kind==='cell'){
        const{lat,lon}=hit;
        const piece=board[lat]?.[lon];
        // In test mode: if the clicked piece is an enemy AND a valid capture target → execute capture
        if(testModeActive&&selectedCell&&piece){
          const selPiece=board[selectedCell.lat]?.[selectedCell.lon];
          if(selPiece&&piece.color!==selPiece.color){
            const isTarget=currentTargets.some(t=>t.lat===lat&&t.lon===lon);
            if(isTarget){execMove(selectedCell.lat,selectedCell.lon,lat,lon);return;}
          }
        }
        if(piece&&(piece.color===turnColor||testModeActive)){
          if(selectedCell?.lat===lat&&selectedCell?.lon===lon)clearVis();
          else showMoves(lat,lon);
          return;
        }
        if(selectedCell){
          const isTarget=currentTargets.some(t=>t.lat===lat&&t.lon===lon);
          if(isTarget){execMove(selectedCell.lat,selectedCell.lon,lat,lon);return;}
        }
        clearVis();
      } else clearVis();
    }
  } else { pDownPos=null; }
  // Re-init midpoint for remaining finger
  if(activePointers.size===1){
    const pt=[...activePointers.values()][0];
    prevMidX=pt.x; prevMidY=pt.y; prevFingerAngle=null;
  }
});

renderer.domElement.addEventListener('pointerleave',e=>{
  activePointers.delete(e.pointerId);
  if(activePointers.size===0){dragging=false;document.body.classList.remove('dragging');}
});

renderer.domElement.addEventListener('wheel',e=>{camera.position.z=Math.max(1.6,Math.min(7,camera.position.z+e.deltaY*0.008));},{passive:true});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ─── AI Player (minimax + alpha-beta, depth 3) ────────────────────────────────
const AI_COLOR='black', HUMAN_COLOR='white';
let aiMode=false, aiThinking=false;
const AI_PVAL={K:20000,Q:950,R:500,B:345,N:330,P:100};
const AI_POS=[6,10,13,16,16,13,10,6];

function aiMoves(lat,lon){
  const piece=board[lat][lon]; if(!piece)return[];
  const{type,color}=piece; const mvs=[];
  const ok=l=>l>=0&&l<=7;
  const ally=(l,n)=>ok(l)&&board[l][n]?.color===color;
  const occ=(l,n)=>ok(l)&&board[l][n];
  function slide(dl,dn){
    let l=lat,n=lon,pole=null,cDl=dl;
    for(let i=0;i<15;i++){
      l+=cDl;n=wL(n+dn);
      if(dl!==0&&(l<0||l>7)){if(pole)break;const r=poleRef(l,n);l=r.l;n=r.n;cDl=-cDl;pole=r.pole;}
      else if(dl===0&&!ok(l))break;
      if(!ok(l)||ally(l,n))break;
      mvs.push({tLat:l,tLon:n});
      if(occ(l,n))break;
    }
  }
  function diagS(dl,dn){
    let l=lat,n=lon,cDl=dl,cDn=dn;
    for(let i=0;i<14;i++){
      const nb=n;l+=cDl;n=wL(n+cDn);
      if(l<0){l=0;n=wL(nb+4);cDl=1;cDn=-cDn;}
      else if(l>7){l=7;n=wL(nb+4);cDl=-1;cDn=-cDn;}
      if(ally(l,n))break;
      mvs.push({tLat:l,tLon:n});
      if(occ(l,n))break;
    }
  }
  if(type==='R'||type==='Q'){slide(1,0);slide(-1,0);slide(0,1);slide(0,-1);}
  if(type==='B'||type==='Q'){diagS(1,1);diagS(1,-1);diagS(-1,1);diagS(-1,-1);}
  if(type==='N'){
    for(const[dl,dn]of[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){
      let l=lat+dl,n=wL(lon+dn);
      if(l<0||l>7){const r=poleRef(l,n);l=r.l;n=r.n;}
      if(ok(l)&&!ally(l,n))mvs.push({tLat:l,tLon:n});
    }
  }
  if(type==='K'){
    for(let dl=-1;dl<=1;dl++)for(let dn=-1;dn<=1;dn++){
      if(!dl&&!dn)continue;
      let l=lat+dl, n=wL(lon+dn);
      if(l<0||l>7){
        if(dn!==0)continue;      // all pole crossings converge — add once only
        l=l<0?-1-l:15-l;        // reflected lat
        n=wL(lon+4);              // pre-step lon + 4
      }
      if(ok(l)&&!ally(l,n))mvs.push({tLat:l,tLon:n});
    }
    if(!piece.hasMoved){
      const rQ=board[lat][0];
      if(rQ?.type==='R'&&!rQ.hasMoved&&rQ.color===color&&!board[lat][1]&&!board[lat][2])
        mvs.push({tLat:lat,tLon:1,isCastle:true,rookFromLon:0,rookToLon:2});
      const rK=board[lat][7];
      if(rK?.type==='R'&&!rK.hasMoved&&rK.color===color&&!board[lat][4]&&!board[lat][5]&&!board[lat][6])
        mvs.push({tLat:lat,tLon:5,isCastle:true,rookFromLon:7,rookToLon:4});
    }
  }
  if(type==='P'){
    const dir=color==='black'?1:-1,start=color==='black'?1:6;
    const fl=lat+dir;
    if(ok(fl)&&!board[fl][lon]){
      mvs.push({tLat:fl,tLon:lon});
      if(lat===start&&!board[fl+dir]?.[lon])mvs.push({tLat:fl+dir,tLon:lon});
    }
    for(const cn of[wL(lon-1),wL(lon+1)])
      if(ok(fl)&&board[fl][cn]?.color!==color&&board[fl][cn])mvs.push({tLat:fl,tLon:cn});
    if(enPassantTarget&&ok(fl))
      for(const cn of[wL(lon-1),wL(lon+1)])
        if(fl===enPassantTarget.lat&&cn===enPassantTarget.lon)
          mvs.push({tLat:fl,tLon:cn,isEnPassant:true,capturedLat:lat,capturedLon:cn});
  }
  return mvs;
}
function allAIMoves(color){
  const out=[];
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    if(board[la][lo]?.color!==color)continue;
    aiMoves(la,lo).forEach(m=>out.push({fLat:la,fLon:lo,...m}));
  }
  return out;
}
function aiEval(){
  let s=0;
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p)continue;
    const v=AI_PVAL[p.type]+AI_POS[la];
    const adv=p.type==='P'?(p.color==='black'?la*5:(7-la)*5):0;
    s+=p.color==='black'?v+adv:-(v+adv);
  }
  return s;
}
function aiApply(m){
  const c=board[m.tLat][m.tLon];
  const piece=board[m.fLat][m.fLon];
  const prevEP=enPassantTarget;
  // Update en passant target BEFORE promotion changes the type
  enPassantTarget=(piece&&piece.type==='P'&&Math.abs(m.tLat-m.fLat)===2)
    ?{lat:Math.round((m.fLat+m.tLat)/2),lon:m.tLon}:null;
  board[m.tLat][m.tLon]=piece; board[m.fLat][m.fLon]=null;
  // Promotion: pawn reaching opposite end becomes queen (visible to deeper search levels)
  let wasType=null;
  if(piece&&piece.type==='P'){
    const promLat=piece.color==='black'?7:0;
    if(m.tLat===promLat){wasType='P';piece.type='Q';}
  }
  if(m.isCastle){board[m.tLat][m.rookToLon]=board[m.tLat][m.rookFromLon];board[m.tLat][m.rookFromLon]=null;}
  let epCap=null;
  if(m.isEnPassant){epCap=board[m.capturedLat][m.capturedLon];board[m.capturedLat][m.capturedLon]=null;}
  return{c,epCap,wasType,prevEP};
}
function aiUndo(m,piece,sv){
  if(sv.wasType)piece.type=sv.wasType;
  board[m.fLat][m.fLon]=piece; board[m.tLat][m.tLon]=sv.c||null;
  enPassantTarget=sv.prevEP;
  if(m.isCastle){board[m.tLat][m.rookFromLon]=board[m.tLat][m.rookToLon];board[m.tLat][m.rookToLon]=null;}
  if(m.isEnPassant&&sv.epCap)board[m.capturedLat][m.capturedLon]=sv.epCap;
}
function minimax(depth,alpha,beta,maxing){
  if(depth===0)return aiEval();
  const color=maxing?'black':'white';
  const moves=allAIMoves(color);
  if(!moves.length)return maxing?-18000:18000;
  moves.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?AI_PVAL[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?AI_PVAL['P']:0);
    const vb=(board[b.tLat][b.tLon]?AI_PVAL[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?AI_PVAL['P']:0);
    return vb-va;
  });
  let best=maxing?-Infinity:Infinity;
  for(const m of moves){
    const piece=board[m.fLat][m.fLon];
    const sv=aiApply(m);
    const score=minimax(depth-1,alpha,beta,!maxing);
    aiUndo(m,piece,sv);
    if(maxing){if(score>best)best=score;if(score>alpha)alpha=score;}
    else{if(score<best)best=score;if(score<beta)beta=score;}
    if(beta<=alpha)break;
  }
  return best;
}
function getBestAIMove(){
  const moves=allAIMoves(AI_COLOR); if(!moves.length)return null;
  for(let i=moves.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[moves[i],moves[j]]=[moves[j],moves[i]];}
  moves.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?AI_PVAL[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?AI_PVAL['P']:0);
    const vb=(board[b.tLat][b.tLon]?AI_PVAL[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?AI_PVAL['P']:0);
    return vb-va;
  });
  let best=null,bestScore=-Infinity;
  for(const m of moves){
    const piece=board[m.fLat][m.fLon];
    const sv=aiApply(m);
    const score=minimax(2,-Infinity,Infinity,false);
    aiUndo(m,piece,sv);
    if(score>bestScore){bestScore=score;best=m;}
  }
  return best;
}

// Globe rotation animation
let globeRotAnim=null;
function rotateGlobeToFace(localDir,dur,onDone){
  const worldDir=localDir.clone().normalize().applyQuaternion(globe.quaternion);
  if(worldDir.z>0.88){if(onDone)onDone();return;}
  const Qr=new THREE.Quaternion().setFromUnitVectors(worldDir,new THREE.Vector3(0,0,1));
  const endQ=new THREE.Quaternion().multiplyQuaternions(Qr,globe.quaternion);
  globeRotAnim={startQ:globe.quaternion.clone(),endQ,t:0,dur:dur||650,onDone};
}

function doAiMove(){
  if(!aiMode||aiThinking||turnColor!==AI_COLOR)return;
  aiThinking=true;
  turnEl.textContent='AI thinking… depth 1';
  _findBestMove(AI_COLOR,_AI_THINK_MS,
    (depth,elapsed)=>{turnEl.textContent=`AI thinking… depth ${depth} (${(elapsed/1000).toFixed(1)}s)`;},
    (m)=>{
      if(!m){aiThinking=false;turnEl.textContent='Black has no moves.';return;}
      const localDir=cellPos(m.fLat,m.fLon,R).normalize();
      rotateGlobeToFace(localDir,650,()=>{
        showMoves(m.fLat,m.fLon);
        setTimeout(()=>{aiThinking=false;execMove(m.fLat,m.fLon,m.tLat,m.tLon);},480);
      });
    }
  );
}

function resetGame(){
  if(testModeActive){
    // clean up test pieces before full reset
    for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
      const p=board[la][lo];if(!p)continue;
      globe.remove(p.sprite);globe.remove(p.blob);
      const i=allSprites.indexOf(p.sprite);if(i>=0)allSprites.splice(i,1);
      board[la][lo]=null;
    }
    testModeActive=false; _testSave=null;
    document.getElementById('testPanel').classList.remove('visible');
    document.querySelectorAll('.tpb.sel').forEach(b=>b.classList.remove('sel'));
    document.getElementById('testStartBtn').disabled=true;
    const btn=document.getElementById('testBtn');
    btn.textContent='Test mode'; btn.classList.remove('active');
  }
  if(moveAnim)moveAnim=null;
  clearVis();
  clearCheckRing();
  enPassantTarget=null;
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p)continue;
    globe.remove(p.sprite);globe.remove(p.blob);
    const i=allSprites.indexOf(p.sprite);if(i>=0)allSprites.splice(i,1);
    board[la][lo]=null;
  }
  MAJOR.forEach((p,lon)=>placePiece(p,true,0,lon));
  for(let lon=0;lon<8;lon++)placePiece('P',true,1,lon);
  for(let lon=0;lon<8;lon++)placePiece('P',false,6,lon);
  MAJOR.forEach((p,lon)=>placePiece(p,false,7,lon));
  turnColor='white';
  turnEl.textContent='White to move';
}

    btn.textContent='Test mode'; btn.classList.remove('active');
  }
}

function startTestWithSelection(){
  const selected=[...document.querySelectorAll('.tpb.sel')].map(b=>({
    type:b.dataset.type, color:b.dataset.color
  }));
  if(!selected.length)return;

  // Hide panel, deselect all buttons
  document.getElementById('testPanel').classList.remove('visible');
  document.querySelectorAll('.tpb.sel').forEach(b=>b.classList.remove('sel'));
  document.getElementById('testStartBtn').disabled=true;

  clearVis(); clearCheckRing(); if(moveAnim)moveAnim=null; aiThinking=false;
  testModeActive=true;

  // Save all current pieces
  _testSave={pieces:[],turn:turnColor,ai:aiMode,ep:enPassantTarget};
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p)continue;
    _testSave.pieces.push({p,la,lo});
    p.sprite.visible=false;
    p.blob.visible=false;
    board[la][lo]=null;
  }

  // Place selected pieces at their standard initial positions
  selected.forEach(({type,color})=>{
    (_testInitPos[color][type]||[]).forEach(([la,lo])=>{
      placePiece(type,color==='black',la,lo);
    });
  });

  // Snap globe instantly so selected pieces are centred on screen
  const dirs=[];
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    if(board[la][lo]) dirs.push(cellPos(la,lo,R).normalize());
  }
  if(dirs.length){
    const avg=dirs.reduce((s,d)=>s.clone().add(d),new THREE.Vector3()).normalize();
    const worldDir=avg.clone().applyQuaternion(globe.quaternion).normalize();
    const Qr=new THREE.Quaternion().setFromUnitVectors(worldDir,new THREE.Vector3(0,0,1));
    globe.quaternion.premultiply(Qr);
    globeRotAnim=null;
  }

  aiMode=false; enPassantTarget=null;
  turnColor='white'; // allow any piece via testModeActive flag
  const btn=document.getElementById('testBtn');
  btn.textContent='Exit test'; btn.classList.add('active');
  turnEl.textContent='Test mode — tap any piece';
}

function exitTestMode(){
  if(!testModeActive)return;
  clearVis(); clearCheckRing(); if(moveAnim)moveAnim=null;
  testModeActive=false;

  // Remove test pieces
  for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++){
    const p=board[la][lo]; if(!p)continue;
    globe.remove(p.sprite); globe.remove(p.blob);
    const i=allSprites.indexOf(p.sprite); if(i>=0)allSprites.splice(i,1);
    board[la][lo]=null;
  }

  // Restore saved pieces
  if(_testSave){
    _testSave.pieces.forEach(({p,la,lo})=>{
      p.sprite.visible=true; p.blob.visible=true; board[la][lo]=p;
    });
    turnColor=_testSave.turn;
    aiMode=_testSave.ai;
    enPassantTarget=_testSave.ep;
    document.getElementById('aiToggle').checked=aiMode;
    _testSave=null;
  }
  aiThinking=false;

  // Hide panel if open
  document.getElementById('testPanel').classList.remove('visible');
  document.querySelectorAll('.tpb.sel').forEach(b=>b.classList.remove('sel'));
  document.getElementById('testStartBtn').disabled=true;

  const btn=document.getElementById('testBtn');
  btn.textContent='Test mode'; btn.classList.remove('active');

  const inCheck=isInCheck(turnColor);
  if(inCheck){
    for(let la=0;la<8;la++) for(let lo=0;lo<8;lo++)
      if(board[la][lo]?.type==='K'&&board[la][lo]?.color===turnColor){showCheckRing(la,lo);}
    showCheckThreats(turnColor);
    turnEl.textContent=(turnColor==='black'?'Black':'White')+' to move  —  check';
  } else {
    turnEl.textContent=turnColor==='black'?'Black to move':'White to move';
  }
}

// ─── Animate ──────────────────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);

  // Intro animation
  if(!introAnim.done){
    introAnim.t=Math.min(introAnim.t+16/2000,1);
    const te=1-Math.pow(1-introAnim.t,5);
    _introQspin.setFromAxisAngle(introSpinAxis,te*3.0*Math.PI);
    globe.quaternion.multiplyQuaternions(_introQspin,introR0);
    if(introAnim.t>=1){introAnim.done=true;globe.quaternion.copy(introFinalQ);autoRotate=false;}
    renderer.render(scene,camera);
    return;
  }

  // Globe rotation animation
  if(globeRotAnim){
    globeRotAnim.t=Math.min(globeRotAnim.t+16/globeRotAnim.dur,1);
    const te=easeInOut(globeRotAnim.t);
    globe.quaternion.copy(globeRotAnim.startQ).slerp(globeRotAnim.endQ,te);
    if(globeRotAnim.t>=1){const cb=globeRotAnim.onDone;globeRotAnim=null;if(cb)cb();}
  }

  // Shake animation for threatened pieces (fearful trembling)
  if(shakeAnims.length){
    // maxAngle scales inversely with piece height squared — pawn unchanged, large pieces calmer
    // Effective heights (in multiples of u): P=5.4 N=6.0 R=6.2 B=7.2 Q=7.5 K=7.5
    const SHAKE_AMP={P:0.090,N:0.073,R:0.068,B:0.051,Q:0.047,K:0.047};
    const PIECE_H  ={P:5.4,  N:6.0,  R:6.2,  B:7.2,  Q:7.5,  K:7.5 };
    const dt=16/1000;
    shakeAnims.forEach(s=>{
      s.t+=dt;
      const maxAngle=SHAKE_AMP[s.type]??0.065;
      const localX=new THREE.Vector3(1,0,0).applyQuaternion(s.baseQ);
      const localZ=new THREE.Vector3(0,0,1).applyQuaternion(s.baseQ);
      const rx=(Math.sin(s.t*53)+Math.sin(s.t*37)*0.6)*maxAngle;
      const rz=(Math.sin(s.t*41)*0.8+Math.sin(s.t*29)*0.4)*maxAngle;
      const perturbQ=new THREE.Quaternion()
        .multiply(new THREE.Quaternion().setFromAxisAngle(localX,rx))
        .multiply(new THREE.Quaternion().setFromAxisAngle(localZ,rz));
      const hCenter=0.062*(PIECE_H[s.type]??6.5)/2*0.65;
      const center=s.basePos.clone().addScaledVector(s.radialDir,hCenter);
      const newQ=perturbQ.clone().multiply(s.baseQ);
      s.group.quaternion.copy(newQ);
      const newLocalY=new THREE.Vector3(0,1,0).applyQuaternion(newQ);
      s.group.position.copy(center).addScaledVector(newLocalY,-hCenter);
    });
  }

  // Captured piece fade-out
  for(let i=captureFlyAnims.length-1;i>=0;i--){
    const a=captureFlyAnims[i];
    a.t+=16/1000;
    const opacity=Math.max(0,1-a.t/a.dur);
    a.sprite.traverse(child=>{
      if(child.isMesh&&child.material)child.material.opacity=opacity;
    });
    if(a.t>=a.dur){globe.remove(a.sprite);captureFlyAnims.splice(i,1);}
  }

  // Bounce
  if(bounceAnim){
    bounceAnim.t+=16/1000;
    const lift=Math.abs(Math.sin(bounceAnim.t*Math.PI))*0.18;
    bounceAnim.group.position.copy(bounceAnim.basePos).addScaledVector(bounceAnim.radialDir,lift);
    // Blob shadow fades as piece lifts: full opacity at ground, fades to ~20% at peak
    if(bounceAnim.blob){
      const mat=bounceAnim.blob.children[0]?.material;
      if(mat){mat.opacity=0.48*(1-lift/0.18*0.8);mat.needsUpdate=true;}
    }
  }

  // Move animation
  if(moveAnim){
    moveAnim.t=Math.min(moveAnim.t+16/moveAnim.dur,1);
    const te=easeInOut(moveAnim.t);
    // Arc-length parameterization: map eased time → target arc distance → point
    const targetDist=te*moveAnim.totalLen;
    const cum=moveAnim.cum;
    let i0=0;
    for(let i=1;i<cum.length-1;i++){if(cum[i]>=targetDist)break;i0=i;}
    const segLen=cum[i0+1]-cum[i0];
    const frac=segLen>1e-9?(targetDist-cum[i0])/segLen:0;
    const pos=moveAnim.pts[i0].clone().lerp(moveAnim.pts[i0+1],frac);
    moveAnim.sprite.position.copy(pos);
    orientPiece(moveAnim.sprite,pos);
    if(moveAnim.pieceType==='N') faceKnightTowardPole(moveAnim.sprite,pos,moveAnim.pieceIsWhite);
    if((aiMode||autoBattleActive)&&!globeRotAnim){
      const worldDir=pos.clone().normalize().applyQuaternion(globe.quaternion);
      const offCentre=Math.max(0,1-worldDir.z);
      const alpha=0.025+offCentre*0.035;
      const Qr=new THREE.Quaternion().setFromUnitVectors(worldDir,new THREE.Vector3(0,0,1));
      const tQ=new THREE.Quaternion().multiplyQuaternions(Qr,globe.quaternion);
      globe.quaternion.slerp(tQ,alpha);
    }
    if(moveAnim.blob){
      const blobPos=pos.clone().normalize().multiplyScalar(R);
      moveAnim.blob.position.copy(blobPos);
      orientPiece(moveAnim.blob,blobPos);
    }
    if(moveAnim.t>=1){const cb=moveAnim.onDone;moveAnim=null;cb();}
  }

  // Inertia
  if(!dragging){
    if(Math.abs(vel.x)>0.01||Math.abs(vel.y)>0.01){applyDelta(vel.x,vel.y);vel.x*=0.88;vel.y*=0.88;}
    else{vel.x=0;vel.y=0;}
    if(autoRotate){
      const rotSpeed=multiViewMode>0?0.0032:0.0010;
      _qy.setFromAxisAngle(WY,rotSpeed);globe.quaternion.premultiply(_qy);
    }
  }

  // Split-view intro animation: update all panel quaternions independently of globe.quaternion
  if(_splitIntroAnim.active){
    _splitIntroAnim.t=Math.min(_splitIntroAnim.t+16/2000,1);
    const te=1-Math.pow(1-_splitIntroAnim.t,5);
    _introQspin.setFromAxisAngle(introSpinAxis,te*3.0*Math.PI);
    _splitIntroQ.multiplyQuaternions(_introQspin,introR0);
    _mvPanelQ.forEach(q=>q.copy(_splitIntroQ));
    if(_splitIntroAnim.t>=1){
      _splitIntroAnim.active=false;
      _mvPanelQ.forEach(q=>q.copy(introFinalQ));
    }
  }

  // Side-game animations + tracking
  if(_pgActive&&autoBattleActive){
    for(const g of _pgGames){
      if(!g)continue;
      // Drive piece move animation (great-circle arc)
      if(g.pgMoveAnim){
        const anim=g.pgMoveAnim;
        anim.t=Math.min(anim.t+16/700,1);
        const te=0.5-0.5*Math.cos(Math.PI*anim.t); // ease in-out
        // Quaternion slerp: stable for ALL move distances including near-antipodal
        // (lerp+normalize breaks when from≈-to, giving zero vector → NaN → pieces "lie flat")
        const _qCur=anim.fromQ.clone().slerp(anim.toQ,te);
        const curDir=new THREE.Vector3(0,1,0).applyQuaternion(_qCur).normalize();
        const curPos=curDir.clone().multiplyScalar(anim.radius);
        anim.mesh.position.copy(curPos);
        orientPiece(anim.mesh,curPos); // keep orientation correct each frame (prevents flash)
        if(anim.piece.type==='N') faceKnightTowardPole(anim.mesh,curPos,anim.piece.color!=='black');
        // Animate blob shadow along with piece
        if(anim.blob){anim.blob.position.copy(curPos);orientPiece(anim.blob,curPos);}
        // Per-frame tracking: keep moving piece centred in panel
        const _wd=curDir.clone().applyQuaternion(g.globeQ);
        const _Qr=new THREE.Quaternion().setFromUnitVectors(_wd,new THREE.Vector3(0,0,1));
        g.targetGlobeQ.multiplyQuaternions(_Qr,g.globeQ);
        g.targetGlobeQ.normalize();
        if(anim.t>=1){ g.pgMoveAnim=null; if(anim.onDone)anim.onDone(); }
      }
      // Slerp globeQ toward target (runs whether or not animation is active)
      g.globeQ.slerp(g.targetGlobeQ,0.065);
    }
  }

  if(multiViewMode>0) _renderMultiView(); else renderer.render(scene,camera);
}

// ─── Multi-view split screen ──────────────────────────────────────────────────
let multiViewMode=0;
// Six fixed viewpoints around the globe:  front · back · left · right · north · south
const _mvDefs=[
  {pd:[0,0,1],  up:[0,1,0]},   // 0 front
  {pd:[0,0,-1], up:[0,1,0]},   // 1 back
  {pd:[-1,0,0], up:[0,1,0]},   // 2 left
  {pd:[1,0,0],  up:[0,1,0]},   // 3 right
  {pd:[0,1,0],  up:[0,0,-1]},  // 4 north pole (top-down)
  {pd:[0,-1,0], up:[0,0,1]},   // 5 south pole (bottom-up)
];
// Cameras created lazily (Three.js must already be loaded at this point)
const _mvCams=_mvDefs.map(()=>new THREE.PerspectiveCamera(42,1,0.01,2000));
// Per-panel independent rotation quaternions (used only during preview, not during battle)
const _mvPanelQ=_mvDefs.map(()=>new THREE.Quaternion());
let _dragCi=-1; // camera-index of the panel currently being dragged (-1 = single-view or none)
// Pre-computed camera-relative rotation axes for each panel definition.
// These make the drag/roll in every split panel feel exactly like the normal full-screen mode:
//   horizontal drag → around camera's "up" axis
//   vertical drag   → around camera's "right" axis (= cross(up, pd))
//   roll gesture    → around camera's "pd" axis (position direction)
const _mvPds  = _mvDefs.map(d=>new THREE.Vector3(d.pd[0],d.pd[1],d.pd[2]));
const _mvUps  = _mvDefs.map(d=>new THREE.Vector3(d.up[0],d.up[1],d.up[2]));
const _mvRights = _mvDefs.map((_,i)=>
  new THREE.Vector3().crossVectors(_mvUps[i],_mvPds[i]).normalize());
// Per-panel rotation offset for battle rendering:
// Multiplied onto globe.quaternion so the tracked piece is centred in EACH panel's view
// (front panel = identity; back panel = 180° around Y; left = 90° around Y; etc.)
const _mvPanelOffsets = _mvDefs.map(def=>
  new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0,0,1),
    new THREE.Vector3(def.pd[0],def.pd[1],def.pd[2])
  )
);
// Per-panel camera distances (independent zoom per panel)
const _mvPanelDist = _mvDefs.map(()=>camera.position.z);
// Per-panel user-controlled rotation overlay during battle (identity = no override).
// Applied on top of auto-tracking so manual spin and AI tracking coexist.
const _mvBattleQ = _mvDefs.map(()=>new THREE.Quaternion());
// Independent split-view intro animation (animates _mvPanelQ instead of globe.quaternion)
let _splitIntroAnim = {t:0, active:false};
const _splitIntroQ  = new THREE.Quaternion(); // reusable temp, avoids per-frame allocation

function setSplitView(n){
  multiViewMode=n;
  _dragCi=-1;
  // Re-initialise panel quaternions and distances so new panels start at current globe state
  _mvPanelQ.forEach(q=>q.copy(globe.quaternion));
  _mvPanelDist.forEach((_,i)=>{ _mvPanelDist[i]=camera.position.z; });
  document.querySelectorAll('.spb').forEach(b=>{
    b.classList.toggle('sel',parseInt(b.dataset.v)===n);
  });
  document.getElementById('mvLines').className=n>0?`mv${n}`:'';
}

function _mvLayout(){
  const W=innerWidth,H=innerHeight;
  if(multiViewMode===2)return[
    {ci:0,x:0,y:0,   w:W,h:H/2},
    {ci:1,x:0,y:H/2, w:W,h:H/2},
  ];
  if(multiViewMode===4)return[
    {ci:0,x:0,   y:0,   w:W/2,h:H/2},
    {ci:1,x:W/2, y:0,   w:W/2,h:H/2},
    {ci:2,x:0,   y:H/2, w:W/2,h:H/2},
    {ci:3,x:W/2, y:H/2, w:W/2,h:H/2},
  ];
  // 6 panels: 2 columns × 3 rows — wider panels, better aspect ratio on portrait phones
  if(multiViewMode===6)return[
    {ci:0,x:0,   y:0,     w:W/2,h:H/3},  // top-left:    front
    {ci:1,x:W/2, y:0,     w:W/2,h:H/3},  // top-right:   back
    {ci:2,x:0,   y:H/3,   w:W/2,h:H/3},  // mid-left:    left
    {ci:3,x:W/2, y:H/3,   w:W/2,h:H/3},  // mid-right:   right
    {ci:4,x:0,   y:H*2/3, w:W/2,h:H/3},  // bot-left:    north pole
    {ci:5,x:W/2, y:H*2/3, w:W/2,h:H/3},  // bot-right:   south pole
  ];
  return null;
}

function _renderMultiView(){
  const layout=_mvLayout();if(!layout)return;
  const H=innerHeight;
  const savedAC=renderer.autoClear;
  renderer.autoClear=false;
  renderer.setScissorTest(true);
  for(const{ci,x,y,w,h}of layout){
    const cam=_mvCams[ci];
    const def=_mvDefs[ci];
    const dist = _mvPanelDist[ci];
    cam.aspect=w/h; cam.updateProjectionMatrix();
    cam.position.set(def.pd[0]*dist, def.pd[1]*dist, def.pd[2]*dist);
    cam.up.set(def.up[0], def.up[1], def.up[2]);
    cam.lookAt(0,0,0);
    renderer.setViewport(x, H-y-h, w, h);
    renderer.setScissor(x, H-y-h, w, h);
    renderer.clear(true,true,false);
    const savedQ=globe.quaternion.clone();

    if(!autoBattleActive||_splitIntroAnim.active){
      cam.layers.enableAll();
      globe.quaternion.copy(_mvPanelQ[ci]);
      _pgGames.forEach(g=>g&&(g.grp.visible=false));
    } else if(ci===0){
      // Panel 0: main game — globe (layer 0) + main pieces/vis (layer 1)
      cam.layers.mask=3;
      globe.quaternion.copy(savedQ);
      globe.quaternion.premultiply(_mvBattleQ[0]);
    } else {
      // Panels 1–5: independent side games — globe (layer 0) + side pieces (layer ci+2)
      cam.layers.mask=(1<<0)|(1<<(ci+2));
      const pgQ=_pgGames[ci]?.globeQ||savedQ;
      globe.quaternion.multiplyQuaternions(_mvPanelOffsets[ci],pgQ);
      globe.quaternion.premultiply(_mvBattleQ[ci]);
      if(_pgGames[ci]){
        _pgGames[ci].grp.visible=true;
        _pgGames[ci].grp.quaternion.copy(globe.quaternion);
      }
    }
    // EnvDome as independent 3D background per panel
    envDome.visible=true;
    renderer.render(scene,cam);
    envDome.visible=false;
    cam.layers.enableAll();
    globe.quaternion.copy(savedQ);
  }
  renderer.setScissorTest(false);
  renderer.autoClear=savedAC;
  renderer.setViewport(0,0,innerWidth,innerHeight);
}

// ─── Independent side games for split-view panels ────────────────────────────
// Panel 0 = main full-featured game (uses global state).
// Panels 1–5 = independent games with AI, blob shadows, and smooth animation.
const _pgGames = [];   // sparse array indexed by ci; index 0 unused
let   _pgActive = false;

function _pgNewGame(ci){
  const MAJOR=['R','N','B','K','Q','B','N','R'];
  const pgBoard=Array.from({length:8},()=>Array(8).fill(null));
  const meshes=[];
  const layer=ci+2;
  const grp=new THREE.Group();
  grp.visible=true;
  scene.add(grp);
  function _pgPlace(type,color,la,lo){
    const sprite=createPieceMesh(type,color==='black');
    const outer=new THREE.Group();
    outer.add(sprite);
    outer.traverse(c=>{c.layers.set(layer);c.frustumCulled=false;});
    const pos=cellPos(la,lo,R);
    outer.position.copy(pos);orientPiece(outer,pos);
    if(type==='N') faceKnightTowardPole(outer,pos,color!=='black');
    const blob=createBlobGroup();
    blob.position.copy(pos);orientPiece(blob,pos);
    blob.traverse(c=>{c.layers.set(layer);c.frustumCulled=false;});
    grp.add(blob);
    const p={type,color,mesh:outer,blob,hasMoved:false};
    pgBoard[la][lo]=p;
    grp.add(outer);meshes.push(outer);
  }
  for(let lo=0;lo<8;lo++){
    _pgPlace(MAJOR[lo],'black',0,lo);_pgPlace('P','black',1,lo);
    _pgPlace(MAJOR[lo],'white',7,lo);_pgPlace('P','white',6,lo);
  }
  const g={ci,board:pgBoard,meshes,grp,turnColor:'white',halfMove:0,
    enPassantTarget:null,
    globeQ:new THREE.Quaternion().copy(introFinalQ),
    targetGlobeQ:new THREE.Quaternion().copy(introFinalQ),
    pgMoveAnim:null,timer:null,done:false};
  g.timer=setTimeout(()=>_pgMoveGo(ci),2400+ci*300+Math.random()*500);
  return g;
}

function _pgStart(n){
  _pgStop();_pgActive=true;
  for(let ci=1;ci<n;ci++) _pgGames[ci]=_pgNewGame(ci);
}

function _pgStop(){
  _pgActive=false;
  for(const g of _pgGames){
    if(!g)continue;
    if(g.timer)clearTimeout(g.timer);
    g.pgMoveAnim=null;
    scene.remove(g.grp);
  }
  _pgGames.length=0;
}

function _pgMoveGo(ci){
  const g=_pgGames[ci];
  if(!g||g.done||!_pgActive||!autoBattleActive)return;
  // Save global state
  const svBoard=board.map(r=>r.slice());
  const svEP=enPassantTarget;const svLog=_autoBattleLog;
  // Load side-game state
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++) board[la][lo]=g.board[la][lo];
  enPassantTarget=g.enPassantTarget;_autoBattleLog=null;
  const hasMove=hasAnyLegalMove(g.turnColor);
  let move=null;
  if(hasMove){
    // AI search: synchronous depth-2 with 400 ms limit
    const legal=[];
    for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
      if(board[la][lo]?.color!==g.turnColor)continue;
      getLegalMoves(la,lo).forEach(mv=>legal.push({fLat:la,fLon:lo,tLat:mv.lat,tLon:mv.lon,...mv}));
    }
    for(let i=legal.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[legal[i],legal[j]]=[legal[j],legal[i]];}
    const isBlack=g.turnColor==='black';
    let bestSc=isBlack?-Infinity:Infinity;
    const dl=Date.now()+400;
    for(const m of legal){
      if(Date.now()>=dl)break;
      const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
      let sc=_abSearch(1,-Infinity,Infinity,!isBlack,dl);
      aiUndo(m,pc,sv);
      if(sv.c||sv.epCap){const capT=sv.c?sv.c.type:(sv.epCap?'P':null);
        if(capT)sc+=(isBlack?1:-1)*Math.min(Math.round(_EV[capT]*0.12),150);}
      const steps=m.step||0;let gb=0;
      if(steps>3)gb+=(steps-3)*12;if(m.pole)gb+=50;
      if(m.straightDn&&steps>4)gb+=35;if(m.diagKey&&steps>3)gb+=(steps-3)*10+30;
      if(gb>0)sc+=(isBlack?1:-1)*gb;
      if(isBlack?sc>bestSc:sc<bestSc){bestSc=sc;move=m;}
    }
  }
  // Restore global state
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++) board[la][lo]=svBoard[la][lo];
  enPassantTarget=svEP;_autoBattleLog=svLog;
  if(!hasMove||!move){g.done=true;return;}
  // Pre-rotate to face the moving piece
  const _fpos=cellPos(move.fLat,move.fLon,R).normalize();
  const _fwd=_fpos.clone().applyQuaternion(g.globeQ);
  const _fQr=new THREE.Quaternion().setFromUnitVectors(_fwd,new THREE.Vector3(0,0,1));
  g.targetGlobeQ.multiplyQuaternions(_fQr,g.globeQ);
  g.targetGlobeQ.normalize();
  g.timer=setTimeout(()=>{
    if(!g||g.done||!_pgActive||!autoBattleActive)return;
    _pgApply(g,move);
  },460);
}

function _pgApply(g,m){
  const b=g.board;
  const {fLat:fl,fLon:fn,lat:tl,lon:tn}=m;
  const piece=b[fl][fn];if(!piece)return;
  piece.hasMoved=true;
  // En passant capture
  if(m.isEnPassant&&m.capturedLat!=null){
    const cp=b[m.capturedLat][m.capturedLon];
    if(cp){g.grp.remove(cp.mesh);g.grp.remove(cp.blob);
      g.meshes.splice(g.meshes.indexOf(cp.mesh),1);b[m.capturedLat][m.capturedLon]=null;}
  }
  // Normal capture
  if(b[tl][tn]){
    const cp=b[tl][tn];
    g.grp.remove(cp.mesh);g.grp.remove(cp.blob);
    g.meshes.splice(g.meshes.indexOf(cp.mesh),1);b[tl][tn]=null;
  }
  // Castling
  if(m.isCastle){
    const isKS=tn>fn,rfl=isKS?7:0,rtl=isKS?5:2;
    const rook=b[fl][rfl];
    if(rook){
      b[fl][rtl]=rook;b[fl][rfl]=null;rook.hasMoved=true;
      const rp=cellPos(fl,rtl,R);
      rook.mesh.position.copy(rp);orientPiece(rook.mesh,rp);
      rook.blob.position.copy(rp);orientPiece(rook.blob,rp);
    }
  }
  const _fromPos=piece.mesh.position.clone();
  b[tl][tn]=piece;b[fl][fn]=null;
  const np=cellPos(tl,tn,R);
  // Promotion
  if(piece.type==='P'&&(tl===0||tl===7)){
    piece.type='Q';
    const _qLayer=g.ci+2;
    const _qOuter=new THREE.Group();
    _qOuter.add(createPieceMesh('Q',piece.color==='black'));
    _qOuter.traverse(c=>{c.layers.set(_qLayer);c.frustumCulled=false;});
    _qOuter.position.copy(_fromPos);orientPiece(_qOuter,_fromPos);
    g.grp.remove(piece.mesh);
    const _qi=g.meshes.indexOf(piece.mesh);if(_qi>=0)g.meshes.splice(_qi,1);
    g.grp.add(_qOuter);g.meshes.push(_qOuter);
    piece.mesh=_qOuter;
  }
  g.enPassantTarget=(piece.type==='P'&&Math.abs(tl-fl)===2)?{lat:Math.round((fl+tl)/2),lon:tn}:null;
  g.turnColor=g.turnColor==='white'?'black':'white';
  g.halfMove++;
  // Animated move with blob shadow
  const _pType=piece.type;const _pColor=piece.color;
  const _animUp=new THREE.Vector3(0,1,0);
  const _fromDir2=_fromPos.clone().normalize();
  const _toDir2=np.clone().normalize();
  g.pgMoveAnim={
    mesh:piece.mesh, blob:piece.blob,
    fromDir:_fromDir2, toDir:_toDir2,
    fromQ:new THREE.Quaternion().setFromUnitVectors(_animUp,_fromDir2),
    toQ:  new THREE.Quaternion().setFromUnitVectors(_animUp,_toDir2),
    radius:R, t:0,
    piece:piece,
    onDone:()=>{
      piece.mesh.position.copy(np);orientPiece(piece.mesh,np);
      piece.blob.position.copy(np);orientPiece(piece.blob,np);
      if(_pType==='N') faceKnightTowardPole(piece.mesh,np,_pColor!=='black');
      if(!g.done&&_pgActive&&autoBattleActive)
        g.timer=setTimeout(()=>_pgMoveGo(g.ci),AUTO_DELAY+Math.random()*500);
    }
  };
}

const AUTO_DELAY = 300;        // ms between moves (AI thinking time is the main pacing now)
const AUTO_MAX_MOVES = 250;    // draw if exceeded
const RESIGN_THRESHOLD = 1200; // eval pts: losing by this much = hopeless → resign
const RESIGN_STREAK    = 8;    // consecutive half-moves at that level to confirm
const DRAW_EVAL_RANGE  = 150;  // eval pts: both sides within this = "mutually equal"
const DRAW_STREAK      = 30;   // consecutive half-moves both agree it's equal → draw
let autoBattleActive = false;
let autoBattlePaused = false;
let _autoBattleTimer = null;
let _autoBattleLog = null;
let _autoGameNum = 0;
let _autoPosHist = {};

// ── Globe-tactics-aware evaluation ──────────────────────────────────────────
// Primary driver: piece material.
// Secondary driver: pole proximity — pieces near polar caps attack in BOTH directions
//   (normal + through the pole), doubling their tactical reach.
// Tertiary: direct antipodal threat for Q/R exactly at the edge.
function captureEval(){
  const CV={K:50000,Q:1800,R:1000,B:650,N:620,P:180};
  // Polar bonus per piece type (small enough not to override captures)
  const POLAR={Q:30,R:27,B:24,N:20,P:0,K:0};
  let s=0;
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo];if(!p)continue;
    let v=CV[p.type];
    // Tiered polar bonus: ×2 at the edge (lat 0 or 7), ×1 just inside (lat 1 or 6)
    const pd=Math.min(la,7-la); // 0=pole edge, 3=equator
    if(pd<=1) v+=(2-pd)*(POLAR[p.type]||0);
    // Antipodal threat: Q or R on the pole edge, enemy at wL(lo+4) same lat
    // → can reach enemy in ONE straight move through the polar cap
    if(pd===0&&(p.type==='Q'||p.type==='R')){
      const opp=board[la][wL(lo+4)];
      if(opp&&opp.color!==p.color) v+=Math.round(CV[opp.type]*0.09);
    }
    s+=p.color==='black'?v:-v;
  }
  return s;
}

// ── Quiescence search (captures only, up to qleft extra plies) ────────────
// Prevents the "horizon effect": never stop in the middle of a capture sequence.
// This is what lets the AI see through 3-ply pole-crossing exchange sequences.
function _quiesce(alpha,beta,maxing,qleft){
  const stand=captureEval();
  if(qleft===0) return stand;
  // Stand-pat: if the quiet position is already good enough, don't search further
  if(maxing){if(stand>=beta)return beta;if(stand>alpha)alpha=stand;}
  else{if(stand<=alpha)return alpha;if(stand<beta)beta=stand;}
  const color=maxing?'black':'white';
  // Only look at captures (and en passant)
  const caps=allAIMoves(color).filter(m=>board[m.tLat][m.tLon]||m.isEnPassant);
  caps.sort((a,b)=>{
    const va=board[a.tLat][a.tLon]?AI_PVAL[board[a.tLat][a.tLon].type]:0;
    const vb=board[b.tLat][b.tLon]?AI_PVAL[board[b.tLat][b.tLon].type]:0;
    return vb-va;
  });
  for(const m of caps){
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const score=_quiesce(alpha,beta,!maxing,qleft-1);
    aiUndo(m,pc,sv);
    if(maxing){if(score>alpha){alpha=score;if(alpha>=beta)return beta;}}
    else{if(score<beta){beta=score;if(beta<=alpha)return alpha;}}
  }
  return maxing?alpha:beta;
}

function captureMinim(depth,alpha,beta,maxing){
  // At depth=0, run quiescence instead of returning raw eval —
  // this ensures capture sequences (including pole-crossing ones) are fully resolved.
  if(depth===0) return _quiesce(alpha,beta,maxing,3);
  const color=maxing?'black':'white';
  const mvs=allAIMoves(color);
  if(!mvs.length) return captureEval();
  // Captures first in search ordering
  mvs.sort((a,b)=>{
    const va=board[a.tLat][a.tLon]?AI_PVAL[board[a.tLat][a.tLon].type]:0;
    const vb=board[b.tLat][b.tLon]?AI_PVAL[board[b.tLat][b.tLon].type]:0;
    return vb-va;
  });
  let best=maxing?-Infinity:Infinity;
  for(const m of mvs){
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const sc=captureMinim(depth-1,alpha,beta,!maxing);
    aiUndo(m,pc,sv);
    if(maxing){if(sc>best)best=sc;if(sc>alpha)alpha=sc;}
    else{if(sc<best)best=sc;if(sc<beta)beta=sc;}
    if(beta<=alpha)break;
  }
  return best;
}

// ── Get best legal move for either color ─────────────────────────────────────
// Strategy: greedy capture ordering + captureMinim(depth=2) for tie-breaking.
// Each AI evaluates independently — neither knows the other's chosen move.
function getAutoAIMove(color){
  const legal=[];
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    if(board[la][lo]?.color!==color)continue;
    getLegalMoves(la,lo).forEach(mv=>legal.push({fLat:la,fLon:lo,tLat:mv.lat,tLon:mv.lon,...mv}));
  }
  if(!legal.length)return null;
  // Shuffle first (variety within equal groups)
  for(let i=legal.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[legal[i],legal[j]]=[legal[j],legal[i]];
  }
  // Primary sort: highest-value capture first
  legal.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?AI_PVAL[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?AI_PVAL['P']:0);
    const vb=(board[b.tLat][b.tLon]?AI_PVAL[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?AI_PVAL['P']:0);
    return vb-va;
  });
  const isBlack=color==='black';
  const nextMax=!isBlack; // after black moves → white's turn (not maxing); after white → black (maxing)
  let best=null,bestSc=isBlack?-Infinity:Infinity;
  const top=Math.min(legal.length,30); // evaluate top 30 candidate moves
  // Anti-oscillation: penalise moves that send a piece straight back where it came from
  const recentOwn=(_autoBattleLog?.moves||[]).filter(m=>m.color===color).slice(-3);
  const OSC_PEN=700; // large enough to override same-value jitter, small enough to allow if only option
  const isReversal=m=>recentOwn.some(prev=>
    prev.coords[2]===m.fLat&&prev.coords[3]===m.fLon&&
    prev.coords[0]===m.tLat&&prev.coords[1]===m.tLon);

  for(let i=0;i<top;i++){
    const m=legal[i];
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    let sc=captureMinim(2,-Infinity,Infinity,nextMax);
    aiUndo(m,pc,sv);
    if(isReversal(m))sc=isBlack?sc-OSC_PEN:sc+OSC_PEN;
    if(isBlack?sc>bestSc:sc<bestSc){bestSc=sc;best=m;}
  }
  return best;
}

function _autoBoardHash(){
  let h='';
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo];h+=p?p.color[0]+p.type:'.';

  return h+turnColor[0];
}
const _ACOL=['h','g','f','e','d','c','b','a'];
function _autoNote(la,lo){return _ACOL[lo]+(8-la);}
function _autoBoardSnap(){

function _autoLogAnomaly(type,desc,extra={}){
