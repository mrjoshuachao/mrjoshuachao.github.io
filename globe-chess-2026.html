// ── Main drive loop ───────────────────────────────────────────────────────────

// Insufficient material: K/K+minor vs K/K+minor → cannot force checkmate
function _autoInsufMaterial(){
  let wX=[],bX=[];
  for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
    const p=board[la][lo];if(!p||p.type==='K')continue;
    (p.color==='white'?wX:bX).push(p.type);
  }
  const minor=arr=>arr.length===0||(arr.length===1&&(arr[0]==='B'||arr[0]==='N'));
  return minor(wX)&&minor(bX);
}

// ══════════════════════════════════════════════════════════════════════════════
// ─── Enhanced AI Engine — positional evaluation + iterative deepening α-β ────
const _AI_THINK_MS  = 8000;   // AI opponent: 8 s per move
const _AUTO_THINK_MS= 1500;   // Auto-battle: 1.5 s per move (deeper search)

// Piece-square tables (index = latForPST: 0=own back rank, 7=opponent back rank)
const _PST={
  P:[0,5,15,30,45,65,90,0],         // stronger center push incentive
  N:[-30,-5,15,25,25,15,-5,-30],     // much stronger center preference
  B:[-10,5,12,18,18,12,5,-10],       // encourage development
  R:[5,0,0,8,8,0,0,5],
  Q:[-15,-5,0,5,5,0,-5,-15],
  Km:[30,15,-15,-30,-30,-15,15,30],  // king middlegame: STAY BACK strongly
  Ke:[-20,-5,15,25,25,15,-5,-20]      // king endgame: centralize MORE aggressively
};
const _EV={K:50000,Q:1800,R:1000,B:650,N:620,P:180};
const _POL={Q:30,R:27,B:24,N:20,P:0,K:0};

function evaluate(){
  let s=0,nonPK=0;
  const pLon=[new Uint8Array(8),new Uint8Array(8)]; // [black,white] pawn lon counts
  let wBishops=0,bBishops=0,wKingLat=-1,wKingLon=-1,bKingLat=-1,bKingLon=-1;
  let wCastled=false,bCastled=false;
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    const p=board[a][o];if(!p)continue;
    if(p.type==='K'){
      if(p.color==='white'){wKingLat=a;wKingLon=o;wCastled=!!p._castled;}
      else{bKingLat=a;bKingLon=o;bCastled=!!p._castled;}
    }
    if(p.type!=='K'&&p.type!=='P')nonPK+=_EV[p.type];
    if(p.type==='B'){if(p.color==='white')wBishops++;else bBishops++;}
  }
  const eg=nonPK<2600;
  const moveNum=(_autoBattleLog?.moves.length||0)/2;
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    const p=board[a][o];if(!p)continue;
    const bk=p.color==='black';
    const lp=bk?a:(7-a);
    let v=_EV[p.type];
    // PST
    v+=(p.type==='K'?(eg?_PST.Ke:_PST.Km):_PST[p.type]||[])[lp]||0;
    const pd=Math.min(a,7-a); // 0=pole edge, 3=equator
    // Knight on own back rank (lp=0) is extra bad
    if(p.type==='N'&&lp===0)v-=20;
    // Opening: knight on pole edge (pd=0, lat 0 or 7) is genuinely bad — no escape routes
    if(p.type==='N'&&moveNum<10&&pd===0)v-=50;
    // Polar bonus
    if(pd<=1)v+=(2-pd)*(_POL[p.type]||0);
    if(pd===0&&(p.type==='Q'||p.type==='R')){
      const op=board[a][wL(o+4)];
      if(op&&op.color!==p.color)v+=Math.round(_EV[op.type]*0.09);
    }
    // Development: minor pieces still on starting square
    if(!p.hasMoved&&(p.type==='N'||p.type==='B')){
      v-=25;
      if(moveNum<10)v-=20; // extra penalty in opening: get pieces out!
    }
    if(p.hasMoved&&(p.type==='N'||p.type==='B')&&moveNum<10)v+=10; // reward developed pieces
    if(p.type==='R'&&p.hasMoved)v+=8;
    // Pawn tracking
    if(p.type==='P'){
      pLon[bk?0:1][o]++;
      // Late endgame: pawns become critical (only path to promotion/winning)
      if(eg){
        // Count own non-pawn, non-king pieces
        let ownPieces=0;
        for(let la2=0;la2<8;la2++)for(let lo2=0;lo2<8;lo2++){
          const p2=board[la2][lo2];
          if(p2&&p2.color===p.color&&p2.type!=='K'&&p2.type!=='P')ownPieces++;
        }
        if(ownPieces===0)v+=120; // no pieces left → pawns are worth double
        else if(ownPieces===1)v+=50; // only one piece → pawns are precious
      }
    }
    s+=bk?v:-v;
  }
  // Pawn structure penalties
  for(let side=0;side<2;side++){
    const sgn=side===0?1:-1;
    let pen=0;
    for(let o=0;o<8;o++){
      const c=pLon[side][o];
      if(c>1)pen+=(c-1)*18;    // doubled pawns (increased)
      if(c>0&&!pLon[side][wL(o-1)]&&!pLon[side][wL(o+1)])pen+=15; // isolated (increased)
    }
    s-=pen*sgn;
  }
  // Passed pawn detection + bonus
  const passedPawns=[];
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    const p=board[a][o];if(!p||p.type!=='P')continue;
    const bk=p.color==='black';
    const promoLat=bk?7:0;
    let passed=true;
    // Check opponent pawns on same or adjacent lons ahead of this pawn
    for(let dlo=-1;dlo<=1;dlo++){
      const lo=wL(o+dlo);
      if(bk){for(let la=a+1;la<=7;la++){const bp=board[la][lo];if(bp&&bp.type==='P'&&bp.color==='white'){passed=false;break;}}}
      else{for(let la=a-1;la>=0;la--){const bp=board[la][lo];if(bp&&bp.type==='P'&&bp.color==='black'){passed=false;break;}}}
      if(!passed)break;
    }
    if(passed){
      const dist=Math.abs(promoLat-a);
      passedPawns.push({lat:a,lon:o,color:p.color,dist});
      // Exponential bonus: closer to promotion = much more valuable
      let bonus=dist<=1?250:dist<=2?140:dist<=3?85:dist<=4?55:dist<=5?35:20;
      // Unblocked passer: no piece of ANY color in the way → even more dangerous
      let clearPath=true;
      const dir2=bk?1:-1;
      for(let la=a+dir2;bk?(la<=7):(la>=0);la+=dir2){
        if(board[la][o]){clearPath=false;break;}
      }
      if(clearPath&&dist<=2)bonus+=dist<=1?500:200; // nearly unstoppable
      s+=bk?bonus:-bonus;
    }
  }
  // Endgame: king proximity to passed pawns
  if(eg&&passedPawns.length>0){
    const lonDist=(a,b)=>Math.min(Math.abs(a-b),8-Math.abs(a-b));
    for(const pp of passedPawns){
      const bk=pp.color==='black';
      const promoLat=bk?7:0;
      const ownKLat=bk?bKingLat:wKingLat, ownKLon=bk?bKingLon:wKingLon;
      const oppKLat=bk?wKingLat:bKingLat, oppKLon=bk?wKingLon:bKingLon;
      if(ownKLat<0||oppKLat<0)continue;
      const ownDist=Math.max(Math.abs(ownKLat-pp.lat),lonDist(ownKLon,pp.lon));
      const oppDist=Math.max(Math.abs(oppKLat-pp.lat),lonDist(oppKLon,pp.lon));
      // Own king close to support passer; opponent king far = good
      s+=(bk?1:-1)*((7-ownDist)*6-(7-oppDist)*8);
      // King escort: own king close to AND ahead of passer gets big bonus
      // "ahead" = between pawn and promo square
      const ownKingAhead=bk?(ownKLat>pp.lat):(ownKLat<pp.lat);
      if(ownDist<=2&&ownKingAhead){
        s+=(bk?1:-1)*(pp.dist<=2?100:pp.dist<=4?50:25); // huge bonus for escorting near-promo pawn
      }
      // K+P endgame: if own side has no non-pawn pieces, king MUST escort pawn
      let ownPiecesCount=0;
      for(let la2=0;la2<8;la2++)for(let lo2=0;lo2<8;lo2++){
        const p2=board[la2][lo2];
        if(p2&&p2.color===pp.color&&p2.type!=='K'&&p2.type!=='P')ownPiecesCount++;
      }
      if(ownPiecesCount===0&&ownDist>2){
        s+=(bk?-1:1)*(ownDist-2)*18; // strong penalty: king far from pawn with no pieces to help
      }
      // Urgent interception: opponent king distance to PROMO SQUARE matters most for dangerous passers
      if(pp.dist<=3){
        const oppToPromo=Math.max(Math.abs(oppKLat-promoLat),lonDist(oppKLon,pp.lon));
        // If opponent king can't reach promo square in time, passer is unstoppable
        if(oppToPromo>pp.dist){
          const unstopBonus=pp.dist<=1?400:pp.dist<=2?200:80;
          s+=(bk?1:-1)*unstopBonus;
        }
        // Reward opponent king being close to the pawn (for interception)
        // This encourages the DEFENDING side to move king toward the passer
        const oppToPawn=Math.max(Math.abs(oppKLat-pp.lat),lonDist(oppKLon,pp.lon));
        s+=(bk?-1:1)*(7-oppToPawn)*12; // defending king close to pawn = good for defender
      }
    }
  }
  // Bishop pair bonus (having both bishops is worth extra)
  if(wBishops>=2)s-=35;
  if(bBishops>=2)s+=35;
  // King safety (middlegame only)
  if(!eg){
    // Castling bonus
    if(wCastled)s-=40; // white castled → good for white → s goes down
    if(bCastled)s+=40;
    // Penalty for uncastled king after early game
    if(moveNum>8){
      if(!wCastled&&wKingLat>=0){
        const wkd=Math.min(wKingLat,7-wKingLat);
        if(wkd>1)s+=25; // white king exposed in center → bad for white
      }
      if(!bCastled&&bKingLat>=0){
        const bkd=Math.min(bKingLat,7-bKingLat);
        if(bkd>1)s-=25;
      }
    }
    // Pawn shield: count pawns adjacent to king
    for(let side=0;side<2;side++){
      const kLat=side===0?bKingLat:wKingLat;
      const kLon=side===0?bKingLon:wKingLon;
      if(kLat<0)continue;
      const sgn=side===0?1:-1;
      let shield=0;
      const fwd=side===0?1:-1; // forward direction for each side
      for(let dlo=-1;dlo<=1;dlo++){
        const sLat=kLat+fwd, sLon=wL(kLon+dlo);
        if(sLat>=0&&sLat<=7){
          const sp=board[sLat][sLon];
          if(sp&&sp.type==='P'&&sp.color===(side===0?'black':'white'))shield++;
        }
      }
      s+=sgn*(shield*12); // each shield pawn worth 12
    }
  }
  // Endgame bonuses
  if(eg){
    const _ld=(a,b)=>Math.min(Math.abs(a-b),8-Math.abs(a-b));
    // Push enemy king to polar edge (lat 0 or 7 = fewer escape squares on sphere)
    if(wKingLat>=0){
      const wkCenter=Math.min(wKingLat,7-wKingLat); // 0=pole edge, 3=equator
      s+=(3-wkCenter)*10; // white king near edge → bad for white → s↑
    }
    if(bKingLat>=0){
      const bkCenter=Math.min(bKingLat,7-bKingLat);
      s-=(3-bkCenter)*10; // black king near edge → bad for black → s↓
    }
    // Piece hunting enemy king (queen, rook, or any major piece)
    let wHasQ=false,bHasQ=false,wQLat=-1,wQLon=-1,bQLat=-1,bQLon=-1;
    let wMajors=0,bMajors=0;
    const wRooks=[],bRooks=[];
    for(let a=0;a<8;a++)for(let o=0;o<8;o++){
      const p=board[a][o];if(!p)continue;
      if(p.type==='Q'){
        if(p.color==='white'){wHasQ=true;wQLat=a;wQLon=o;wMajors++;}
        else{bHasQ=true;bQLat=a;bQLon=o;bMajors++;}
      }
      if(p.type==='R'){
        if(p.color==='white'){wMajors++;wRooks.push({a,o});}
        else{bMajors++;bRooks.push({a,o});}
      }
    }
    // Queen hunting enemy king (aggressive)
    if(wHasQ&&!bHasQ&&bKingLat>=0){
      const qd=Math.max(Math.abs(wQLat-bKingLat),_ld(wQLon,bKingLon));
      s-=(7-qd)*25; // stronger pull toward enemy king
      // King should also approach to help queen deliver mate
      const kkd=Math.max(Math.abs(wKingLat-bKingLat),_ld(wKingLon,bKingLon));
      s-=(7-kkd)*10;
    }
    if(bHasQ&&!wHasQ&&wKingLat>=0){
      const qd=Math.max(Math.abs(bQLat-wKingLat),_ld(bQLon,wKingLon));
      s+=(7-qd)*25;
      const kkd=Math.max(Math.abs(bKingLat-wKingLat),_ld(bKingLon,wKingLon));
      s+=(7-kkd)*10;
    }
    // Rook hunting enemy king: reward rook proximity when opponent has no rook
    if(wRooks.length>0&&bRooks.length===0&&!bHasQ&&bKingLat>=0){
      for(const r of wRooks){
        const rd=Math.max(Math.abs(r.a-bKingLat),_ld(r.o,bKingLon));
        s-=(7-rd)*12;
      }
    }
    if(bRooks.length>0&&wRooks.length===0&&!wHasQ&&wKingLat>=0){
      for(const r of bRooks){
        const rd=Math.max(Math.abs(r.a-wKingLat),_ld(r.o,wKingLon));
        s+=(7-rd)*12;
      }
    }
    // R+K vs K mating pattern: specialized evaluation for rook + king vs lone king
    // On the sphere, the "box method" = rook restricts enemy king's latitude band, own king closes in
    for(let side=0;side<2;side++){
      const atkCol=side===0?'white':'black';
      const defCol=side===0?'black':'white';
      const sgn=side===0?-1:1; // negative = good for white
      const atkK=side===0?{la:wKingLat,lo:wKingLon}:{la:bKingLat,lo:bKingLon};
      const defK=side===0?{la:bKingLat,lo:bKingLon}:{la:wKingLat,lo:wKingLon};
      const rooks=side===0?wRooks:bRooks;
      const oppRooks=side===0?bRooks:wRooks;
      const oppQ=side===0?bHasQ:wHasQ;
      if(rooks.length===0||oppRooks.length>0||oppQ)continue;
      if(atkK.la<0||defK.la<0)continue;
      // Count defender's non-king pieces
      let defPieces=0;
      for(let a=0;a<8;a++)for(let o=0;o<8;o++){
        const p=board[a][o];if(p&&p.color===defCol&&p.type!=='K')defPieces++;
      }
      if(defPieces>0)continue; // only activate for R+K vs lone K
      // Mating bonuses (much stronger than general hunting)
      const r=rooks[0]; // use first rook
      // 1. Enemy king pushed to edge: much stronger bonus
      const defCenter=Math.min(defK.la,7-defK.la);
      s+=sgn*(3-defCenter)*30; // 0=pole edge: +90, 3=center: 0
      // 2. Rook on same lat as enemy king (cutting off escape) or adjacent lat
      const rLatDist=Math.abs(r.a-defK.la);
      if(rLatDist<=1&&_ld(r.o,defK.lo)>=2) s+=sgn*60; // rook cutting off enemy king
      // 3. Own king close to enemy king (for coordinated mate)
      const kkDist=Math.max(Math.abs(atkK.la-defK.la),_ld(atkK.lo,defK.lo));
      s+=sgn*(7-kkDist)*20; // much stronger: up to +140
      // 4. Own king on same lat as enemy king (opposition)
      if(Math.abs(atkK.la-defK.la)<=1) s+=sgn*40;
      // 5. Rook and king on same side of enemy king (coordinated)
      const rkSameSide=(r.a<defK.la&&atkK.la<defK.la)||(r.a>defK.la&&atkK.la>defK.la);
      if(!rkSameSide) s+=sgn*25; // bonus for flanking from opposite sides
    }
    // Major pieces (R/Q) should approach enemy king in endgame
    if(wMajors>0&&!bHasQ&&bKingLat>=0){
      // Reward own king proximity to enemy king (for coordinated mating attack)
      const kkDist=Math.max(Math.abs(wKingLat-bKingLat),_ld(wKingLon,bKingLon));
      s-=(7-kkDist)*8; // white king close to black king → good for white
    }
    if(bMajors>0&&!wHasQ&&wKingLat>=0){
      const kkDist=Math.max(Math.abs(bKingLat-wKingLat),_ld(bKingLon,wKingLon));
      s+=(7-kkDist)*8;
    }
    // Passed pawn blocker
    for(const pp of passedPawns){
      const bk=pp.color==='black';
      const dir=bk?1:-1;
      let blockerCount=0;
      for(let la=pp.lat+dir;bk?(la<=7):(la>=0);la+=dir){
        const bp=board[la][pp.lon];
        if(bp&&bp.color!==(bk?'black':'white')){blockerCount++;break;}
      }
      if(blockerCount===1&&pp.dist<=3){
        const pen=pp.dist<=1?80:pp.dist<=2?50:30;
        s+=(bk?1:-1)*pen;
      }
    }
    // Endgame piece coordination: minor pieces should stay near own king
    for(let a=0;a<8;a++)for(let o=0;o<8;o++){
      const p=board[a][o];if(!p||p.type==='K'||p.type==='P')continue;
      const bk=p.color==='black';
      const kLat=bk?bKingLat:wKingLat, kLon=bk?bKingLon:wKingLon;
      if(kLat<0)continue;
      const dist=Math.max(Math.abs(a-kLat),_ld(o,kLon));
      // Knight/bishop far from own king in endgame is bad (can't coordinate for mate)
      if(p.type==='N'||p.type==='B'){
        if(dist>3) s+=(bk?-1:1)*(dist-3)*12; // penalty for being far from own king
      }
      // Rook can operate from distance, but should still be somewhat coordinated
      if(p.type==='R'&&dist>5) s+=(bk?-1:1)*(dist-5)*6;
    }
    // King should move toward own remaining pieces, not flee randomly
    for(let side=0;side<2;side++){
      const kLat=side===0?bKingLat:wKingLat;
      const kLon=side===0?bKingLon:wKingLon;
      if(kLat<0)continue;
      const sgn=side===0?1:-1;
      const col=side===0?'black':'white';
      let totalDist=0,pieceCount=0;
      for(let a=0;a<8;a++)for(let o=0;o<8;o++){
        const p=board[a][o];if(!p||p.color!==col||p.type==='K')continue;
        totalDist+=Math.max(Math.abs(a-kLat),_ld(o,kLon));
        pieceCount++;
      }
      if(pieceCount>0){
        const avgDist=totalDist/pieceCount;
        // Penalize king being far from its own army
        if(avgDist>3) s-=sgn*Math.round((avgDist-3)*8);
      }
    }
  }
  // Middlegame: queen should stay near own king for defense when king is exposed
  if(!eg){
    for(let a=0;a<8;a++)for(let o=0;o<8;o++){
      const p=board[a][o];if(!p||p.type!=='Q')continue;
      const bk=p.color==='black';
      const kLat=bk?bKingLat:wKingLat, kLon=bk?bKingLon:wKingLon;
      if(kLat<0)continue;
      const kCastled=bk?bCastled:wCastled;
      if(!kCastled){
        const _ld2=(x,y)=>Math.min(Math.abs(x-y),8-Math.abs(x-y));
        const qkDist=Math.max(Math.abs(a-kLat),_ld2(o,kLon));
        if(qkDist>4) s+=(bk?-1:1)*(qkDist-4)*12; // queen too far from uncastled king
      }
    }
  }
  // Tempo bonus: white has first-move advantage
  s-=8; // s negative = good for white
  return s;
}

// α-β with time deadline
function _abSearch(depth,alpha,beta,maxing,deadline){
  if(Date.now()>=deadline)return evaluate();
  if(depth<=0)return _abQuiesce(alpha,beta,maxing,4,deadline);
  const color=maxing?'black':'white';
  const mvs=allAIMoves(color);
  if(!mvs.length){
    // No moves: checkmate or stalemate
    if(isInCheck(color))return maxing?(-90000+depth*100):(90000-depth*100);
    // Stalemate: penalize the winning side (drawing when ahead is terrible)
    const stalEval=evaluate();
    // If black is ahead (stalEval>0) and it's white's turn with no moves → white is stalemated
    // Black caused the stalemate and should be penalized for drawing
    if(Math.abs(stalEval)>200){
      // Return a value bad for the side that was winning
      return stalEval>0?-3000:3000; // heavy penalty for stalemating when winning
    }
    return 0; // truly equal position → stalemate is fine
  }
  mvs.sort((a,b)=>{
    const va=(board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?_EV.P:0);
    const vb=(board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?_EV.P:0);
    return vb-va;
  });
  let best=maxing?-Infinity:Infinity;
  for(const m of mvs){
    if(Date.now()>=deadline)break;
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const sc=_abSearch(depth-1,alpha,beta,!maxing,deadline);
    aiUndo(m,pc,sv);
    if(maxing){if(sc>best)best=sc;if(sc>alpha)alpha=sc;}
    else{if(sc<best)best=sc;if(sc<beta)beta=sc;}
    if(beta<=alpha)break;
  }
  return best===(-Infinity)||best===Infinity?evaluate():best;
}
function _abQuiesce(alpha,beta,maxing,qleft,deadline){
  if(Date.now()>=deadline)return evaluate();
  const stand=evaluate();
  if(qleft<=0)return stand;
  if(maxing){if(stand>=beta)return beta;if(stand>alpha)alpha=stand;}
  else{if(stand<=alpha)return alpha;if(stand<beta)beta=stand;}
  const color=maxing?'black':'white';
  const caps=allAIMoves(color).filter(m=>board[m.tLat][m.tLon]||m.isEnPassant);
  caps.sort((a,b)=>{
    const va=board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0;
    const vb=board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0;
    return vb-va;
  });
  for(const m of caps){
    if(Date.now()>=deadline)break;
    const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
    const sc=_abQuiesce(alpha,beta,!maxing,qleft-1,deadline);
    aiUndo(m,pc,sv);
    if(maxing){if(sc>alpha){alpha=sc;if(alpha>=beta)return beta;}}
    else{if(sc<beta){beta=sc;if(beta<=alpha)return alpha;}}
  }
  return maxing?alpha:beta;
}

// Iterative deepening with time control + progress UI
function _findBestMove(color,timeLimitMs,onProgress,onDone,opts){
  const captureBonus=(opts?.captureBonus)||0;
  const globeBonus=(opts?.globeBonus)||0;  // scale factor for globe-wrapping spectacle bonus
  const t0=Date.now(),deadline=t0+timeLimitMs;
  // Pre-compute phase deadlines as absolute timestamps
  const dlEarly=t0+timeLimitMs*0.55;  // stop starting new depths after 55% of time
  const dlMid  =t0+timeLimitMs*0.80;  // abort if no time for a full depth
  const dlLate =t0+timeLimitMs*0.95;  // stop mid-depth if nearly out of time
  const legal=[];
  for(let a=0;a<8;a++)for(let o=0;o<8;o++){
    if(board[a][o]?.color!==color)continue;
    getLegalMoves(a,o).forEach(mv=>legal.push({fLat:a,fLon:o,tLat:mv.lat,tLon:mv.lon,...mv}));
  }
  if(!legal.length){onDone(null,0);return;}
  // Shuffle for variety among equal-scoring moves
  for(let i=legal.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[legal[i],legal[j]]=[legal[j],legal[i]];}
  // Initial ordering: captures first (stable: equal-value captures keep shuffled order)
  // Assign shuffle index to preserve randomness within same-value groups
  legal.forEach((m,i)=>m._si=i);
  legal.sort((a,b)=>{
    // Near-promotion pawns first (distance ≤2 to promo rank)
    const pa=board[a.fLat]?.[a.fLon], pb=board[b.fLat]?.[b.fLon];
    const promA=pa?.type==='P'?Math.abs((pa.color==='black'?7:0)-a.tLat):99;
    const promB=pb?.type==='P'?Math.abs((pb.color==='black'?7:0)-b.tLat):99;
    if(promA<=2&&promB>2)return -1;
    if(promB<=2&&promA>2)return 1;
    // Then captures by value
    const va=(board[a.tLat][a.tLon]?_EV[board[a.tLat][a.tLon].type]:0)+(a.isEnPassant?_EV.P:0);
    const vb=(board[b.tLat][b.tLon]?_EV[board[b.tLat][b.tLon].type]:0)+(b.isEnPassant?_EV.P:0);
    return vb-va||(a._si-b._si);
  });
  let bestMove=legal[0],finalDepth=0;
  // Random noise for tie-breaking (±8 pts — varies openings without affecting real decisions)
  const _noise=()=>(Math.random()-0.5)*16;
  // Anti-oscillation (auto-battle only) — check last 6 moves for reversals
  const recent=autoBattleActive?(_autoBattleLog?.moves||[]).filter(m=>m.color===color).slice(-6):[];
  const isRev=m=>recent.some(p=>p.coords[2]===m.fLat&&p.coords[3]===m.fLon&&p.coords[0]===m.tLat&&p.coords[1]===m.tLon);
  // Broader repetition: penalize moves that recreate ANY position we've seen before
  const posHist=autoBattleActive?_autoPosHist:{};
  // Same-piece wandering detection: chain-based identity tracking
  // Trace piece identity by linking move destinations to origins (handles pole crossings)
  const _pieceWanderCount={};
  const _pieceTypeCount={};
  if(autoBattleActive){
    const allRecent=(_autoBattleLog?.moves||[]).filter(m=>m.color===color).slice(-10);
    // Build identity chains: a piece that moved FROM (fLat,fLon) TO (tLat,tLon)
    // is the same piece that later moves FROM (tLat,tLon). Chain consecutive non-capture moves.
    // Count consecutive non-capture moves per chain (reset on capture of significant piece ≥300).
    const chains={}; // key = current position → {count, type}
    for(let i=0;i<allRecent.length;i++){
      const m=allRecent[i];
      const fromKey=`${m.coords[0]},${m.coords[1]}`;
      const toKey=`${m.coords[2]},${m.coords[3]}`;
      const sigCapture=m.captured&&m.captureVal>=300;
      // Find chain at fromKey (this piece was previously tracked here)
      const prev=chains[fromKey];
      const cnt=(!sigCapture&&prev)?prev.count+1:1;
      delete chains[fromKey]; // piece left this square
      chains[toKey]={count:cnt,type:m.piece};
      // Type counting (non-capture moves only)
      if(!m.captured){
        _pieceTypeCount[m.piece]=(_pieceTypeCount[m.piece]||0)+1;
      }
    }
    // Map current positions to wander counts
    Object.entries(chains).forEach(([key,{count,type}])=>{
      _pieceWanderCount[key]=count;
    });
    _pieceWanderCount._types=_pieceTypeCount;
  }
  let searchDepth=0;

  function nextDepth(){
    searchDepth++;
    if(searchDepth>8||Date.now()>=dlEarly){onDone(bestMove,finalDepth);return;}
    if(onProgress)onProgress(searchDepth,Date.now()-t0);
    setTimeout(()=>{
      if(Date.now()>=dlMid){onDone(bestMove,finalDepth);return;}
      const isBlack=color==='black';
      let dBest=null,dBestSc=isBlack?-Infinity:Infinity;
      let completed=true;
      for(const m of legal){
        if(Date.now()>=dlLate){completed=false;break;}
        const pc=board[m.fLat][m.fLon];const sv=aiApply(m);
        const opp=color==='black'?'white':'black';
        const givesCheck=isInCheck(opp);
        // Stalemate avoidance: if this move leaves opponent with no legal moves and not in check
        // it's stalemate (draw). If we're winning, heavily penalize drawing.
        const oppHasMoves=hasAnyLegalMove(opp);
        let sc=_abSearch(searchDepth-1,-Infinity,Infinity,!isBlack,deadline);
        aiUndo(m,pc,sv);
        if(!oppHasMoves&&!givesCheck){
          // Stalemate! If we have material advantage, this is terrible
          const eval0=evaluate();
          const ourAdvantage=isBlack?eval0:-eval0; // positive = we're winning
          if(ourAdvantage>200) sc+=(isBlack?-1:1)*5000; // massive penalty for stalemate when winning
        }
        // Repetition penalty
        if(autoBattleActive){
          const sv2=aiApply(m);
          const h=_autoBoardHash();
          aiUndo(m,pc,sv2);
          const cnt=posHist[h]||0;
          if(cnt>=1)sc+=(isBlack?-1:1)*(cnt>=2?3000:600);
        }
        // Check bonus: giving check is aggressive and constrains opponent
        if(givesCheck)sc+=(isBlack?1:-1)*120;
        // Capture incentive with exchange strategy
        if(sv.c||sv.epCap){
          const capT=sv.c?sv.c.type:(sv.epCap?'P':null);
          const capVal=capT?_EV[capT]:0;
          const ownVal=pc?_EV[pc.type]:0;
          const materialGain=capVal-ownVal;
          const curEval=evaluate();
          const ourLead=isBlack?curEval:-curEval;
          // Asymmetric bonus: reward winning exchanges
          if(materialGain>0){
            sc+=(isBlack?1:-1)*Math.min(Math.round(materialGain*0.3),300);
          }
          // Safety check: high-value piece capturing low-value target
          // If Q/R captures a pawn/minor and target square is attacked, penalize
          if(ownVal>=600&&capVal<ownVal-150){
            // Quick check: is target square attacked by opponent after our capture?
            const opp2=color==='black'?'white':'black';
            let sqAttacked=false;
            const sv3=aiApply(m);
            outer:for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
              const p2=board[la][lo];if(!p2||p2.color!==opp2)continue;
              const mvs2=getValidMoves(la,lo);
              for(const mv2 of mvs2){
                if(mv2.lat===m.tLat&&mv2.lon===m.tLon){sqAttacked=true;break outer;}
              }
            }
            aiUndo(m,pc,sv3);
            if(sqAttacked){
              // Piece is likely to be recaptured — penalize based on value at risk
              sc+=(isBlack?-1:1)*Math.round((ownVal-capVal)*0.4);
            }
          }
          // Exchange strategy: when leading, avoid equal trades; when trailing, seek them
          if(Math.abs(materialGain)<100){
            if(ourLead>150) sc+=(isBlack?-1:1)*(ourLead>400?80:60);
            else if(ourLead<-150) sc+=(isBlack?1:-1)*(ourLead<-400?80:60);
            else sc+=(isBlack?-1:1)*25;
          }
          // Base capture bonus (still want aggressive play)
          if(captureBonus>0&&capT){
            sc+=(isBlack?1:-1)*Math.min(Math.round(capVal*captureBonus),200);
          }
        }
        // Safety check: non-capture moves — penalize moving Q/R/N/B to an attacked square
        if(!sv.c&&!sv.epCap&&pc&&pc.type!=='K'&&pc.type!=='P'){
          const pieceVal=_EV[pc.type];
          if(pieceVal>=600){
            const opp3=color==='black'?'white':'black';
            let cheapestAttacker=99999;
            const sv4=aiApply(m);
            for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
              const p3=board[la][lo];if(!p3||p3.color!==opp3)continue;
              const mvs3=getValidMoves(la,lo);
              for(const mv3 of mvs3){
                if(mv3.lat===m.tLat&&mv3.lon===m.tLon){
                  const av=_EV[p3.type];
                  if(av<cheapestAttacker)cheapestAttacker=av;
                  break;
                }
              }
            }
            aiUndo(m,pc,sv4);
            if(cheapestAttacker<99999){
              // Square is attacked. Penalize based on how much we'd lose.
              if(cheapestAttacker<pieceVal){
                // Opponent can profit by capturing: heavy penalty
                sc+=(isBlack?-1:1)*Math.round((pieceVal-cheapestAttacker)*0.5);
              } else {
                // Equal or losing trade for opponent, but still risky
                sc+=(isBlack?-1:1)*40;
              }
            }
          }
        }
        // Forward aggression: reward pieces moving toward opponent's territory
        if(pc){
          const fromRank=isBlack?m.fLat:(7-m.fLat);
          const toRank=isBlack?m.tLat:(7-m.tLat);
          if(toRank>fromRank&&pc.type!=='K')sc+=(isBlack?1:-1)*((toRank-fromRank)*8);
          // Retreat penalty: non-king pieces moving backward without capturing
          if(toRank<fromRank&&pc.type!=='K'&&!sv.c&&!sv.epCap){
            const retreatPen=(fromRank-toRank)*15;
            // Extra penalty for retreating to back rank (lp=0)
            const backPen=(toRank===0)?30:0;
            sc+=(isBlack?-1:1)*(retreatPen+backPen);
          }
        }
        // Wandering piece penalty: piece moved repeatedly without significant progress
        // Only skip penalty for captures of pieces worth ≥300 (not pawn captures)
        const _sigCapture=sv.c&&_EV[sv.c.type]>=300;
        if(autoBattleActive&&!_sigCapture&&pc){
          const pieceKey=`${m.fLat},${m.fLon}`;
          const pmCount=_pieceWanderCount[pieceKey]||0;
          if(pmCount>=2)sc+=(isBlack?-1:1)*(pmCount-1)*100;
          const typeCount=(_pieceWanderCount._types||{})[pc.type]||0;
          if(typeCount>=3&&pc.type!=='K'&&pc.type!=='P')sc+=(isBlack?-1:1)*(typeCount-2)*70;
        }
        // Globe spectacle bonus
        if(globeBonus>0){
          let gb=0;
          const steps=m.step||0;
          if(steps>3) gb+=(steps-3)*12;
          if(m.pole) gb+=50;
          if(m.straightDn&&steps>4) gb+=35;
          if(m.diagKey&&steps>3) gb+=(steps-3)*10+30;
          sc+=(isBlack?1:-1)*Math.round(gb*globeBonus);
        }
        if(isRev(m))sc=isBlack?sc-1500:sc+1500;
        // Random noise to break ties → different games each time
        sc+=(isBlack?1:-1)*_noise();
        if(isBlack?sc>dBestSc:sc<dBestSc){dBestSc=sc;dBest=m;}
      }
      // Only update bestMove if this depth completed fully (partial results unreliable)
      if(completed&&dBest){
        bestMove=dBest;finalDepth=searchDepth;
        const idx=legal.indexOf(dBest);
        if(idx>0){legal.splice(idx,1);legal.unshift(dBest);}
      }
      nextDepth();
    },4);
  }
  nextDepth();
}

// ── Main drive loop ───────────────────────────────────────────────────────────

function doAutoMove(){
  if(!autoBattleActive||autoBattlePaused)return;
  if(moveAnim||globeRotAnim||dragging){_autoBattleTimer=setTimeout(doAutoMove,120);return;}

  const log=_autoBattleLog;if(!log)return;

  // Move-limit guard
  if(log.moves.length>=AUTO_MAX_MOVES){
    _autoLogAnomaly('MOVE_LIMIT',`Game exceeded ${AUTO_MAX_MOVES} moves — possible infinite loop`);
    _endAutoGame('DRAW_MOVE_LIMIT');return;
  }

  // 3-fold repetition guard
  const hash=_autoBoardHash();
  _autoPosHist[hash]=(_autoPosHist[hash]||0)+1;
  if(_autoPosHist[hash]>=3){
    _autoLogAnomaly('REPETITION','Same position repeated 3 times',{count:_autoPosHist[hash]});
    _endAutoGame('DRAW_REPETITION');return;
  }

  // Insufficient material — neither side can force checkmate
  if(_autoInsufMaterial()){
    _autoLogAnomaly('INSUF_MATERIAL','Both sides have insufficient mating material (K/K+minor vs K/K+minor)');
    _endAutoGame('DRAW_INSUF_MATERIAL');return;
  }

  // Symmetric endgame detection: R+K vs R+K (with equal pawns) → draw quickly
  // Also covers equal minor piece endgames that will never produce a winner
  if(log.moves.length>=50){
    let wPieces=[],bPieces=[],wPawns=0,bPawns=0;
    for(let la=0;la<8;la++)for(let lo=0;lo<8;lo++){
      const p=board[la][lo];if(!p||p.type==='K')continue;
      if(p.type==='P'){if(p.color==='white')wPawns++;else bPawns++;continue;}
      (p.color==='white'?wPieces:bPieces).push(p.type);
    }
    const wStr=wPieces.sort().join(''), bStr=bPieces.sort().join('');
    // Symmetric: same pieces and same number of pawns
    if(wStr===bStr&&wPawns===bPawns){
      // R vs R, B vs B, N vs N, RB vs RB, etc. with equal pawns → draw after 8 half-moves of low eval
      if(!log._symDrawStreak)log._symDrawStreak=0;
      if(Math.abs(evaluate())<=300) log._symDrawStreak++;
      else log._symDrawStreak=0;
      if(log._symDrawStreak>=8){
        _endAutoGame('DRAW_AGREEMENT');return;
      }
    } else { log._symDrawStreak=0; }
  }

  // 50-move rule — 100 half-moves without capture or pawn advance
  if((log.halfMoveClock||0)>=100){
    _autoLogAnomaly('FIFTY_MOVE',`50-move rule triggered after ${log.halfMoveClock} half-moves without capture or pawn advance`);
    _endAutoGame('DRAW_FIFTY_MOVE');return;
  }

  // ── Resignation & draw-by-agreement ────────────────────────────────────────
  const _ev=evaluate();
  if(_ev >= RESIGN_THRESHOLD){
    log.wResignStreak++;log.bResignStreak=0;log.drawStreak=0;
  } else if(_ev <= -RESIGN_THRESHOLD){
    log.bResignStreak++;log.wResignStreak=0;log.drawStreak=0;
  } else {
    log.wResignStreak=0;log.bResignStreak=0;
    if(log.moves.length>=40 && Math.abs(_ev)<=DRAW_EVAL_RANGE){
      log.drawStreak++;
    } else {
      log.drawStreak=0;
    }
  }
  if(log.wResignStreak>=RESIGN_STREAK){_endAutoGame('WHITE_RESIGNS');return;}
  if(log.bResignStreak>=RESIGN_STREAK){_endAutoGame('BLACK_RESIGNS');return;}
  if(log.drawStreak>=DRAW_STREAK){_endAutoGame('DRAW_AGREEMENT');return;}

  // Game-end check (before AI thinks)
  if(!hasAnyLegalMove(turnColor)){
    _endAutoGame(isInCheck(turnColor)
      ?(turnColor==='white'?'BLACK_WINS_CHECKMATE':'WHITE_WINS_CHECKMATE')
      :'DRAW_STALEMATE');
    return;
  }

  // Show thinking status
  const cLabel=turnColor==='white'?'White':'Black';
  turnEl.textContent=cLabel+' thinking…';

  // Async AI search — aggressive + spectacular play
  const t0=Date.now();
  _findBestMove(turnColor,_AUTO_THINK_MS,
    (depth,elapsed)=>{
      turnEl.textContent=cLabel+' thinking…';
    },
    (m,fd)=>{
      if(!autoBattleActive)return;
      const thinkMs=Date.now()-t0;
      if(!m){
        _autoLogAnomaly('NO_MOVE',`${turnColor} AI returned null despite available legal moves`,
          {legalCheck:allAIMoves(turnColor).length});
        _endAutoGame('ERROR_NO_MOVE');return;
      }
      const piece=board[m.fLat][m.fLon];
      if(!piece){
        _autoLogAnomaly('EMPTY_FROM','AI selected a move originating from an empty square',
          {from:`${m.fLat},${m.fLon}`,to:`${m.tLat},${m.tLon}`});
        _endAutoGame('ERROR_EMPTY_SQUARE');return;
      }
      // Record move (guard against double-recording)
      const cap=board[m.tLat][m.tLon];
      const color=turnColor;
      const _lastMove=log.moves.length>0?log.moves[log.moves.length-1]:null;
      if(_lastMove&&_lastMove.color===color&&_lastMove.coords[0]===m.fLat&&_lastMove.coords[1]===m.fLon
        &&_lastMove.coords[2]===m.tLat&&_lastMove.coords[3]===m.tLon){
        return; // exact same move already recorded — skip duplicate
      }
      const entry={
        n:log.moves.length+1,color,piece:piece.type,
        from:_autoNote(m.fLat,m.fLon),to:_autoNote(m.tLat,m.tLon),
        captured:cap?cap.type:null,captureVal:cap?AI_PVAL[cap.type]:0,
        special:m.isCastle?'castle':m.isEnPassant?'ep':null,
        thinkMs,coords:[m.fLat,m.fLon,m.tLat,m.tLon]
      };
      log.moves.push(entry);
      if(cap)(color==='white'?log.wCapt:log.bCapt).push({t:cap.type,v:AI_PVAL[cap.type]});
      log.halfMoveClock=(cap||piece.type==='P')?0:(log.halfMoveClock||0)+1;
      // Chess notation status
      const _an=_moveNotation(piece,m.fLat,m.fLon,m.tLat,m.tLon,!!cap||!!m.isEnPassant,m,false,false);
      turnEl.textContent=(color==='white'?'White':'Black')+': '+_an;
      // Rotate globe to face the piece, show move dots briefly, execute
      const localDir=cellPos(m.fLat,m.fLon,R).normalize();
      rotateGlobeToFace(localDir,460,()=>{
        showMoves(m.fLat,m.fLon,m.tLat,m.tLon);
        setTimeout(()=>execMove(m.fLat,m.fLon,m.tLat,m.tLon),370);
      });
    },
    {captureBonus:0.25, globeBonus:1}  // aggressive captures + globe spectacle
  );
}

// ── Game lifecycle ────────────────────────────────────────────────────────────
function _endAutoGame(result){
  if(!autoBattleActive)return;
  autoBattleActive=false;autoBattlePaused=false;
  clearTimeout(_autoBattleTimer);
  clearVis();
  if(_autoBattleLog){_autoBattleLog.result=result;_autoBattleLog.endTime=Date.now();}
  const _MSG={
    WHITE_RESIGNS:'White resigns — Black wins',BLACK_RESIGNS:'Black resigns — White wins',
    DRAW_AGREEMENT:'Draw — by agreement',BLACK_WINS_CHECKMATE:'Checkmate — Black wins',
    WHITE_WINS_CHECKMATE:'Checkmate — White wins',DRAW_STALEMATE:'Draw — stalemate',
    DRAW_REPETITION:'Draw — threefold repetition',DRAW_FIFTY_MOVE:'Draw — 50-move rule',
    DRAW_INSUF_MATERIAL:'Draw — insufficient material',DRAW_MOVE_LIMIT:'Draw — move limit reached',
    ERROR_NO_MOVE:'Error — no move found',ERROR_EMPTY_SQUARE:'Error — empty square',
    STOPPED_BY_USER:'Stopped',
  };
  turnEl.textContent=_MSG[result]||result;
  if(result==='WHITE_RESIGNS'||result==='BLACK_RESIGNS') playGameOver();
  // Show Report button (replace Pause), keep Reset and Quit
  const pauseBtn=document.getElementById('autoPauseBtn');
  if(_autoBattleLog&&_autoBattleLog.moves.length>0){
    pauseBtn.textContent='Record';
    pauseBtn.onclick=()=>_copyRecord();
  } else {
    // No moves — just restore UI
    document.getElementById('aiWrap').style.display='';
    document.getElementById('newGameBtn').style.display='';
    document.getElementById('testBtn').style.display='';
    document.getElementById('autoBattleBtn').style.display='';
    document.getElementById('autoBattleControls').style.display='none';
  }
}

function startAutoBattle(){
  if(testModeActive)return;
  if(autoBattleActive)stopAutoBattle();
  _autoGameNum++;_autoPosHist={};
  _autoBattleLog={gameNum:_autoGameNum,moves:[],anomalies:[],wCapt:[],bCapt:[],
    result:null,halfMoveClock:0,
    wResignStreak:0,bResignStreak:0,drawStreak:0,
    startTime:Date.now(),endTime:null};
  autoBattleActive=true;autoBattlePaused=false;
  document.getElementById('aiToggle').checked=false;
  aiMode=false;aiThinking=false;_updateAILabel();
  resetGame();
  // Hide other UI, show battle controls
  document.getElementById('aiWrap').style.display='none';
  document.getElementById('newGameBtn').style.display='none';
  document.getElementById('testBtn').style.display='none';
  document.getElementById('autoBattleBtn').style.display='none';
  document.getElementById('autoBattleControls').style.display='flex';
  const _pb=document.getElementById('autoPauseBtn');
  _pb.textContent='Pause'; _pb.onclick=toggleAutoPause;
  _autoBattleTimer=setTimeout(doAutoMove,900);
}

function toggleAutoPause(){
  if(!autoBattleActive)return;
  autoBattlePaused=!autoBattlePaused;
  document.getElementById('autoPauseBtn').textContent=autoBattlePaused?'Resume':'Pause';
  if(!autoBattlePaused){clearTimeout(_autoBattleTimer);doAutoMove();}
}

function newAutoBattle(){
  _autoBattleLog=null;autoBattleActive=false;
  clearTimeout(_autoBattleTimer);
  const pb=document.getElementById('autoPauseBtn');
  pb.textContent='Pause'; pb.onclick=toggleAutoPause;
  startAutoBattle();
}

function stopAutoBattle(){
  clearTimeout(_autoBattleTimer);
  clearVis();
  if(autoBattleActive&&_autoBattleLog&&_autoBattleLog.moves.length>0){
    _autoBattleLog.result='STOPPED_BY_USER';_autoBattleLog.endTime=Date.now();
  }
  autoBattleActive=false;autoBattlePaused=false;
  // Restore pause button and full UI
  const pb=document.getElementById('autoPauseBtn');
  pb.textContent='Pause'; pb.onclick=toggleAutoPause;
  document.getElementById('aiWrap').style.display='';
  document.getElementById('newGameBtn').style.display='';
  document.getElementById('testBtn').style.display='';
  document.getElementById('autoBattleBtn').style.display='';
  document.getElementById('autoBattleControls').style.display='none';
  turnEl.textContent='White to move';
}





// ── Record generation ─────────────────────────────────────────────────────────
function _genCompactRecord(){
  const log=_autoBattleLog;if(!log)return'';
  const dur=log.endTime?Math.round((log.endTime-log.startTime)/1000):0;
  const ds=dur<60?dur+'s':Math.floor(dur/60)+'m'+(dur%60)+'s';
  const RES={
    BLACK_WINS_CHECKMATE:'B_MATE',WHITE_WINS_CHECKMATE:'W_MATE',
    WHITE_RESIGNS:'B_WIN_RES',BLACK_RESIGNS:'W_WIN_RES',
    DRAW_AGREEMENT:'DRAW_AGR',DRAW_STALEMATE:'DRAW_STALE',
    DRAW_REPETITION:'DRAW_REP',DRAW_MOVE_LIMIT:'DRAW_LIM',
    DRAW_FIFTY_MOVE:'DRAW_50',DRAW_INSUF_MATERIAL:'DRAW_INSUF',
    ERROR_NO_MOVE:'ERR_NULL',ERROR_EMPTY_SQUARE:'ERR_EMPTY',
    STOPPED_BY_USER:'STOPPED'
  };
  // Compact captures: P5+N2+B2+Q1+R1=3100
  const capStr=arr=>{
    if(!arr.length)return'-';
    const g={};arr.forEach(({t,v})=>{if(!g[t])g[t]=0;g[t]++;});
    const total=arr.reduce((s,{v})=>s+v,0);
    return Object.entries(g).map(([t,n])=>t+n).join('+')+`=${total}`;
  };
  // Compact move: piece+from+cap?+to+special (e.g. "Nb1-a3" "Paxb5" "Ke1-a1castle")
  const mvStr=m=>{
    const c=m.captured?'x':'>';
    let s=m.piece+m.from+c+m.to;
    if(m.special)s+='.'+m.special;
    s+='.'+m.thinkMs;
    return s;
  };
  // Board: 8 ranks separated by /, pieces as FEN (uppercase=white, lowercase=black)
  const fenRow=lat=>{
    let r='',empty=0;
    for(let lo=0;lo<8;lo++){
      const p=board[lat][lo];
      if(!p){empty++;continue;}
      if(empty>0){r+=empty;empty=0;}
      const ch=p.type==='N'?'N':p.type;
      r+=p.color==='white'?ch:ch.toLowerCase();
    }
    if(empty>0)r+=empty;
    return r;
  };
  const boardStr=[];for(let la=0;la<8;la++)boardStr.push(fenRow(la));
  // Anomalies compact
  const anomStr=log.anomalies.length===0?'':'\nA:'+log.anomalies.map(a=>`#${a.n}:${a.type}`).join(',');
  const lines=[
    `GLOBE_CHESS ${_VERSION} #${log.gameNum} ${new Date(log.startTime).toISOString()}`,
    `R:${RES[log.result]||log.result} N:${log.moves.length} D:${ds}`,
    `WC:${capStr(log.wCapt)} BC:${capStr(log.bCapt)}`,
    `BD:${boardStr.join('/')}`,
    `MV:${log.moves.map(mvStr).join(' ')}`
  ];
  if(anomStr)lines.push(anomStr);
  return lines.join('\n');
}

function _copyRecord(){
  const record=_genCompactRecord();
  if(!record)return;
  try{navigator.clipboard?.writeText(record);}catch(e){
    // Fallback
    const ta=document.createElement('textarea');
    ta.value=record;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const pauseBtn=document.getElementById('autoPauseBtn');
  pauseBtn.textContent='Record copied';
  setTimeout(()=>{pauseBtn.textContent='Record';},2000);
}

function _showAutoReport(){_copyRecord();}

function closeReport(){
  document.getElementById('reportModal').classList.remove('visible');
  if(!autoBattleActive)turnEl.textContent=turnColor==='white'?'White to move':'Black to move';
}

function copyReport(){_copyRecord();}

animate();
