<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日文書頁辨識</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&display=swap');

  :root {
    --ink: #1a1208;
    --paper: #f7f3ec;
    --paper2: #faf7f2;
    --gold: #8b6914;
    --gold-light: #c4a84a;
    --border: #d8cdb8;
    --muted: #9a8a72;
    --error-bg: #fff0ee;
    --error-border: #e0a090;
    --error-text: #8b2020;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    font-family: 'Noto Serif JP', Georgia, serif;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    padding: 18px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    color: var(--paper);
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 1px;
  }
  header span {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
  }

  /* ── Main layout ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ── Preview zone ── */
  #preview-wrap {
    position: relative;
    width: 100%;
    background: var(--paper2);
    border: 2px dashed var(--border);
    border-radius: 10px;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 14px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #preview-wrap:hover { border-color: var(--gold); }
  #preview-img {
    display: none;
    width: 100%;
    max-height: 360px;
    object-fit: contain;
  }
  #preview-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    padding: 30px 20px;
    text-align: center;
  }
  #preview-placeholder .icon { font-size: 44px; opacity: 0.4; }
  #preview-placeholder .txt { font-size: 14px; letter-spacing: 1px; }
  #preview-placeholder .sub { font-size: 11px; opacity: 0.6; }

  /* ── Buttons ── */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  button {
    font-family: 'Noto Serif JP', serif;
    cursor: pointer;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 12px;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
  }

  #btn-camera {
    background: var(--gold);
    color: #fff8e8;
    font-weight: 600;
  }
  #btn-camera:active { background: #6e530f; transform: scale(0.97); }
  #btn-camera:disabled { opacity: 0.4; }

  #btn-gallery {
    background: var(--ink);
    color: var(--paper);
  }
  #btn-gallery:active { background: #3a2808; transform: scale(0.97); }

  /* Hidden file inputs */
  input[type=file] { display: none; }

  /* ── Status / Loading ── */
  #status {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  #error-box {
    display: none;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--error-text);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 16px;
  }

  /* ── Result ── */
  #result-section { display: none; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .result-title {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  #btn-copy {
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    padding: 8px 18px;
    border-radius: 20px;
    letter-spacing: 1px;
  }
  #btn-copy:active { background: #3a2808; }
  #btn-copy.copied { background: #2a6830; }

  /* Page number badge */
  #page-badge {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    letter-spacing: 2px;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
    width: fit-content;
  }

  /* Blocks */
  #blocks-container { display: flex; flex-direction: column; gap: 0; }

  .block-card {
    background: var(--paper2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .block-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: rgba(139,105,20,0.07);
    border-bottom: 1px solid var(--border);
  }
  .block-position {
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .block-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .block-text {
    padding: 14px 16px;
    font-size: 15px;
    line-height: 2.1;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* ── Divider ── */
  .gold-line {
    width: 36px; height: 2px;
    background: var(--gold);
    margin: 0 auto 22px;
  }

  /* Footer */
  footer {
    text-align: center;
    color: var(--border);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>日文書頁辨識</h1>
  <span>Japanese OCR</span>
</header>

<main>
  <div class="gold-line"></div>

  <!-- Preview -->
  <div id="preview-wrap" onclick="document.getElementById('input-gallery').click()">
    <img id="preview-img" alt="book page">
    <div id="preview-placeholder">
      <div class="icon">📖</div>
      <div class="txt">點擊選取照片</div>
      <div class="sub">或使用下方「拍照」按鈕</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button id="btn-camera" onclick="document.getElementById('input-camera').click()">
      📷 拍照辨識
    </button>
    <button id="btn-gallery" onclick="document.getElementById('input-gallery').click()">
      🖼 從相簿選取
    </button>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="input-camera" accept="image/*" capture="environment">
  <input type="file" id="input-gallery" accept="image/*">

  <!-- Error -->
  <div id="error-box"></div>

  <!-- Loading status -->
  <div id="status">
    <div class="spinner"></div>
    <span>正在辨識日文文字⋯</span>
  </div>

  <!-- Result -->
  <div id="result-section">
    <div class="result-header">
      <div class="result-title">辨識結果</div>
      <button id="btn-copy" onclick="copyAll()">複製全文</button>
    </div>

    <div id="page-badge">📄 頁碼：<span id="page-num-text"></span></div>

    <div id="blocks-container"></div>
  </div>

  <footer>Powered by Claude Vision · 日文書頁 OCR</footer>
</main>

<script>
const SYSTEM_PROMPT = `你是一個專業的日文書頁 OCR 工具。

用戶會提供一張書頁的照片。頁面上有多個日文文字區塊，排列不規則。

你的任務：
1. 仔細掃描整張圖片，辨識所有日文文字
2. 將文字按「所在位置」分區（例如：右上、左上、中央、右下、左下、頁面頂端、頁面底部、角落頁碼 等）
3. 每個區塊依照「從右到左、從上到下」的日文閱讀順序轉錄
4. 輸出格式請嚴格遵守以下 JSON，不要輸出其他文字：

{
  "pageNumber": "頁碼數字，沒有就填 null",
  "blocks": [
    {
      "position": "位置名稱（例如：右上、左下、中央、頁碼）",
      "text": "該區塊的完整文字內容，保留換行"
    }
  ]
}

位置名稱請用繁體中文，盡量精確描述（右上角、左下角、頁面中央偏右、頁面底部中央 等）。
只輸出 JSON，不要有任何前言或解釋。`;

let currentBase64 = null;
let currentMediaType = null;
let fullResultText = "";

// Wire up both file inputs
document.getElementById('input-camera').addEventListener('change', e => {
  handleFile(e.target.files[0], true);
  e.target.value = "";
});
document.getElementById('input-gallery').addEventListener('change', e => {
  handleFile(e.target.files[0], false);
  e.target.value = "";
});

function handleFile(file, autoAnalyze) {
  if (!file || !file.type.startsWith('image/')) return;

  // Show preview
  const url = URL.createObjectURL(file);
  const img = document.getElementById('preview-img');
  img.src = url;
  img.style.display = 'block';
  document.getElementById('preview-placeholder').style.display = 'none';

  // Read base64
  const reader = new FileReader();
  reader.onload = e => {
    currentBase64 = e.target.result.split(',')[1];
    currentMediaType = file.type;
    if (autoAnalyze) analyze();
  };
  reader.readAsDataURL(file);

  // Clear previous result
  clearResult();
}

function clearResult() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('blocks-container').innerHTML = '';
  document.getElementById('page-badge').style.display = 'none';
  fullResultText = "";
}

async function analyze() {
  if (!currentBase64) return;

  setLoading(true);
  clearResult();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4096,
        system: SYSTEM_PROMPT,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: currentMediaType, data: currentBase64 }
            },
            { type: 'text', text: '請辨識這張書頁上所有的日文文字，按位置分區輸出 JSON。' }
          ]
        }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const rawText = data.content.map(b => b.text || '').join('').trim();

    // Strip markdown code fences if present
    const jsonStr = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/,'').trim();
    const parsed = JSON.parse(jsonStr);

    renderResult(parsed);

  } catch (err) {
    showError('辨識失敗：' + (err.message || '請再試一次'));
  } finally {
    setLoading(false);
  }
}

function renderResult(data) {
  const section = document.getElementById('result-section');
  const container = document.getElementById('blocks-container');
  const badge = document.getElementById('page-badge');

  // Page number
  if (data.pageNumber && data.pageNumber !== 'null' && data.pageNumber !== null) {
    document.getElementById('page-num-text').textContent = data.pageNumber;
    badge.style.display = 'flex';
  }

  // Build full plain text for copy
  const lines = [];
  if (data.pageNumber && data.pageNumber !== 'null' && data.pageNumber !== null) {
    lines.push(`【頁碼】${data.pageNumber}\n`);
  }

  (data.blocks || []).forEach((block, i) => {
    const card = document.createElement('div');
    card.className = 'block-card';

    const header = document.createElement('div');
    header.className = 'block-header';
    header.innerHTML = `
      <span class="block-position">${escHtml(block.position)}</span>
      <span class="block-label">區塊 ${i + 1}</span>
    `;

    const textDiv = document.createElement('div');
    textDiv.className = 'block-text';
    textDiv.textContent = block.text;

    card.appendChild(header);
    card.appendChild(textDiv);
    container.appendChild(card);

    lines.push(`【${block.position}】\n${block.text}`);
  });

  fullResultText = lines.join('\n\n');
  section.style.display = 'block';

  // Scroll to results
  setTimeout(() => section.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function copyAll() {
  if (!fullResultText) return;
  const btn = document.getElementById('btn-copy');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(fullResultText).then(() => flashCopied(btn));
  } else {
    // Fallback for older iOS
    const ta = document.createElement('textarea');
    ta.value = fullResultText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    flashCopied(btn);
  }
}

function flashCopied(btn) {
  btn.textContent = '已複製 ✓';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = '複製全文';
    btn.classList.remove('copied');
  }, 2200);
}

function setLoading(on) {
  document.getElementById('status').style.display = on ? 'flex' : 'none';
  document.getElementById('btn-camera').disabled = on;
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
